name: build docker job
description: Build an image from a Dockerfile, verify that its run exits 0, push it and attest its provenance.

inputs:
  file:
    required: false
    description: Path of the dockerfile, relative to repository root.
    default: "Dockerfile"
  image_name:
    required: true
    description: The name of the image to build.
  version:
    required: false
    description: >
      Version of a dispatched release, such as 1.2.3, which runs on the default branch. The image is
      then tagged vX.Y.Z, vX.Y, vX and latest from it. Empty derives the tags from the git ref.
  run_args:
    required: false
    description: Docker flags for the test run. Supports quoted values and $NAME/${NAME} environment references; command substitution is not evaluated.
  timeout:
    required: false
    description: Timeout (in deciseconds) for the container to finish running.
    default: "300"
  skip_healthcheck:
    required: false
    description: Skip the test run of the image.
  github_token:
    required: true
    description: The GitHub token to use for publication.
  context:
    required: false
    description: The context to use for the build.
    default: .
  secrets:
    description: "List of secrets to expose to the build (e.g., key=string, GIT_AUTH_TOKEN=mytoken)."
    required: false
  secret-envs:
    description: "List of secret env vars to expose to the build (e.g., key=envname, MY_SECRET=MY_ENV_VAR)."
    required: false
  secret-files:
    description: "List of secret files to expose to the build (e.g., key=filename, MY_SECRET=./secret.txt)."
    required: false
  cache:
    required: false
    description: >
      When "true", reuse a GitHub Actions layer cache across runs, so an image whose Go sources are
      unchanged restores its compilation. Set "false" for an image that compiles nothing, such as a
      stock database image, where caching the large base costs more time than it saves.
    default: "true"

outputs:
  digest:
    description: The digest of the built image.
    value: ${{ steps.build.outputs.digest }}
  imageid:
    description: The ID of the built image.
    value: ${{ steps.build.outputs.imageid }}

runs:
  using: "composite"
  steps:
    - id: build
      uses: a-novel-kit/workflows/build-actions/docker@v1.77.1
      with:
        mode: job
        file: ${{ inputs.file }}
        image_name: ${{ inputs.image_name }}
        version: ${{ inputs.version }}
        run_args: ${{ inputs.run_args }}
        timeout: ${{ inputs.timeout }}
        skip_healthcheck: ${{ inputs.skip_healthcheck }}
        github_token: ${{ inputs.github_token }}
        context: ${{ inputs.context }}
        secrets: ${{ inputs.secrets }}
        secret-envs: ${{ inputs.secret-envs }}
        secret-files: ${{ inputs.secret-files }}
        cache: ${{ inputs.cache }}
