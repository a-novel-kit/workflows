name: build docker service
description: Build a docker container from a Dockerfile, and make sure it reports healthy when run.

inputs:
  mode:
    required: false
    default: service
    description: >
      "service" waits for the test container to report healthy; "job" waits for it to exit 0
      and also tags scheduled builds `nightly`.
  file:
    required: false
    description: Path of the dockerfile, relative to repository root.
    default: "Dockerfile"
  image_name:
    required: true
    description: The name of the image to build.
  version:
    required: false
    description: >
      Explicit release version (e.g. 1.2.3) for the dispatched release flow. When
      set, the image is tagged vX.Y.Z / vX.Y / vX / latest from it instead of from
      the git ref (the workflow runs on the default branch, not the tag). Leave
      empty for the legacy tag-push flow, which keeps the ref-derived tags.
  run_args:
    required: false
    description: Docker flags for the test run. Supports quoted values and $NAME/${NAME} environment references; command substitution is not evaluated.
  timeout:
    required: false
    description: Timeout (in deciseconds) for the container healthcheck.
    default: "300"
  skip_healthcheck:
    required: false
    description: >
      Skip the build-then-run smoke test (build + push only). Set true when the
      image is exercised by a downstream job anyway, so the caller can drop the
      service containers this smoke test would otherwise need.
  github_token:
    required: true
    description: The GitHub token to use for publication.
  context:
    required: false
    description: The context to use for the build.
    # Default to the repository root so the build context matches local and CI builds.
    default: .
  secrets:
    description: "List of secrets to expose to the build (e.g., key=string, GIT_AUTH_TOKEN=mytoken)."
    required: false
  secret-envs:
    description: "List of secret env vars to expose to the build (e.g., key=envname, MY_SECRET=MY_ENV_VAR)."
    required: false
  secret-files:
    description: "List of secret files to expose to the build (e.g., key=filename, MY_SECRET=./secret.txt)."
    required: false
  cache:
    required: false
    description: >
      Reuse a cross-run GHA layer cache (type=gha) for the build. Default true,
      which persists the go build + module cache so an image whose sources are
      unchanged restores its previous compilation. Set false for images that do
      not compile (e.g. a stock-base database image), where caching the large
      base to GHA is pure overhead and can make the build slower than cold.
    default: "true"

outputs:
  digest:
    description: The digest of the built image.
    value: ${{ steps.build.outputs.digest }}
  imageid:
    description: The ID of the built image.
    value: ${{ steps.build.outputs.imageid }}

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    # Derive vX.Y and vX from an explicit version. The dispatched release passes one
    # because the workflow runs on the default branch, where the ref is not a tag.
    - id: ver
      if: ${{ inputs.version != '' }}
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        v="$VERSION"
        echo "minor=${v%.*}" >> "$GITHUB_OUTPUT"
        echo "major=${v%%.*}" >> "$GITHUB_OUTPUT"
    - id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ inputs.image_name }}
        tags: |
          # Ref-derived tags for the tag-push flow, off when a version is passed.
          type=ref,event=pr,enable=${{ inputs.version == '' }}
          type=schedule,pattern=nightly,enable=${{ inputs.version == '' && inputs.mode == 'job' }}
          type=ref,event=branch,enable=${{ inputs.version == '' }}
          type=ref,event=tag,enable=${{ inputs.version == '' }}
          type=semver,pattern=v{{version}},enable=${{ inputs.version == '' }}
          type=semver,pattern=v{{major}}.{{minor}},enable=${{ inputs.version == '' }}
          type=semver,pattern=v{{major}},enable=${{ inputs.version == '' }}
          # Explicit-version tags (dispatched release flow).
          type=raw,value=v${{ inputs.version }},enable=${{ inputs.version != '' }}
          type=raw,value=v${{ steps.ver.outputs.minor }},enable=${{ inputs.version != '' }}
          type=raw,value=v${{ steps.ver.outputs.major }},enable=${{ inputs.version != '' }}
          type=raw,value=latest,enable=${{ inputs.version != '' }}
        flavor: latest=auto
    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github_token }}
    - uses: docker/setup-buildx-action@v4
      with:
        # Hosted runners are discarded after the job; removing a large builder took 10s.
        cleanup: false
    - uses: docker/build-push-action@v7
      env:
        # The job summary still reports the build; the record artifact only clutters the run.
        DOCKER_BUILD_RECORD_UPLOAD: "false"
      with:
        context: ${{ inputs.context }}
        # Persist the module and go-build cache across runs, so an image whose Go
        # sources are unchanged, or only partly changed, reuses the previous run's
        # compilation. mode=max also caches the intermediate builder stage where
        # `go build` runs. The scope is per image, so the parallel jobs building
        # different images keep separate caches.
        cache-from: ${{ inputs.cache == 'true' && format('type=gha,scope={0}', inputs.image_name) || '' }}
        # Only pushes to the default branch write the cache: other refs read it, a merge-queue
        # branch's cache is unreachable once the branch is deleted, and a pull_request_target run
        # reports the base branch as its ref.
        cache-to: ${{ inputs.cache == 'true' && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && format('type=gha,mode=max,scope={0},ignore-error=true', inputs.image_name) || '' }}
        load: true
        tags: ghcr.io/${{ inputs.image_name }}:test
        file: ${{ inputs.file }}
        secret-envs: ${{ inputs.secret-envs }}
        secret-files: ${{ inputs.secret-files }}
        secrets: ${{ inputs.secrets }}
    - name: wait for the test container
      if: ${{ inputs.skip_healthcheck != 'true' }}
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image_name }}
        MODE: ${{ inputs.mode }}
        TIMEOUT: ${{ inputs.timeout }}
        RUN_ARGS: ${{ inputs.run_args }}
      run: |
        node "$GITHUB_ACTION_PATH/../wait-container.mjs" "$MODE" "$TIMEOUT"
    - uses: docker/build-push-action@v7
      if: ${{ success() }}
      id: build
      env:
        DOCKER_BUILD_RECORD_UPLOAD: "false"
      with:
        context: ${{ inputs.context }}
        # Restore only: the push build shares this job's warm buildx cache from the
        # load build above, so it re-tags and pushes the already-built layers.
        cache-from: ${{ inputs.cache == 'true' && format('type=gha,scope={0}', inputs.image_name) || '' }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        file: ${{ inputs.file }}
        secret-envs: ${{ inputs.secret-envs }}
        secret-files: ${{ inputs.secret-files }}
        secrets: ${{ inputs.secrets }}
    - name: Attest the pushed image
      uses: actions/attest@v4.2.2
      with:
        subject-name: ghcr.io/${{ inputs.image_name }}
        subject-digest: ${{ steps.build.outputs.digest }}
        push-to-registry: true
        # Linked-artifact records need a broader permission and add no value to
        # digest/source verification, so publish only the signed attestation.
        create-storage-record: false
