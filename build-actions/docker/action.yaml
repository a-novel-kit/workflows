name: build docker service
description: >
  Build an image from a Dockerfile, verify that it runs healthy, push it and attest its provenance.
  Pushes to the default branch, releases and pull requests labeled with-feature-env are tagged. Every
  other build is pushed by digest alone.

inputs:
  mode:
    required: false
    default: service
    description: >
      "service" waits for the test container to report healthy; "job" waits for it to exit 0
      and also tags scheduled builds `nightly`.
  file:
    required: false
    description: Path of the dockerfile, relative to repository root.
    default: "Dockerfile"
  image_name:
    required: true
    description: The name of the image to build.
  version:
    required: false
    description: >
      Version of a dispatched release, such as 1.2.3, which runs on the default branch. The image is
      then tagged vX.Y.Z, vX.Y, vX and latest from it. Empty derives the tags from the git ref.
  run_args:
    required: false
    description: Docker flags for the test run. Supports quoted values and $NAME/${NAME} environment references; command substitution is not evaluated.
  timeout:
    required: false
    description: Timeout (in deciseconds) for the container healthcheck.
    default: "300"
  skip_healthcheck:
    required: false
    description: >
      When "true", build and push without the smoke run. Use it when a later job exercises the
      image, so the caller needs no service containers for the smoke run.
  github_token:
    required: true
    description: The GitHub token to use for publication.
  context:
    required: false
    description: The context to use for the build.
    default: .
  secrets:
    description: "List of secrets to expose to the build (e.g., key=string, GIT_AUTH_TOKEN=mytoken)."
    required: false
  secret-envs:
    description: "List of secret env vars to expose to the build (e.g., key=envname, MY_SECRET=MY_ENV_VAR)."
    required: false
  secret-files:
    description: "List of secret files to expose to the build (e.g., key=filename, MY_SECRET=./secret.txt)."
    required: false
  cache:
    required: false
    description: >
      When "true", reuse a GitHub Actions layer cache across runs, so an image whose Go sources are
      unchanged restores its compilation. Set "false" for an image that compiles nothing, such as a
      stock database image, where caching the large base costs more time than it saves.
    default: "true"
  reproducible:
    required: false
    default: "false"
    description: >
      When "true", the pushed image is reproducible: its file times and metadata are set to
      the Unix epoch, and it carries no build-time metadata (created, version and revision
      labels, or inline provenance). Its digest then depends only on its content, so a
      release that changes nothing in the image pushes the same digest under its new tags.
      The attestation is unchanged.

outputs:
  digest:
    description: The digest of the built image.
    value: ${{ steps.build.outputs.digest }}
  imageid:
    description: The ID of the built image.
    value: ${{ steps.build.outputs.imageid }}

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    # A fixed epoch keeps the digest a function of the image's content alone, whatever the commit date.
    - if: ${{ inputs.reproducible == 'true' }}
      shell: bash
      run: echo "SOURCE_DATE_EPOCH=0" >>"$GITHUB_ENV"
    # A dispatched release runs on the default branch, whose ref is no tag, so it passes its version.
    - id: ver
      if: ${{ inputs.version != '' }}
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        v="$VERSION"
        echo "minor=${v%.*}" >> "$GITHUB_OUTPUT"
        echo "major=${v%%.*}" >> "$GITHUB_OUTPUT"
    - id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ inputs.image_name }}
        tags: |
          # Ref-derived tags apply when no version is passed. A pull request is tagged only while
          # labeled with-feature-env. The label approves the head it was added on, so a push, whose
          # payload still carries it, is not tagged.
          type=ref,event=pr,enable=${{ github.event.action != 'synchronize' && contains(github.event.pull_request.labels.*.name, 'with-feature-env') }}
          type=schedule,pattern=nightly,enable=${{ inputs.version == '' && inputs.mode == 'job' }}
          # Only the default branch is tagged; other branches and merge-queue groups push untagged.
          type=ref,event=branch,enable=${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
          type=ref,event=tag,enable=${{ inputs.version == '' }}
          type=semver,pattern=v{{version}},enable=${{ inputs.version == '' }}
          type=semver,pattern=v{{major}}.{{minor}},enable=${{ inputs.version == '' }}
          type=semver,pattern=v{{major}},enable=${{ inputs.version == '' }}
          # Explicit-version tags (dispatched release flow).
          type=raw,value=v${{ inputs.version }},enable=${{ inputs.version != '' }}
          type=raw,value=v${{ steps.ver.outputs.minor }},enable=${{ inputs.version != '' }}
          type=raw,value=v${{ steps.ver.outputs.major }},enable=${{ inputs.version != '' }}
          type=raw,value=latest,enable=${{ inputs.version != '' }}
        flavor: latest=auto
    # These labels change on every release, so a reproducible image leaves them out.
    - id: labels
      shell: bash
      env:
        LABELS: ${{ steps.meta.outputs.labels }}
        REPRODUCIBLE: ${{ inputs.reproducible == 'true' }}
      run: |
        set -euo pipefail
        {
          echo 'labels<<LABELS_END'
          if [ "$REPRODUCIBLE" = true ]; then
            grep -v -E '^org\.opencontainers\.image\.(created|version|revision)=' <<<"$LABELS" || true
          else
            echo "$LABELS"
          fi
          echo LABELS_END
        } >>"$GITHUB_OUTPUT"
    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github_token }}
    - uses: docker/setup-buildx-action@v4
      with:
        # Hosted runners are discarded after the job, and removing a large builder takes about 10 seconds.
        cleanup: false
    - uses: docker/build-push-action@v7
      env:
        # The job summary still reports the build; the record artifact only clutters the run.
        DOCKER_BUILD_RECORD_UPLOAD: "false"
      with:
        context: ${{ inputs.context }}
        # mode=max also caches the builder stage where `go build` runs. Each image has its own
        # scope, so parallel jobs building different images keep separate caches.
        cache-from: ${{ inputs.cache == 'true' && format('type=gha,scope={0}', inputs.image_name) || '' }}
        # Only pushes to the default branch write the cache: other refs read it, a merge-queue
        # branch's cache is unreachable once the branch is deleted, and a pull_request_target run
        # reports the base branch as its ref.
        cache-to: ${{ inputs.cache == 'true' && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && format('type=gha,mode=max,scope={0},ignore-error=true', inputs.image_name) || '' }}
        load: true
        tags: ghcr.io/${{ inputs.image_name }}:test
        file: ${{ inputs.file }}
        secret-envs: ${{ inputs.secret-envs }}
        secret-files: ${{ inputs.secret-files }}
        secrets: ${{ inputs.secrets }}
    - name: wait for the test container
      if: ${{ inputs.skip_healthcheck != 'true' }}
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image_name }}
        MODE: ${{ inputs.mode }}
        TIMEOUT: ${{ inputs.timeout }}
        RUN_ARGS: ${{ inputs.run_args }}
      run: |
        node "$GITHUB_ACTION_PATH/../wait-container.mjs" "$MODE" "$TIMEOUT"
    - uses: docker/build-push-action@v7
      if: ${{ success() }}
      id: build
      env:
        DOCKER_BUILD_RECORD_UPLOAD: "false"
      with:
        context: ${{ inputs.context }}
        # Restore only: the push build shares this job's warm buildx cache from the
        # load build above, so it re-tags and pushes the already-built layers.
        cache-from: ${{ inputs.cache == 'true' && format('type=gha,scope={0}', inputs.image_name) || '' }}
        # A build without tags still pushes, by digest alone, for the jobs that pull it by digest.
        # A reproducible push rewrites file times to SOURCE_DATE_EPOCH, and skips inline
        # provenance, which records the build time; the attestation below covers it.
        outputs: type=image,push=true,push-by-digest=${{ steps.meta.outputs.tags == '' }}${{ inputs.reproducible == 'true' && ',rewrite-timestamp=true' || '' }}
        provenance: ${{ inputs.reproducible == 'true' && 'false' || '' }}
        tags: ${{ steps.meta.outputs.tags || format('ghcr.io/{0}', inputs.image_name) }}
        labels: ${{ steps.labels.outputs.labels }}
        file: ${{ inputs.file }}
        secret-envs: ${{ inputs.secret-envs }}
        secret-files: ${{ inputs.secret-files }}
        secrets: ${{ inputs.secrets }}
    # Rekor can stay slow for minutes, past the minute actions/attest spends on its own retries, so
    # a failed attempt runs again after a pause. All three attempts take the same inputs, and only
    # the last one fails the job.
    - name: Attest the pushed image
      id: attest
      continue-on-error: true
      uses: actions/attest@v4.2.2
      with:
        subject-name: ghcr.io/${{ inputs.image_name }}
        subject-digest: ${{ steps.build.outputs.digest }}
        # The registry copy adds a sha256-<digest> tag, so an untagged image's attestation stays
        # in GitHub's attestation store, where `gh attestation verify` still finds it.
        push-to-registry: ${{ steps.meta.outputs.tags != '' }}
        # Verification needs only the signed attestation; a linked-artifact record needs a broader
        # permission.
        create-storage-record: false
    - name: Wait before retrying the attestation
      if: ${{ steps.attest.outcome == 'failure' }}
      shell: bash
      run: sleep 30
    - name: Attest the pushed image, second attempt
      id: attest-retry
      if: ${{ steps.attest.outcome == 'failure' }}
      continue-on-error: true
      uses: actions/attest@v4.2.2
      with:
        subject-name: ghcr.io/${{ inputs.image_name }}
        subject-digest: ${{ steps.build.outputs.digest }}
        push-to-registry: ${{ steps.meta.outputs.tags != '' }}
        create-storage-record: false
    - name: Wait before the last attestation attempt
      if: ${{ steps.attest-retry.outcome == 'failure' }}
      shell: bash
      run: sleep 60
    - name: Attest the pushed image, last attempt
      if: ${{ steps.attest-retry.outcome == 'failure' }}
      uses: actions/attest@v4.2.2
      with:
        subject-name: ghcr.io/${{ inputs.image_name }}
        subject-digest: ${{ steps.build.outputs.digest }}
        push-to-registry: ${{ steps.meta.outputs.tags != '' }}
        create-storage-record: false
