name: clean images
description: >
  Delete a container package's images once the branch or pull request that built them is gone: untagged
  builds and tags of closed pull requests, merge-queue builds, old branch tags, and the default branch's
  untagged builds from before the last minor release. Release tags, the default branch's tag and its
  builds since that release, and open pull requests' tags and builds stay, with the manifests and
  attestations they reference. Run it for one package at a time.

inputs:
  package:
    required: true
    description: Container package name without its owner, such as service-json-keys/rest.
  github_token:
    required: true
    description: >
      Token with packages write, contents read, pull requests read and attestations read. The package
      must grant the calling repository the Admin role, which GitHub gives the repository whose workflow
      first published it.
  min_age_days:
    required: false
    default: "1"
    description: Age in days an image must reach before it can be deleted, so running jobs and merge-queue groups keep theirs.
  dry_run:
    required: false
    default: "false"
    description: When "true", list what would be deleted without deleting it.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: "24"
        package-manager-cache: false
    # A build's origin never changes, so its classification is cached across runs by digest.
    - uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/clean-images.json
        key: clean-images-v2-${{ inputs.package }}-${{ github.run_id }}
        restore-keys: clean-images-v2-${{ inputs.package }}-
    - name: Find the images to keep
      id: keep
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        PACKAGE: ${{ inputs.package }}
        MIN_AGE_DAYS: ${{ inputs.min_age_days }}
        CACHE_FILE: ${{ runner.temp }}/clean-images.json
      run: node "$GITHUB_ACTION_PATH/keep.mjs"
    - uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/clean-images.json
        key: clean-images-v2-${{ inputs.package }}-${{ github.run_id }}
    - uses: dataaxiom/ghcr-cleanup-action@v1.2.2
      with:
        token: ${{ inputs.github_token }}
        package: ${{ inputs.package }}
        use-regex: true
        # Patterns this long or with a lookahead fail the action's own length and ReDoS checks.
        skip-regex-checks: true
        # Every tag except attestation referrers, which follow the image they attest.
        delete-tags: ^(?!sha256-)
        delete-untagged: true
        delete-orphaned-images: true
        # Release tags stay even if the computed part is empty, which then matches, and keeps, everything.
        exclude-tags: ^(v[0-9].*|latest|nightly)$|${{ steps.keep.outputs.pattern }}
        older-than: ${{ inputs.min_age_days }} days
        validate: true
        dry-run: ${{ inputs.dry_run }}
