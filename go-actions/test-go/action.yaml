name: test go
description: Run the Go test suite across the workspace with coverage and upload the report.

inputs:
  test_artifact:
    required: false
    description: The name of the artifact to store the test report.
    default: go-test
  coverage_artifact:
    required: false
    description: The name of the artifact to store the coverage report.
    default: coverage
  test_file:
    required: false
    description: The name of the test report file.
    default: tests.json
  coverage_file:
    required: false
    description: The name of the coverage report file.
    default: coverage.txt
  skip_setup:
    required: false
    description: Skip the setup steps.
  filter_patterns:
    required: false
    description: The file patterns to filter.
    default: "| grep -v /mocks | grep -v /test | grep -v /proto"
  filter_extra_patterns:
    required: false
    description: The file patterns to filter, appended to filter_patterns.
    default: ""
  modfile:
    required: false
    description: The go.mod file to use.
    default: go.mod

outputs:
  artifact-id:
    description: The coverage artifact id.
    value: ${{ steps.upload-artifact.outputs.artifact-id }}

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v7
      if: ${{ inputs.skip_setup != 'true' }}
      with:
        persist-credentials: false
    - id: setup-go
      uses: actions/setup-go@v7.0.0
      if: ${{ inputs.skip_setup != 'true' }}
      with:
        go-version-file: "go.mod"
        # Each Go action keeps its own cache, since setup-go keys one cache on go.sum for every Go job.
        cache: false
    - id: go-cache
      uses: actions/cache/restore@v6
      if: ${{ inputs.skip_setup != 'true' }}
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('**/*.sum') }}
        restore-keys: go-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-
    - name: discover modules
      shell: bash
      id: discover
      env:
        PACKAGES: ${{ runner.temp }}/go-test-packages.txt
      run: |
        # Lists the packages of every module from `go list -m`, since one `go list ./...` reaches a
        # single module of a Go workspace.
        #
        # An empty set fails. gotestsum given no package tests `.`, which holds no tests in most
        # modules, and passes with coverage reduced to its `mode: set` header.
        discover_modules() {
          local root modules mod packages

          if ! root=$(go list .); then
            echo "::error::go list . failed — cannot derive the module path prefix"
            return 1
          fi

          if ! modules=$(go list -m); then
            echo "::error::go list -m failed — cannot enumerate the modules"
            return 1
          fi

          : >"$PACKAGES"

          for mod in $modules; do
            if ! packages=$(go list "${mod//$root/.}/..."); then
              echo "::error::go list failed for module ${mod}"
              return 1
            fi

            # A module may list no package, or the filters may drop all of them. Only an empty set
            # overall fails, below.
            [ -n "$packages" ] || continue

            printf '%s\n' "$packages" ${{ inputs.filter_patterns }} ${{ inputs.filter_extra_patterns }} >>"$PACKAGES"
          done

          if [ ! -s "$PACKAGES" ]; then
            echo "::error::discovery produced no packages — the test run would report success having run nothing"
            return 1
          fi
        }

        discover_modules || exit 1
    - name: run tests
      shell: bash
      env:
        PACKAGES: ${{ runner.temp }}/go-test-packages.txt
        MODFILE: ${{ inputs.modfile }}
        TEST_FILE: ${{ inputs.test_file }}
        COVERAGE_FILE: ${{ inputs.coverage_file }}
      run: |
        set -euo pipefail
        # A read loop rather than mapfile, which macOS runners' Bash 3.2 lacks.
        packages=()
        while IFS= read -r package; do packages+=("$package"); done <"$PACKAGES"
        go tool -modfile="$MODFILE" gotestsum --jsonfile "$TEST_FILE" --format pkgname \
          -- -count=1 -cover -coverprofile="$COVERAGE_FILE" -json "${packages[@]}"

        go tool cover -func "$COVERAGE_FILE"
    # Only pushes to the default branch save: other refs restore its cache, a merge-queue
    # branch's cache is unreachable once the branch is deleted, and a pull_request_target run
    # reports the base branch as its ref.
    - if: inputs.skip_setup != 'true' && steps.go-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
      uses: actions/cache/save@v6
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ steps.go-cache.outputs.cache-primary-key }}
    - name: archive code coverage results
      id: upload-artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.coverage_artifact }}
        path: ${{ inputs.coverage_file }}
    - name: archive test results
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.test_artifact }}
        path: ${{ inputs.test_file }}
