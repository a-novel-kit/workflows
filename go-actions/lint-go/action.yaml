name: lint go
description: >
  Run golangci-lint over the Go module, then report the vulnerabilities its code reaches when the
  module pins govulncheck in govulncheck.mod. The report never fails the job.

inputs:
  working_directory:
    required: false
    description: The Go module directory to lint and scan. Defaults to the repository root.

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - id: setup-go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ${{ inputs.working_directory || '.' }}/go.mod
        # Each Go action keeps its own cache, since setup-go keys one cache on go.sum for every Go job.
        cache: false
    - id: go-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-lint-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('**/*.sum') }}
        restore-keys: go-lint-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-
    # golangci-lint.mod pins the version developers run locally, and CI reads it from there.
    # The prebuilt binary never reads golangci-lint.sum, so loading the tool's import graph checks
    # that file for missing entries without compiling the tool.
    - id: golangci-version
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working_directory }}
        # Any proxy error falls back to the origin; Go's checksum database still verifies the source.
        GOPROXY: "https://proxy.golang.org|direct"
      run: |
        set -euo pipefail
        cd "${WORKING_DIRECTORY:-.}"
        go list -modfile=golangci-lint.mod -deps github.com/golangci/golangci-lint/v2/cmd/golangci-lint >/dev/null
        version="$(go list -modfile=golangci-lint.mod -m -f '{{.Version}}' github.com/golangci/golangci-lint/v2)"
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      env:
        GOPROXY: "https://proxy.golang.org|direct"
      with:
        version: ${{ steps.golangci-version.outputs.version }}
        working-directory: ${{ inputs.working_directory }}
    # govulncheck.mod pins the scanner developers run locally, and a module without one skips it.
    # The scan reports and never fails the job: its database changes without a commit, and each Go
    # security release flags the standard library until Renovate moves the go directive, so a gate
    # would turn every repository red at once.
    - name: govulncheck
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working_directory }}
        GOPROXY: "https://proxy.golang.org|direct"
      run: |
        set -euo pipefail
        cd "${WORKING_DIRECTORY:-.}"
        if [ ! -f govulncheck.mod ]; then
          echo "No govulncheck.mod, so the vulnerability scan is skipped."
          exit 0
        fi
        report="$RUNNER_TEMP/govulncheck.txt"
        rc=0
        go tool -modfile=govulncheck.mod govulncheck ./... >"$report" 2>&1 || rc=$?
        cat "$report"
        printf '## govulncheck\n\n```\n%s\n```\n' "$(cat "$report")" >>"$GITHUB_STEP_SUMMARY"
        # Exit code 3 marks vulnerabilities the code reaches, each listed under its own heading.
        case "$rc" in
          0) ;;
          3)
            sed -n 's/^Vulnerability #[0-9]*: \(GO-[0-9-]*\).*/\1/p' "$report" | while read -r id; do
              echo "::warning title=govulncheck::$id is reachable from this module; see the job summary."
            done
            ;;
          *) echo "::warning title=govulncheck::The scan did not run (exit $rc); see the job log." ;;
        esac
    # Only pushes to the default branch save: other refs restore its cache, a merge-queue
    # branch's cache is unreachable once the branch is deleted, and a pull_request_target run
    # reports the base branch as its ref.
    - if: steps.go-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ steps.go-cache.outputs.cache-primary-key }}
