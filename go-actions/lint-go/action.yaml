name: lint go
description: Run golangci-lint over the Go module.

inputs:
  working-directory:
    required: false
    description: The working directory to run the scan from.

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - id: setup-go
      uses: actions/setup-go@v7.0.0
      with:
        # Resolve go.mod relative to working-directory so the action works when the
        # Go module is not at the repo root. An empty working-directory falls back
        # to the repo-root go.mod.
        go-version-file: ${{ inputs.working-directory && format('{0}/go.mod', inputs.working-directory) || 'go.mod' }}
        # setup-go keys one cache on go.sum for every Go job in the repo, so the first
        # job to finish decided what the others restored. Each Go action keeps its own.
        cache: false
    - id: go-cache
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-lint-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('**/*.sum') }}
        restore-keys: go-lint-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-
    # golangci-lint.mod is the single source of truth for the version developers run
    # locally (`go tool -modfile=golangci-lint.mod golangci-lint`): Renovate bumps it
    # and CI follows, with no version literal here to drift.
    #
    # The prebuilt binary below never reads golangci-lint.sum, so an incomplete one
    # would rot until the local command fails with `missing go.sum entry`. Loading the
    # tool's import graph fails on exactly those entries without compiling the tool.
    - id: golangci-version
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        cd "${WORKING_DIRECTORY:-.}"
        go list -modfile=golangci-lint.mod -deps github.com/golangci/golangci-lint/v2/cmd/golangci-lint >/dev/null
        version="$(go list -modfile=golangci-lint.mod -m -f '{{.Version}}' github.com/golangci/golangci-lint/v2)"
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - uses: golangci/golangci-lint-action@v9
      with:
        version: ${{ steps.golangci-version.outputs.version }}
        working-directory: ${{ inputs.working-directory }}
    # Only pushes to the default branch save: other refs restore its cache, a merge-queue
    # branch's cache is unreachable once the branch is deleted, and a pull_request_target run
    # reports the base branch as its ref.
    - if: steps.go-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
      uses: actions/cache/save@v6
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ steps.go-cache.outputs.cache-primary-key }}
