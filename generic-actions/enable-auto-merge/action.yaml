name: enable-auto-merge
description: >
  Enable native auto-merge on a pull request as a GitHub App, so GitHub lands it once every required
  check and approval is satisfied. The caller enables it once and moves on.

  GitHub accepts the request while a required check is still failing or pending, and merges once the
  branch goes green. A landing coordinator therefore enables auto-merge on each sibling as soon as it
  leaves draft, and lets the gate hold it until the whole set is ready.

  The action is idempotent. It reads the pull request's auto-merge state and does nothing when
  auto-merge is already on. It passes `--squash`, the only method the require-approval ruleset
  allows. On a merge-queue repository the queue's own configuration decides the method.

inputs:
  repo:
    required: false
    default: ${{ github.event.repository.name }}
    description: >
      Name of the pull request's repository, without the owner, which is the workflow's
      organization. Defaults to the triggering repository. A cross-repo caller passes each
      sibling's name.
  pull_request_number:
    required: true
    description: Number of the pull request to enable auto-merge on.
  client_id:
    required: true
    description: >
      Client ID of a GitHub App installed on the target repository, with pull requests and contents
      write.
  app_private_key:
    required: true
    description: Private key (PEM) of that App.
  dry_run:
    required: false
    default: "true"
    description: >
      Any value but "false", in any case, logs the intended change and leaves the pull request
      alone. "false" enables auto-merge.
  kill_switch:
    required: false
    default: ""
    description: >
      Org-wide halt switch. The action runs only when the value, lowercased and stripped of
      whitespace, is empty, 0, off, false, no or disabled. Any other value halts it, so a mistyped
      value fails safe. A halt arms nothing and exits 0. Auto-merge already armed on a pull request
      stays armed, and merge-gate's failing check blocks that merge once the next event or reconcile
      sweep posts it.

runs:
  using: composite
  steps:
    # The token covers the target repository alone. A cross-repo caller reaches a sibling by its
    # name, wherever the App is installed.
    - name: Mint token
      id: token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.client_id }}
        private-key: ${{ inputs.app_private_key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ inputs.repo }}
        permission-pull-requests: write
        # `gh pr merge --auto` needs contents:write alongside pull-requests:write.
        permission-contents: write

    - name: Enable auto-merge
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        REPO_FULL: ${{ github.repository_owner }}/${{ inputs.repo }}
        PR: ${{ inputs.pull_request_number }}
        DRY_RUN: ${{ inputs.dry_run }}
        KILL_SWITCH: ${{ inputs.kill_switch }}
      run: |
        set -euo pipefail

        if [ -z "${PR:-}" ]; then
          echo "::error::pull_request_number is required"
          exit 1
        fi
        target="${REPO_FULL}#${PR}"

        # The org-wide halt is read before anything is armed.
        case "$(printf '%s' "${KILL_SWITCH:-}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')" in
          "" | 0 | off | false | no | disabled) : ;;
          *)
            echo "AGENT_KILL_SWITCH engaged — not enabling auto-merge on ${target} (org-wide halt)." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
            ;;
        esac

        already=$(gh pr view "$PR" --repo "$REPO_FULL" --json autoMergeRequest \
          -q '.autoMergeRequest != null')

        dry=$(printf '%s' "${DRY_RUN:-true}" | tr '[:upper:]' '[:lower:]')
        if [ "$dry" != "false" ]; then
          if [ "$already" = "true" ]; then
            echo "auto-merge already enabled on ${target} — would no-op (DRY RUN)." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "would enable auto-merge on ${target} (DRY RUN)." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
        fi

        if [ "$already" = "true" ]; then
          echo "auto-merge already enabled on ${target} — no-op." | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        gh pr merge "$PR" --repo "$REPO_FULL" --auto --squash
        echo "auto-merge enabled on ${target}." | tee -a "$GITHUB_STEP_SUMMARY"
