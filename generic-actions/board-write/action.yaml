name: board-write
description: >
  Set one single-select or date field on the Projects v2 board item of one or more issues or pull
  requests, as a GitHub App. The action resolves the field, the option and each item, and adds an
  item that is not on the board yet. It compares the current value before writing, so a re-run or
  an overlapping trigger writes nothing.

inputs:
  client_id:
    required: true
    description: >
      Client ID of a GitHub App installed on the org that runs the workflow, with organization
      Projects write. The default workflow token cannot reach an org's Projects v2.
  app_private_key:
    required: true
    description: Private key (PEM) of that App.
  project_id:
    required: true
    description: >
      Node id of the Projects v2 board (PVT_…). Find it with: gh project view <n> --owner <org>
      --format json.
  content_id:
    required: true
    description: >
      Node id of the issue or pull request whose board item to write, or several such ids separated
      by newlines or spaces. Every id gets the same field and value. A composite action cannot loop a
      `uses:` step, so a caller with several contents passes them all here.
  field:
    required: true
    description: Name of the field to set, e.g. "Status" or "Start date".
  value:
    required: true
    description: >
      Target value. For a single-select field, the option name (e.g. "In progress").
      For a date field, an ISO date (YYYY-MM-DD).
  add_if_missing:
    required: false
    default: "true"
    description: >
      When "true" (default), add a content that is not on the board yet, so a derived write never
      silently skips it. Any other value makes a missing item fail the run.
  only_if_empty:
    required: false
    default: "false"
    description: >
      When "true", write only a field that is empty and leave any set value untouched. A set-once
      field such as Start date uses it, so a re-run keeps the first stamp.
  dry_run:
    required: false
    default: "false"
    description: When "true", log the change that would be made without writing it.
  kill_switch:
    required: false
    default: ""
    description: >
      Org-level halt, passed in by the caller because a composite action cannot read the `vars`
      context. The action runs only when the value, lowercased and stripped of whitespace, is empty,
      0, off, false, no or disabled. Any other value engages the halt. The action then writes
      nothing, sets `changed` to "false" and exits 0.

outputs:
  item_id:
    description: Node id of the board item resolved or added. With several content ids, the last one.
    value: ${{ steps.write.outputs.item_id }}
  changed:
    description: '"true" if the run wrote a value to at least one item, "false" otherwise.'
    value: ${{ steps.write.outputs.changed }}

runs:
  using: composite
  steps:
    # Organization Projects write alone bounds a leak of this token to board edits.
    - name: Mint org-Projects token
      id: token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.client_id }}
        private-key: ${{ inputs.app_private_key }}
        owner: ${{ github.repository_owner }}
        permission-organization-projects: write

    - name: Write the field
      id: write
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        PROJECT_ID: ${{ inputs.project_id }}
        CONTENT_ID: ${{ inputs.content_id }}
        FIELD: ${{ inputs.field }}
        VALUE: ${{ inputs.value }}
        ADD_IF_MISSING: ${{ inputs.add_if_missing }}
        ONLY_IF_EMPTY: ${{ inputs.only_if_empty }}
        DRY_RUN: ${{ inputs.dry_run }}
        KILL_SWITCH: ${{ inputs.kill_switch }}
      run: |
        set -euo pipefail

        # Org-level halt, read before any write. Only an explicit off-token runs. The guard shares its
        # step with the write, so its `exit 0` ends the action.
        case "$(printf '%s' "${KILL_SWITCH:-}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')" in
          "" | 0 | off | false | no | disabled) : ;;
          *)
            echo "AGENT_KILL_SWITCH engaged — skipping board write for \"${FIELD}\" on ${CONTENT_ID} (org-wide halt)." | tee -a "$GITHUB_STEP_SUMMARY"
            {
              echo "item_id="
              echo "changed=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
            ;;
        esac

        for v in PROJECT_ID CONTENT_ID FIELD VALUE; do
          if [ -z "${!v:-}" ]; then
            echo "::error::$v is required"
            exit 1
          fi
        done

        # 1. Resolve the field's node id and type, and the option ids of a single-select field. A
        #    single-select field matches both fragments, and a date field matches the first only.
        field_q='query($proj:ID!,$field:String!){ node(id:$proj){ ... on ProjectV2{
          field(name:$field){
            ... on ProjectV2FieldCommon{ id dataType }
            ... on ProjectV2SingleSelectField{ options{ id name } } } } } }'
        fresp=$(gh api graphql -f query="$field_q" -F proj="$PROJECT_ID" -F field="$FIELD")
        field_id=$(echo "$fresp" | jq -r '.data.node.field.id // empty')
        data_type=$(echo "$fresp" | jq -r '.data.node.field.dataType // empty')
        if [ -z "$field_id" ]; then
          echo "::error::field \"$FIELD\" not found on the board"
          exit 1
        fi

        # Build the value fragment to write and the selection that reads the current value. The value
        # is inlined into the mutation, since gh -F coerces an all-digit option id to a number. An
        # option id comes from GitHub's own option list and a date passes the checks below, so both
        # are safe to inline.
        case "$data_type" in
          SINGLE_SELECT)
            opt_id=$(echo "$fresp" | jq -r --arg v "$VALUE" \
              '.data.node.field.options[] | select(.name==$v) | .id')
            if [ -z "$opt_id" ]; then
              echo "::error::\"$VALUE\" is not an option of single-select field \"$FIELD\""
              exit 1
            fi
            value_frag="{singleSelectOptionId: \"$opt_id\"}"
            cur_frag='... on ProjectV2ItemFieldSingleSelectValue{ current: name }'
            ;;
          DATE)
            if ! echo "$VALUE" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
              echo "::error::date field \"$FIELD\" needs a YYYY-MM-DD value, got \"$VALUE\""
              exit 1
            fi
            # A real date round-trips through `date -d`. An impossible one, such as 2026-02-30,
            # errors or normalizes to another day.
            if [ "$(date -d "$VALUE" +%Y-%m-%d 2>/dev/null)" != "$VALUE" ]; then
              echo "::error::\"$VALUE\" is not a real calendar date"
              exit 1
            fi
            value_frag="{date: \"$VALUE\"}"
            cur_frag='... on ProjectV2ItemFieldDateValue{ current: date }'
            ;;
          *)
            echo "::error::board-write handles single-select + date fields; \"$FIELD\" is $data_type"
            exit 1
            ;;
        esac

        # content_id may name several contents, since a pull request can close more than one issue.
        # The loop lives here because a composite action cannot loop a `uses:` step.
        read -r -a content_ids <<<"$(printf '%s' "$CONTENT_ID" | tr '\n' ' ')"

        any_changed=false
        last_item=""

        for content_id in "${content_ids[@]}"; do
          [ -n "$content_id" ] || continue

          # 2. Find the content's item on this board, paging projectItems because a content can sit
          #    on many boards. The item carries the field's current value for the compare below. A
          #    missing item is added when add_if_missing allows it.
          item_sel="id project{ id } fieldValueByName(name:\$field){ $cur_frag }"
          item_q="query(\$c:ID!,\$cursor:String,\$field:String!){ node(id:\$c){
            ... on Issue{ projectItems(first:100, after:\$cursor){
              pageInfo{ hasNextPage endCursor } nodes{ $item_sel } } }
            ... on PullRequest{ projectItems(first:100, after:\$cursor){
              pageInfo{ hasNextPage endCursor } nodes{ $item_sel } } } } }"
          item=""
          cursor=""
          while :; do
            args=(-F c="$content_id" -F field="$FIELD")
            [ -n "$cursor" ] && args+=(-F cursor="$cursor")
            iresp=$(gh api graphql -f query="$item_q" "${args[@]}")
            item=$(echo "$iresp" | jq -c --arg p "$PROJECT_ID" \
              '[.data.node.projectItems.nodes[] | select(.project.id==$p)][0] // empty')
            [ -n "$item" ] && break
            [ "$(echo "$iresp" | jq -r '.data.node.projectItems.pageInfo.hasNextPage')" = "true" ] || break
            cursor=$(echo "$iresp" | jq -r '.data.node.projectItems.pageInfo.endCursor')
          done

          if [ -z "$item" ]; then
            if [ "$ADD_IF_MISSING" != "true" ]; then
              echo "::error::content $content_id is not on the board and add_if_missing=false"
              exit 1
            fi
            if [ "$DRY_RUN" = "true" ]; then
              echo "- [dry-run] would add content $content_id to the board and set \"$FIELD\" = \"$VALUE\"." \
                | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi
            add_m="mutation(\$proj:ID!,\$c:ID!,\$field:String!){
              addProjectV2ItemById(input:{projectId:\$proj,contentId:\$c}){ item{ $item_sel } } }"
            item=$(gh api graphql -f query="$add_m" -F proj="$PROJECT_ID" -F c="$content_id" -F field="$FIELD" \
              | jq -c '.data.addProjectV2ItemById.item')
            echo "Added content to the board (item $(echo "$item" | jq -r '.id'))." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

          item_id=$(echo "$item" | jq -r '.id')
          last_item="$item_id"

          # 3. Compare before writing. An equal value, from a re-run or an overlapping trigger, writes
          #    nothing.
          cur=$(echo "$item" | jq -r '.fieldValueByName.current // empty')

          if [ "$ONLY_IF_EMPTY" = "true" ] && [ -n "$cur" ]; then
            echo "No change — \"$FIELD\" already set (\"$cur\") on item $item_id and only_if_empty." | tee -a "$GITHUB_STEP_SUMMARY"
            continue
          fi

          if [ "$cur" = "$VALUE" ]; then
            echo "No change — \"$FIELD\" already \"$VALUE\" on item $item_id." | tee -a "$GITHUB_STEP_SUMMARY"
            continue
          fi

          # 4. Write the value, or report it under dry_run.
          if [ "$DRY_RUN" = "true" ]; then
            echo "- [dry-run] would set \"$FIELD\" = \"$VALUE\" on item $item_id (was \"${cur:-<unset>}\")." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            continue
          fi

          write_m="mutation(\$proj:ID!,\$item:ID!,\$field:ID!){ updateProjectV2ItemFieldValue(input:{
            projectId:\$proj, itemId:\$item, fieldId:\$field, value: $value_frag }){ projectV2Item{ id } } }"
          gh api graphql -f query="$write_m" -F proj="$PROJECT_ID" -F item="$item_id" -F field="$field_id" >/dev/null
          echo "Set \"$FIELD\" = \"$VALUE\" on item $item_id (was \"${cur:-<unset>}\")." | tee -a "$GITHUB_STEP_SUMMARY"
          any_changed=true
        done

        {
          echo "item_id=$last_item"
          echo "changed=$any_changed"
        } >> "$GITHUB_OUTPUT"
