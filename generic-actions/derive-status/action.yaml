name: derive-status
description: >
  Derive the board Status of each issue a pull request closes from the pull request's current
  state, and write it through board-write as a GitHub App. A draft maps to In progress, an open
  pull request to In review, an approved one to Done, a merged one to Awaiting release, and one
  closed unmerged to Ready. The Status depends on that state alone, so a re-run on any pull request
  repairs drift left by a dropped event. Any Status but Ready also stamps an empty Start date with
  today's date. A pull request that closes no issue is a no-op.

inputs:
  client_id:
    required: true
    description: >
      Client ID of a GitHub App installed on the org that runs the workflow, with organization
      Projects write. board-write mints its token for the board write.
  app_private_key:
    required: true
    description: Private key (PEM) of that App.
  project_id:
    required: true
    description: Node id of the Projects v2 board (PVT_…).
  pull_request_number:
    required: false
    default: ${{ github.event.pull_request.number }}
    description: >
      Number of the pull request to derive from. Defaults to the pull request of the triggering
      pull_request or pull_request_review event.
  repo:
    required: false
    default: ${{ github.event.repository.name }}
    description: >
      Repository of the pull request, by name, in the workflow's org. Defaults to the triggering
      repository.
  github_token:
    required: false
    default: ${{ github.token }}
    description: >
      Token that reads the pull request and its closing issues. Defaults to the job's token. Pass
      one that can read `repo` when it names another repository.
  kill_switch:
    required: false
    default: ""
    description: >
      Org-level halt, passed in by the caller because a composite action cannot read the `vars`
      context. The action runs only when the value, lowercased and stripped of whitespace, is empty,
      0, off, false, no or disabled. Any other value engages the halt. The action then reads no pull
      request, writes nothing and exits 0. board-write receives the value too and checks it again.

runs:
  using: composite
  steps:
    # Read the pull request with `github_token` and compute the target Status. board-write mints
    # the App token for the writes.
    - name: Compute Status + resolve the Task
      id: derive
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        OWNER: ${{ github.repository_owner }}
        REPO: ${{ inputs.repo }}
        PR: ${{ inputs.pull_request_number }}
        KILL_SWITCH: ${{ inputs.kill_switch }}
      run: |
        set -euo pipefail

        # Org-level halt, read before the derivation. Only an explicit off-token runs. A composite
        # action has no early return, so the `exit 0` here leaves the later steps to run. The guard
        # sets a `halted` output instead, and both board-write steps check it.
        case "$(printf '%s' "${KILL_SWITCH:-}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')" in
          "" | 0 | off | false | no | disabled) : ;;
          *)
            echo "AGENT_KILL_SWITCH engaged — skipping board-status derivation (org-wide halt)." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "halted=true" >> "$GITHUB_OUTPUT"
            exit 0
            ;;
        esac

        if [ -z "${PR:-}" ]; then
          echo "::error::no PR number — run on a pull_request / pull_request_review event, or pass pull_request_number"
          exit 1
        fi

        q='query($owner:String!,$repo:String!,$num:Int!){ repository(owner:$owner,name:$repo){
          pullRequest(number:$num){
            state isDraft reviewDecision
            closingIssuesReferences(first:5){ nodes{ id number } } } } }'
        # A missing or unreadable pull request fails the query, reported here as one message.
        if ! pr=$(gh api graphql -f query="$q" -f owner="$OWNER" -f repo="$REPO" -F num="$PR"); then
          echo "::error::could not query PR #$PR (not found, or the token lacks access)"
          exit 1
        fi
        state=$(echo "$pr" | jq -r '.data.repository.pullRequest.state')
        draft=$(echo "$pr" | jq -r '.data.repository.pullRequest.isDraft')
        review=$(echo "$pr" | jq -r '.data.repository.pullRequest.reviewDecision // ""')

        # A pull request the query could not resolve comes back null.
        if [ -z "$state" ] || [ "$state" = "null" ]; then
          echo "::error::PR #$PR not found or inaccessible (check the number and token access)"
          exit 1
        fi

        # Every issue the pull request closes, up to the query's five, takes the derived Status.
        # board-write takes their ids newline-separated and writes each one.
        refs=$(echo "$pr" | jq '.data.repository.pullRequest.closingIssuesReferences.nodes')
        ref_count=$(echo "$refs" | jq 'length')
        issue_ids=$(echo "$refs" | jq -r 'sort_by(.number) | .[].id')

        # The Status depends on the pull request's current state alone, so every event and every
        # re-run reach the same answer.
        case "$state" in
          MERGED) status="Awaiting release" ;;
          CLOSED) status="Ready" ;; # closed unmerged → the attempt was abandoned; back to actionable
          OPEN)
            if [ "$draft" = "true" ]; then
              status="In progress"
            elif [ "$review" = "APPROVED" ]; then
              status="Done"
            else
              status="In review"
            fi
            ;;
          *)
            echo "::error::unexpected PR state '$state'"
            exit 1
            ;;
        esac

        if [ -z "$issue_ids" ]; then
          echo "PR #$PR closes no issue — nothing to derive." | tee -a "$GITHUB_STEP_SUMMARY"
          echo "has_issue=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # A Task is activated, and earns a Start date, once it moves past Backlog and Ready. A pull
        # request closed unmerged returns it to Ready and stamps nothing.
        activated=false
        case "$status" in
          "In progress" | "In review" | "Done" | "Awaiting release") activated=true ;;
        esac

        {
          echo "has_issue=true"
          # Multi-line, so it needs the delimiter form; board-write splits on whitespace.
          echo "issue_ids<<EOF_ISSUE_IDS"
          printf '%s\n' "$issue_ids"
          echo "EOF_ISSUE_IDS"
          echo "status=$status"
          echo "activated=$activated"
          echo "today=$(date -u +%Y-%m-%d)"
        } >> "$GITHUB_OUTPUT"
        echo "PR #$PR ($state, draft=$draft, review=${review:-none}) → \"$status\" on $ref_count issue(s)." \
          | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Write Status
      if: ${{ steps.derive.outputs.has_issue == 'true' && steps.derive.outputs.halted != 'true' }}
      uses: a-novel-kit/workflows/generic-actions/board-write@v1.70.0
      with:
        client_id: ${{ inputs.client_id }}
        app_private_key: ${{ inputs.app_private_key }}
        project_id: ${{ inputs.project_id }}
        content_id: ${{ steps.derive.outputs.issue_ids }}
        field: Status
        value: ${{ steps.derive.outputs.status }}
        kill_switch: ${{ inputs.kill_switch }}

    - name: Stamp Start date (once)
      if: ${{ steps.derive.outputs.has_issue == 'true' && steps.derive.outputs.activated == 'true' && steps.derive.outputs.halted != 'true' }}
      uses: a-novel-kit/workflows/generic-actions/board-write@v1.70.0
      with:
        client_id: ${{ inputs.client_id }}
        app_private_key: ${{ inputs.app_private_key }}
        project_id: ${{ inputs.project_id }}
        content_id: ${{ steps.derive.outputs.issue_ids }}
        field: Start date
        value: ${{ steps.derive.outputs.today }}
        only_if_empty: "true"
        kill_switch: ${{ inputs.kill_switch }}
