name: approve playwright
description: >
  Bind the allow-screenshot-change label to the pull request's head as the screenshot approval
  `test-playwright` reads. The label approves only when a person with write access adds it. A push
  removes it, and a label change reruns the head's completed `test-browser` job in `main.yaml`.

inputs:
  github_token:
    required: true
    description: >
      Token with actions, statuses and pull requests write, plus contents read. Pass it only from a
      trusted pull_request_target or workflow_run job.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24"
        package-manager-cache: false
    - name: Record the approval and refresh the browser check
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        set -euo pipefail
        node "$ACTION_PATH/../../node-actions/test-playwright/drive/policy.mjs" label
