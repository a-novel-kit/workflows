name: approve playwright
description: Bind screenshot approval to the PR head and rerun the browser check that a label change left stale.

inputs:
  github_token:
    required: true
    description: Token with Actions and statuses write plus contents and pull requests read; use only from trusted pull_request_target or workflow_run code.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: "24"
        package-manager-cache: false
    - name: Record the approval and refresh the browser check
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        set -euo pipefail
        node "$ACTION_PATH/../../node-actions/test-playwright/drive/policy.mjs" label
