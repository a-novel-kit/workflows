name: approve playwright
description: Bind screenshot approval to the PR head, refresh browser checks and attach pending drift reviews to this run.

inputs:
  github_token:
    required: true
    description: Token with Actions and statuses write plus contents and pull requests read; use only from trusted pull_request_target code.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: "24"
        package-manager-cache: false
    - name: Verify the label and collect screenshot review
      id: review
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        set -euo pipefail
        node "$ACTION_PATH/../../node-actions/test-playwright/drive/policy.mjs" label
    - name: Download screenshot drift review
      if: ${{ steps.review.outputs.artifact_id != '' }}
      uses: actions/download-artifact@v8
      with:
        artifact-ids: ${{ steps.review.outputs.artifact_id }}
        run-id: ${{ steps.review.outputs.run_id }}
        github-token: ${{ inputs.github_token }}
        path: ${{ runner.temp }}/visual-review
    - name: Attach screenshot drift review to this run
      if: ${{ steps.review.outputs.artifact_id != '' }}
      uses: actions/upload-artifact@v7
      with:
        path: ${{ runner.temp }}/visual-review/playwright-drift.html
        archive: false
        if-no-files-found: error
        retention-days: 3
        overwrite: true
