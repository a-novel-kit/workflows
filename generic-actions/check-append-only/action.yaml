name: check append-only
description: >
  Allow new files under a path and reject changes to existing ones. A visible pull request label
  overrides the check for bulk regeneration or another reviewed exception. The label approves the
  head it was added on. A push is checked without it, and the push removes it when a token is given.

inputs:
  path:
    required: true
    description: Path whose files become immutable after landing.
  base:
    required: true
    description: >
      Full base-branch commit SHA. The checkout must use `fetch-depth: 0`. A shallow history fails the
      check, because Git cannot resolve the pull request's merge base reliably in it.
  override_label:
    required: false
    default: append-only-override
    description: Pull request label that bypasses the check. Empty disables the override.
  github_token:
    required: false
    default: ""
    description: >
      Token with pull requests write. With it, a push removes the override label, so a reviewer adds
      it again for the new head. Without it, a push only ignores the label.

runs:
  using: composite
  steps:
    - name: Check append-only path
      shell: bash
      env:
        BASE: ${{ inputs.base }}
        PATH_TO_CHECK: ${{ inputs.path }}
        OVERRIDE_LABEL: ${{ inputs.override_label }}
        EVENT_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        EVENT_ACTION: ${{ github.event.action }}
        PR: ${{ github.event.pull_request.number }}
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        set -euo pipefail

        has_override() {
          [ -n "${OVERRIDE_LABEL:-}" ] &&
            jq -e --arg label "$OVERRIDE_LABEL" \
              'type == "array" and index($label) != null' \
              <<<"${EVENT_LABELS:-null}" >/dev/null
        }

        collect_changes() { # $1=output file
          git diff --name-status --no-renames -z "${BASE}...HEAD" -- "$PATH_TO_CHECK" > "$1"
        }

        classify_changes() { # $1=name-status file
          VIOLATIONS=()
          local status file
          while IFS= read -r -d '' status && IFS= read -r -d '' file; do
            [ "$status" = "A" ] || VIOLATIONS+=("$status"$'\t'"$file")
          done < "$1"
          [ "${#VIOLATIONS[@]}" -eq 0 ]
        }

        revoke_override() {
          [ -n "${GH_TOKEN:-}" ] || return 0
          local label err
          label=$(jq -rn --arg label "$OVERRIDE_LABEL" '$label | @uri')
          if ! err=$(gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/$label" --silent 2>&1); then
            # Another append-only step in the same job may have removed it first.
            [[ $err == *"HTTP 404"* ]] && return 0
            printf '::error::failed to remove the "%s" label: %s\n' "$OVERRIDE_LABEL" "$err"
            return 1
          fi
        }

        if has_override; then
          if [ "${EVENT_ACTION:-}" != synchronize ]; then
            printf '::warning::append-only check bypassed by label "%s"\n' "$OVERRIDE_LABEL"
            printf '## Append-only check\n\nBypassed by `%s`.\n' "$OVERRIDE_LABEL" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # A push's payload still carries the label added for the previous head.
          printf '::notice::"%s" approved an earlier head, so this push is checked without it\n' \
            "$OVERRIDE_LABEL"
          revoke_override || exit 1
        fi

        if [ -z "${PATH_TO_CHECK:-}" ]; then
          printf '%s\n' '::error::path must not be empty'
          exit 1
        fi
        if ! [[ "${BASE:-}" =~ ^([0-9a-fA-F]{40}|[0-9a-fA-F]{64})$ ]]; then
          printf '::error::base must be a full commit SHA, got "%s"\n' "${BASE:-}"
          exit 1
        fi
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          printf '%s\n' \
            '::error::check-append-only requires actions/checkout with fetch-depth: 0'
          exit 1
        fi
        if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
          printf '::error::base commit %s is absent from the checkout\n' "$BASE"
          exit 1
        fi
        if ! git merge-base "$BASE" HEAD >/dev/null; then
          printf '::error::base commit %s has no merge base with HEAD\n' "$BASE"
          exit 1
        fi

        changes=$(mktemp)
        trap 'rm -f "$changes"' EXIT
        if ! collect_changes "$changes"; then
          printf '::error::failed to compare %s...HEAD under %s\n' "$BASE" "$PATH_TO_CHECK"
          exit 1
        fi

        if classify_changes "$changes"; then
          printf 'Append-only path unchanged except for additions: %s\n' "$PATH_TO_CHECK"
          printf '## Append-only check\n\nOnly additions found under `%s`.\n' "$PATH_TO_CHECK" \
            >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        printf '%s\n' \
          '::error::existing files changed under an append-only path; see the job summary'
        {
          printf '## Append-only check failed\n\nExisting files changed under `%s`:\n\n' \
            "$PATH_TO_CHECK"
          for violation in "${VIOLATIONS[@]}"; do
            status=${violation%%$'\t'*}
            file=${violation#*$'\t'}
            printf -v quoted '%q' "$file"
            printf -- '- `%s` (%s)\n' "$quoted" "$status"
          done
          if [ -n "${OVERRIDE_LABEL:-}" ]; then
            printf '\nAdd the `%s` label only for a reviewed exception.\n' "$OVERRIDE_LABEL"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
        exit 1
