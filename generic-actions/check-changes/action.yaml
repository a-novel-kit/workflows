name: check changes
description: >
  Detect uncommitted changes under a pathspec, untracked files included, and fail on them by
  default. Run after a generation step, it proves the committed output is current.

inputs:
  pathspec:
    description: Git pathspec to check.
    required: false
    default: "."
  fail_on_changes:
    description: When "true", uncommitted changes fail the step. When "false", only the diff output reports them.
    required: false
    default: "true"
  fail_message:
    description: Message printed when uncommitted changes fail the step.
    required: false
    default: "Uncommitted changes found in the pathspec."

outputs:
  diff:
    description: '"1" when the pathspec holds uncommitted changes, empty otherwise.'
    value: ${{ steps.check_diff.outputs.diff }}

runs:
  using: "composite"
  steps:
    - name: check diff
      id: check_diff
      shell: bash
      env:
        PATHSPEC: ${{ inputs.pathspec }}
      run: |
        set -euo pipefail
        changes=$(git status --porcelain -- "$PATHSPEC")
        if [ -n "$changes" ]; then echo "diff=1" >> "$GITHUB_OUTPUT"; fi
    - name: fail if changes
      if: inputs.fail_on_changes == 'true' && steps.check_diff.outputs.diff == '1'
      shell: bash
      env:
        MESSAGE: ${{ inputs.fail_message }}
      run: |
        printf '%s\n' "$MESSAGE"
        exit 1
