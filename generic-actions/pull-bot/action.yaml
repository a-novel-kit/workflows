name: pull bot
description: >
  Mint a GitHub App token and check out the repository with it. The token stays out of the git
  config, so a later step that needs it reads the token output.

inputs:
  app_private_key:
    required: true
    description: Private key of the GitHub App.
  client_id:
    required: true
    description: Client ID of the GitHub App.
  fetch_depth:
    required: false
    description: Number of commits to fetch. 0 fetches all history for all branches and tags.
    default: "1"
  fetch_tags:
    required: false
    description: When "true", fetch tags even with a shallow fetch_depth.
    default: "false"
  ref:
    required: false
    description: >
      Ref (branch, tag or SHA) to check out. Empty checks out github.head_ref, the pull request's
      branch, on a pull request event, and the triggering commit otherwise. A dispatched release
      passes its new tag, so the checkout holds the version bump.
    default: ""

outputs:
  token:
    description: Installation token of the App.
    value: ${{ steps.token_client.outputs.token }}
  app_login:
    description: Login of the App's bot user, such as `my-app[bot]`.
    value: ${{ steps.token_client.outputs.app-slug }}[bot]

runs:
  using: "composite"
  steps:
    # The App is named by its client ID, because create-github-app-token deprecates app-id. The token
    # pushes a branch and opens its pull request, so it holds those two permissions and no other.
    - name: get app token
      id: token_client
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        private-key: ${{ inputs.app_private_key }}
        client-id: ${{ inputs.client_id }}
        permission-contents: write
        permission-pull-requests: write
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        token: ${{ steps.token_client.outputs.token }}
        ref: ${{ inputs.ref != '' && inputs.ref || github.head_ref }}
        persist-credentials: false
        fetch-depth: ${{ inputs.fetch_depth }}
        fetch-tags: ${{ inputs.fetch_tags }}
