name: lint shell
description: >
  Run shellcheck over a repo's tracked shell scripts. A repo with no shell files passes, so the job
  fits any repo. Advisory mode reports findings without failing, for a repo clearing an existing
  backlog before the check gates.

inputs:
  paths:
    required: false
    description: >
      Space- or newline-separated globs of shell files to lint. Empty lints every tracked `*.sh`
      file. Discovery reads tracked files only, so it skips gitignored trees. The caller checks the
      repo out first.
  advisory:
    required: false
    default: "false"
    description: >
      When "true", the log lists the findings, the run summary counts them, and the check passes.
      When "false", any finding fails the check.
  version:
    required: true
    description: >
      shellcheck release tag, with or without the leading v. The caller pins it so Renovate bumps
      it per repo, with the annotation
      `# renovate: datasource=custom.shellcheck depName=koalaman/shellcheck`. The pin keeps what the
      gate accepts independent of the runner image.
  sha256:
    required: false
    default: ""
    description: >
      SHA-256 of that release's `shellcheck-v<version>.linux.x86_64.tar.xz`, on the line right after
      `version`, so Renovate moves both together. A download that does not match fails the step.
      Empty installs the release unverified, with a warning; a later release requires it.

runs:
  using: composite
  steps:
    - name: install shellcheck
      shell: bash
      env:
        SHELLCHECK_VERSION: ${{ inputs.version }}
        SHELLCHECK_SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        # The release tag and the archive name both carry the v, so the input works with or without it.
        v="v${SHELLCHECK_VERSION#v}"
        tmp=$(mktemp -d)

        # curl restarts a retried transfer from its first byte, so the archive lands in a file before
        # tar reads it. `--retry-all-errors` also retries a transport-level reset (curl exit 35),
        # which plain `--retry` leaves fatal.
        if ! curl -sSfL --retry 3 --retry-delay 2 --retry-all-errors \
          "https://github.com/koalaman/shellcheck/releases/download/${v}/shellcheck-${v}.linux.x86_64.tar.xz" \
          -o "$tmp/shellcheck.tar.xz"; then
          echo "::error::failed to download shellcheck ${v} after 3 retries"
          exit 1
        fi

        # The pin comes from the caller, never from the release, whose files and checksums an
        # attacker holding the release can replace together.
        if [ -z "$SHELLCHECK_SHA256" ]; then
          echo "::warning::shellcheck ${v} installs unverified: pin its sha256 beside version."
        elif ! echo "$SHELLCHECK_SHA256  $tmp/shellcheck.tar.xz" | sha256sum --check --quiet; then
          echo "::error::shellcheck ${v} does not match the pinned sha256"
          exit 1
        fi

        tar -xJ -C "$tmp" --strip-components=1 -f "$tmp/shellcheck.tar.xz"
        install -m 0755 "$tmp/shellcheck" /usr/local/bin/shellcheck
        rm -rf "$tmp"
        shellcheck --version

    - name: shellcheck
      shell: bash
      env:
        PATHS: ${{ inputs.paths }}
        ADVISORY: ${{ inputs.advisory }}
      run: |
        # errexit is off because shellcheck exits non-zero on findings, and the step gates on that code.
        set +e -u
        shopt -s nullglob
        if [ -n "${PATHS//[[:space:]]/}" ]; then
          # The caller's globs split into words and expand into the file list.
          # shellcheck disable=SC2206
          files=($PATHS)
        else
          mapfile -t files < <(git ls-files '*.sh')
        fi

        if [ ${#files[@]} -eq 0 ]; then
          echo "No shell files to lint."
          printf '## shellcheck\n\nNo shell files found — nothing to lint.\n' >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        shellcheck -f gcc "${files[@]}" > "$RUNNER_TEMP/shellcheck.txt" 2>&1
        rc=$?
        cat "$RUNNER_TEMP/shellcheck.txt"

        total=$(grep -cE ': (error|warning|note|style):' "$RUNNER_TEMP/shellcheck.txt")
        printf '## shellcheck\n\n**%s** finding(s) across %s shell file(s).\n' \
          "${total:-0}" "${#files[@]}" >> "$GITHUB_STEP_SUMMARY"

        if [ "$ADVISORY" = "true" ]; then
          echo "Advisory mode: findings reported without gating."
          exit 0
        fi
        exit "$rc"
