name: discord-post
description: >
  Deprecated, use generic-actions/chat-post, which this action runs with the same inputs and output.
  The next major removes it.

inputs:
  webhook:
    required: false
    default: ""
    description: Forwarded to chat-post.
  title:
    required: true
    description: Forwarded to chat-post.
  url:
    required: false
    default: ""
    description: Forwarded to chat-post.
  description:
    required: false
    default: ""
    description: Forwarded to chat-post.
  color:
    required: true
    description: Forwarded to chat-post.
  footer:
    required: false
    default: ""
    description: Forwarded to chat-post.
  mention_roles:
    required: false
    default: ""
    description: Forwarded to chat-post.
  mention_users:
    required: false
    default: ""
    description: Forwarded to chat-post.
  dry_run:
    required: false
    default: "false"
    description: Forwarded to chat-post.

outputs:
  delivered:
    description: chat-post's delivered output.
    value: ${{ steps.post.outputs.delivered }}

runs:
  using: composite
  steps:
    - name: Warn that discord-post is deprecated
      shell: bash
      run: |
        echo "::warning::generic-actions/discord-post is deprecated, and the next major removes it. Call generic-actions/chat-post, which takes the same inputs."
    - id: post
      uses: a-novel-kit/workflows/generic-actions/chat-post@v1.85.0
      with:
        webhook: ${{ inputs.webhook }}
        title: ${{ inputs.title }}
        url: ${{ inputs.url }}
        description: ${{ inputs.description }}
        color: ${{ inputs.color }}
        footer: ${{ inputs.footer }}
        mention_roles: ${{ inputs.mention_roles }}
        mention_users: ${{ inputs.mention_users }}
        dry_run: ${{ inputs.dry_run }}
