name: maintain playwright
description: Promote successful master screenshot batches and remove superseded or merged/deleted branch evidence from Drive.

inputs:
  github_token:
    required: true
    description: Read-only token for verifying run completion, current master and live branches.
  identity_provider:
    required: true
    description: Trusted default-branch maintenance Workload Identity provider.
  service_account:
    required: true
    description: Trusted service account able to publish and permanently delete batches in both configured folders.
  references_folder:
    required: true
    description: Platform references folder ID inside a Shared Drive.
  results_folder:
    required: true
    description: Sibling platform results folder ID inside a Shared Drive.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: "24"
        package-manager-cache: false
    - name: Authenticate trusted cleanup
      id: auth
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ inputs.identity_provider }}
        service_account: ${{ inputs.service_account }}
        token_format: access_token
        access_token_scopes: https://www.googleapis.com/auth/drive
        create_credentials_file: false
        export_environment_variables: false
    - name: Reconcile retained batches
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        DRIVE_TOKEN: ${{ steps.auth.outputs.access_token }}
        GH_TOKEN: ${{ inputs.github_token }}
        REFERENCES_FOLDER: ${{ inputs.references_folder }}
        RESULTS_FOLDER: ${{ inputs.results_folder }}
      run: |
        set -euo pipefail
        node "$ACTION_PATH/../../node-actions/test-playwright/drive/storage.mjs" cleanup
