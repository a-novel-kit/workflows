name: maintain playwright
description: >
  Maintain the Drive store of `test-playwright`. A staged reference batch is published once its
  browser tests passed and its commit is still master's head, and older references are deleted. Each
  live branch keeps its newest completed result batch, and batches of merged or deleted branches are
  deleted.

inputs:
  github_token:
    required: true
    description: Read-only token that checks each batch's run, the master head and the live branches.
  identity_provider:
    required: true
    description: Workload Identity provider that admits only the default branch's maintenance job.
  service_account:
    required: true
    description: Service account that can add and permanently delete batches in both folders.
  references_folder:
    required: true
    description: ID of the platform's references folder inside a Shared Drive.
  results_folder:
    required: true
    description: ID of the platform's results folder, a sibling of the references folder.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "26"
        package-manager-cache: false
    - name: Authenticate trusted cleanup
      id: auth
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: ${{ inputs.identity_provider }}
        service_account: ${{ inputs.service_account }}
        token_format: access_token
        access_token_scopes: https://www.googleapis.com/auth/drive
        create_credentials_file: false
        export_environment_variables: false
    - name: Reconcile retained batches
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        DRIVE_TOKEN: ${{ steps.auth.outputs.access_token }}
        GH_TOKEN: ${{ inputs.github_token }}
        REFERENCES_FOLDER: ${{ inputs.references_folder }}
        RESULTS_FOLDER: ${{ inputs.results_folder }}
      run: |
        set -euo pipefail
        node "$ACTION_PATH/../../node-actions/test-playwright/drive/storage.mjs" cleanup
