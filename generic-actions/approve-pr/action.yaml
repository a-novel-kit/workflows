name: approve-pr
description: >
  Approve a repository admin's own pull request as a GitHub App. Self-approval skips review, so it
  stays an escape hatch for urgent work or for a repository with no other reviewer. `require-role`
  refuses anyone but an admin, core included through its org role, the action refuses a pull request
  someone else opened, and `approve-bot` records the approval.

inputs:
  client_id:
    required: true
    description: Client ID of a GitHub App with the pull-requests write permission.
  app_private_key:
    required: true
    description: Private key (PEM) of that App.
  pull_request:
    required: true
    description: URL or number of a pull request in the calling repository.
  kill_switch:
    required: false
    default: ""
    description: >
      Org-wide halt switch. The action runs only on an explicit off value: empty, 0, off, false, no
      or disabled, compared lowercased with whitespace removed. Any other value halts it, so a
      mistyped value fails safe. A halt fails the step before the role check, the token mint and the
      approval.

runs:
  using: composite
  steps:
    # The org-wide halt is read first. A person triggers this action, so a halt fails the step where
    # that person sees it.
    - name: Halt guard (kill-switch)
      shell: bash
      env:
        KILL_SWITCH: ${{ inputs.kill_switch }}
      run: |
        set -euo pipefail
        # A failing step stops the composite, so the role check, the mint and the approval never run.
        case "$(printf '%s' "${KILL_SWITCH:-}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')" in
          "" | 0 | off | false | no | disabled) : ;;
          *)
            echo "::error::AGENT_KILL_SWITCH engaged — [Agent] automation is halted org-wide; approvals are refused. Lift the org kill-switch (set it to an explicit off-token, e.g. \"off\", or unset it) to proceed."
            exit 1
            ;;
        esac

    - uses: a-novel-kit/workflows/generic-actions/require-role@v1.72.0
      with:
        roles: admin

    # The token reads the author and writes the review. approve-bot reaches the pull request through
    # the API, so it needs no checkout and no contents access.
    - name: Mint approval token
      id: token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.client_id }}
        private-key: ${{ inputs.app_private_key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-pull-requests: write

    # An admin approves only their own pull request. Anyone else's gets a review on GitHub. The check
    # names the person who started this attempt, as require-role does, so a re-run is theirs.
    - name: Require own pull request
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        GH_REPO: ${{ github.repository }}
        PR_URL: ${{ inputs.pull_request }}
        ACTOR: ${{ github.triggering_actor }}
      run: |
        set -euo pipefail
        author="$(gh pr view "$PR_URL" --json author --jq .author.login)"
        if [ "$author" != "$ACTOR" ]; then
          echo "::error::@${ACTOR} may approve only their own pull request; ${PR_URL} was opened by @${author}. Review it on GitHub instead."
          exit 1
        fi

    - uses: a-novel-kit/workflows/generic-actions/approve-bot@v1.72.0
      with:
        pull_request: ${{ inputs.pull_request }}
        github_token: ${{ steps.token.outputs.token }}
