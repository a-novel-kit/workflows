name: approve-pr
description: >
  Approve a pull request as a GitHub App on behalf of a repository admin or maintainer, usually one
  approving their own pull request. Self-approval skips review, so it stays an escape hatch for urgent
  work or for a repository with no other reviewer. `require-role` refuses anyone below Maintain, and
  `approve-bot` records the approval.

inputs:
  client_id:
    required: true
    description: Client ID of a GitHub App with the pull-requests write permission.
  app_private_key:
    required: true
    description: Private key (PEM) of that App.
  pull_request:
    required: true
    description: URL or number of a pull request in the calling repository.
  kill_switch:
    required: false
    default: ""
    description: >
      Org-wide halt switch. The action runs only when the value, lowercased and stripped of
      whitespace, is empty, 0, off, false, no or disabled. Any other value halts it, so a mistyped
      value fails safe. A halt fails the step before the role check, the token mint and the approval.

runs:
  using: composite
  steps:
    # The org-wide halt is read first. A person triggers this action, so a halt fails the step where
    # that person sees it.
    - name: Halt guard (kill-switch)
      shell: bash
      env:
        KILL_SWITCH: ${{ inputs.kill_switch }}
      run: |
        set -euo pipefail
        # A failing step stops the composite, so the role check, the mint and the approval never run.
        case "$(printf '%s' "${KILL_SWITCH:-}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')" in
          "" | 0 | off | false | no | disabled) : ;;
          *)
            echo "::error::AGENT_KILL_SWITCH engaged — [Agent] automation is halted org-wide; approvals are refused. Lift the org kill-switch (set it to an explicit off-token, e.g. \"off\", or unset it) to proceed."
            exit 1
            ;;
        esac

    - uses: a-novel-kit/workflows/generic-actions/require-role@v1.66.1
      with:
        roles: admin,maintain

    # The token only writes the review. approve-bot reaches the pull request through the API, so it
    # needs no checkout and no contents access.
    - name: Mint approval token
      id: token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.client_id }}
        private-key: ${{ inputs.app_private_key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-pull-requests: write

    - uses: a-novel-kit/workflows/generic-actions/approve-bot@v1.66.1
      with:
        pull_request: ${{ inputs.pull_request }}
        github_token: ${{ steps.token.outputs.token }}
