name: approve bot
description: Records a pull request approval on every invocation. Only enable this for a specific set of users.

inputs:
  pull_request:
    required: true
    description: URL or number of the pull request to approve. A number refers to the calling repository.
  github_token:
    required: true
    description: The GitHub token to use for the action.
  head_sha:
    required: false
    default: ""
    description: >
      Commit the approval applies to. Empty approves the current head. With a commit, the approval is
      made only while that commit is the head, and withdrawn if the head moves while it is made, so a
      later push never inherits it.

runs:
  using: "composite"
  steps:
    - name: approve PR
      shell: bash
      run: |
        set -euo pipefail
        if [ -z "$HEAD_SHA" ]; then
          gh pr review --approve "$PR_URL"
          exit 0
        fi
        pull="repos/$GH_REPO/pulls/${PR_URL##*/}"
        if [ "$(gh api "$pull" --jq .head.sha)" != "$HEAD_SHA" ]; then
          echo "::notice::The head moved past ${HEAD_SHA:0:12}; not approving it."
          exit 0
        fi
        review="$(gh api "$pull/reviews" --method POST -f event=APPROVE -f commit_id="$HEAD_SHA" --jq .id)"
        # Whether GitHub counts an older commit's approval after a push is undocumented, so a head that
        # moved meanwhile withdraws it. A push after this read dismisses the approval as stale.
        if [ "$(gh api "$pull" --jq .head.sha)" != "$HEAD_SHA" ]; then
          gh api "$pull/reviews/$review/dismissals" --method PUT -f event=DISMISS \
            -f message="The head moved past the approved commit." >/dev/null
          echo "::notice::The head moved past ${HEAD_SHA:0:12}; withdrew the approval."
        fi
      env:
        PR_URL: ${{ inputs.pull_request }}
        HEAD_SHA: ${{ inputs.head_sha }}
        GH_TOKEN: ${{ inputs.github_token }}
        # Without a checkout, gh resolves a bare PR number only through GH_REPO.
        GH_REPO: ${{ github.repository }}
