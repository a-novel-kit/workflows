name: detect-partial-landing
description: >
  Writes the required `epic-freeze` check, which holds an Epic's remaining pull requests once a
  partial landing is confirmed. merge-gate releases an `epic:<N>` set to land together. After
  landing starts, a member can drop out of its merge queue while the others keep merging, and
  merge-gate cannot see it, because the dropped member is still approved and ready.

  Two modes share one decision function, so they cannot disagree. Per-PR mode runs when a pull
  request or a merge group is given, and posts on that head only. It fails open with `success` when
  a read fails for a known head, so a fresh head never strands on "Expected". It posts `failure`
  when it cannot tie the head to a pull request, which dequeues a merge group. Sweep mode runs
  otherwise. It evaluates every active Epic in the org, re-arms auto-merge on stray members within
  grace, freezes confirmed partial landings, and posts `success` on every open head without an
  `epic:<N>` label. A sweep that cannot read an Epic posts nothing for it, so a standing freeze
  stays. Both modes re-read every member's state on each pass.

  Membership is the live `epic:<N>` label set plus the activation snapshot that merge-gate freezes
  into the Epic issue. The snapshot keeps a member that was de-labeled and closed mid-landing in
  view, and the sweep reaches an Epic through its snapshot when no open pull request carries the
  label. The snapshot's wave boundary limits merge history to the Epic's current wave.

  The freeze is an `epic-freeze` check-run with `conclusion: failure`. GitHub counts `neutral` as a
  passing required check, so a hold is never neutral. Posted on a live queue head, the freeze
  dequeues the group. A later pass that finds the Epic whole posts `success` and lifts the freeze.
  The action never reverts a merged pull request. `automation:paused` on the Epic issue leaves the
  Epic to manual control. `dry_run` defaults on and logs every intended post and re-enqueue without
  writing to GitHub.

inputs:
  client_id:
    required: true
    description: >
      Client ID of the GitHub App that posts `epic-freeze`. Its identity fixes the check's
      integration ID, so a ruleset can require the check from that App. Both modes mint org-wide
      tokens for Issues and Pull requests read and for Checks write. The sweep also mints a Pull
      requests and Contents write token for the roll-forward. That token is scoped to the
      repositories with an open Epic pull request, and the sweep skips it when there is none.
  app_private_key:
    required: true
    description: Private key (PEM) of that App.
  org:
    required: false
    default: ${{ github.repository_owner }}
    description: >
      Organization whose pull requests and Epics both modes evaluate. Every search is scoped to it,
      and every token is minted on its installation. Defaults to the workflow's owner.
  repo:
    required: false
    default: ${{ github.event.repository.name }}
    description: >
      Repository name, without owner, of the pull request or merge group that per-PR mode evaluates.
      The sweep ignores it. Defaults to the triggering repository.
  pull_request_number:
    required: false
    default: ${{ github.event.pull_request.number }}
    description: >
      Pull request that per-PR mode evaluates. A value here or in `merge_group_head_ref` selects
      per-PR mode, and both empty select the sweep. Defaults to the triggering pull request.
  head_sha:
    required: false
    default: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
    description: >
      Per-PR only. Commit that the `epic-freeze` check is posted on: the pull request head, or the
      group's head on a `merge_group` event.
  merge_group_head_ref:
    required: false
    default: ${{ github.event.merge_group.head_ref }}
    description: >
      Head ref of the merge-queue group to gate, such as `refs/heads/gh-readonly-queue/master/pr-7-<sha>`.
      A value selects per-PR mode. Defaults to the triggering merge group; a run relayed through
      `workflow_run` passes it from `relay-context`. Empty off the queue.
  grace_minutes:
    required: false
    default: "45"
    description: >
      Minutes after the wave's first merge during which the sweep re-arms a stray open member instead
      of freezing the Epic. A stray still out of the queue after the window trips the freeze. A member
      closed without merging trips it at once. Must be a whole number.
  dry_run:
    required: false
    default: "true"
    description: >
      Only "false", ignoring case and whitespace, posts check-runs and re-enqueues. Any other value,
      the default "true" included, logs every intended check post and re-enqueue without writing to
      GitHub.
  planning_repo:
    required: false
    default: .github
    description: >
      Repository name, without owner, that holds the Epic issues. The action reads each Epic's
      `automation:paused` label and activation snapshot there. Defaults to `.github`.
  max_freeze_repos:
    required: false
    default: "5"
    description: >
      Sweep only. Number of distinct repositories one Epic's freeze may span before the sweep flags
      it as suspiciously wide. A wider freeze is still posted on every target, and the sweep raises an
      `::error` and ends red so a person investigates. Other Epics in the sweep are unaffected. Empty
      falls back to 5. Must be a positive integer.
  kill_switch:
    required: false
    default: ""
    description: >
      Org-wide halt flag. A composite action cannot read the `vars` context, so the caller threads an
      org variable in. Only an explicit off value runs the action: empty, 0, off, false, no or
      disabled, compared lowercased with whitespace removed. Any other value halts it, so a mistyped
      value stops automation. The flag resolves with no API call and is acted on before any
      evaluation. When halted, per-PR mode posts a `failure` hold on the head, because a skipped or
      neutral required check passes. The sweep posts and re-enqueues nothing, because merge-gate holds
      every pull request while halted.

runs:
  using: composite
  steps:
    # The mode comes first because it gates the write-token mint, so per-PR mode holds only the read
    # and checks tokens.
    - name: Select mode (per-PR vs sweep)
      id: mode
      shell: bash
      env:
        IN_QUEUE: ${{ inputs.merge_group_head_ref }}
        PR_NUMBER: ${{ inputs.pull_request_number }}
      run: |
        set -euo pipefail
        if [ -n "${IN_QUEUE:-}" ] || [ -n "${PR_NUMBER:-}" ]; then
          echo "mode=per-pr" >> "$GITHUB_OUTPUT"
          echo "detect-partial-landing: PER-PR mode."
        else
          echo "mode=sweep" >> "$GITHUB_OUTPUT"
          echo "detect-partial-landing: SWEEP mode."
        fi

    # App tokens, because an Epic's members span the org and GITHUB_TOKEN sees one repository. The read
    # and checks tokens are org-wide, since enumeration and freeze posts reach every repository. The
    # enqueue token below is scoped to the repositories with an open Epic pull request.
    #
    # The kill switch does not gate the mints. A halted per-PR run posts its hold with the checks
    # token. A halted sweep still runs the discovery read below, then posts and re-enqueues nothing.
    - name: Mint read token
      id: read
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.client_id }}
        private-key: ${{ inputs.app_private_key }}
        owner: ${{ inputs.org }}
        permission-issues: read
        permission-pull-requests: read

    - name: Mint checks token
      id: checks
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.client_id }}
        private-key: ${{ inputs.app_private_key }}
        owner: ${{ inputs.org }}
        permission-checks: write

    # The repositories with an open `epic:<N>` pull request bound the enqueue token, so a leaked token
    # reaches only repositories mid-landing. This read is also the sweep's enumeration. The step saves
    # it in search_prs' node shape, and sweep_main derives its Epic set from it, so the token scope and
    # the Epic set come from one read.
    #
    # A snapshot-only member's repository can fall outside the scope, and sweep_post_clear never rolls
    # such a member forward. A failed page saves nothing and mints no enqueue token, so the scope is
    # never partial.
    - name: Discover active-Epic repos (scope for the enqueue token)
      id: scope
      if: ${{ steps.mode.outputs.mode == 'sweep' }}
      shell: bash
      env:
        GH_TOKEN: ${{ steps.read.outputs.token }}
        ORG: ${{ inputs.org }}
      run: |
        set -euo pipefail
        if ! [[ "${ORG:-}" =~ ^[A-Za-z0-9-]+$ ]]; then
          echo "::error::org must be a valid GitHub login (alphanumeric + hyphens), got \"${ORG:-}\""; exit 1
        fi
        Q='query($q:String!,$cursor:String){ search(query:$q, type:ISSUE, first:100, after:$cursor){
          pageInfo{ hasNextPage endCursor }
          nodes{ ... on PullRequest{
            number headRefOid mergedAt baseRefName isDraft
            repository{ nameWithOwner }
            labels(first:100){ nodes{ name } } } } } }'
        cursor=""; prs='[]'; failed=0
        while :; do
          args=(-f query="$Q" -f q="org:${ORG} is:pr is:open")
          [ -n "$cursor" ] && args+=(-f cursor="$cursor")
          # A 200 carrying data and errors is a partial page, so it fails the read as search_prs does.
          if ! data=$(gh api graphql "${args[@]}" 2>/dev/null) \
            || ! printf '%s' "$data" | jq -e 'has("data") and (has("errors") | not)' >/dev/null 2>&1; then
            failed=1; break
          fi
          prs=$(jq -cs '.[0] + [(.[1].data.search.nodes // [])[] | select(.number != null)]' \
            <(printf '%s' "$prs") <(printf '%s' "$data"))
          [ "$(printf '%s' "$data" | jq -r '.data.search.pageInfo.hasNextPage')" = "true" ] || break
          cursor=$(printf '%s' "$data" | jq -r '.data.search.pageInfo.endCursor')
        done
        if [ "$failed" = 1 ]; then
          # A partial scope makes reenqueue fail in every uncovered repository, so a failed discovery
          # mints no enqueue token. Freeze detection still runs, because sweep_main enumerates again
          # when nothing was saved.
          echo "::warning::active-Epic repo discovery failed — not minting the enqueue token this sweep (roll-forward waits for the next); freeze detection is unaffected."
          echo "repos=" >> "$GITHUB_OUTPUT"
        else
          open_prs=$(mktemp "${RUNNER_TEMP}/open-prs.XXXXXX")
          printf '%s' "$prs" > "$open_prs"
          csv=$(printf '%s' "$prs" | jq -r '[.[] | select([.labels.nodes[]?.name] | any(test("^epic:[0-9]+$")))
            | .repository.nameWithOwner | split("/")[1]] | unique | join(",")')
          {
            echo "repos=${csv}"
            echo "open_prs=${open_prs}"
          } >> "$GITHUB_OUTPUT"
          echo "Enqueue-token scope (repos with an open Epic PR): ${csv:-<none>}"
        fi

    - name: Mint enqueue token
      id: write
      if: ${{ steps.mode.outputs.mode == 'sweep' && steps.scope.outputs.repos != '' }}
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.client_id }}
        private-key: ${{ inputs.app_private_key }}
        owner: ${{ inputs.org }}
        repositories: ${{ steps.scope.outputs.repos }}
        # `gh pr merge --auto` needs contents:write alongside pull-requests:write.
        permission-pull-requests: write
        permission-contents: write

    - name: Detect + reconcile partial landings
      shell: bash
      env:
        # GH_TOKEN is the read token. freeze_post and reenqueue apply the checks and write tokens
        # inline, so no read helper holds a write scope. WRITE_TOKEN is empty when its mint was
        # skipped.
        GH_TOKEN: ${{ steps.read.outputs.token }}
        CHECKS_TOKEN: ${{ steps.checks.outputs.token }}
        WRITE_TOKEN: ${{ steps.write.outputs.token }}
        # Path to the file of open pull requests the scope step saved. Empty in per-PR mode or when its
        # read failed.
        OPEN_PRS: ${{ steps.scope.outputs.open_prs }}
        MODE: ${{ steps.mode.outputs.mode }}
        ORG: ${{ inputs.org }}
        PLANNING_REPO: ${{ inputs.planning_repo }}
        GRACE_MINUTES: ${{ inputs.grace_minutes }}
        MAX_FREEZE_REPOS: ${{ inputs.max_freeze_repos }}
        DRY_RUN: ${{ inputs.dry_run }}
        KILL_SWITCH: ${{ inputs.kill_switch }}
        # Per-PR inputs, read only in per-PR mode. REPO_FULL derives from `org`, the owner the tokens
        # are minted for.
        REPO: ${{ inputs.repo }}
        REPO_FULL: ${{ inputs.org }}/${{ inputs.repo }}
        HEAD_SHA: ${{ inputs.head_sha }}
        PR_NUMBER: ${{ inputs.pull_request_number }}
        IN_QUEUE: ${{ inputs.merge_group_head_ref }}
        # The number and labels of the pull request in a pull_request event payload. They let per-PR
        # mode classify that pull request with no API call.
        EVENT_PR: ${{ github.event.pull_request.number }}
        EVENT_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
      run: |
        set -euo pipefail

        # ---- Validate the inputs before they reach a search query, an API path or arithmetic.
        # org feeds `org:<ORG>` search qualifiers, where whitespace or an extra qualifier changes the
        # scope.
        if ! [[ "${ORG:-}" =~ ^[A-Za-z0-9-]+$ ]]; then
          echo "::error::org must be a valid GitHub login (alphanumeric + hyphens), got \"${ORG:-}\""
          exit 1
        fi
        if ! [[ "${GRACE_MINUTES:-}" =~ ^[0-9]+$ ]]; then
          echo "::error::grace_minutes must be an integer, got \"${GRACE_MINUTES:-}\""
          exit 1
        fi
        if ! [[ "${PLANNING_REPO:-}" =~ ^[A-Za-z0-9._-]+$ ]]; then
          echo "::error::planning_repo must be a bare repository name (no owner/slash), got \"${PLANNING_REPO:-}\""
          exit 1
        fi
        # An empty max_freeze_repos falls back to the input's default, for a caller that threads an
        # empty string through.
        MAX_FREEZE_REPOS="${MAX_FREEZE_REPOS:-5}"
        if ! [[ "${MAX_FREEZE_REPOS}" =~ ^[0-9]+$ ]] || [ "${MAX_FREEZE_REPOS}" -lt 1 ]; then
          echo "::error::max_freeze_repos must be a positive integer, got \"${MAX_FREEZE_REPOS:-}\""
          exit 1
        fi

        # Org-level halt flag. Only an explicit off value runs the action, and any other value halts it.
        # The halt acts just before dispatch, once freeze_post is defined, so a halted per-PR run posts
        # its hold through the dry-run gate.
        kill_engaged=true
        case "$(printf '%s' "${KILL_SWITCH:-}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')" in
          "" | 0 | off | false | no | disabled) kill_engaged=false ;;
        esac
        # Per-PR inputs become GraphQL arguments and API path components. Per-PR mode fails open on
        # uncertain data, but a misconfigured input fails the run here.
        if [ "${MODE:-}" = "per-pr" ]; then
          if ! [[ "${REPO:-}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::repo must be a bare repository name (no owner/slash), got \"${REPO:-}\""
            exit 1
          fi
          if [ -n "${PR_NUMBER:-}" ] && ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::pull_request_number must be numeric, got \"$PR_NUMBER\""
            exit 1
          fi
          if ! [[ "${HEAD_SHA:-}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::head_sha must be a 40-hex commit SHA, got \"${HEAD_SHA:-}\""
            exit 1
          fi
        fi

        # tr lowercases portably to Bash 3.
        dry=$(printf '%s' "${DRY_RUN:-}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
        [ "$dry" = false ] || dry=true

        now_epoch=$(date -u +%s)
        grace_seconds=$(( GRACE_MINUTES * 60 ))

        # epic_issue caches one response per Epic issue here for the pass. The cache lives on disk
        # because its readers run inside `$( )`, whose assignments never reach the parent shell.
        EPIC_CACHE=$(mktemp -d)
        trap 'rm -rf "$EPIC_CACHE"' EXIT

        # ---- Shared GraphQL documents ----------------------------------------------------

        # One pull request node shape serves the enumeration and the three per-Epic searches. The scope
        # step saves its enumeration in this shape, so a field added here is added there too.
        SEARCH_Q='query($q:String!,$cursor:String){
          search(query:$q, type:ISSUE, first:100, after:$cursor){
            pageInfo{ hasNextPage endCursor }
            nodes{ ... on PullRequest{
              number headRefOid mergedAt baseRefName isDraft
              repository{ nameWithOwner }
              labels(first:100){ nodes{ name } } } } } }'

        # Live merge-queue entries. `mergeQueue` is null on a branch with no queue. An entry's
        # headCommit is the queue's temporary merge commit, which differs from the pull request's head.
        MQ_Q='query($owner:String!,$repo:String!,$base:String!){
          repository(owner:$owner,name:$repo){
            mergeQueue(branch:$base){
              entries(first:100){ nodes{ pullRequest{ number } state headCommit{ oid } } } } } }'

        # One pull request's labels, read in per-PR mode when the event payload does not carry them.
        PR_LABELS_Q='query($owner:String!,$repo:String!,$num:Int!){
          repository(owner:$owner,name:$repo){
            pullRequest(number:$num){ labels(first:100){ nodes{ name } } } } }'

        # ---- Read helpers (all use the default read GH_TOKEN) ----------------------------

        # Pages a pull request search to completion, retrying transient GraphQL errors. Prints the
        # node array, or logs the error to stderr and returns 1.
        search_prs() { # $1 = search query string
          local search="$1" cursor="" agg='[]' data page ok
          while :; do
            ok=false
            local args
            for attempt in 1 2 3; do
              args=(-f query="$SEARCH_Q" -f q="$search")
              [ -n "$cursor" ] && args+=(-f cursor="$cursor")
              # stderr joins stdout so a transport, auth or rate-limit error reaches the log. On success
              # gh prints only the response JSON, which jq validates.
              if data=$(gh api graphql "${args[@]}" 2>&1) \
                && printf '%s' "$data" | jq -e 'has("data") and (has("errors") | not)' >/dev/null 2>&1; then
                ok=true
                break
              fi
              [ "$attempt" -lt 3 ] && sleep 2
            done
            if [ "$ok" != true ]; then
              printf 'search_prs failed for query "%s": %s\n' "$search" "$data" >&2
              return 1
            fi
            page=$(printf '%s' "$data" | jq '[(.data.search.nodes // [])[] | select(.number != null)]')
            agg=$(jq -s '.[0] + .[1]' <(printf '%s' "$agg") <(printf '%s' "$page"))
            [ "$(printf '%s' "$data" | jq -r '.data.search.pageInfo.hasNextPage')" = "true" ] || break
            cursor=$(printf '%s' "$data" | jq -r '.data.search.pageInfo.endCursor')
          done
          printf '%s' "$agg"
        }

        # Prints the live queue entries of one owner, repo and base as a JSON array of
        # {number, state, headOid}. Returns 1 on failure.
        merge_queue_entries() { # $1=owner $2=repo $3=base
          local data
          for attempt in 1 2 3; do
            if data=$(gh api graphql -f query="$MQ_Q" -f owner="$1" -f repo="$2" -f base="$3" 2>&1) \
              && printf '%s' "$data" | jq -e 'has("data") and (has("errors") | not)' >/dev/null 2>&1; then
              printf '%s' "$data" | jq -c '[(.data.repository.mergeQueue.entries.nodes // [])[]
                | select(.pullRequest.number != null)
                | {number: .pullRequest.number, state, headOid: .headCommit.oid}]'
              return 0
            fi
            [ "$attempt" -lt 3 ] && sleep 2
          done
          printf 'merge_queue_entries failed for %s/%s@%s: %s\n' "$1" "$2" "$3" "$data" >&2
          return 1
        }

        # Reads a pull request over REST, the ground truth the search index lags behind. Prints
        # "<state> <merged>", such as "closed true" or "open false". Returns 1 on error.
        rest_pr_state() { # $1=owner/repo $2=number
          local data
          for attempt in 1 2 3; do
            if data=$(gh api "repos/$1/pulls/$2" 2>&1); then
              printf '%s' "$data" | jq -r '"\(.state) \(.merged)"'
              return 0
            fi
            [ "$attempt" -lt 3 ] && sleep 2
          done
          printf 'rest_pr_state failed for %s#%s after 3 attempts: %s\n' "$1" "$2" "${data:-<no response>}" >&2
          return 1
        }

        # Prints one pull request's label names as a JSON array. A null pullRequest counts as a failure,
        # and the function returns 1 after three attempts.
        fetch_pr_labels() { # $1 = pr number
          local data
          for attempt in 1 2 3; do
            if data=$(gh api graphql -f query="$PR_LABELS_Q" -f owner="$ORG" -f repo="$REPO" -F num="$1" 2>&1) \
              && printf '%s' "$data" | jq -e 'has("data") and (has("errors") | not) and (.data.repository.pullRequest != null)' >/dev/null 2>&1; then
              printf '%s' "$data" | jq -c '[(.data.repository.pullRequest.labels.nodes // [])[].name]'
              return 0
            fi
            [ "$attempt" -lt 3 ] && sleep 2
          done
          printf 'fetch_pr_labels failed for PR #%s after 3 attempts: %s\n' "$1" "${data:-<no response>}" >&2
          return 1
        }

        # Prints the snapshot marker JSON from an issue body, or nothing. Fences match only as whole
        # lines, so a pseudo-fence planted in prose cannot shadow the region. The note ahead of the JSON
        # is skipped. `-s .[0]` takes the first value when a hand-edit left several, and prose after the
        # JSON voids the marker. The claim index and snapshot_buckets both read markers here, so neither
        # reaches an Epic the other cannot parse.
        #
        # merge-gate writes the marker, and epic-membership and epic-rollback read it too. A change to
        # its fences or shape lands in all four actions.
        extract_marker() { # $1 = issue body (CRLF already stripped)
          local s='<!-- epic-membership:snapshot:start -->' e='<!-- epic-membership:snapshot:end -->'
          printf '%s\n' "$1" \
            | awk -v s="$s" -v e="$e" '$0 == s {f=1;next} $0 == e {f=0} f' \
            | sed -n '/^[[:space:]]*[{[]/,$p' \
            | jq -s -c '.[0] // empty' 2>/dev/null || true
        }

        # Reads an Epic issue once per pass for the pause check and the snapshot reader. One read saves
        # a request per Epic and keeps both callers on one view of the issue. build_claim_index primes
        # the cache from its list of the planning repo. The cache holds the response, so each caller
        # keeps its own failure policy: an unreadable pause fails open, and an unreadable snapshot
        # decides nothing.
        #
        # Prints the response. Returns 0 when read, 2 when the Epic issue does not exist, and 1 when the
        # read failed. The last attempt's error text is cached as <N>.err.
        epic_issue() { # $1 = epic number
          local f="${EPIC_CACHE}/$1.json" rcf="${EPIC_CACHE}/$1.rc" ef="${EPIC_CACHE}/$1.err"
          local resp err="" errf attempt rc=1
          if [ -f "$rcf" ]; then
            cat "$f" 2>/dev/null || true
            return "$(cat "$rcf")"
          fi
          errf=$(mktemp)
          for attempt in 1 2 3; do
            # stdout carries the payload and stderr the diagnosis, so a `gh` notice never lands inside
            # the JSON. jq rejects any response that is not an issue object.
            if resp=$(gh api "repos/${ORG}/${PLANNING_REPO}/issues/$1" 2>"$errf") \
              && printf '%s' "$resp" | jq -e 'type == "object" and has("body")' >/dev/null 2>&1; then
              rc=0
              break
            fi
            err=$(cat "$errf" 2>/dev/null || true)
            # A missing Epic issue is not retried.
            case "$err" in *"HTTP 404"*) rc=2; break ;; esac
            [ "$attempt" -lt 3 ] && sleep 2
          done
          rm -f "$errf"
          [ "$rc" = 0 ] && printf '%s' "$resp" > "$f"
          printf '%s' "$err" > "$ef"
          printf '%s' "$rc" > "$rcf"
          [ "$rc" = 0 ] && printf '%s' "$resp"
          return "$rc"
        }

        # Reports whether the Epic issue carries the `automation:paused` label. Applying a label needs
        # triage, so the pause is permission-gated. Returns 0 when paused, 1 when not, and 2 on a read
        # error. Callers treat 2 as not paused, so a real partial landing is still caught.
        epic_paused() { # $1 = epic number
          local resp rc=0
          resp=$(epic_issue "$1") || rc=$?
          # A missing Epic issue carries no pause label, so it reads as not paused.
          [ "$rc" = 2 ] && return 1
          [ "$rc" = 0 ] || return 2
          printf '%s' "$resp" | jq -e 'any(.labels[]?.name; . == "automation:paused")' >/dev/null 2>&1
        }

        # Indexes the frozen snapshots in the planning repo, independent of any live label. CLAIM_EPICS
        # lists the Epics carrying one, so the sweep evaluates an Epic whose last labeled pull request
        # was de-labeled. CLAIM_MEMBERS maps each claimed member to its Epic for epic_claiming. The
        # function lists the open issues once and primes the epic_issue cache with each. A marker search
        # is unreliable, because GitHub's tokenizer drops the marker's punctuation and the search index
        # can omit a matching issue.
        #
        # A list error leaves both indexes empty and costs the rescue for one pass. The claim set only
        # adds to what the live labels reach. Any frozen marker with a non-empty member array is
        # indexed, and snapshot_buckets applies the strict per-member checks later. An Epic indexed in
        # error resolves to a decision that posts nothing.
        build_claim_index() { # no args
          CLAIM_EPICS=''
          # Repos are case-folded, because GitHub resolves repository names case-insensitively.
          CLAIM_MEMBERS='[]'
          local pages nodes n elem body marker total=0 added=0
          if ! pages=$(gh api --paginate "repos/${ORG}/${PLANNING_REPO}/issues?state=open&per_page=100" 2>/dev/null); then
            echo "::warning::could not list open issues in ${ORG}/${PLANNING_REPO} — reaching Epics through live labels only this pass; a de-labeled Epic is not rescued." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            return 0
          fi
          # --paginate prints one JSON array per page, and `-s add` merges them. The list endpoint
          # returns pull requests too, which carry a `pull_request` key and are dropped. A parse failure
          # leaves the index empty.
          nodes=$(printf '%s' "$pages" | jq -s -c 'add // [] | map(select(has("pull_request") | not))' 2>/dev/null) || nodes='[]'
          total=$(printf '%s' "$nodes" | jq 'length' 2>/dev/null || echo 0)
          # fd 4 keeps the loop body's commands off this feed. The loop runs in this shell, so
          # CLAIM_EPICS and CLAIM_MEMBERS persist. jq -c puts each issue on one line.
          while IFS= read -r elem <&4; do
            n=$(printf '%s' "$elem" | jq -r '.number')
            # Prime epic_issue's cache with this issue.
            printf '%s' "$elem" > "${EPIC_CACHE}/$n.json"
            : > "${EPIC_CACHE}/$n.err"
            printf '0' > "${EPIC_CACHE}/$n.rc"
            body=$(printf '%s' "$elem" | jq -r '.body // ""' | tr -d '\r')
            marker=$(extract_marker "$body")
            if printf '%s' "$marker" | jq -e \
                 'type == "object" and .status == "frozen" and (.members | type == "array") and (.members | length > 0)' \
                 >/dev/null 2>&1; then
              CLAIM_EPICS="${CLAIM_EPICS}${n}"$'\n'
              added=$((added + 1))
              # A member without a string repo and a numeric number matches no pull request and is
              # skipped. The Epic number comes from the issue, never from its body.
              CLAIM_MEMBERS=$(jq -c -n --argjson idx "$CLAIM_MEMBERS" --argjson epic "$n" \
                --argjson marker "$marker" '
                $idx + [ $marker.members[]
                  | select((.repo | type) == "string" and (.number | type) == "number")
                  | {epic: $epic, repo: (.repo | ascii_downcase), number} ]' 2>/dev/null || printf '%s' "$CLAIM_MEMBERS")
            fi
          done 4< <(printf '%s' "$nodes" | jq -c '.[]' 2>/dev/null)
          echo "Claim index: ${total} open issue(s) in ${ORG}/${PLANNING_REPO}, ${added} carrying a frozen snapshot." \
            | tee -a "$GITHUB_STEP_SUMMARY"
        }

        # Prints the Epic whose frozen snapshot claims a pull request, or nothing, from the index
        # build_claim_index filled. The repo is case-folded to match the index. A pull request belongs
        # to at most one Epic, so the first match wins.
        epic_claiming() { # $1 = owner/repo  $2 = pull request number
          printf '%s' "${CLAIM_MEMBERS:-[]}" | jq -r --arg r "$1" --argjson n "$2" \
            'map(select(.repo == ($r | ascii_downcase) and .number == $n))[0].epic // empty' 2>/dev/null || true
        }

        # Reads an Epic's frozen activation snapshot and buckets its members by their live state.
        # merge-gate freezes the member set into the Epic body once the set holds still, and every
        # member's state is re-read here on each pass. No label search can rebuild that set, because GitHub
        # indexes no "ever carried label X". The set also omits members that merged before the freeze,
        # so evaluate_epic adds these buckets to the live ones.
        #
        # Fills SNAP_MERGED, SNAP_CLOSED and SNAP_OPEN in search_prs' node shape, and SNAP_SINCE with
        # any valid wave boundary, a `retired` tombstone's included. Returns 0 when the frozen set
        # resolved, 2 when there is no usable snapshot and the live floor stands alone, and 1 when a
        # frozen set exists, or might, and did not resolve. On 1, EV_DECISION stays error. The sweep
        # then posts nothing, so a standing freeze stays, and per-PR mode fails open on its head.
        snapshot_buckets() { # $1 = epic number
          SNAP_MERGED='[]'
          SNAP_CLOSED='[]'
          SNAP_OPEN='[]'
          SNAP_SINCE=''
          local resp="" body="" rc=0 marker frozen want alias_q rh out nodes
          local since="" since_epoch="" shown=""
          resp=$(epic_issue "$1") || rc=$?
          # A missing Epic issue holds no snapshot, so the live floor is the whole truth. Any other read
          # failure leaves the snapshot unknown. An unknown decides nothing, because a `clear` posts
          # success and lifts a standing freeze.
          if [ "$rc" = 2 ]; then
            echo "::warning::epic #$1: ${ORG}/${PLANNING_REPO}#$1 not found — no snapshot possible, live label set only."
            return 2
          fi
          if [ "$rc" != 0 ]; then
            echo "::error::epic #$1: could not read ${ORG}/${PLANNING_REPO}#$1 after 3 attempts, so it is unknown whether a snapshot exists — deciding nothing this pass: $(cat "${EPIC_CACHE}/$1.err" 2>/dev/null || true)"
            return 1
          fi
          # GitHub stores bodies with CRLF, and the fences match only without \r.
          body=$(printf '%s' "$resp" | jq -r '.body // ""' | tr -d '\r')

          marker=$(extract_marker "$body")

          # The wave boundary is read from any marker, whatever its `status`, ahead of the frozen-only
          # returns below. A `retired` tombstone names no members and carries only this instant. A
          # pending or frozen marker carries it forward from the tombstone it replaced. The value is
          # validated once here, because the caller appends it to a search query as is.
          since=$(printf '%s' "$marker" | jq -r 'if type == "object" then (.since // empty) else empty end' 2>/dev/null || true)
          if [ -n "$since" ]; then
            # GitHub answers a malformed time qualifier, such as `merged:>=2026-13-45T99:00:00Z`, with
            # zero rows and no `errors` array, and a future instant hides every merge the same way. An
            # empty merged bucket decides `clear`, which lifts a standing freeze. A boundary therefore
            # reaches the query only in merge-gate's exact form, as a real date, and not ahead of this
            # run. Any other value is dropped for the Epic's whole history, which errs toward freezing.
            #
            # The marker is attacker-controlled issue content, and GitHub reads workflow commands line by
            # line. A raw value with an embedded newline forges its own `::error::` or `::stop-commands::`
            # line, so the warnings show one bounded line.
            shown=$(printf '%s' "$since" | tr -d '\r\n' | cut -c1-64)
            if ! [[ "$since" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
              echo "::warning::epic #$1: the snapshot's wave boundary \"${shown}\" is not an ISO-8601 UTC instant (YYYY-MM-DDTHH:MM:SSZ) — ignoring it and scoping to the Epic's whole history."
            elif ! since_epoch=$(date -u -d "$since" +%s 2>/dev/null); then
              echo "::warning::epic #$1: the snapshot's wave boundary \"${shown}\" is not a real date — ignoring it and scoping to the Epic's whole history."
            # now_epoch is the step's start, and a sweep can be minutes in by the time it reaches this
            # Epic. Five minutes of skew keeps a tombstone that merge-gate just wrote in the past. The
            # allowance hides at most five minutes of merges, well inside the grace window.
            elif [ "$since_epoch" -gt "$(( now_epoch + 300 ))" ]; then
              echo "::warning::epic #$1: the snapshot's wave boundary \"${shown}\" is in the FUTURE — ignoring it (it would hide every merge this Epic has) and scoping to the Epic's whole history."
            else
              SNAP_SINCE="$since"
            fi
          fi

          [ -n "$marker" ] || return 2
          # Only a well-formed frozen marker counts. A pending or misshapen marker falls back to the live
          # floor.
          #
          # The guards are strict because `.repo` and `.number` are interpolated into the GraphQL
          # document below, and anyone with write access to the planning repo can edit the body. The
          # repo pattern excludes the quotes and newlines that inject fields. A fractional number fails
          # the whole document, so the number must be a whole integer. The dedup key is case-folded,
          # because GitHub resolves repository names case-insensitively. The cap bounds the aliased query.
          frozen=$(printf '%s' "$marker" | jq -c --arg org "$ORG" '
            select(type == "object" and .status == "frozen" and (.members | type == "array"))
            | .members
            | select(all(.[]; type == "object"
                and (.repo | type == "string") and (.repo | test("\\A[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9._-]+\\z"))
                and (.repo | ascii_downcase | startswith(($org | ascii_downcase) + "/"))
                and (.number | type == "number" and . == floor and . > 0 and . < 2147483648)))
            | unique_by((.repo | ascii_downcase), .number)
            | select(length > 0 and length <= 50)' 2>/dev/null || true)
          [ -n "$frozen" ] || return 2
          want=$(printf '%s' "$frozen" | jq 'length')

          # One aliased GraphQL call re-reads every member's live state, all or nothing. GitHub answers a
          # multi-alias query with partial data and an `errors` array. A dropped member erases the
          # evidence of abandonment, so only a complete answer is accepted.
          #
          # `|floor` renders each number as an integer literal. jq keeps the literal a body was written
          # with, such as 1.0 or 1e2, and a non-Int literal fails the whole query on every retry.
          alias_q=$(printf '%s' "$frozen" | jq -r 'to_entries | map(
              "m\(.key): repository(owner:\"\(.value.repo|split("/")[0])\", name:\"\(.value.repo|split("/")[1])\")"
              + "{pullRequest(number:\(.value.number|floor)){number headRefOid mergedAt baseRefName isDraft state repository{nameWithOwner}"
              + " labels(first:100){nodes{name}}"
              + " timelineItems(last:250, itemTypes:[LABELED_EVENT]){nodes{... on LabeledEvent{label{name} createdAt}}}}}"
            ) | join("\n")')
          rh=""
          for attempt in 1 2 3; do
            out=$(gh api graphql -f query="{ ${alias_q} }" 2>&1 || true)
            if printf '%s' "$out" | jq -e --argjson want "$want" '
                 (has("errors") | not)
                 and (((.data // {}) | to_entries | map(.value.pullRequest | select(. != null)) | length) == $want)
               ' >/dev/null 2>&1; then
              rh="$out"
              break
            fi
            [ "$attempt" -lt 3 ] && sleep 2
          done
          if [ -z "$rh" ]; then
            # EV_DECISION stays error with no message of its own, so the failure is logged here.
            printf 'snapshot_buckets: could not re-read all %s frozen member(s) of epic #%s after 3 attempts: %s\n' \
              "$want" "$1" "$out" >&2
            return 1
          fi

          # Every member must show the `epic:<N>` label before the marker is trusted. The marker is issue
          # content, yet each member it names becomes a freeze target under an org-wide checks:write
          # token. Applying the label needs triage on the member's repository, so the label is the
          # permission-gated claim. A member shows it by still carrying the label or by a timeline event
          # adding it. One member without it makes the whole marker untrustworthy, and the function
          # decides nothing (rc 1). Dropping that member alone leaves an attacker-chosen subset.
          #
          # A merged pull request keeps its label event for good, so timeline evidence counts only from
          # the wave boundary on. A label still present counts whatever its age, since it is membership
          # now. With no boundary, every event counts. A member labeled and unlabeled within the wave
          # still corroborates, because planning-repo write is the trust boundary and already lets its
          # holder name any member.
          local unverified
          unverified=$(printf '%s' "$rh" | jq -r --arg lbl "epic:$1" --arg since "${SNAP_SINCE:-}" '
            [ (.data // {}) | to_entries[] | .value.pullRequest | select(. != null)
              | select((([(.labels.nodes // [])[].name]
                  + [(.timelineItems.nodes // [])[]
                       | select($since == "" or (.createdAt // "") >= $since) | .label.name // empty]) | index($lbl)) | not)
              | "\(.repository.nameWithOwner)#\(.number)" ] | join(", ")' 2>/dev/null || printf 'PARSE_FAILURE')
          if [ -n "$unverified" ]; then
            echo "::error::epic #$1: the activation snapshot names pull request(s) not labeled \`epic:$1\` during this wave (${unverified}) — refusing to decide anything for this Epic until it is corrected. Check who edited ${ORG}/${PLANNING_REPO}#$1."
            return 1
          fi

          # Each node must answer the member its alias asked for, so no unrequested pull request becomes
          # a freeze target. Identity is the alias index plus the number. GraphQL follows a repository
          # rename and answers with the new nameWithOwner, while the frozen marker keeps the old name, so
          # the name stays out of the match.
          nodes=$(printf '%s' "$rh" | jq -c --argjson members "$frozen" '
            [ (.data // {}) | to_entries[]
              | (.key | ltrimstr("m") | tonumber) as $i
              | .value.pullRequest | select(. != null)
              | select($members[$i] != null and .number == ($members[$i].number | floor)) ]' 2>/dev/null || true)
          if [ -z "$nodes" ] || [ "$(printf '%s' "$nodes" | jq 'length')" -ne "$want" ] \
            || ! printf '%s' "$nodes" | jq -e 'all(.[]; .state == "MERGED" or .state == "CLOSED" or .state == "OPEN")' >/dev/null 2>&1; then
            printf 'snapshot_buckets: re-read of epic #%s did not answer its own member set (unmatched, duplicated, or unknown-state nodes)\n' "$1" >&2
            return 1
          fi

          # A merged pull request reports MERGED, so CLOSED means closed without merging.
          SNAP_MERGED=$(printf '%s' "$nodes" | jq -c '[.[] | select(.state == "MERGED")]')
          SNAP_CLOSED=$(printf '%s' "$nodes" | jq -c '[.[] | select(.state == "CLOSED")]')
          SNAP_OPEN=$(printf '%s' "$nodes" | jq -c '[.[] | select(.state == "OPEN")]')
          return 0
        }

        # Prints the live label buckets and the snapshot's as one view, {merged, closed, open}. A pull
        # request in both is taken from the snapshot, bucket and all. The snapshot is a direct read from
        # this pass, while the live node comes from the eventually consistent search index, and a check
        # posted on a stale head strands on "Expected". Each pull request lands in one bucket. MERGED is
        # terminal, so the fresher read never demotes a member the index reports as merged.
        #
        # Every node is tagged `liveMember`, true when the live `epic:<N>` search still returns it.
        # Detection ignores the tag, since a de-labeled member is still a member. The roll-forward in
        # sweep_post_clear honors it.
        union_buckets() { # $1..$3 = live merged/closed/open, $4..$6 = snapshot merged/closed/open
          jq -cn --argjson lm "$1" --argjson lc "$2" --argjson lo "$3" \
            --argjson sm "$4" --argjson sc "$5" --argjson so "$6" '
            def key: "\(.repository.nameWithOwner | ascii_downcase)#\(.number)";
            ([$lm[], $lc[], $lo[]] | map(key)) as $livekeys
            | ([$sm[], $sc[], $so[]] | map(key)) as $snapkeys
            | def live($b): [ $b[] | select((key | IN($snapkeys[])) | not) | . + {liveMember: true} ];
              # Marker entries under the old and new names of one repository resolve to one pull request.
              def snap($b): [ $b[] | . + {liveMember: (key | IN($livekeys[]))} ] | unique_by(key);
            { merged: (snap($sm) + live($lm)),
              closed: (snap($sc) + live($lc)),
              open:   (snap($so) + live($lo)) }'
        }

        # ---- Post helpers, dry-run aware, on the checks token ----------------------------

        # Posts an epic-freeze check-run, or only logs it unless dry_run is "false". jq builds the
        # payload, so quotes and newlines cannot break the JSON. The POST is checked explicitly because
        # sweep_epic runs under `||`, which disables `set -e`. A failed post is a warning in the sweep,
        # which moves to the next target, and an error in per-PR mode, which fails the run so it can be
        # retried.
        freeze_post() { # $1=owner/repo $2=sha $3=conclusion $4=summary
          if [ "$dry" != "false" ]; then
            echo "would post epic-freeze=$3 @ $1 ${2:0:12} — $4 (DRY RUN)" | tee -a "$GITHUB_STEP_SUMMARY"
            return 0
          fi
          local payload
          payload=$(jq -n --arg sha "$2" --arg concl "$3" --arg summary "$4" \
            '{name: "epic-freeze", head_sha: $sha, status: "completed", conclusion: $concl,
              output: {title: "epic-freeze", summary: $summary}}')
          if printf '%s' "$payload" | GH_TOKEN="$CHECKS_TOKEN" gh api "repos/$1/check-runs" --method POST --input - >/dev/null 2>&1; then
            echo "epic-freeze=$3 @ $1 ${2:0:12} — $4" | tee -a "$GITHUB_STEP_SUMMARY"
            return 0
          fi
          if [ "${MODE:-sweep}" = "sweep" ]; then
            echo "::warning::failed to post epic-freeze=$3 @ $1 ${2:0:12} (next sweep retries)"
            return 0
          fi
          echo "::error::failed to post epic-freeze=$3 @ $1 ${2:0:12}"
          return 1
        }

        # Re-enqueues a stray by enabling auto-merge when it is off, with the write token. A failure is a
        # warning, and the next sweep retries. `--squash` matches the org's squash-only merge method.
        reenqueue() { # $1=owner/repo $2=number
          local target="$1#$2" already
          # Checked ahead of the dry-run return, so a rehearsal reports the same skip a live sweep takes
          # when discovery minted no enqueue token.
          if [ -z "${WRITE_TOKEN:-}" ]; then
            echo "::warning::no enqueue token this sweep (repo discovery failed) — not rolling $target forward; the next sweep retries." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            return 0
          fi
          if [ "$dry" != "false" ]; then
            echo "would re-enqueue (enable auto-merge) on $target (DRY RUN)" | tee -a "$GITHUB_STEP_SUMMARY"
            return 0
          fi
          already=$(GH_TOKEN="$WRITE_TOKEN" gh pr view "$2" --repo "$1" --json autoMergeRequest \
            -q '.autoMergeRequest != null' 2>/dev/null || echo "unknown")
          if [ "$already" = "true" ]; then
            echo "auto-merge already enabled on $target — no-op." | tee -a "$GITHUB_STEP_SUMMARY"
            return 0
          fi
          if GH_TOKEN="$WRITE_TOKEN" gh pr merge "$2" --repo "$1" --auto --squash; then
            echo "re-enqueued (auto-merge enabled) on $target." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::failed to re-enqueue $target (next sweep retries)"
          fi
        }

        # ---- evaluate_epic: the shared decision, with no post or mutation -----------------
        # Sets EV_DECISION to clear, frozen or error, EV_REASON when frozen, and the EV_* data both
        # modes post from. It always returns 0, and any resolve, queue or REST error leaves EV_DECISION
        # at error. Both modes call it, so their predicate cannot drift.
        evaluate_epic() { # $1 = Epic number (already validated numeric)
          EV_DECISION=error; EV_REASON=""
          EV_OPEN='[]'; EV_QUEUE='[]'; EV_STRAYS='[]'
          EV_MERGED_COUNT=0; EV_CLOSED_COUNT=0; EV_OPEN_COUNT=0; EV_STRAY_COUNT=0
          local EPIC="$1"
          local base_q="label:\"epic:${EPIC}\" org:${ORG}"

          # The snapshot resolves first because its wave boundary scopes the searches below. Its members
          # are added to the live floor, so a de-labeled member stays a member and no snapshot shrinks
          # the live set.
          local merged closed_unmerged open membership=live snap_rc=0
          snapshot_buckets "$EPIC" || snap_rc=$?
          case "$snap_rc" in
            0) membership=live+snapshot ;;
            # No usable frozen set, so the live floor stands alone. It still goes through union_buckets
            # against an empty snapshot, so every node carries `liveMember`. SNAP_SINCE keeps its value,
            # because a `retired` tombstone returns 2 and carries only the boundary.
            2) SNAP_MERGED='[]'; SNAP_CLOSED='[]'; SNAP_OPEN='[]' ;;
            *)
              # A frozen set exists, or might, and did not resolve. The live floor alone cannot see a
              # de-labeled member, and a `clear` lifts a standing freeze, so EV_DECISION stays error.
              return 0
              ;;
          esac

          # The live label set is the floor, read in three searches: merged, closed unmerged, and open.
          # Any failure leaves EV_DECISION at error. The wave boundary bounds the merged and closed
          # searches, so an earlier wave's history stays out. Grace then starts at this wave's first
          # merge, and a member counts as a stray only once this wave has a merge. The open search is
          # unbounded, because a member can open long before its wave begins.
          local merged_floor="" closed_floor=""
          if [ -n "${SNAP_SINCE:-}" ]; then
            merged_floor=" merged:>=${SNAP_SINCE}"
            closed_floor=" closed:>=${SNAP_SINCE}"
          fi
          if ! merged=$(search_prs "is:pr is:merged $base_q$merged_floor"); then return 0; fi
          if ! closed_unmerged=$(search_prs "is:pr is:closed is:unmerged $base_q$closed_floor"); then return 0; fi
          if ! open=$(search_prs "is:pr is:open $base_q"); then return 0; fi
          # The snapshot's buckets skip the boundary filter. Retirement writes the boundary and removes
          # the set it retires, so a frozen set is always the current wave.
          local buckets
          if ! buckets=$(union_buckets "$merged" "$closed_unmerged" "$open" \
            "$SNAP_MERGED" "$SNAP_CLOSED" "$SNAP_OPEN"); then
            printf 'evaluate_epic: could not build the member set for epic #%s\n' "$EPIC" >&2
            return 0
          fi
          merged=$(printf '%s' "$buckets" | jq -c '.merged')
          closed_unmerged=$(printf '%s' "$buckets" | jq -c '.closed')
          open=$(printf '%s' "$buckets" | jq -c '.open')

          EV_OPEN="$open"
          EV_MERGED_COUNT=$(printf '%s' "$merged" | jq 'length')
          EV_CLOSED_COUNT=$(printf '%s' "$closed_unmerged" | jq 'length')
          EV_OPEN_COUNT=$(printf '%s' "$open" | jq 'length')

          # Reads the live queue of every repo and base among the open members. Git forbids spaces in
          # ref names, so a space-joined pair splits safely. fd 4 keeps the gh calls inside the loop off
          # its input.
          local queue='[]' rb_repo rb_base entries
          while read -r rb_repo rb_base <&4; do
            [ -n "$rb_repo" ] || continue
            if ! entries=$(merge_queue_entries "${rb_repo%%/*}" "${rb_repo#*/}" "$rb_base"); then return 0; fi
            queue=$(printf '%s' "$entries" | jq -c --argjson acc "$queue" --arg repo "$rb_repo" '$acc + map(. + {repo: $repo})')
          done 4< <(printf '%s' "$open" | jq -r '[.[] | "\(.repository.nameWithOwner) \(.baseRefName)"] | unique | .[]')

          # The queues hold unrelated pull requests too. Only open members' entries are kept, so no
          # non-member is dequeued.
          queue=$(printf '%s' "$queue" | jq -c --argjson open "$open" '
            [ .[] | . as $e
              | select(any($open[]; .repository.nameWithOwner == $e.repo and .number == $e.number)) ]')
          EV_QUEUE="$queue"

          # A candidate stray is an open member with no live queue entry.
          local raw_strays
          raw_strays=$(printf '%s' "$open" | jq -c --argjson q "$queue" '
            [ .[] | . as $pr
              | select(any($q[]; .repo == $pr.repository.nameWithOwner and .number == $pr.number) | not) ]')

          # A candidate counts only when REST reads it as "open false", so a lagging index cannot invent
          # a stray. A REST error leaves EV_DECISION at error. The full node is kept so the roll-forward
          # can skip drafts. A stray matters only once the wave has a merge, so the REST pass waits for
          # one.
          local confirmed_keys='[]' rs_repo rs_num st
          if [ "$EV_MERGED_COUNT" -ge 1 ]; then
            while read -r rs_repo rs_num <&4; do
              [ -n "$rs_repo" ] || continue
              if ! st=$(rest_pr_state "$rs_repo" "$rs_num"); then return 0; fi
              if [ "$st" = "open false" ]; then
                confirmed_keys=$(jq -cn --argjson acc "$confirmed_keys" --arg repo "$rs_repo" --argjson num "$rs_num" \
                  '$acc + [{repo: $repo, number: $num}]')
              fi
            done 4< <(printf '%s' "$raw_strays" | jq -r '.[] | "\(.repository.nameWithOwner) \(.number)"')
            EV_STRAYS=$(printf '%s' "$raw_strays" | jq -c --argjson keys "$confirmed_keys" '
              [ .[] | . as $pr | select( any($keys[]; .repo == $pr.repository.nameWithOwner and .number == $pr.number) ) ]')
          fi
          EV_STRAY_COUNT=$(printf '%s' "$EV_STRAYS" | jq 'length')

          # Grace runs from the wave's first merge. ISO-8601 UTC sorts chronologically, so `min` is the
          # earliest. An unparseable timestamp leaves grace running, so a stray never trips on an unknown
          # age.
          local first_merged_at first_epoch grace_elapsed=false
          first_merged_at=$(printf '%s' "$merged" | jq -r '[.[].mergedAt] | map(select(. != null)) | min // empty')
          if [ -n "$first_merged_at" ]; then
            first_epoch=$(date -u -d "$first_merged_at" +%s 2>/dev/null || echo "")
            if [ -n "$first_epoch" ] && [ "$(( now_epoch - first_epoch ))" -gt "$grace_seconds" ]; then
              grace_elapsed=true
            fi
          fi

          # wave_since has its own field, because a tombstone yields a boundary with no frozen set.
          # `membership=live` with a boundary is the normal shape between waves.
          echo "epic #$EPIC: membership=$membership wave_since=${SNAP_SINCE:-none} merged=$EV_MERGED_COUNT closed_unmerged=$EV_CLOSED_COUNT open=$EV_OPEN_COUNT stray=$EV_STRAY_COUNT grace_elapsed=$grace_elapsed" \
            | tee -a "$GITHUB_STEP_SUMMARY"

          # A partial landing needs a merged member. A member closed unmerged then trips at once, and a
          # confirmed stray trips once grace has elapsed.
          local is_partial=false
          if [ "$EV_MERGED_COUNT" -ge 1 ]; then
            if [ "$EV_CLOSED_COUNT" -ge 1 ]; then
              is_partial=true
            elif [ "$EV_STRAY_COUNT" -ge 1 ] && [ "$grace_elapsed" = true ]; then
              is_partial=true
            fi
          fi

          if [ "$is_partial" != true ]; then
            EV_DECISION=clear
            return 0
          fi

          # A freeze blocks merges, so REST confirms the partial landing first. At least one merged
          # member must read as merged.
          local confirmed_merged=false m_repo m_num
          while read -r m_repo m_num <&4; do
            [ -n "$m_repo" ] || continue
            if ! st=$(rest_pr_state "$m_repo" "$m_num"); then return 0; fi
            if [ "$st" = "closed true" ]; then confirmed_merged=true; break; fi
          done 4< <(printf '%s' "$merged" | jq -r '.[] | "\(.repository.nameWithOwner) \(.number)"')
          if [ "$confirmed_merged" != true ]; then
            echo "epic #$EPIC: no merged member confirmed via REST (search lag?) — uncertain, no freeze this pass." | tee -a "$GITHUB_STEP_SUMMARY"
            return 0
          fi

          # The trip reason holds on REST too. Strays were confirmed above, so only closed members are
          # re-read here.
          local trip_reason="" c_repo c_num confirmed_closed=false
          if [ "$EV_CLOSED_COUNT" -ge 1 ]; then
            while read -r c_repo c_num <&4; do
              [ -n "$c_repo" ] || continue
              if ! st=$(rest_pr_state "$c_repo" "$c_num"); then return 0; fi
              if [ "$st" = "closed false" ]; then confirmed_closed=true; break; fi
            done 4< <(printf '%s' "$closed_unmerged" | jq -r '.[] | "\(.repository.nameWithOwner) \(.number)"')
            [ "$confirmed_closed" = true ] && trip_reason="a member was closed without merging"
          fi
          if [ -z "$trip_reason" ] && [ "$EV_STRAY_COUNT" -ge 1 ] && [ "$grace_elapsed" = true ]; then
            trip_reason="${EV_STRAY_COUNT} sibling(s) left the merge queue and did not re-enter within the ${GRACE_MINUTES}-minute grace window"
          fi
          if [ -z "$trip_reason" ]; then
            echo "epic #$EPIC: partial-landing predicate not confirmed on REST re-read — uncertain, no freeze." | tee -a "$GITHUB_STEP_SUMMARY"
            return 0
          fi

          EV_DECISION=frozen
          EV_REASON="$trip_reason"
          return 0
        }

        # ---- Sweep wrappers ---------------------------------------------------------------

        # Rolls landable strays forward, then posts success on every open member head. A clear decision
        # with a merge and a stray means grace is still running. The success is both the required
        # check's default and the unfreeze, since the latest check of a name wins. Queue heads expire on
        # their own and need no success.
        sweep_post_clear() { # $1 = epic
          local epic="$1"
          if [ "$EV_MERGED_COUNT" -ge 1 ] && [ "$EV_STRAY_COUNT" -ge 1 ]; then
            echo "epic #$epic: $EV_STRAY_COUNT stray sibling(s) within grace — rolling forward (re-arms auto-merge; \`automation:paused\` stops it)." | tee -a "$GITHUB_STEP_SUMMARY"
            # Only strays the live `epic:<N>` search still returns roll forward. A snapshot-only member
            # is one a person de-labeled, and merge-gate passes it as standalone. Re-arming it resumes a
            # landing that person stepped out of, and its repository can fall outside the enqueue
            # token's scope. Detection still counts it, so it can trip the freeze at grace.
            local s_repo s_num skipped drafts
            while read -r s_repo s_num <&5; do
              [ -n "$s_repo" ] || continue
              reenqueue "$s_repo" "$s_num"
            done 5< <(printf '%s' "$EV_STRAYS" | jq -r '.[] | select((.isDraft | not) and .liveMember) | "\(.repository.nameWithOwner) \(.number)"')
            skipped=$(printf '%s' "$EV_STRAYS" | jq -r '[.[] | select((.isDraft | not) and (.liveMember | not))] | length')
            if [ "$skipped" -gt 0 ]; then
              echo "::warning::epic #$epic: $skipped stray sibling(s) are frozen-set members the \`epic:$epic\` label no longer returns — NOT rolled forward (a de-labeled member is not auto-merged back into a landing). They still count toward the freeze." \
                | tee -a "$GITHUB_STEP_SUMMARY"
            fi
            # A draft cannot auto-merge, so a draft stray sits out the roll-forward and trips the freeze
            # at grace. The warning comes while there is time to mark it ready.
            drafts=$(printf '%s' "$EV_STRAYS" | jq -r '[.[] | select(.isDraft)] | length')
            if [ "$drafts" -gt 0 ]; then
              echo "::warning::epic #$epic: $drafts stray sibling(s) are DRAFTS — not rolled forward (a draft cannot auto-merge). Mark them ready before the ${GRACE_MINUTES}-minute grace elapses or they trip the freeze." \
                | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi
          if [ "$EV_OPEN_COUNT" -eq 0 ]; then
            echo "epic #$epic: no open siblings — nothing to post." | tee -a "$GITHUB_STEP_SUMMARY"
            return 0
          fi
          local u_repo u_sha
          while read -r u_repo u_sha <&5; do
            [ -n "$u_repo" ] || continue
            freeze_post "$u_repo" "$u_sha" "success" \
              "Epic #${epic}: no partial landing (merged=${EV_MERGED_COUNT}, closed-unmerged=${EV_CLOSED_COUNT}, stray=${EV_STRAY_COUNT}). epic-freeze clear."
          done 5< <(printf '%s' "$EV_OPEN" | jq -r '.[] | "\(.repository.nameWithOwner) \(.headRefOid)"')
        }

        # Posts failure once per repo and SHA on every open member's head and every live queue entry's
        # head. A failure on a member head keeps it out of the queue, and one on a queue head dequeues
        # the in-flight group. The freeze is re-derived each sweep, so it follows new commits.
        sweep_post_freeze() { # $1 = epic
          local epic="$1"
          echo "epic #$epic: PARTIAL LANDING confirmed ($EV_REASON) — freezing $EV_OPEN_COUNT open sibling(s) + queue heads." | tee -a "$GITHUB_STEP_SUMMARY"
          local summary
          summary="Epic #${epic} PARTIALLY LANDED (merged=${EV_MERGED_COUNT}, closed-unmerged=${EV_CLOSED_COUNT}, stray=${EV_STRAY_COUNT}): ${EV_REASON}. Holding every remaining sibling to prevent further partial landing. This does NOT roll back merged PRs — a human rolls them back with the epic-rollback workflow."
          local targets
          targets=$(jq -cn --argjson open "$EV_OPEN" --argjson queue "$EV_QUEUE" '
            ( [ $open[]  | {repo: .repository.nameWithOwner, sha: .headRefOid} ]
            + [ $queue[] | {repo: .repo, sha: .headOid} ] )
            | map(select(.sha != null))
            | unique_by(.repo + " " + .sha)')

          # A freeze wider than max_freeze_repos distinct repos suggests a runaway or mis-scoped Epic.
          # The freeze is still posted on every target, because a confirmed partial landing stays
          # frozen. The cap raises an ::error and sets the flag sweep_main checks after its loop, so the
          # sweep ends red without stopping mid-Epic.
          local distinct_repos
          distinct_repos=$(printf '%s' "$targets" | jq -r '[.[].repo] | unique | length')
          if [ "$distinct_repos" -gt "$MAX_FREEZE_REPOS" ]; then
            blast_cap_tripped=true
            echo "::error::BLAST-CAP: epic #$epic freeze spans ${distinct_repos} distinct repos (> max_freeze_repos=${MAX_FREEZE_REPOS}) — posting the freeze anyway (skipping it would leave a partial landing un-frozen), but flagging this sweep RED. Investigate a runaway / mis-scoped Epic; raise max_freeze_repos deliberately if the width is genuine." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

          local t_repo t_sha
          while read -r t_repo t_sha <&5; do
            [ -n "$t_repo" ] || continue
            freeze_post "$t_repo" "$t_sha" "failure" "$summary"
          done 5< <(printf '%s' "$targets" | jq -r '.[] | "\(.repo) \(.sha)"')
        }

        # Evaluates one Epic and posts its decision. A paused Epic gets no post and no roll-forward, so
        # its landing is under manual control.
        sweep_epic() { # $1 = epic
          if epic_paused "$1"; then
            echo "epic #$1: automation:paused — skipping (no freeze / roll-forward this sweep)." | tee -a "$GITHUB_STEP_SUMMARY"
            return 0
          fi
          evaluate_epic "$1"
          case "$EV_DECISION" in
            clear)  sweep_post_clear "$1" ;;
            frozen) sweep_post_freeze "$1" ;;
            *)      echo "epic #$1: uncertain (resolve/queue/REST error) — skipping this sweep (fail-closed); the next sweep re-derives." | tee -a "$GITHUB_STEP_SUMMARY" ;;
          esac
        }

        # Posts success on every open head without an `epic:<N>` label, so a standalone pull request
        # whose per-PR run never posted still gets the required check. sweep_main runs it ahead of the
        # Epic loop.
        standalone_sweep() {
          local standalone count s_repo s_sha
          standalone=$(printf '%s' "$all_open" | jq -c '
            [ .[]
              | select([(.labels.nodes // [])[].name] | any(test("^epic:[0-9]+$")) | not)
              | {repo: .repository.nameWithOwner, sha: .headRefOid} ]
            | map(select(.sha != null))
            | unique_by(.repo + " " + .sha)')
          count=$(printf '%s' "$standalone" | jq 'length')
          echo "Standalone backstop: posting epic-freeze=success on $count non-member open head(s)." | tee -a "$GITHUB_STEP_SUMMARY"
          while read -r s_repo s_sha <&5; do
            [ -n "$s_repo" ] || continue
            freeze_post "$s_repo" "$s_sha" "success" \
              "PR has no epic:<N> label — standalone, no partial-landing coordination. epic-freeze clear."
          done 5< <(printf '%s' "$standalone" | jq -r '.[] | "\(.repo) \(.sha)"')
        }

        # Runs the standalone backstop, then evaluates every active Epic in the org. Fails the run when
        # enumeration fails or a freeze exceeded max_freeze_repos.
        sweep_main() {
          # sweep_post_freeze sets this when a freeze exceeds max_freeze_repos.
          blast_cap_tripped=false
          echo "Enumerating active Epics (epic:<N> labels on open PRs ∪ frozen snapshots, org=${ORG})…" | tee -a "$GITHUB_STEP_SUMMARY"
          # The scope step's read, so the Epic set matches the enqueue token's scope. When that read
          # failed, nothing was saved and detection enumerates again.
          if [ -n "${OPEN_PRS:-}" ]; then
            all_open=$(cat "$OPEN_PRS")
          elif ! all_open=$(search_prs "org:${ORG} is:pr is:open"); then
            echo "::error::could not enumerate open PRs (GraphQL search failed after retries) — nothing done this sweep"
            exit 1
          fi

          # The jq `test` keeps only numeric `epic:<N>` labels.
          local label_epics epics
          label_epics=$(printf '%s' "$all_open" | jq -r '
            [ .[] | (.labels.nodes // [])[].name | select(test("^epic:[0-9]+$")) | ltrimstr("epic:") ]
            | unique | .[]')

          # Epics reached through their frozen snapshot join the set, so an Epic whose last labeled pull
          # request was de-labeled is still evaluated. build_claim_index also primes the issue cache
          # the loop reads. Each number feeds a `label:"epic:<N>"` search qualifier, so grep keeps only
          # all-digit lines.
          build_claim_index
          epics=$(printf '%s\n%s\n' "$label_epics" "$CLAIM_EPICS" | grep -E '^[0-9]+$' | sort -un || true)

          # The backstop runs first, so the Epic pass posts last and wins on a head both touch. A lagging
          # label index, or a snapshot member de-labeled while open, reads as a non-member to the
          # backstop and as a member to the Epic pass. A paused Epic and an error decision post nothing,
          # so the backstop's success stands on their heads. The backstop runs even with no active Epics.
          standalone_sweep

          if [ -n "$epics" ]; then
            # fd 3 keeps the gh calls in sweep_epic off the loop's input. The loop runs in this shell,
            # so blast_cap_tripped survives it.
            local EPIC
            while IFS= read -r EPIC <&3; do
              sweep_epic "$EPIC" || echo "::warning::epic #$EPIC aborted unexpectedly (fail-closed); next sweep re-derives"
            done 3< <(printf '%s\n' "$epics")
          else
            echo "No active Epics (no open epic:<N> PRs and no frozen snapshot)." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

          echo "Partial-landing sweep complete." | tee -a "$GITHUB_STEP_SUMMARY"

          if [ "$blast_cap_tripped" = true ]; then
            echo "::error::BLAST-CAP tripped this sweep — one or more Epics exceeded max_freeze_repos=${MAX_FREEZE_REPOS} (details above). They were frozen anyway (fail-safe); investigate a runaway / mis-scoped Epic."
            exit 1
          fi
        }

        # ---- Per-PR wrapper ---------------------------------------------------------------
        # Classifies the triggering pull request and posts epic-freeze on its head only. A standalone
        # pull request and any uncertainty get success, so a fresh head never strands on "Expected".
        # The next sweep re-derives every head. Failure is posted for a confirmed partial landing, and
        # for a head no pull request can be tied to.
        per_pr_main() {
          # On a merge_group event, the group ref encodes the queued pull request (…/pr-<N>-<sha>). A
          # batch names one pull request, and its Epic is evaluated.
          local classify_pr=""
          if [ -n "${IN_QUEUE:-}" ]; then
            [[ "$IN_QUEUE" =~ pr-([0-9]+) ]] && classify_pr="${BASH_REMATCH[1]}"
            if [ -z "$classify_pr" ]; then
              # Failure on an unidentifiable group's head dequeues it, as merge-gate does. The sweep
              # re-checks the pull request's own head.
              freeze_post "$REPO_FULL" "$HEAD_SHA" "failure" \
                "merge_group head_ref \"${IN_QUEUE}\" — couldn't identify the queued PR to check its Epic; posting failure (dequeues) rather than passing blind. The sweep re-checks the PR head."
              return 0
            fi
          elif [ -n "${PR_NUMBER:-}" ]; then
            classify_pr="$PR_NUMBER"
          else
            # A head with neither a pull request nor a merge group comes from a misconfigured caller. A
            # required check never passes on a head nothing evaluated.
            freeze_post "$REPO_FULL" "$HEAD_SHA" "failure" \
              "No pull_request_number for ${HEAD_SHA:0:12} and not a merge_group event — refusing to pass a required check without evaluating a PR."
            return 0
          fi

          # A pull_request event carries the labels in its payload, so that path classifies with no API
          # call and a GraphQL outage cannot hold a standalone pull request. Other events read them over
          # GraphQL. A failed read posts success, because merge-gate holds a pull request whose labels
          # it cannot read, and the sweep re-derives.
          local labels=""
          if [ "$classify_pr" = "${EVENT_PR:-}" ]; then
            labels="${EVENT_LABELS:-[]}"
          elif ! labels=$(fetch_pr_labels "$classify_pr"); then
            freeze_post "$REPO_FULL" "$HEAD_SHA" "success" \
              "Couldn't read PR #${classify_pr}'s labels (GraphQL error after retries) — failing open (success); merge-gate holds independently and the reconcile sweep re-derives."
            return 0
          fi

          # The first `epic:<N>` label names the Epic, since a pull request belongs to one Epic.
          local epic
          epic=$(printf '%s' "$labels" | jq -r 'map(select(test("^epic:[0-9]+$")))[0] // empty | ltrimstr("epic:")' || true)

          if [ -z "$epic" ]; then
            # A frozen snapshot can still claim an unlabeled pull request as a member de-labeled
            # mid-landing. The sweep counts such a member, so per-PR mode consults the claim index and
            # judges the head as the sweep does.
            #
            # A claim-index error fails open to standalone success, and the next sweep re-derives. Only a
            # pull request the index claims is evaluated as a member, so an ordinary pull request passes
            # without a per-Epic evaluation.
            build_claim_index >/dev/null 2>&1 || true
            epic=$(epic_claiming "$REPO_FULL" "$classify_pr")
            if [ -z "$epic" ]; then
              freeze_post "$REPO_FULL" "$HEAD_SHA" "success" \
                "PR #${classify_pr} has no epic:<N> label and no frozen snapshot claims it — standalone, no partial-landing coordination. epic-freeze clear."
              return 0
            fi
            echo "PR #${classify_pr} carries no label but Epic #${epic}'s frozen snapshot claims it (de-labeled mid-landing) — evaluating for a partial landing." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

          # A paused Epic is not evaluated. merge-gate holds a paused Epic's labeled members, so this
          # posts success and the head never strands on "Expected".
          if epic_paused "$epic"; then
            freeze_post "$REPO_FULL" "$HEAD_SHA" "success" \
              "Epic #${epic} is automation:paused — merge-gate holds it; epic-freeze not evaluating partial-landing while paused. epic-freeze clear."
            return 0
          fi

          echo "PR #${classify_pr} belongs to Epic #${epic} — evaluating the Epic for a partial landing." | tee -a "$GITHUB_STEP_SUMMARY"
          evaluate_epic "$epic"
          case "$EV_DECISION" in
            clear)
              freeze_post "$REPO_FULL" "$HEAD_SHA" "success" \
                "Epic #${epic}: no partial landing (merged=${EV_MERGED_COUNT}, closed-unmerged=${EV_CLOSED_COUNT}, stray=${EV_STRAY_COUNT}). epic-freeze clear." ;;
            frozen)
              freeze_post "$REPO_FULL" "$HEAD_SHA" "failure" \
                "Epic #${epic} PARTIALLY LANDED (merged=${EV_MERGED_COUNT}, closed-unmerged=${EV_CLOSED_COUNT}, stray=${EV_STRAY_COUNT}): ${EV_REASON}. Holding this sibling to prevent further partial landing. Does NOT roll back merged PRs — a human rolls them back with the epic-rollback workflow." ;;
            *)
              # Uncertainty fails open. The next sweep re-derives from scratch and freezes the true heads
              # if the partial landing is real.
              freeze_post "$REPO_FULL" "$HEAD_SHA" "success" \
                "Epic #${epic}: couldn't confirm partial-landing state (resolve/queue/REST uncertainty) — failing open (success). merge-gate holds independently and the reconcile sweep re-derives." ;;
          esac
        }

        # ---- Org-level halt, acted on before dispatch -------------------------------------
        # Per-PR mode holds by posting failure, because a skipped or neutral required check passes.
        # The sweep does nothing, because merge-gate holds every pull request while the halt is on.
        # Under dry_run, a halted per-PR run only logs its hold.
        if [ "$kill_engaged" = true ]; then
          if [ "${MODE:-sweep}" = "per-pr" ]; then
            freeze_post "$REPO_FULL" "$HEAD_SHA" "failure" \
              "Automation halted org-wide by AGENT_KILL_SWITCH — holding this PR. Lift the org kill-switch to resume; the next event or reconcile sweep re-evaluates."
          else
            echo "AGENT_KILL_SWITCH engaged — skipping the partial-landing sweep (no freeze posts, no roll-forward). merge-gate HOLDs every PR org-wide meanwhile." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
        fi

        # ---- Dispatch --------------------------------------------------------------------
        if [ "${MODE:-sweep}" = "per-pr" ]; then
          per_pr_main
        else
          sweep_main
        fi
