name: render-epic-status
description: >
  Render a display-only status table into the body of each active Epic issue in an organization.
  The table is rebuilt from live GitHub state on every run. No landing decision reads it, and the
  action posts no check and touches no board.

  An Epic is active while a pull request labeled `epic:<N>` is open, or was merged or closed within
  `lookback_days`. The window gives a fully landed Epic its final render. A closed Epic issue is left
  alone.

  The table lists every pull request labeled `epic:<N>`, of any age, with its state. A merged pull
  request shows as released once the highest `vX.Y.Z` tag of its repository contains its merge
  commit.

  The table lives between the `<!-- epic-read-model:start -->` and `<!-- epic-read-model:end -->`
  fence lines. The action creates the region when it is missing and preserves the rest of the body.
  It skips the edit when only the render timestamp would change, so an unchanged Epic sends no
  notification. Invalid inputs fail the action. Any later search, read or write error warns and
  leaves that Epic to the next run. `dry_run` defaults to "true", which logs each table and writes
  nothing.

inputs:
  client_id:
    required: true
    description: >
      Client ID of a GitHub App installed on the organization with write access to issues and read
      access to pull requests and contents. The App edits the Epic issues and reads release tags in
      each member's repository.
  app_private_key:
    required: true
    description: Private key (PEM) of that App.
  org:
    required: false
    default: ${{ github.repository_owner }}
    description: Organization whose Epics to render. Defaults to the workflow's organization.
  planning_repo:
    required: false
    default: .github
    description: >
      Repository that holds the Epic issues, as a bare name in `org`. The label `epic:<N>` names
      issue N there. Defaults to the organization's `.github` repository.
  lookback_days:
    required: false
    default: "21"
    description: >
      Days a merged or closed pull request keeps its Epic active, as a whole number. An open pull
      request keeps its Epic active regardless.
  dry_run:
    required: false
    default: "true"
    description: >
      When "true", log the table each Epic would get and write nothing. Only "false", in any case,
      splices the table into the Epic issue.
  kill_switch:
    required: false
    default: ""
    description: >
      Organization-wide halt. The action runs only when the value, lowercased with whitespace
      removed, is empty, `0`, `off`, `false`, `no` or `disabled`. Any other value halts it, so a
      mistyped value halts too. A halted run edits no Epic and succeeds. A composite action cannot
      read the `vars` context, so the caller passes the switch in as an input.

runs:
  using: composite
  steps:
    # The token spans the organization, because the search covers every repository and release tags
    # are read from each member's repository. Write access to issues also covers reading the Epic
    # body.
    - name: Mint token
      id: token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.client_id }}
        private-key: ${{ inputs.app_private_key }}
        owner: ${{ inputs.org }}
        permission-issues: write
        permission-pull-requests: read
        permission-contents: read

    - name: Render Epic read-model
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        ORG: ${{ inputs.org }}
        PLANNING_REPO: ${{ inputs.planning_repo }}
        LOOKBACK_DAYS: ${{ inputs.lookback_days }}
        DRY_RUN: ${{ inputs.dry_run }}
        KILL_SWITCH: ${{ inputs.kill_switch }}
      run: |
        set -euo pipefail

        # Organization-wide halt, read before the render. Only an explicit off-token runs it. The
        # guard and the render share this step, so the exit skips the whole render, and the next run
        # re-derives the table.
        case "$(printf '%s' "${KILL_SWITCH:-}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')" in
          "" | 0 | off | false | no | disabled) : ;;  # explicit off-token / unset → running
          *)
            echo "AGENT_KILL_SWITCH engaged — skipping Epic read-model render (org-wide halt)." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
            ;;
        esac

        # ---- Validate the inputs before they reach a search query, an API path or `date`.
        # `org` feeds `org:` search qualifiers, so it must be a GitHub login. A stray value broadens
        # the scope or breaks the query.
        if ! [[ "${ORG:-}" =~ ^[A-Za-z0-9-]+$ ]]; then
          echo "::error::org must be a valid GitHub login (alphanumeric + hyphens), got \"${ORG:-}\""
          exit 1
        fi
        if ! [[ "${PLANNING_REPO:-}" =~ ^[A-Za-z0-9._-]+$ ]]; then
          echo "::error::planning_repo must be a bare repository name (no owner/slash), got \"${PLANNING_REPO:-}\""
          exit 1
        fi
        if ! [[ "${LOOKBACK_DAYS:-}" =~ ^[0-9]+$ ]]; then
          echo "::error::lookback_days must be an integer, got \"${LOOKBACK_DAYS:-}\""
          exit 1
        fi

        # Only "false", in any case, writes. `tr` lowercases because ${VAR,,} needs Bash 4.
        dry=$(printf '%s' "${DRY_RUN:-true}" | tr '[:upper:]' '[:lower:]')

        # Fence lines of the managed region. The render rewrites only the lines between them.
        START='<!-- epic-read-model:start -->'
        END='<!-- epic-read-model:end -->'

        # ---- GraphQL document and read helpers --------------------------------------------------

        # Pull request search node. `labels` drives Epic enumeration, and the other fields fill the
        # table. The node carries no `state`, because each node's state is the search that returned
        # it, open, merged or closed unmerged.
        SEARCH_Q='query($q:String!,$cursor:String){
          search(query:$q, type:ISSUE, first:100, after:$cursor){
            pageInfo{ hasNextPage endCursor }
            nodes{ ... on PullRequest{
              number headRefOid isDraft reviewDecision
              repository{ nameWithOwner }
              mergeCommit{ oid }
              labels(first:100){ nodes{ name } } } } } }'

        # Page an ISSUE search to completion, retrying transient GraphQL errors. Prints the pull request
        # nodes as one JSON array, or logs to stderr and returns 1.
        search_prs() { # $1 = search query string
          local search="$1" cursor="" agg='[]' data page ok args
          while :; do
            ok=false
            for attempt in 1 2 3; do
              args=(-f query="$SEARCH_Q" -f q="$search")
              [ -n "$cursor" ] && args+=(-f cursor="$cursor")
              if data=$(gh api graphql "${args[@]}" 2>&1) \
                && printf '%s' "$data" | jq -e 'has("data") and (has("errors") | not)' >/dev/null 2>&1; then
                ok=true
                break
              fi
              [ "$attempt" -lt 3 ] && sleep 2
            done
            if [ "$ok" != true ]; then
              printf 'search_prs failed for query "%s": %s\n' "$search" "$data" >&2
              return 1
            fi
            page=$(printf '%s' "$data" | jq '[(.data.search.nodes // [])[] | select(.number != null)]')
            agg=$(jq -s '.[0] + .[1]' <(printf '%s' "$agg") <(printf '%s' "$page"))
            [ "$(printf '%s' "$data" | jq -r '.data.search.pageInfo.hasNextPage')" = "true" ] || break
            cursor=$(printf '%s' "$data" | jq -r '.data.search.pageInfo.endCursor')
          done
          printf '%s' "$agg"
        }

        # The repository's highest `vX.Y.Z` tag, or empty when it has none. Compare resolves a tag
        # name to its commit, so annotated and lightweight tags behave alike. A read error also yields
        # empty, which shows that repository's merged members as unreleased.
        latest_tag() { # $1 = owner/repo
          local repo="$1" data
          for attempt in 1 2 3; do
            if data=$(gh api --paginate "repos/${repo}/git/matching-refs/tags/v" 2>/dev/null); then
              # --paginate emits one JSON array per page, and `-s` with `.[][]` flattens them into one
              # ref stream before the max.
              printf '%s' "$data" | jq -rs '
                [ .[][].ref | ltrimstr("refs/tags/")
                  | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) ]
                | map(ltrimstr("v") | split(".") | map(tonumber))
                | sort
                | if length == 0 then "" else "v" + (.[-1] | map(tostring) | join(".")) end'
              return 0
            fi
            [ "$attempt" -lt 3 ] && sleep 2
          done
          printf ''
        }

        # Whether release tag $3 contains merge commit $2, comparing the merge as base with the tag as
        # head. `ahead` and `identical` both mean the tag includes the merge. Prints "yes" or "no", and
        # an error or a missing SHA prints "no".
        tag_contains() { # $1=owner/repo $2=merge-sha $3=tag
          local repo="$1" sha="$2" tag="$3" data status
          [ -n "$sha" ] && [ "$sha" != "null" ] || { printf 'no'; return 0; }
          for attempt in 1 2 3; do
            if data=$(gh api "repos/${repo}/compare/${sha}...${tag}" 2>/dev/null); then
              status=$(printf '%s' "$data" | jq -r '.status // ""')
              case "$status" in
                ahead|identical) printf 'yes' ;;
                *)               printf 'no' ;;
              esac
              return 0
            fi
            [ "$attempt" -lt 3 ] && sleep 2
          done
          printf 'no'
        }

        # Drop the "_Rendered … " stamp line and blank lines from stdin, so the compare before a write
        # sees only material content. A new timestamp alone never triggers an edit.
        strip_volatile() {
          grep -v '^_Rendered ' | sed '/^[[:space:]]*$/d' || true
        }

        # Replace the managed region in an Epic body with a fresh one and print the new body. A body
        # with exactly one START line before one END line is rewritten in place. Any other shape has
        # every fence line removed and one fresh region appended after a blank line, which leaves one
        # balanced pair for the next run. Text outside the fences survives both paths.
        #
        # Fences match whole lines (grep -x, awk $0==), so a fence string inside prose stays prose. An
        # unclosed START takes the append path, which removes only fence lines.
        splice() { # $1 = body file, $2 = region file (already wrapped in the markers)
          local bodyf="$1" regionf="$2" ns ne sl el wellformed=false
          ns=$(grep -cxF -- "$START" "$bodyf" || true)
          ne=$(grep -cxF -- "$END" "$bodyf" || true)
          if [ "$ns" = "1" ] && [ "$ne" = "1" ]; then
            sl=$(grep -nxF -- "$START" "$bodyf" | cut -d: -f1)
            el=$(grep -nxF -- "$END" "$bodyf" | cut -d: -f1)
            if [ "$sl" -lt "$el" ]; then wellformed=true; fi
          fi
          if [ "$wellformed" = true ]; then
            awk -v startm="$START" -v endm="$END" -v regionfile="$regionf" '
              BEGIN { region=""; while ((getline line < regionfile) > 0) region = region line "\n" }
              $0 == startm { if (!done) { printf "%s", region; done=1 } inside=1; next }
              $0 == endm { inside=0; next }
              inside { next }
              { print }
            ' "$bodyf"
          else
            grep -vxF -e "$START" -e "$END" -- "$bodyf" || true
            printf '\n'
            cat "$regionf"
          fi
        }

        # ---- Enumerate active Epics -------------------------------------------------------------

        # Print the distinct Epic numbers labeled on open pull requests, and on pull requests merged or
        # closed unmerged within the lookback window.
        enumerate_epics() {
          local since open merged closed
          since=$(date -u -d "-${LOOKBACK_DAYS} days" +%Y-%m-%d)
          if ! open=$(search_prs "org:${ORG} is:pr is:open"); then return 1; fi
          if ! merged=$(search_prs "org:${ORG} is:pr is:merged merged:>=${since}"); then return 1; fi
          if ! closed=$(search_prs "org:${ORG} is:pr is:closed is:unmerged closed:>=${since}"); then return 1; fi
          jq -sr '(.[0] + .[1] + .[2])
            | [ .[] | (.labels.nodes // [])[].name | select(test("^epic:[0-9]+$")) | ltrimstr("epic:") ]
            | unique | .[]' \
            <(printf '%s' "$open") <(printf '%s' "$merged") <(printf '%s' "$closed")
        }

        # ---- Render one Epic --------------------------------------------------------------------

        # Called under `||` from the loop, so `set -e` is inactive here. Every failure path warns and
        # returns 0, and the next run re-derives the table.
        render_epic() { # $1 = Epic number (validated numeric)
          local epic="$1"

          # A missing or closed Epic issue is left alone, so a finished Epic stops changing.
          local issue state body
          if ! issue=$(gh issue view "$epic" --repo "${ORG}/${PLANNING_REPO}" --json state,body 2>/dev/null); then
            echo "::warning::Epic ${ORG}/${PLANNING_REPO}#${epic} not found — skipping (display-only)." | tee -a "$GITHUB_STEP_SUMMARY"
            return 0
          fi
          state=$(printf '%s' "$issue" | jq -r '.state')
          if [ "$state" = "CLOSED" ]; then
            echo "Epic ${ORG}/${PLANNING_REPO}#${epic} is CLOSED — leaving its body untouched." | tee -a "$GITHUB_STEP_SUMMARY"
            return 0
          fi
          # A body edited on the web carries CRLF line endings. Normalizing to LF lets the fences match
          # and the compare ignore line endings, and the write stores LF.
          body=$(printf '%s' "$issue" | jq -r '.body // ""' | tr -d '\r')

          # The full member set, outside the lookback window too, so older merged members still
          # appear. Each node is tagged with the search bucket it came from.
          local base_q open merged closed members
          base_q="label:\"epic:${epic}\" org:${ORG}"
          if ! open=$(search_prs "is:pr is:open $base_q"); then
            echo "::warning::could not resolve open epic:${epic} members — skipping this sweep." | tee -a "$GITHUB_STEP_SUMMARY"; return 0
          fi
          if ! merged=$(search_prs "is:pr is:merged $base_q"); then
            echo "::warning::could not resolve merged epic:${epic} members — skipping this sweep." | tee -a "$GITHUB_STEP_SUMMARY"; return 0
          fi
          if ! closed=$(search_prs "is:pr is:closed is:unmerged $base_q"); then
            echo "::warning::could not resolve closed epic:${epic} members — skipping this sweep." | tee -a "$GITHUB_STEP_SUMMARY"; return 0
          fi
          # A pull request that changes state between the three searches appears in two buckets.
          # Deduplicating by repo and number keeps merged over closed over open, so a just-merged
          # member never lingers as open.
          members=$(jq -s '
            def prio: {"merged":0,"closed":1,"open":2}[.bucket];
            ( [.[0][] | . + {bucket:"open"}]
              + [.[1][] | . + {bucket:"merged"}]
              + [.[2][] | . + {bucket:"closed"}] )
            | group_by(.repository.nameWithOwner + "#" + (.number|tostring))
            | map(min_by(prio))
            | sort_by(.repository.nameWithOwner, .number)' \
            <(printf '%s' "$open") <(printf '%s' "$merged") <(printf '%s' "$closed"))

          local mcount
          mcount=$(printf '%s' "$members" | jq 'length')
          if [ "$mcount" -eq 0 ]; then
            echo "Epic #${epic}: no epic:${epic} PRs resolved — nothing to render." | tee -a "$GITHUB_STEP_SUMMARY"
            return 0
          fi

          # Released resolution. Each repository with a merged member gets one latest-tag lookup, and
          # each merged member one compare. The result maps repo#number to its release tag, or to an
          # empty string when unreleased. fd 7 isolates this loop's stdin from the gh calls inside it.
          local repo_tags='{}' released='{}' merged_repos r t
          merged_repos=$(printf '%s' "$members" | jq -r '[.[] | select(.bucket=="merged") | .repository.nameWithOwner] | unique | .[]')
          while IFS= read -r r <&7; do
            [ -n "$r" ] || continue
            t=$(latest_tag "$r")
            repo_tags=$(jq -cn --argjson m "$repo_tags" --arg k "$r" --arg v "$t" '$m + {($k): $v}')
          done 7< <(printf '%s\n' "$merged_repos")

          local m_repo m_num m_sha m_tag rel
          # Stream the merged members tab-separated from one jq pass. fd 8 keeps this loop's stdin free
          # for the tag_contains gh calls inside it.
          while IFS=$'\t' read -r m_repo m_num m_sha <&8; do
            m_tag=$(printf '%s' "$repo_tags" | jq -r --arg k "$m_repo" '.[$k] // ""')
            rel=""
            if [ -n "$m_tag" ] && [ "$(tag_contains "$m_repo" "$m_sha" "$m_tag")" = "yes" ]; then
              rel="$m_tag"
            fi
            released=$(jq -cn --argjson m "$released" --arg k "${m_repo}#${m_num}" --arg v "$rel" '$m + {($k): $v}')
          done 8< <(printf '%s' "$members" | jq -r '.[] | select(.bucket=="merged")
            | [.repository.nameWithOwner, (.number|tostring), (.mergeCommit.oid // "")] | @tsv')

          # Fold each member into a table row and the summary counts. The SHA column shows the head of
          # an open or closed member and the merge commit of a merged one.
          local rows counts
          rows=$(printf '%s' "$members" | jq -r --argjson rel "$released" '
            .[]
            | .repository.nameWithOwner as $repo
            | "\($repo)#\(.number)" as $key
            | ($rel[$key] // "") as $r
            | (if .bucket == "open" then
                 (if .isDraft then "open · draft"
                  elif .reviewDecision == "APPROVED" then "open · ready"
                  else "open · in review" end)
               elif .bucket == "merged" then
                 (if ($r | length) > 0 then "merged · released" else "merged" end)
               else "closed (unmerged)" end) as $state
            | (if .bucket == "merged" then (.mergeCommit.oid // "") else (.headRefOid // "") end) as $sha
            | (if ($sha | length) >= 7 then $sha[0:7] else $sha end) as $short
            | "| \($repo) | #\(.number) | \($state) | `\(if ($short | length) > 0 then $short else "—" end)` | \(if ($r | length) > 0 then $r else "—" end) |"')
          counts=$(printf '%s' "$members" | jq -r --argjson rel "$released" '
            "\(length) member(s) · "
            + "\([.[] | select(.bucket=="merged")] | length) merged "
            + "(\([.[] | select(.bucket=="merged") | select(($rel["\(.repository.nameWithOwner)#\(.number)"] // "") | length > 0)] | length) released) · "
            + "\([.[] | select(.bucket=="open")] | length) open · "
            + "\([.[] | select(.bucket=="closed")] | length) closed-unmerged"')

          # The managed region, timestamp included. $counts and $rows pass as %s arguments, so printf
          # never reads a `%` or `\` in them as a format directive.
          local ts region_inner
          ts=$(date -u '+%Y-%m-%d %H:%M')
          region_inner=$(printf '### Epic status — display-only, derived from live GitHub truth (not authority)\n\n_Rendered %s UTC by the reconcile sweep. A lost or hand-edited table is cosmetic — every decision reads live state._\n\n%s\n\n| Repo | PR | State | SHA | Released |\n|------|----|-------|-----|----------|\n%s' \
            "$ts" "$counts" "$rows")

          # Re-read the body before the compare and the write. The searches and compares above take
          # seconds, and merge-gate writes its activation snapshot into this body from concurrent jobs.
          # A splice into the body read at the top can erase a snapshot written since.
          local fresh
          if fresh=$(gh api "repos/${ORG}/${PLANNING_REPO}/issues/${epic}" --jq '.body // ""' 2>/dev/null | tr -d '\r'); then
            body="$fresh"
          else
            echo "::warning::could not re-read Epic ${ORG}/${PLANNING_REPO}#${epic} — skipping this pass rather than deciding on a stale body." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            return 0
          fi

          # Compare the content between the fences, minus the stamp, with the fresh render. A match
          # means the table is current, so nothing is written.
          local new_norm old_inner old_norm
          new_norm=$(printf '%s\n' "$region_inner" | strip_volatile)
          old_inner=$(printf '%s\n' "$body" | awk -v s="$START" -v e="$END" '
            $0 == s { inside=1; next } $0 == e { inside=0; next } inside { print }')
          old_norm=$(printf '%s\n' "$old_inner" | strip_volatile)
          if [ -n "$old_inner" ] && [ "$old_norm" = "$new_norm" ]; then
            echo "Epic ${ORG}/${PLANNING_REPO}#${epic}: read-model unchanged — no write." | tee -a "$GITHUB_STEP_SUMMARY"
            return 0
          fi

          if [ "$dry" != "false" ]; then
            {
              echo "Epic ${ORG}/${PLANNING_REPO}#${epic}: would render read-model (DRY RUN):"
              printf '%s\n' "$region_inner"
            } | tee -a "$GITHUB_STEP_SUMMARY"
            return 0
          fi

          # A narrow window remains between the read and this write. A snapshot write inside it is
          # overwritten with the marker the body held before. merge-gate retries when its verify sees
          # the loss, and otherwise its next pass decides again from the restored marker.
          local region_file body_file spliced_file
          region_file=$(mktemp); body_file=$(mktemp); spliced_file=$(mktemp)
          {
            printf '%s\n' "$START"
            printf '%s\n' "$region_inner"
            printf '%s\n' "$END"
          } > "$region_file"
          printf '%s\n' "$body" > "$body_file"
          splice "$body_file" "$region_file" > "$spliced_file"

          if gh issue edit "$epic" --repo "${ORG}/${PLANNING_REPO}" --body-file "$spliced_file" >/dev/null 2>&1; then
            echo "Epic ${ORG}/${PLANNING_REPO}#${epic}: read-model region updated." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::could not update Epic ${ORG}/${PLANNING_REPO}#${epic} body — display-only, next sweep retries." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          rm -f "$region_file" "$body_file" "$spliced_file"
        }

        # ---- Main -------------------------------------------------------------------------------

        echo "## Epic read-model render (org=${ORG}, planning=${PLANNING_REPO}, lookback=${LOOKBACK_DAYS}d, dry_run=${dry})" | tee -a "$GITHUB_STEP_SUMMARY"

        # An enumeration failure warns and exits 0, so the display-only render never fails its caller.
        # Per-Epic errors warn and continue below.
        epics=$(enumerate_epics) || {
          echo "::warning::could not enumerate active Epics (GraphQL search failed after retries) — nothing rendered this sweep; next sweep re-derives (display-only, sweep not failed)." | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
        }
        if [ -z "$epics" ]; then
          echo "No active Epics in the last ${LOOKBACK_DAYS} day(s) — nothing to render." | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        # fd 3 isolates the outer loop's input from every gh call inside render_epic.
        while IFS= read -r epic <&3; do
          [ -n "$epic" ] || continue
          # enumerate_epics emits digits only. The number feeds a `label:"epic:<N>"` search qualifier,
          # so it is checked again here.
          if ! [[ "$epic" =~ ^[0-9]+$ ]]; then
            echo "::warning::skipping non-numeric epic token \"$epic\""
            continue
          fi
          render_epic "$epic" || echo "::warning::epic #$epic render aborted (display-only); next sweep re-derives"
        done 3< <(printf '%s\n' "$epics")

        echo "Epic read-model render complete." | tee -a "$GITHUB_STEP_SUMMARY"
