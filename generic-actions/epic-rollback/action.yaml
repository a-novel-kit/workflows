name: epic-rollback
description: >
  Roll back an Epic's landing with compensating reverts, on a person's dispatch. The action
  reconstructs the `epic:<N>` pull requests merged in the Epic's current wave, opens one revert pull
  request per repository, and groups them under a new rollback Epic, `epic:<M>`. The merge gate,
  review and merge queue then land the reverts together, as one atomic landing.

  The action never rewrites history. Each revert is a new commit that undoes one squash merge,
  newest first, once the merge's parent matches the pre-merge commit the ledger recorded. A conflict
  or a parent mismatch turns that repository's pull request into a draft placeholder labeled
  `epic:<M>`, which holds the whole wave until a person finishes it, and the run fails. A revert
  whose label does not stick aborts the run, and so does a ledger wider than `max_rollback_repos`
  repositories or spanning several base branches in one repository.

  The App authors the reverts and cannot approve its own pull requests, so auto-merge waits for a
  person to approve each revert. The action also labels Epic N `rolled-back`, and resets each
  reverted Task to Ready on the board, except Tasks in a repository whose revert is held. `dry_run`
  defaults to "true", which prints the ledger and the planned reverts and writes nothing. The action
  requires the admin role and refuses to run while the kill switch is engaged or Epic N carries
  `automation:paused`.

inputs:
  client_id:
    required: true
    description: >
      Client ID of a GitHub App installed on the org. The action mints three tokens from it: an
      org-wide read token for issues, pull requests and contents, a write token for contents, pull
      requests and issues scoped to the ledger's repositories and `planning_repo`, and an
      organization Projects write token for the board reset. A dry run mints the read token only.
  app_private_key:
    required: true
    description: Private key (PEM) of that App.
  epic_number:
    required: true
    description: >
      Number of the Epic to roll back. It builds a `label:"epic:<N>"` search qualifier, so anything
      but an integer fails the run.
  reason:
    required: true
    description: >
      Why the landing must be undone. The step summary, the rollback Epic and every revert pull
      request record it as the audit trail.
  project_id:
    required: true
    description: Node id of the Projects v2 board (PVT_…) that holds the Tasks to reset.
  org:
    required: false
    default: ${{ github.repository_owner }}
    description: >
      Organization login. The `epic:<N>` search is scoped to it, and every token is minted on its
      installation. Defaults to the workflow's org.
  planning_repo:
    required: false
    default: .github
    description: >
      Repository, by name in `org`, that holds the Epic issues. The rollback Epic opens there.
      Defaults to `.github`.
  dry_run:
    required: false
    default: "true"
    description: >
      Only "false", ignoring case and whitespace, opens and lands the reverts. Any other value, the
      default "true" included, prints the reconstructed ledger, the planned reverts and the planned
      board resets, and writes nothing.
  max_rollback_repos:
    required: false
    default: "5"
    description: >
      Largest number of repositories one rollback may touch, as a positive integer. A wider ledger
      fails the run before any revert, in dry and live runs alike, once the plan is in the step
      summary. A rollback that wide usually means a mis-scoped Epic, so raise the cap only for a
      genuinely large one. Empty means 5.
  kill_switch:
    required: false
    default: ""
    description: >
      Org-level halt, passed in by the caller because a composite action cannot read the `vars`
      context. The action runs only when the value, lowercased and stripped of whitespace, is empty,
      0, off, false, no or disabled. Any other value engages the halt, and the action fails in its
      first step, before the role check or any token mint.

runs:
  using: composite
  steps:
    # Org-level halt, read before the role check and every token mint. A rollback must be a
    # deliberate decision, so only an explicit off-token runs. Any other value fails this step,
    # which stops every later one.
    - name: Halt guard (kill-switch)
      shell: bash
      env:
        KILL_SWITCH: ${{ inputs.kill_switch }}
      run: |
        set -euo pipefail
        case "$(printf '%s' "${KILL_SWITCH:-}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')" in
          "" | 0 | off | false | no | disabled) : ;;
          *)
            echo "::error::AGENT_KILL_SWITCH engaged — [Agent] automation is halted org-wide; refusing to run epic-rollback. Lift the org kill-switch (set it to an explicit off-token, e.g. \"off\", or unset it) deliberately before rolling back."
            exit 1
            ;;
        esac

    # The role is checked here as well as in the caller, since a hand-written or outdated caller can
    # omit the check.
    - uses: a-novel-kit/workflows/generic-actions/require-role@v1.69.1
      with:
        roles: admin

    # Read token. The ledger search and REST reads span every repository in the org, which the
    # single-repository GITHUB_TOKEN cannot see.
    - name: Mint read token
      id: read
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.client_id }}
        private-key: ${{ inputs.app_private_key }}
        owner: ${{ inputs.org }} # zizmor: ignore[github-app] read-only, across the org
        permission-issues: read
        permission-pull-requests: read
        permission-contents: read

    # Reconstruct the epic:<N> ledger with the read token. The step outputs `ledger`, `repos` (the
    # ledger's repositories plus the planning repo) and `proceed`, "true" only for a live run that
    # cleared every gate. A separate step lets the write token cover `repos` alone, and a dry run
    # never mints it.
    - name: Reconstruct ledger + plan (read-only)
      id: plan
      shell: bash
      env:
        GH_TOKEN: ${{ steps.read.outputs.token }}
        ORG: ${{ inputs.org }}
        EPIC: ${{ inputs.epic_number }}
        REASON: ${{ inputs.reason }}
        PLANNING_REPO: ${{ inputs.planning_repo }}
        DRY_RUN: ${{ inputs.dry_run }}
        MAX_ROLLBACK_REPOS: ${{ inputs.max_rollback_repos }}
        ACTOR: ${{ github.actor }}
      run: |
        set -euo pipefail

        # ---- Validate untrusted inputs before they reach a search, a token scope or an API path ----
        # epic_number builds `label:"epic:<N>"`, where a non-numeric value can close the quoted
        # qualifier and inject terms.
        if ! [[ "${EPIC:-}" =~ ^[0-9]+$ ]]; then
          echo "::error::epic_number must be an integer, got \"${EPIC:-}\""
          exit 1
        fi
        # org feeds `org:<ORG>`, where a stray value widens the search, so only login characters pass.
        if ! [[ "${ORG:-}" =~ ^[A-Za-z0-9-]+$ ]]; then
          echo "::error::org must be a valid GitHub login (alphanumeric + hyphens), got \"${ORG:-}\""
          exit 1
        fi
        if [ -z "${REASON:-}" ]; then
          echo "::error::reason is required (it is the audit trail for the rollback)"
          exit 1
        fi
        # planning_repo feeds the write token's `repositories:` scope, through the repos output, and
        # the rollback Epic's API path. A bare repo name keeps a comma from widening the token scope
        # and a newline from breaking the `repos=` output.
        if ! [[ "${PLANNING_REPO:-}" =~ ^[A-Za-z0-9._-]+$ ]]; then
          echo "::error::planning_repo must be a bare repository name (no owner/slash), got \"${PLANNING_REPO:-}\""
          exit 1
        fi
        # The cap feeds a `-gt` compare, so it must be a positive integer. An empty value takes the
        # default of 5.
        MAX_ROLLBACK_REPOS="${MAX_ROLLBACK_REPOS:-5}"
        if ! [[ "${MAX_ROLLBACK_REPOS}" =~ ^[0-9]+$ ]] || [ "${MAX_ROLLBACK_REPOS}" -lt 1 ]; then
          echo "::error::max_rollback_repos must be a positive integer, got \"${MAX_ROLLBACK_REPOS:-}\""
          exit 1
        fi

        # `tr` lowercases because ${VAR,,} needs Bash 4.
        dry=$(printf '%s' "${DRY_RUN:-}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
        [ "$dry" = false ] || dry=true

        # ---- Per-Epic pause -------------------------------------------------------------------
        # `automation:paused` on the Epic issue holds all automation for that Epic, the rollback
        # included. A failed label read does not block, since the role check already gates the run.
        paused_labels=$(gh api "repos/${ORG}/${PLANNING_REPO}/issues/${EPIC}" --jq '.labels[].name' 2>/dev/null || echo "")
        if printf '%s\n' "$paused_labels" | grep -qx 'automation:paused'; then
          echo "::error::epic:#${EPIC} is automation:paused — remove the \`automation:paused\` label from the Epic issue before rolling it back."
          exit 1
        fi

        # ---- Wave boundary ----------------------------------------------------------------------
        # A rollback undoes the current wave, the one that failed to land. Earlier waves landed whole
        # and were retired. The snapshot's `since` marks where the current wave began, and an Epic
        # that never retired a wave has none, so all its merges belong to the current wave.
        #
        # An unreadable or invalid boundary stops the run. An unscoped ledger also reverts retired
        # waves, and GitHub answers a malformed `merged:` qualifier with no rows. The Epic body is
        # editable, so a rejected value is shown on one line of at most 64 characters. A boundary up
        # to five minutes ahead of the runner's clock still passes.
        wave_since() { # $1 = Epic body. Prints the boundary, or nothing; 1 = unreadable
          local region marker since shown since_epoch
          region=$(printf '%s\n' "$1" | awk -v s='<!-- epic-membership:snapshot:start -->' \
            -v e='<!-- epic-membership:snapshot:end -->' '$0 == s {f=1;next} $0 == e {f=0} f')
          [ -n "$region" ] || return 0
          marker=$(printf '%s\n' "$region" | sed -n '/^[[:space:]]*[{[]/,$p' | jq -cs '.[0] // empty' 2>/dev/null) || marker=""
          if ! printf '%s' "$marker" | jq -e 'type == "object"' >/dev/null 2>&1; then
            echo "::error::epic:#${EPIC}'s activation snapshot is unreadable, so its wave boundary is unknown; repair it before rolling back." >&2
            return 1
          fi
          since=$(printf '%s' "$marker" | jq -r '(.since // "") | tostring')
          [ -n "$since" ] || return 0
          shown=$(printf '%s' "$since" | tr -d '\r\n' | cut -c1-64)
          if ! [[ "$since" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] \
            || ! since_epoch=$(date -u -d "$since" +%s 2>/dev/null) \
            || [ "$since_epoch" -gt "$(( $(date -u +%s) + 300 ))" ]; then
            echo "::error::epic:#${EPIC}'s wave boundary \"${shown}\" is not a past ISO-8601 UTC instant; repair the snapshot before rolling back." >&2
            return 1
          fi
          printf '%s' "$since"
        }

        epic_read=false
        for attempt in 1 2 3; do
          if epic_body=$(gh api "repos/${ORG}/${PLANNING_REPO}/issues/${EPIC}" --jq '.body // ""' 2>/dev/null); then
            epic_read=true
            break
          fi
          [ "$attempt" -lt 3 ] && sleep 2
        done
        if [ "$epic_read" != true ]; then
          echo "::error::could not read epic:#${EPIC} to find the wave to roll back."
          exit 1
        fi
        since=$(wave_since "$(printf '%s' "$epic_body" | tr -d '\r')") || exit 1

        # ---- Shared GraphQL + read helpers ----------------------------------------------------

        # Pull request search node. mergeCommit cross-checks the squash SHA, which REST supplies with
        # authority. closingIssuesReferences carries the Task ids the board reset walks.
        SEARCH_Q='query($q:String!,$cursor:String){
          search(query:$q, type:ISSUE, first:100, after:$cursor){
            pageInfo{ hasNextPage endCursor }
            nodes{ ... on PullRequest{
              number mergedAt baseRefName
              repository{ nameWithOwner }
              mergeCommit{ oid }
              closingIssuesReferences(first:10){ nodes{ id number } } } } } }'

        # Page an ISSUE search to completion, retrying transient GraphQL errors, and print the
        # aggregated node array. Returns 1 with a stderr log on failure, so the caller fails closed.
        search_prs() { # $1 = search query string
          local search="$1" cursor="" agg='[]' data page ok args
          while :; do
            ok=false
            for attempt in 1 2 3; do
              args=(-f query="$SEARCH_Q" -f q="$search")
              [ -n "$cursor" ] && args+=(-f cursor="$cursor")
              if data=$(gh api graphql "${args[@]}" 2>&1) \
                && printf '%s' "$data" | jq -e 'has("data") and (has("errors") | not)' >/dev/null 2>&1; then
                ok=true
                break
              fi
              [ "$attempt" -lt 3 ] && sleep 2
            done
            if [ "$ok" != true ]; then
              printf 'search_prs failed for query "%s": %s\n' "$search" "$data" >&2
              return 1
            fi
            page=$(printf '%s' "$data" | jq '[(.data.search.nodes // [])[] | select(.number != null)]')
            agg=$(jq -s '.[0] + .[1]' <(printf '%s' "$agg") <(printf '%s' "$page"))
            [ "$(printf '%s' "$data" | jq -r '.data.search.pageInfo.hasNextPage')" = "true" ] || break
            cursor=$(printf '%s' "$data" | jq -r '.data.search.pageInfo.endCursor')
          done
          printf '%s' "$agg"
        }

        # Read one pull request through REST, the authority the search index lags behind. Prints
        # "<merged> <merge_commit_sha>", such as "true a1b2c3…", and returns 1 on error.
        rest_pr_merge() { # $1=owner/repo $2=number
          local data
          for attempt in 1 2 3; do
            if data=$(gh api "repos/$1/pulls/$2" 2>/dev/null); then
              printf '%s' "$data" | jq -r '"\(.merged) \(.merge_commit_sha // "")"'
              return 0
            fi
            [ "$attempt" -lt 3 ] && sleep 2
          done
          printf 'rest_pr_merge failed for %s#%s\n' "$1" "$2" >&2
          return 1
        }

        # Print a commit's parent SHAs, one per line. A squash commit has exactly one.
        rest_commit_parents() { # $1=owner/repo $2=sha
          local data
          for attempt in 1 2 3; do
            if data=$(gh api "repos/$1/commits/$2" 2>/dev/null); then
              printf '%s' "$data" | jq -r '.parents[].sha'
              return 0
            fi
            [ "$attempt" -lt 3 ] && sleep 2
          done
          printf 'rest_commit_parents failed for %s@%s\n' "$1" "$2" >&2
          return 1
        }

        # ================= Reconstruct the ledger ==============================================
        echo "## Rollback of epic:#${EPIC} (org=${ORG})" | tee -a "$GITHUB_STEP_SUMMARY"
        echo "Reason: ${REASON}" | tee -a "$GITHUB_STEP_SUMMARY"
        echo "Requested by @${ACTOR}. dry_run=${dry}." | tee -a "$GITHUB_STEP_SUMMARY"

        echo "Wave boundary: ${since:-none (the Epic has not retired a wave)}." | tee -a "$GITHUB_STEP_SUMMARY"
        if ! candidates=$(search_prs "is:pr is:merged label:\"epic:${EPIC}\" org:${ORG}${since:+ merged:>=${since}}"); then
          echo "::error::could not reconstruct the ledger (GraphQL search failed after retries)"
          exit 1
        fi
        cand_count=$(printf '%s' "$candidates" | jq 'length')
        # An empty ledger has nothing to roll back. Whether a landing deserves a rollback stays the
        # dispatcher's call.
        if [ "$cand_count" -eq 0 ]; then
          echo "::error::no merged PRs carry epic:${EPIC} in org ${ORG}${since:+ since ${since}} — nothing to roll back."
          exit 1
        fi

        # Confirm each candidate through REST, take its squash SHA, require a single parent, and
        # record the pre-merge parent and the Task ids. A row REST reports as unmerged is left out. A
        # commit with two parents means the ledger is wrong and aborts the run.
        ledger='[]'
        for i in $(seq 0 $((cand_count - 1))); do
          row=$(printf '%s' "$candidates" | jq -c ".[$i]")
          repo=$(printf '%s' "$row" | jq -r '.repository.nameWithOwner')
          number=$(printf '%s' "$row" | jq -r '.number')
          base=$(printf '%s' "$row" | jq -r '.baseRefName')
          merged_at=$(printf '%s' "$row" | jq -r '.mergedAt')
          search_oid=$(printf '%s' "$row" | jq -r '.mergeCommit.oid // ""')
          tasks=$(printf '%s' "$row" | jq -c '[.closingIssuesReferences.nodes[] | .id]')

          if ! info=$(rest_pr_merge "$repo" "$number"); then
            echo "::error::REST read failed for ${repo}#${number} — cannot confirm the ledger; aborting."
            exit 1
          fi
          read -r merged sha <<<"$info"
          if [ "$merged" != "true" ]; then
            echo "::warning::${repo}#${number} is not REST-confirmed merged (search index lag?) — excluding from the ledger." | tee -a "$GITHUB_STEP_SUMMARY"
            continue
          fi
          if [ -z "$sha" ]; then
            echo "::error::${repo}#${number} is merged but has no merge_commit_sha — cannot revert; aborting."
            exit 1
          fi
          if [ -n "$search_oid" ] && [ "$search_oid" != "$sha" ]; then
            echo "::warning::${repo}#${number}: search mergeCommit.oid (${search_oid:0:12}) != REST merge_commit_sha (${sha:0:12}); using REST (authority)." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

          if ! parents=$(rest_commit_parents "$repo" "$sha"); then
            echo "::error::could not read commit ${sha} in ${repo}; aborting."
            exit 1
          fi
          np=$(printf '%s\n' "$parents" | grep -c . || true)
          if [ "$np" -ne 1 ]; then
            echo "::error::commit ${sha} for ${repo}#${number} has ${np} parents (expected 1 — not a squash merge). The ledger is wrong; aborting rather than guessing a -m mainline."
            exit 1
          fi
          premerge=$(printf '%s\n' "$parents" | head -n1)

          ledger=$(jq -cn --argjson acc "$ledger" --arg repo "$repo" --argjson number "$number" \
            --arg base "$base" --arg mergedAt "$merged_at" --arg sha "$sha" --arg pre "$premerge" \
            --argjson tasks "$tasks" \
            '$acc + [{repo:$repo, number:$number, base:$base, mergedAt:$mergedAt, sha:$sha, premerge:$pre, tasks:$tasks}]')
        done

        ledger_count=$(printf '%s' "$ledger" | jq 'length')
        if [ "$ledger_count" -eq 0 ]; then
          echo "::error::every epic:${EPIC} candidate failed REST merge-confirmation — nothing safe to roll back."
          exit 1
        fi

        repos=$(printf '%s' "$ledger" | jq -r '[.[].repo] | unique | .[]')

        # ---- Print the ledger and the plan, the whole output of a dry run ---------------------
        {
          echo ""
          echo "### Reconstructed ledger (${ledger_count} merged sibling(s), grouped by repo, newest-first)"
        } | tee -a "$GITHUB_STEP_SUMMARY"
        while IFS= read -r repo; do
          [ -n "$repo" ] || continue
          rows=$(printf '%s' "$ledger" | jq -c --arg r "$repo" '[.[] | select(.repo==$r)] | sort_by(.mergedAt) | reverse')
          base=$(printf '%s' "$rows" | jq -r '.[0].base')
          echo "- **${repo}** (base \`${base}\`): would open ONE revert PR reverting, newest-first:" | tee -a "$GITHUB_STEP_SUMMARY"
          printf '%s' "$rows" | jq -r '.[] | "    - PR #\(.number) squash \(.sha[0:12]) (merged \(.mergedAt))"' \
            | tee -a "$GITHUB_STEP_SUMMARY"
        done < <(printf '%s\n' "$repos")

        task_n=$(printf '%s' "$ledger" | jq '[.[].tasks[]] | unique | length')
        echo "### Board reset plan: ${task_n} rolled-back Task(s) → Status \"Ready\"" | tee -a "$GITHUB_STEP_SUMMARY"

        # ---- Blast cap, before any mutation, on both dry and live runs -------------------------
        # A ledger over the cap aborts. The plan above is already in the summary, so the operator
        # sees the planned targets and raises max_rollback_repos if the width is genuine.
        repo_n=$(printf '%s' "$repos" | grep -c . || true)
        if [ "$repo_n" -gt "$MAX_ROLLBACK_REPOS" ]; then
          echo "::error::BLAST-CAP: rollback of epic:#${EPIC} would touch ${repo_n} repos (> max_rollback_repos=${MAX_ROLLBACK_REPOS}) — aborting before any revert. A rollback this wide is almost certainly a mis-scoped Epic; investigate, or re-dispatch with a higher max_rollback_repos if it is genuinely intended." | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

        # ---- Multi-base assert, before any mutation, on both dry and live runs -----------------
        # A repo's siblings all target one base branch. Reverting an older-base sibling onto the
        # newest base reverts a change that is not on that base, so a multi-base ledger aborts.
        multibase=$(printf '%s' "$ledger" | jq -r '
          group_by(.repo)[] | select((map(.base) | unique | length) > 1)
          | "  - \(.[0].repo): \((map(.base) | unique) | join(", "))"')
        if [ -n "$multibase" ]; then
          echo "::error::epic:${EPIC} siblings span multiple base branches within a repo — refusing to revert older-base siblings onto the newest base. Roll those back per-base by hand:" | tee -a "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$multibase" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

        # ---- Output the ledger and the write token's repository scope --------------------------
        # The `repos` output holds bare repository names, since the token's `owner:` supplies the
        # owner. The planning repo joins them for the rollback Epic and Epic N's `rolled-back` label.
        # A leaked write token reaches no repository outside this rollback. The mutation step reverts
        # this exact ledger, so nothing drifts against a second search.
        repos_csv=$(printf '%s' "$ledger" | jq -r --arg pr "$PLANNING_REPO" '([.[].repo | split("/")[1]] + [$pr]) | unique | join(",")')
        {
          echo "repos=${repos_csv}"
          echo "ledger<<__ROLLBACK_LEDGER__"
          printf '%s\n' "$ledger"
          echo "__ROLLBACK_LEDGER__"
        } >> "$GITHUB_OUTPUT"

        if [ "$dry" != "false" ]; then
          echo "" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "DRY RUN — no writes performed (no write token minted). Re-dispatch with dry_run=false to open + land the reverts." | tee -a "$GITHUB_STEP_SUMMARY"
          echo "proceed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "proceed=true" >> "$GITHUB_OUTPUT"

    # Write token, minted only on a live run that cleared every gate, and scoped to the Epic's
    # repositories plus the planning repo. contents pushes the revert branches, pull-requests opens,
    # labels and arms the reverts, and issues writes the rollback Epic, the epic:<M> labels and Epic
    # N's `rolled-back` label.
    - name: Mint scoped write token
      id: write
      if: ${{ steps.plan.outputs.proceed == 'true' }}
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.client_id }}
        private-key: ${{ inputs.app_private_key }}
        owner: ${{ inputs.org }}
        repositories: ${{ steps.plan.outputs.repos }}
        permission-contents: write
        permission-pull-requests: write
        permission-issues: write

    # Board token, limited to organization Projects write, which bounds a leak to board edits. That
    # permission is org-wide and ignores `repositories:`, so the live-run gate is what keeps a dry run
    # from holding it.
    - name: Mint board token
      id: board
      if: ${{ steps.plan.outputs.proceed == 'true' }}
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.client_id }}
        private-key: ${{ inputs.app_private_key }}
        owner: ${{ inputs.org }}
        permission-organization-projects: write

    # Generate the reverts, land the wave and reset the board. Every mutation lives in this step,
    # which runs on a live run only, with the scoped write token and the plan step's ledger.
    - name: Generate reverts, land + reset
      id: mutate
      if: ${{ steps.plan.outputs.proceed == 'true' }}
      shell: bash
      env:
        # GH_TOKEN holds the read token, so a `gh` call that names no token cannot write. Every call in
        # this step names the write or board token inline, its reads included.
        GH_TOKEN: ${{ steps.read.outputs.token }}
        WRITE_TOKEN: ${{ steps.write.outputs.token }}
        BOARD_TOKEN: ${{ steps.board.outputs.token }}
        APP_SLUG: ${{ steps.write.outputs.app-slug }}
        LEDGER: ${{ steps.plan.outputs.ledger }}
        ORG: ${{ inputs.org }}
        EPIC: ${{ inputs.epic_number }}
        REASON: ${{ inputs.reason }}
        PROJECT_ID: ${{ inputs.project_id }}
        PLANNING_REPO: ${{ inputs.planning_repo }}
        ACTOR: ${{ github.actor }}
      run: |
        set -euo pipefail

        # The plan step's ledger names exactly the repositories the write token covers. The mutation
        # never searches the epic:<N> set again, since a repository from a fresh search answers 403
        # mid-wave.
        repos=$(printf '%s' "$LEDGER" | jq -r '[.[].repo] | unique | .[]')
        task_n=$(printf '%s' "$LEDGER" | jq -r '[.[].tasks[]] | unique | length')
        MARKER="ROLLBACK-HELD.md"

        # ================= Mutations ===========================================================

        # ---- Open the rollback Epic M first, since branch names and PR bodies name it ----------
        epic_body=$(printf 'Automated rollback of **epic:#%s** — its landed subset violated INV-1.\n\n**Reason:** %s\n\nRequested by @%s.\n\nReverts (one PR per repo, labeled to THIS rollback epic) land atomically through the same merge-gate + review + queue + partial-landing detector as the forward wave. This does NOT un-merge the originals — each revert is a new forward commit.\n\n### Reconstructed ledger\n%s' \
          "$EPIC" "$REASON" "$ACTOR" "$(printf '%s' "$LEDGER" | jq -r '.[] | "- \(.repo)#\(.number): revert squash \(.sha[0:12]) (pre-merge \(.premerge[0:12]))"')")
        if ! epic_url=$(GH_TOKEN="$WRITE_TOKEN" gh issue create --repo "${ORG}/${PLANNING_REPO}" \
          --title "ROLLBACK epic:#${EPIC} — reconstructed compensating reverts" \
          --body "$epic_body"); then
          echo "::error::could not open the rollback-Epic issue in ${ORG}/${PLANNING_REPO} (issues:write?)."
          exit 1
        fi
        M=$(printf '%s' "$epic_url" | grep -oE '[0-9]+$' || true)
        if ! [[ "$M" =~ ^[0-9]+$ ]]; then
          echo "::error::could not parse the rollback-Epic number from \"${epic_url}\"."
          exit 1
        fi
        echo "Opened rollback-Epic ${ORG}/${PLANNING_REPO}#${M} (${epic_url})." | tee -a "$GITHUB_STEP_SUMMARY"

        branch="rollback/epic-${EPIC}-m${M}"
        produced='[]'
        had_failure=false
        dir=""

        # List the revert pull requests already opened under #M, for an abort mid-generation such as
        # a clone, push or label failure. No listed pull request has auto-merge armed or an
        # approval, so nothing lands. A person closes them and #M, or finishes the rollback by hand.
        orphan_summary() {
          local n
          n=$(printf '%s' "$produced" | jq 'length')
          {
            echo ""
            echo "### Rollback ABORTED mid-generation — ${n} revert PR(s) already opened under rollback-Epic #${M}"
            echo "None has auto-merge armed or an approval, so nothing lands. Clean up (close them + close #${M}) or finish the rollback by hand:"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          printf '%s' "$produced" | jq -r '.[] | "- \(.repo) PR #\(.number)\(if .draft then " (HELD draft)" else "" end)"' | tee -a "$GITHUB_STEP_SUMMARY"
          echo "- Rollback-Epic: ${ORG}/${PLANNING_REPO}#${M}" | tee -a "$GITHUB_STEP_SUMMARY"
        }

        # Aborts mid-generation: logs $1, drops the clone, lists the pull requests already opened and
        # fails the step.
        abort_generation() { # $1 = error message
          echo "::error::$1" | tee -a "$GITHUB_STEP_SUMMARY"
          rm -rf "$dir"
          orphan_summary
          exit 1
        }

        # ---- Pass 1a: per repository, revert newest first, open the pull request, label it ------
        # Each pull request takes epic:<M> as soon as it opens, so an abort later in the loop leaves
        # the earlier ones labeled. The outer loop reads fd 3 and the inner revert loop fd 5, so no
        # git or gh call inside consumes their input.
        while IFS= read -r repo <&3; do
          [ -n "$repo" ] || continue
          rows=$(printf '%s' "$LEDGER" | jq -c --arg r "$repo" '[.[] | select(.repo==$r)] | sort_by(.mergedAt) | reverse')
          base=$(printf '%s' "$rows" | jq -r '.[0].base')
          sha_list=$(printf '%s' "$rows" | jq -r '[.[].sha[0:12]] | join(", ")')
          orig_list=$(printf '%s' "$rows" | jq -r '[.[] | "\(.repo)#\(.number)"] | join(", ")')

          dir=$(mktemp -d)
          # A composite action cannot loop actions/checkout, so each repository is cloned here. Full
          # history keeps the squash commit and its parent reachable. The token lives only in this
          # throwaway clone's remote URL on the ephemeral runner.
          if ! git clone --quiet --branch "$base" \
            "https://x-access-token:${WRITE_TOKEN}@github.com/${repo}.git" "$dir" 2>/dev/null; then
            abort_generation "could not clone ${repo}@${base}."
          fi
          git -C "$dir" config user.name "${APP_SLUG}[bot]"
          git -C "$dir" config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git -C "$dir" switch -c "$branch" >/dev/null 2>&1

          conflict=false
          detail=""
          while read -r r_sha r_pre <&5; do
            [ -n "$r_sha" ] || continue
            # The squash commit's parent must equal the ledger's pre-merge SHA. A mismatch means the
            # branch was rewritten or the ledger names the wrong landing.
            actual_parent=$(git -C "$dir" rev-parse "${r_sha}^" 2>/dev/null || echo "")
            if [ "$actual_parent" != "$r_pre" ]; then
              conflict=true
              detail="pre-merge SHA mismatch for ${r_sha:0:12} (parent ${actual_parent:0:12} != recorded ${r_pre:0:12})"
              break
            fi
            # The revert carries a Conventional subject, `revert: <reverted subject>`, so it passes a
            # commit-message ruleset that git's default `Revert "…"` subject fails.
            if ! git -C "$dir" revert --no-commit "$r_sha" >/dev/null 2>&1 \
              || ! git -C "$dir" commit --quiet -m "revert: $(git -C "$dir" log -1 --format=%s "$r_sha")" \
                -m "This reverts commit ${r_sha}."; then
              conflict=true
              detail="git-revert conflict on ${r_sha:0:12}; paths: $(git -C "$dir" diff --name-only --diff-filter=U | tr '\n' ' ')"
              git -C "$dir" revert --abort >/dev/null 2>&1 || true
              break
            fi
          done 5< <(printf '%s' "$rows" | jq -r '.[] | "\(.sha) \(.premerge)"')

          if [ "$conflict" = true ]; then
            # A conflict is never resolved automatically. The branch resets to the base tip and takes
            # an empty commit, since GitHub refuses a pull request without one. The draft placeholder
            # is labeled epic:<M> below, and a draft member holds the whole wave.
            echo "::error::${repo}: ${detail}" | tee -a "$GITHUB_STEP_SUMMARY"
            git -C "$dir" reset --hard "origin/${base}" >/dev/null 2>&1
            git -C "$dir" commit --allow-empty --quiet \
              -m "revert: hold the epic:#${EPIC} rollback #${M} placeholder (do not merge)"
            if ! git -C "$dir" push --quiet -u origin "$branch" 2>/dev/null; then
              # A branch ruleset can reject an empty commit. A one-file marker commit then carries the
              # held draft instead.
              echo "::warning::${repo}: held-placeholder empty commit rejected (ruleset?) — retrying with a ${MARKER} marker commit."
              git -C "$dir" reset --hard "origin/${base}" >/dev/null 2>&1
              printf 'HELD rollback placeholder for epic:#%s (rollback #%s) — DO NOT MERGE.\n\nThe automated revert for %s could not be produced:\n\n%s\n\nFinish by hand: reset to `%s`, then for each of %s newest-first run `git revert --no-commit <squash>`, resolve conflicts and `git commit -m "revert: <reverted subject>"`; delete this file, push, mark the PR ready.\n' \
                "$EPIC" "$M" "$repo" "$detail" "$base" "$sha_list" > "${dir}/${MARKER}"
              git -C "$dir" add "$MARKER"
              git -C "$dir" commit --quiet -m "revert: hold the epic:#${EPIC} rollback #${M} placeholder (do not merge)"
              if ! git -C "$dir" push --quiet -u origin "$branch" 2>/dev/null; then
                abort_generation "could not push held placeholder for ${repo} (empty commit AND ${MARKER} marker both rejected)."
              fi
            fi
            body=$(printf 'HELD — the automated revert for **%s** could not be produced:\n\n> %s\n\nThis is a DRAFT placeholder that keeps epic:#%s from landing partially (the merge-gate holds every sibling until this one is ready). Never auto-resolved.\n\n**Finish by hand:** reset this branch to `%s`, then for each commit below (NEWEST-FIRST) run `git revert --no-commit <squash>`, resolve conflicts, `git commit -m "revert: <reverted subject>"`, push, retitle this PR without `[HELD]`, and mark it ready.\n\nCommits to revert: %s (originals: %s)\n\nRequested by @%s. Reason: %s' \
              "$repo" "$detail" "$M" "$base" "$sha_list" "$orig_list" "$ACTOR" "$REASON")
            if ! pr_url=$(GH_TOKEN="$WRITE_TOKEN" gh pr create --repo "$repo" --base "$base" --head "$branch" \
              --draft --title "revert: [HELD] roll back epic:#${EPIC} in ${repo} (rollback #${M})" --body "$body"); then
              abort_generation "could not open the HELD draft revert PR for ${repo}."
            fi
            draft=true
            had_failure=true
          else
            if ! git -C "$dir" push --quiet -u origin "$branch" 2>/dev/null; then
              abort_generation "could not push revert branch for ${repo}."
            fi
            body=$(printf 'Reverts the landed epic:#%s changes in **%s** (newest-first): %s.\n\nOriginals: %s. Part of rollback epic #%s. Each revert is a new forward commit — the originals stay merged in history.\n\nRequested by @%s. Reason: %s' \
              "$EPIC" "$repo" "$sha_list" "$orig_list" "$M" "$ACTOR" "$REASON")
            if ! pr_url=$(GH_TOKEN="$WRITE_TOKEN" gh pr create --repo "$repo" --base "$base" --head "$branch" \
              --title "revert: roll back epic:#${EPIC} in ${repo} (rollback #${M})" --body "$body"); then
              abort_generation "could not open the revert PR for ${repo}."
            fi
            draft=false
          fi
          rm -rf "$dir"

          pr_num=$(printf '%s' "$pr_url" | grep -oE '[0-9]+$')
          produced=$(jq -cn --argjson acc "$produced" --arg repo "$repo" --argjson num "$pr_num" \
            --argjson draft "$draft" '$acc + [{repo:$repo, number:$num, draft:$draft}]')
          echo "${repo}: opened $([ "$draft" = true ] && echo 'DRAFT ' )revert PR #${pr_num} ($pr_url)." | tee -a "$GITHUB_STEP_SUMMARY"

          # epic:<M> membership keeps the rollback from landing partially, so a label failure aborts.
          # Epic labels sit outside the managed label set, so epic:<M> is created first, and an
          # existing one is fine.
          GH_TOKEN="$WRITE_TOKEN" gh label create "epic:${M}" --repo "$repo" --color BFD4F2 \
            --description "Rollback epic #${M} (reverts epic:#${EPIC})" >/dev/null 2>&1 || true
          if ! GH_TOKEN="$WRITE_TOKEN" gh pr edit "$pr_num" --repo "$repo" --add-label "epic:${M}" >/dev/null 2>&1; then
            abort_generation "could not apply epic:${M} to ${repo}#${pr_num} — the epic:<M> membership is the no-partial-rollback guarantee; aborting."
          fi
        done 3< <(printf '%s\n' "$repos")

        # ---- Pass 1b: re-read each pull request's labels to confirm epic:<M> -------------------
        # A `gh pr edit` that returns 0 does not prove the label persisted, since it can lag or be
        # stripped. A missing epic:<M> aborts, because an unlabeled member escapes the wave and can
        # land alone.
        prod_count=$(printf '%s' "$produced" | jq 'length')
        while read -r repo pr_num <&3; do
          labels_now=$(GH_TOKEN="$WRITE_TOKEN" gh pr view "$pr_num" --repo "$repo" --json labels -q '.labels[].name' 2>/dev/null || echo "")
          if ! printf '%s\n' "$labels_now" | grep -qx "epic:${M}"; then
            abort_generation "epic:${M} did NOT stick on ${repo}#${pr_num} (label re-read failed) — the no-partial-rollback guarantee is broken; aborting. Apply epic:${M} to every produced revert by hand, or close them + close #${M}."
          fi
        done 3< <(printf '%s' "$produced" | jq -r '.[] | "\(.repo) \(.number)"')
        echo "All ${prod_count} revert PR(s) verified as epic:${M} members." | tee -a "$GITHUB_STEP_SUMMARY"

        # merge-gate retires epic:#N's frozen wave once every member merged, so a member closed
        # unmerged holds every later epic:<N> pull request. The `rolled-back` label lets merge-gate,
        # the snapshot's only writer, retire the wave once none of its members is open. An open
        # member keeps the wave frozen, so nothing from it lands alone.
        GH_TOKEN="$WRITE_TOKEN" gh label create rolled-back --repo "${ORG}/${PLANNING_REPO}" --force \
          --color 5319e7 --description "This Epic's landing was rolled back; its frozen wave retires once no member is open" \
          >/dev/null 2>&1 || true
        GH_TOKEN="$WRITE_TOKEN" gh issue edit "$EPIC" --repo "${ORG}/${PLANNING_REPO}" --add-label rolled-back >/dev/null 2>&1 \
          || echo "::warning::could not label epic:#${EPIC} \`rolled-back\`; add it by hand so its frozen wave can retire."

        # ---- Surface the wave for a person to review and approve --------------------------------
        # The App cannot approve the reverts it authored, so the merge gate holds the wave until a
        # person approves. The list of revert pull requests goes into the Epic body and the summary.
        pr_list=$(printf '%s' "$produced" | jq -r '.[] | "- \(.repo)#\(.number)\(if .draft then " — HELD draft (finish by hand first)" else "" end)"')
        approve_body=$(printf '%s\n\n---\n\n### Revert PRs awaiting human approval\nThe [Agent] App authored these reverts and GitHub forbids approving your own PR, so the merge-gate holds the whole wave until a human approves them. **Review and APPROVE each PR below** (and finish any HELD draft); once all are approved the gate greens and they land together in reverse.\n\n%s' \
          "$epic_body" "$pr_list")
        GH_TOKEN="$WRITE_TOKEN" gh issue edit "$M" --repo "${ORG}/${PLANNING_REPO}" --body "$approve_body" >/dev/null 2>&1 \
          || echo "::warning::could not append the revert-PR list to rollback-Epic #${M} — the list is still in the step summary."
        {
          echo ""
          echo "### Awaiting human review — approve these to release the rollback wave"
          echo "The App cannot approve its own PRs, so the merge-gate PARKS the wave until a human approves. Review + approve each revert:"
          printf '%s\n' "$pr_list"
          echo "- Rollback-Epic: ${ORG}/${PLANNING_REPO}#${M}"
        } | tee -a "$GITHUB_STEP_SUMMARY"

        # ---- Pass 2: arm auto-merge on each ready revert once the whole set is labeled ----------
        # Arming after the whole set is labeled keeps an early member from arming before its
        # siblings exist. Auto-merge then waits for a person's approval. A held draft stays unarmed,
        # since it is the member that holds the wave.
        while read -r repo pr_num draft <&3; do
          if [ "$draft" = "true" ]; then
            echo "${repo}#${pr_num}: HELD draft — epic:${M} member (holds the wave), auto-merge NOT armed." | tee -a "$GITHUB_STEP_SUMMARY"
            continue
          fi
          arm_ok=false
          for attempt in 1 2 3; do
            if GH_TOKEN="$WRITE_TOKEN" gh pr merge "$pr_num" --repo "$repo" --auto --squash >/dev/null 2>&1; then
              arm_ok=true; break
            fi
            [ "$attempt" -lt 3 ] && sleep 2
          done
          if [ "$arm_ok" = true ]; then
            echo "${repo}#${pr_num}: auto-merge armed — PARKED pending human approval." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            # An unarmed revert among armed siblings half-lands the rollback on approval, since only
            # the armed ones merge. The run fails, so the operator arms it by hand before approving.
            had_failure=true
            echo "::error::could not arm auto-merge on ${repo}#${pr_num} after retries — enable it by hand before approving the wave." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
        done 3< <(printf '%s' "$produced" | jq -r '.[] | "\(.repo) \(.number) \(.draft)"')

        # ---- Board reset: move each forward pull request's Tasks to Status "Ready" --------------
        # A revert is a new commit and the originals stay merged, so no other automation moves the
        # Tasks back. "Ready" is the column derive-status uses for an abandoned attempt. A composite
        # action cannot loop board-write, so its logic runs inline. The field and option resolve
        # once, and each Task is added if missing and compared before the write.
        #
        # A Task from a repository whose revert is a held draft keeps its Status, since that revert
        # has not landed.
        held_repos=$(printf '%s' "$produced" | jq -c '[.[] | select(.draft==true) | .repo]')
        reset_task_ids=$(printf '%s' "$LEDGER" | jq -r --argjson held "$held_repos" '
          ( [ .[] | select(.repo as $r | $held | index($r)) | .tasks[] ] | unique ) as $blocked
          | [ .[].tasks[] ] | unique
          | map(select( . as $t | ($blocked | index($t)) | not ))
          | .[]')
        reset_task_n=$(printf '%s' "$reset_task_ids" | grep -c . || true)

        board_status_field=""
        board_ready_opt=""
        board_init() {
          local fq fresp
          fq='query($proj:ID!){ node(id:$proj){ ... on ProjectV2{
            field(name:"Status"){
              ... on ProjectV2FieldCommon{ id }
              ... on ProjectV2SingleSelectField{ options{ id name } } } } } }'
          fresp=$(GH_TOKEN="$BOARD_TOKEN" gh api graphql -f query="$fq" -f proj="$PROJECT_ID") || return 1
          board_status_field=$(printf '%s' "$fresp" | jq -r '.data.node.field.id // empty')
          board_ready_opt=$(printf '%s' "$fresp" | jq -r '.data.node.field.options[]? | select(.name=="Ready") | .id')
          [ -n "$board_status_field" ] && [ -n "$board_ready_opt" ]
        }
        board_set_ready() { # $1 = Task issue node id
          local content="$1" iq iresp item_id cursor="" cur cq wm
          iq='query($c:ID!,$cursor:String){ node(id:$c){ ... on Issue{
            projectItems(first:100, after:$cursor){ pageInfo{ hasNextPage endCursor } nodes{ id project{ id } } } } } }'
          item_id=""
          while :; do
            local args=(-f c="$content")
            [ -n "$cursor" ] && args+=(-f cursor="$cursor")
            iresp=$(GH_TOKEN="$BOARD_TOKEN" gh api graphql -f query="$iq" "${args[@]}") || return 1
            item_id=$(printf '%s' "$iresp" | jq -r --arg p "$PROJECT_ID" '[.data.node.projectItems.nodes[] | select(.project.id==$p) | .id][0] // empty')
            [ -n "$item_id" ] && break
            [ "$(printf '%s' "$iresp" | jq -r '.data.node.projectItems.pageInfo.hasNextPage')" = "true" ] || break
            cursor=$(printf '%s' "$iresp" | jq -r '.data.node.projectItems.pageInfo.endCursor')
          done
          if [ -z "$item_id" ]; then
            local am
            am='mutation($proj:ID!,$c:ID!){ addProjectV2ItemById(input:{projectId:$proj,contentId:$c}){ item{ id } } }'
            item_id=$(GH_TOKEN="$BOARD_TOKEN" gh api graphql -f query="$am" -f proj="$PROJECT_ID" -f c="$content" \
              | jq -r '.data.addProjectV2ItemById.item.id') || return 1
          fi
          cq='query($item:ID!){ node(id:$item){ ... on ProjectV2Item{ fieldValueByName(name:"Status"){ ... on ProjectV2ItemFieldSingleSelectValue{ current: name } } } } }'
          cur=$(GH_TOKEN="$BOARD_TOKEN" gh api graphql -f query="$cq" -f item="$item_id" | jq -r '.data.node.fieldValueByName.current // empty') || return 1
          if [ "$cur" = "Ready" ]; then
            echo "board: Task ${content} already \"Ready\" — no-op." | tee -a "$GITHUB_STEP_SUMMARY"
            return 0
          fi
          # The option id is inlined into the mutation, as board-write does. board_ready_opt comes from
          # GitHub's own option list, so it is safe to inline.
          wm="mutation(\$proj:ID!,\$item:ID!,\$field:ID!){ updateProjectV2ItemFieldValue(input:{projectId:\$proj,itemId:\$item,fieldId:\$field,value:{singleSelectOptionId:\"${board_ready_opt}\"}}){ projectV2Item{ id } } }"
          GH_TOKEN="$BOARD_TOKEN" gh api graphql -f query="$wm" -f proj="$PROJECT_ID" -f item="$item_id" -f field="$board_status_field" >/dev/null || return 1
          echo "board: Task ${content} \"${cur:-<unset>}\" → \"Ready\"." | tee -a "$GITHUB_STEP_SUMMARY"
        }

        if [ "$reset_task_n" -gt 0 ]; then
          if board_init; then
            # fd 3 isolates this loop's input from the gh calls inside board_set_ready.
            while IFS= read -r tid <&3; do
              [ -n "$tid" ] || continue
              board_set_ready "$tid" || echo "::warning::board reset failed for Task ${tid} — set it to \"Ready\" by hand (reconcile won't re-derive a Task whose forward PR is already merged)."
            done 3< <(printf '%s\n' "$reset_task_ids")
          else
            echo "::warning::could not resolve the Status/\"Ready\" field on the board — skipping board reset; reset the rolled-back Task(s) to \"Ready\" by hand."
          fi
        fi
        if [ "$reset_task_n" -lt "$task_n" ]; then
          echo "board: skipped $(( task_n - reset_task_n )) Task(s) whose repo revert is a HELD draft (not landed) — reset by hand once the draft finishes and its revert lands." | tee -a "$GITHUB_STEP_SUMMARY"
        fi

        # ---- Final status ----------------------------------------------------------------------
        if [ "$had_failure" = true ]; then
          echo "::error::Rollback epic:#${M} assembled (${prod_count} revert PR(s)), but at least one is a HELD draft (conflict / integrity mismatch) or has no auto-merge armed. Finish every draft and arm auto-merge on every revert before approving the wave, or it lands partially. See #${M} and the step summary for the PR list."
          exit 1
        fi
        echo "Rollback epic:#${M} assembled: ${prod_count} revert PR(s) labeled epic:${M} + auto-merge-armed, PARKED pending human approval (the App can't approve its own PRs). A human reviews + approves the wave, then the merge-gate greens and lands it atomically in reverse. Board: ${reset_task_n} Task(s) reset to \"Ready\"." | tee -a "$GITHUB_STEP_SUMMARY"
