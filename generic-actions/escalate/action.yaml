name: escalate
description: >
  Bring a person in when governance automation reaches a state it cannot resolve on its own. The
  action files a deduplicated ticket, an issue in `planning_repo`, and sets its Status on a Projects
  v2 board. A SEV1 also posts a page to a Discord webhook. The severity picks
  the channels:

    SEV1  org inconsistent    → ticket + @mention + page
    SEV2  one repo blocked    → ticket + @mention
    SEV3  cleanup / advisory  → ticket, silent

  The same `dedup_key` firing again updates the open ticket, counts the occurrence and, for SEV1 and
  SEV2, notifies again. `state: resolve` closes every ticket carrying the key and moves the newest
  one to `resolved_status` on the board.

  A composite action cannot set `concurrency`, so two runs on one key can each file a ticket. Give
  the calling job a concurrency group keyed by the dedup_key. A resolve closes any duplicate. The
  action ignores the org kill switch, so a halt never mutes the report of stuck automation. Reserve
  SEV1 for an inconsistent org, since a page that fires for less teaches people to ignore it.

inputs:
  client_id:
    required: true
    description: >
      Client ID of a GitHub App installed on the org, with Issues write on `planning_repo` and
      organization Projects write. The default workflow token cannot reach an org's Projects v2.
  app_private_key:
    required: true
    description: Private key (PEM) of that App.
  project_id:
    required: true
    description: >
      Node id of the Projects v2 board (PVT_…). Find it with: gh project view <n> --owner <org>
      --format json.
  severity:
    required: true
    description: >
      Blast radius: sev1, sev2 or sev3, in any case, or a bare 1, 2 or 3. SEV1 pages, SEV2 mentions,
      and SEV3 files a silent ticket. Any other value fails the run, so a typo never downgrades a
      page.
  summary:
    required: true
    description: >
      One-line summary of the condition. It becomes the ticket title, prefixed with the severity,
      and the first line of the page. Newlines collapse to spaces.
  dedup_key:
    required: true
    description: >
      Stable identity of the condition, such as "stuck-hotfix-lock:service-auth". The same key
      firing again updates the open ticket, and `state: resolve` closes every ticket carrying it.
      The key sits in an HTML-comment marker in the ticket body, so it must not contain a newline
      or "-->".
  body:
    required: false
    default: ""
    description: >
      Longer Markdown detail for the ticket body, such as what happened and what to check. The
      action regenerates the body on each occurrence, so people add context in comments.
  state:
    required: false
    default: open
    description: >
      "open" (default) files or updates the ticket. "resolve" closes the matching tickets and sets
      the board Status to `resolved_status`, and does nothing when no ticket matches.
  repo:
    required: false
    default: ${{ github.repository }}
    description: The affected repository (owner/name). Defaults to the repo the workflow runs in.
  epic:
    required: false
    default: ""
    description: Epic reference for context, as a number or a URL. The ticket renders a bare number as #N.
  run_url:
    required: false
    default: ""
    description: >
      Link to the run that raised the escalation, shown in the ticket and the page. Defaults to the
      current run.
  runbook:
    required: false
    default: ""
    description: Link to the runbook section for this condition, shown in the ticket and the page.
  mention:
    required: false
    default: ""
    description: >
      GitHub mention for SEV1 and SEV2 tickets, such as "@user" or "@org/team". It reaches the
      ticket and its recurrence comments only, and the page takes `push_mention`. Empty pings
      nobody.
  push_mention:
    required: false
    default: ""
    description: >
      Discord mention for the SEV1 page: "<@&ROLE_ID>" for a role, "<@USER_ID>" for a user. Empty
      posts the page without a ping. The page allows user and role mentions only, so @everyone and
      @here never ping.
  planning_repo:
    required: false
    default: ${{ github.repository_owner }}/.github
    description: >
      Repository (owner/name) that holds the tickets. Defaults to the current org's .github
      repository.
  escalation_label:
    required: false
    default: escalation
    description: >
      Label on every escalation ticket. It scopes the dedup lookup and gives people one filter for
      open escalations. The action creates it before filing a ticket.
  board_status:
    required: false
    default: Triage
    description: >
      Board Status for an open ticket, a column where a person must act. Triage fits, since a ticket
      has no pull request and nothing else writes its Status.
  resolved_status:
    required: false
    default: Applied
    description: >
      Board Status for a resolved ticket. The default, Applied, is a terminal status. Closing an
      issue leaves its board item in place, so the action sets this Status explicitly.
  push_webhook:
    required: false
    default: ""
    description: >
      Discord channel webhook URL for the SEV1 page. Empty turns the page off, and the ticket is
      still filed. Only a SEV1 with `state: open` posts.
  dry_run:
    required: false
    default: "false"
    description: >
      When "true", "1" or "yes", in any case, log every intended issue, board and push action
      without performing it.

outputs:
  issue_number:
    description: >
      Number of the ticket filed or updated, or of the newest match on resolve. Empty when there is
      no ticket, on a resolve no-op or a dry-run filing.
    value: ${{ steps.ticket.outputs.issue_number }}
  issue_url:
    description: URL of that ticket.
    value: ${{ steps.ticket.outputs.issue_url }}
  action:
    description: What happened to the ticket, as created, updated, resolved or noop.
    value: ${{ steps.ticket.outputs.action }}
  changed:
    description: '"false" on a dry run or a resolve no-op, "true" otherwise.'
    value: ${{ steps.ticket.outputs.changed }}
  pushed:
    description: '"true" if the SEV1 page was delivered ("false" or empty otherwise).'
    value: ${{ steps.push.outputs.pushed }}

runs:
  using: composite
  steps:
    # Validate the routing inputs before a token is minted, so a bad severity, state, dedup_key or
    # planning_repo fails with nothing done. The step also picks the channels and the target board
    # Status.
    - name: Resolve inputs and routing
      id: resolve
      shell: bash
      env:
        SEVERITY: ${{ inputs.severity }}
        STATE: ${{ inputs.state }}
        SUMMARY: ${{ inputs.summary }}
        MENTION: ${{ inputs.mention }}
        PUSH_MENTION: ${{ inputs.push_mention }}
        DEDUP_KEY: ${{ inputs.dedup_key }}
        PLANNING_REPO: ${{ inputs.planning_repo }}
        RUN_URL: ${{ inputs.run_url }}
        BOARD_STATUS: ${{ inputs.board_status }}
        RESOLVED_STATUS: ${{ inputs.resolved_status }}
        PUSH_WEBHOOK: ${{ inputs.push_webhook }}
        DRY_RUN: ${{ inputs.dry_run }}
        SERVER_URL: ${{ github.server_url }}
        REPO_FULL: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
      run: |
        set -euo pipefail

        # Lowercase $1 and drop its whitespace, so " SEV1 " and "sev1" read the same.
        normalize() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]'; }

        sev=$(normalize "${SEVERITY:-}")
        case "$sev" in
          sev1 | 1) sev=sev1; sevlabel="SEV1 — org inconsistent" ;;
          sev2 | 2) sev=sev2; sevlabel="SEV2 — one repo blocked" ;;
          sev3 | 3) sev=sev3; sevlabel="SEV3 — cleanup / advisory" ;;
          *) echo "::error::severity must be sev1|sev2|sev3 (got \"${SEVERITY:-}\")"; exit 1 ;;
        esac

        st=$(normalize "${STATE:-open}")
        case "$st" in open | resolve) : ;; *) echo "::error::state must be open|resolve (got \"${STATE:-}\")"; exit 1 ;; esac

        # dry_run is normalized once, so a "True" or " true " still stays dry. Every later step reads
        # this value.
        dry=$(normalize "${DRY_RUN:-}")
        case "$dry" in true | 1 | yes) dry=true ;; *) dry=false ;; esac

        for v in SUMMARY DEDUP_KEY PLANNING_REPO; do
          if [ -z "${!v:-}" ]; then echo "::error::$v is required"; exit 1; fi
        done

        # The dedup_key sits in an HTML-comment marker (<!-- escalate:key=... -->), matched as the
        # exact first body line. A newline or a "-->" breaks the marker.
        case "$DEDUP_KEY" in
          *"-->"*) echo "::error::dedup_key must not contain the literal \"-->\""; exit 1 ;;
          *$'\n'*) echo "::error::dedup_key must not contain a newline"; exit 1 ;;
        esac

        # planning_repo splits into planning_owner and planning_name, which reach GITHUB_OUTPUT as
        # key=value lines where a newline would forge another output. The error omits the value, so a
        # newline cannot start a ::workflow-command:: line in the log either.
        case "$PLANNING_REPO" in
          *$'\n'*) echo "::error::planning_repo must not contain a newline"; exit 1 ;;
        esac
        powner=${PLANNING_REPO%%/*}
        pname=${PLANNING_REPO#*/}
        if [ -z "$powner" ] || [ -z "$pname" ] || [ "$powner" = "$PLANNING_REPO" ]; then
          echo "::error::planning_repo must be owner/name (got \"$PLANNING_REPO\")"; exit 1
        fi

        # Collapse $1's newlines to spaces. The free-text values below reach GITHUB_OUTPUT as key=value
        # lines, where a newline would end the value and forge another output such as do_push.
        # Collapsing also keeps the title on one line and keeps a ::workflow-command:: out of the log
        # lines that echo these values. The body keeps its newlines, since the ticket step reads it
        # from the input and writes it only to a --body-file.
        oneline() { printf '%s' "$1" | tr -d '\r' | tr '\n' ' '; }
        clean_summary=$(oneline "$SUMMARY")
        clean_mention=$(oneline "${MENTION:-}")
        clean_push_mention=$(oneline "${PUSH_MENTION:-}")
        run_url=$(oneline "${RUN_URL:-${SERVER_URL}/${REPO_FULL}/actions/runs/${RUN_ID}}")
        if [ "$st" = "resolve" ]; then target_status="$RESOLVED_STATUS"; else target_status="$BOARD_STATUS"; fi
        target_status=$(oneline "$target_status")

        # Only a raised SEV1 with a webhook pages, and only a raised SEV1 or SEV2 mentions.
        do_push=false
        if [ "$sev" = "sev1" ] && [ "$st" = "open" ] && [ -n "${PUSH_WEBHOOK:-}" ]; then do_push=true; fi
        do_mention=false
        if { [ "$sev" = "sev1" ] || [ "$sev" = "sev2" ]; } && [ "$st" = "open" ]; then do_mention=true; fi

        {
          echo "sev=$sev"
          echo "state=$st"
          echo "dry_run=$dry"
          echo "sevlabel=$sevlabel"
          echo "planning_owner=$powner"
          echo "planning_name=$pname"
          echo "run_url=$run_url"
          echo "do_push=$do_push"
          echo "do_mention=$do_mention"
          echo "target_status=$target_status"
          echo "clean_summary=$clean_summary"
          echo "clean_mention=$clean_mention"
          echo "clean_push_mention=$clean_push_mention"
        } >> "$GITHUB_OUTPUT"

    # A token scoped to issues:write on the planning repo alone, which bounds a leak.
    - name: Mint issues token
      id: token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.client_id }}
        private-key: ${{ inputs.app_private_key }}
        owner: ${{ steps.resolve.outputs.planning_owner }}
        repositories: ${{ steps.resolve.outputs.planning_name }}
        permission-issues: write

    # Find the ticket carrying this dedup marker, then create, update or close it. The lookup lists
    # issues, which is strongly consistent where the search index lags.
    - name: File or update the ticket
      id: ticket
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        PLANNING_REPO: ${{ inputs.planning_repo }}
        ESC_LABEL: ${{ inputs.escalation_label }}
        DEDUP_KEY: ${{ inputs.dedup_key }}
        STATE: ${{ steps.resolve.outputs.state }}
        SEV: ${{ steps.resolve.outputs.sev }}
        SEVLABEL: ${{ steps.resolve.outputs.sevlabel }}
        SUMMARY: ${{ steps.resolve.outputs.clean_summary }}
        BODY: ${{ inputs.body }}
        REPO: ${{ inputs.repo }}
        EPIC: ${{ inputs.epic }}
        RUN_URL: ${{ steps.resolve.outputs.run_url }}
        RUNBOOK: ${{ inputs.runbook }}
        MENTION: ${{ steps.resolve.outputs.clean_mention }}
        DO_MENTION: ${{ steps.resolve.outputs.do_mention }}
        TARGET_STATUS: ${{ steps.resolve.outputs.target_status }}
        DRY_RUN: ${{ steps.resolve.outputs.dry_run }}
      run: |
        set -euo pipefail

        marker="<!-- escalate:key=${DEDUP_KEY} -->"
        now=$(date -u +%Y-%m-%dT%H:%M:%SZ)

        # A bare Epic number links as #N, and any other reference passes through.
        case "${EPIC:-}" in
          "") epic_render="" ;;
          *[!0-9]*) epic_render="$EPIC" ;;
          *) epic_render="#$EPIC" ;;
        esac

        # Regenerate the whole body. The dedup marker must be the first line, so a marker pasted into
        # prose never matches. Hidden markers carry the first-seen time and the count to the next
        # occurrence.
        render_body() { # $1 = first-seen ISO, $2 = occurrence count
          local first="$1" count="$2"
          {
            printf '%s\n' "$marker"
            printf '<!-- escalate:first=%s -->\n' "$first"
            printf '<!-- escalate:count=%s -->\n\n' "$count"
            printf '**Severity:** %s\n\n' "$SEVLABEL"
            printf '**Repo:** `%s`\n\n' "$REPO"
            [ -n "$epic_render" ] && printf '**Epic:** %s\n\n' "$epic_render"
            printf '**First seen:** %s · **Last seen:** %s · **Occurrences:** %s\n\n' "$first" "$now" "$count"
            printf '%s\n' "$SUMMARY"
            [ -n "${BODY:-}" ] && printf '\n%s\n' "$BODY"
            printf '\n---\n\n'
            [ -n "${RUN_URL:-}" ] && printf '**Run:** %s\n\n' "$RUN_URL"
            [ -n "${RUNBOOK:-}" ] && printf '**Runbook:** %s\n\n' "$RUNBOOK"
            printf '_Filed by the `escalate` action. This body is bot-owned and regenerated on each occurrence — add context in a comment, not inline._\n'
            if [ "$DO_MENTION" = "true" ] && [ -n "${MENTION:-}" ]; then printf '\ncc %s\n' "$MENTION"; fi
          } > "$RUNNER_TEMP/esc_body.md"
        }

        # The marker matches as the exact first body line, ignoring the CRLF GitHub stores bodies
        # with. The open path takes the first match and the resolve path takes them all.
        pred='.[] | select(((.body // "") | split("\n")[0] | rtrimstr("\r")) == $m)'

        # A failed list read fails the step, since an empty list files a duplicate ticket or reports
        # nothing to resolve. `open` lists open tickets only, because a closed one is resolved.
        # `resolve` lists all, so a closed ticket whose board write failed gets its Status again.
        list_state=open
        [ "$STATE" = "resolve" ] && list_state=all
        if ! existing_json=$(gh issue list --repo "$PLANNING_REPO" --label "$ESC_LABEL" \
          --state "$list_state" --json id,number,url,body,state --limit 200 2>"$RUNNER_TEMP/list.err"); then
          echo "::error::could not list escalations in $PLANNING_REPO ($(tr '\n' ' ' < "$RUNNER_TEMP/list.err")) — failing rather than risk a duplicate ticket or a false resolve."
          exit 1
        fi

        emit() { # $1 action $2 changed $3 number $4 node $5 url
          {
            echo "action=$1"; echo "changed=$2"
            echo "issue_number=$3"; echo "issue_node_id=$4"; echo "issue_url=$5"
          } >> "$GITHUB_OUTPUT"
        }

        # ---- resolve: close every ticket carrying the key, duplicates from a create race included.
        #      The board step moves the first, the newest, to the resolved Status. ----
        if [ "$STATE" = "resolve" ]; then
          matches=$(printf '%s' "$existing_json" | jq -r --arg m "$marker" "$pred | [.number, .url, .state, .id] | @tsv")
          if [ -z "$matches" ]; then
            echo "Nothing to resolve — no escalation for key \"$DEDUP_KEY\"." | tee -a "$GITHUB_STEP_SUMMARY"
            emit noop false "" "" ""; exit 0
          fi
          n=$(printf '%s\n' "$matches" | grep -c '' || true)
          [ "$n" -gt 1 ] && echo "::warning::$n tickets share dedup_key \"$DEDUP_KEY\" (a create race) — resolving all; set a caller concurrency group to prevent it."
          first_num=""; first_url=""; first_node=""
          while IFS=$'\t' read -r num url istate node; do
            if [ "$DRY_RUN" = "true" ]; then
              echo "[dry-run] would close #$num (state=$istate) and drive board Status → \"$TARGET_STATUS\"." | tee -a "$GITHUB_STEP_SUMMARY"
            elif [ "$istate" = "OPEN" ]; then
              gh issue close "$num" --repo "$PLANNING_REPO" --reason completed \
                --comment "Resolved — the escalated condition cleared. See ${RUN_URL}." >/dev/null
              echo "Resolved (closed) #$num." | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "#$num already closed — re-driving its board Status." | tee -a "$GITHUB_STEP_SUMMARY"
            fi
            if [ -z "$first_num" ]; then first_num="$num"; first_url="$url"; first_node="$node"; fi
          done <<< "$matches"
          emit resolved "$([ "$DRY_RUN" = "true" ] && echo false || echo true)" "$first_num" "$first_node" "$first_url"
          exit 0
        fi

        # ---- open: create a new ticket, or update the existing one ----
        match=$(printf '%s' "$existing_json" | jq -c --arg m "$marker" "$pred" | head -1)

        if [ -z "$match" ]; then
          render_body "$now" 1
          title="[$(printf '%s' "$SEV" | tr '[:lower:]' '[:upper:]')] $SUMMARY"
          title=$(printf '%s' "$title" | cut -c1-200)
          if [ "$DRY_RUN" = "true" ]; then
            echo "[dry-run] would FILE \"$title\" in $PLANNING_REPO (label $ESC_LABEL) and drive board Status → \"$TARGET_STATUS\"." | tee -a "$GITHUB_STEP_SUMMARY"
            emit created false "" "" ""; exit 0
          fi
          # Create the label first, so `--label` cannot fail on a repository that lacks it.
          gh label create "$ESC_LABEL" --repo "$PLANNING_REPO" --force \
            --color B60205 --description "Automated governance escalation (escalate action)." >/dev/null 2>&1 || true
          url=$(gh issue create --repo "$PLANNING_REPO" --title "$title" \
            --body-file "$RUNNER_TEMP/esc_body.md" --label "$ESC_LABEL")
          num=$(printf '%s' "$url" | grep -oE '[0-9]+$')
          node=$(gh issue view "$num" --repo "$PLANNING_REPO" --json id -q .id)
          echo "Filed escalation #$num ($url)." | tee -a "$GITHUB_STEP_SUMMARY"
          emit created true "$num" "$node" "$url"
          exit 0
        fi

        num=$(printf '%s' "$match" | jq -r '.number')
        url=$(printf '%s' "$match" | jq -r '.url')
        node=$(printf '%s' "$match" | jq -r '.id')
        ebody=$(printf '%s' "$match" | jq -r '.body // ""')
        # Both parses carry a fallback. A grep that matches nothing returns non-zero, and `set -e`
        # then aborts the step before the default below applies.
        first=$(printf '%s' "$ebody" | grep -oE 'escalate:first=[^ ]+' | head -1 | sed 's/.*escalate:first=//') || first=""
        [ -n "$first" ] || first="$now"
        count=$(printf '%s' "$ebody" | grep -oE 'escalate:count=[0-9]+' | head -1 | grep -oE '[0-9]+' || echo 0)
        # 10# forces base 10, so a hand-edited count such as 08 does not fail as bad octal.
        count=$((10#$count + 1))
        render_body "$first" "$count"

        if [ "$DRY_RUN" = "true" ]; then
          note="[dry-run] would UPDATE #$num (occurrence $count) and drive board Status → \"$TARGET_STATUS\""
          [ "$DO_MENTION" = "true" ] && note="$note; re-notify ${MENTION:-<no mention set>}"
          echo "$note." | tee -a "$GITHUB_STEP_SUMMARY"
          emit updated false "$num" "$node" "$url"
          exit 0
        fi

        gh issue edit "$num" --repo "$PLANNING_REPO" --body-file "$RUNNER_TEMP/esc_body.md" >/dev/null
        # Editing the body notifies nobody, so SEV1 and SEV2 notify again with a comment. SEV3 stays a
        # body edit.
        if [ "$DO_MENTION" = "true" ]; then
          gh issue comment "$num" --repo "$PLANNING_REPO" \
            --body "🔁 Recurred (occurrence ${count}) — ${RUN_URL}.${MENTION:+ cc ${MENTION}}" >/dev/null
        fi
        echo "Updated escalation #$num (occurrence $count)." | tee -a "$GITHUB_STEP_SUMMARY"
        emit updated true "$num" "$node" "$url"

    # The SEV1 page is the most critical output, so it runs before the board write, and `always()`
    # runs it even when the token or ticket step failed. A failed `resolve` step leaves do_push
    # unset, so an invalid input never pages. A failed page fails the run.
    - name: SEV1 push
      id: push
      if: ${{ always() && steps.resolve.outputs.do_push == 'true' }}
      shell: bash
      env:
        PUSH_WEBHOOK: ${{ inputs.push_webhook }}
        SUMMARY: ${{ steps.resolve.outputs.clean_summary }}
        REPO: ${{ inputs.repo }}
        EPIC: ${{ inputs.epic }}
        RUN_URL: ${{ steps.resolve.outputs.run_url }}
        RUNBOOK: ${{ inputs.runbook }}
        PUSH_MENTION: ${{ steps.resolve.outputs.clean_push_mention }}
        ISSUE_URL: ${{ steps.ticket.outputs.issue_url }}
        DRY_RUN: ${{ steps.resolve.outputs.dry_run }}
      run: |
        set -euo pipefail

        content="🚨 **[SEV1] ${SUMMARY}**"
        content="${content}"$'\n'"repo: ${REPO}"
        [ -n "${EPIC:-}" ] && content="${content} · epic: ${EPIC}"
        [ -n "${RUN_URL:-}" ] && content="${content}"$'\n'"run: ${RUN_URL}"
        [ -n "${RUNBOOK:-}" ] && content="${content}"$'\n'"runbook: ${RUNBOOK}"
        [ -n "${ISSUE_URL:-}" ] && content="${content}"$'\n'"ticket: ${ISSUE_URL}"
        [ -n "${PUSH_MENTION:-}" ] && content="${content}"$'\n'"cc ${PUSH_MENTION}"
        # Discord's `content` caps at 2000 characters, and head -c cuts the whole message to 1900
        # bytes, well under that limit. `iconv -c` then drops a
        # multibyte character the cut split, since Discord answers 400 to invalid UTF-8.
        content=$(printf '%s' "$content" | head -c 1900)
        content=$(printf '%s' "$content" | iconv -f UTF-8 -t UTF-8 -c 2>/dev/null) || true

        # jq builds the JSON, so the message can hold any character. allowed_mentions limits pings to
        # users and roles, so an @everyone or @here in `push_mention` cannot ping the channel.
        payload=$(jq -n --arg c "$content" '{content: $c, allowed_mentions: {parse: ["users", "roles"]}}')

        if [ "$DRY_RUN" = "true" ]; then
          {
            echo "[dry-run] would POST a SEV1 page to the push webhook:"
            printf '%s\n' "$content"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # A composite step cannot set timeout-minutes, so curl carries its own timeouts against a
        # webhook that never answers. Discord answers 204 on success, 429 when rate limited and 5xx
        # transiently. curl runs without --fail, so the loop reads each code and retries.
        max=3
        for attempt in $(seq 1 "$max"); do
          # curl prints "000" through -w on a transport failure and exits non-zero. The fallback sits
          # outside the substitution, so it only stops `set -e` and the code stays three digits.
          code=$(curl -sS --connect-timeout 5 --max-time 15 \
            -o "$RUNNER_TEMP/esc_push_resp" -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' --data "$payload" "$PUSH_WEBHOOK") || code=000
          if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
            echo "SEV1 page delivered (HTTP $code)." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::warning::SEV1 push attempt $attempt/$max failed (HTTP $code)."
          [ "$attempt" -lt "$max" ] && sleep "$((attempt * attempt * 2))"
        done

        echo "::error::SEV1 push FAILED after $max attempts (last HTTP $code). The loud page did not deliver — treat this as an escalation-channel outage and check the webhook."
        echo "pushed=false" >> "$GITHUB_OUTPUT"
        exit 1

    # Every severity gets a board card. `always()` sets a filed ticket's Status even when the SEV1
    # page failed. No kill_switch is passed, so board-write's empty default keeps escalation running
    # through an org-wide halt.
    - name: Drive the ticket's board Status
      id: board
      if: ${{ always() && steps.ticket.outputs.issue_node_id != '' }}
      uses: a-novel-kit/workflows/generic-actions/board-write@v1.66.1
      with:
        client_id: ${{ inputs.client_id }}
        app_private_key: ${{ inputs.app_private_key }}
        project_id: ${{ inputs.project_id }}
        content_id: ${{ steps.ticket.outputs.issue_node_id }}
        field: Status
        value: ${{ steps.resolve.outputs.target_status }}
        add_if_missing: "true"
        dry_run: ${{ steps.resolve.outputs.dry_run }}
