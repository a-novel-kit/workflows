name: revoke-labels
description: >
  Remove a pull request's head-bound labels after a push. Each privileged label approves the head it
  was added on, so a push makes it stale and a reviewer adds it again for the new head. A label the
  pull request does not carry, or that an earlier run already removed, is skipped.

inputs:
  github_token:
    required: false
    default: ${{ github.token }}
    description: Token with pull requests write on the calling repository.
  labels:
    required: false
    default: ""
    description: >
      Labels to remove, separated by newlines or commas. Empty removes every label of the fleet's
      privileged list, `generic-actions/privileged-labels.txt`, which review-gate also reads.
  pull_request_number:
    required: false
    default: ${{ github.event.pull_request.number }}
    description: Pull request to clean. Defaults to the triggering one.

runs:
  using: composite
  steps:
    - name: Remove the labels a push made stale
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        LABELS: ${{ inputs.labels }}
        PR: ${{ inputs.pull_request_number }}
        CARRIED: ${{ toJSON(github.event.pull_request.labels.*.name) }}
      run: |
        set -euo pipefail
        wanted=${LABELS:-$(cat "$GITHUB_ACTION_PATH/../privileged-labels.txt")}
        # The event lists the labels the pull request carried when the push landed, so only those cost
        # a call.
        while IFS= read -r label; do
          if ! err=$(gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/$(jq -rn --arg l "$label" '$l | @uri')" --silent 2>&1); then
            # The run for an earlier push may have removed it first.
            [[ $err == *"HTTP 404"* ]] || { printf '::error::%s\n' "$err"; exit 1; }
          fi
          echo "Removed \`$label\`." >>"$GITHUB_STEP_SUMMARY"
        done < <(tr ',' '\n' <<<"$wanted" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//; /^#/d; /^$/d' |
          grep -xF -f <(jq -r '.[]' <<<"$CARRIED") || true)
