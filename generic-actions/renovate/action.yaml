name: self-hosted renovate
description: Run a self-hosted Renovate pass against the repository, authenticated as the bot.

inputs:
  repository_config:
    required: false
    default: "false"
    description: Use the repository's class preset as the only source of update policy.
  allowed_commands:
    required: false
    description: Specify allowed commands for renovate post update actions.
  github_token:
    required: true
    description: The GitHub token to use for the action.
  app_private_key:
    required: true
    description: The GitHub App private key.
  client_id:
    required: false
    description: GitHub App client id (recommended).

runs:
  using: "composite"
  steps:
    # Renovate reads the repository through the API and its config from this action's folder, so
    # the run needs the bot token and no checkout.
    - uses: actions/create-github-app-token@v3
      id: app_token
      with:
        client-id: ${{ inputs.client_id }}
        private-key: ${{ inputs.app_private_key }}
    - name: self-hosted renovate
      uses: renovatebot/github-action@v46.3.6
      with:
        token: ${{ steps.app_token.outputs.token }}
        configurationFile: ${{ github.action_path }}/config.json
        docker-network: ${{ job.container.network }}
      env:
        # Empty overrides preserve the JSON defaults for callers that have not migrated.
        RENOVATE_GLOBAL_EXTENDS: ${{ inputs.repository_config == 'true' && '[]' || '' }}
        RENOVATE_ALLOWED_COMMANDS: ${{ inputs.allowed_commands }}
        RENOVATE_REPOSITORIES: "['${{ github.repository }}']"
        RENOVATE_SECRETS: '{"GITHUB_TOKEN": "${{ inputs.github_token }}"}'
        RENOVATE_NPM_NPM_PKG_GITHUB_COM_TOKEN: ${{ inputs.github_token }}
        LOG_LEVEL: debug
