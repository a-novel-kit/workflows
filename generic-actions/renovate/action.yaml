name: self-hosted renovate
description: Run a self-hosted Renovate pass over the calling repository as a GitHub App.

inputs:
  repository_config:
    required: false
    default: "false"
    description: >
      When "true", drop the workflows base preset this action extends globally, so the repository's
      class preset is the only source of update policy.
  allowed_commands:
    required: false
    description: >
      Regular expressions of the post-upgrade commands Renovate may run. Empty keeps the action's
      default, which allows pnpm install, format and dedupe.
  github_token:
    required: true
    description: >
      Token that reads GitHub Packages. Renovate authenticates to npm.pkg.github.com with it and
      passes it to the commands it runs as GITHUB_TOKEN.
  app_private_key:
    required: true
    description: Private key of the GitHub App that Renovate runs as.
  client_id:
    required: true
    description: Client ID of that App.

runs:
  using: "composite"
  steps:
    # Renovate reads the repository through the API and its config from this action's folder, so
    # the run needs the bot token and no checkout. The token asks for exactly what Renovate uses: it
    # pushes branches, edits workflows, opens pull requests and the dependency dashboard, sets its
    # stability status, and reads check results and Dependabot alerts.
    - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      id: app_token
      with:
        client-id: ${{ inputs.client_id }}
        private-key: ${{ inputs.app_private_key }}
        permission-checks: read
        permission-contents: write
        permission-issues: write
        permission-pull-requests: write
        permission-statuses: write
        permission-vulnerability-alerts: read
        permission-workflows: write
    - name: self-hosted renovate
      uses: renovatebot/github-action@2804199d260ad00c1fae0e9e842888369391c776 # v46.3.10
      with:
        token: ${{ steps.app_token.outputs.token }}
        configurationFile: ${{ github.action_path }}/config.json
        docker-network: ${{ job.container.network }}
      env:
        # An empty variable leaves the matching config.json setting in force.
        RENOVATE_GLOBAL_EXTENDS: ${{ inputs.repository_config == 'true' && '[]' || '' }}
        RENOVATE_ALLOWED_COMMANDS: ${{ inputs.allowed_commands }}
        RENOVATE_REPOSITORIES: "['${{ github.repository }}']"
        RENOVATE_SECRETS: '{"GITHUB_TOKEN": "${{ inputs.github_token }}"}'
        RENOVATE_NPM_NPM_PKG_GITHUB_COM_TOKEN: ${{ inputs.github_token }}
        LOG_LEVEL: debug
