name: classify bot change
description: >
  Decide whether a dependency bot's pull request may merge without a person, for a repository whose
  merges reach production. "pin" means it changes nothing but release pins (ghcr.io/a-novel images
  in terraform.tfvars, and Dockerfile FROM lines taking a digest the same pull request pins there);
  "renovate" means Renovate first put it on auto-merge, auto-merge is still on,
  and every changed line only moves a dependency reference's version, or a digest together with its
  version, apart from checksum files; "review" means a person approves it. A digest that moves
  without its version is a moved tag and always needs review. The classified diff is that of the
  exact commit the caller approves.

inputs:
  github_token:
    required: true
    description: Token that reads the pull request's files and auto-merge state.
  pull_request:
    required: true
    description: URL of the pull request to classify.
  head_sha:
    required: true
    description: >
      Commit the caller approves. Its own diff against the base is classified, so the approval and
      the classification name the same commit whatever the branch does meanwhile.
  bot:
    required: true
    description: Login of the dependency bot, whose own auto-merge marks an update Renovate chose to merge.

outputs:
  decision:
    description: '"pin", "renovate" or "review".'
    value: ${{ steps.classify.outputs.decision }}
  reason:
    description: One line explaining the decision.
    value: ${{ steps.classify.outputs.reason }}

runs:
  using: composite
  steps:
    - name: Classify the change
      id: classify
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        REPOSITORY: ${{ github.repository }}
        PULL_REQUEST: ${{ inputs.pull_request }}
        HEAD_SHA: ${{ inputs.head_sha }}
        BOT: ${{ inputs.bot }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        node "$ACTION_PATH/classify.mjs"
