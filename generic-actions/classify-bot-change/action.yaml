name: classify bot change
description: >
  Decide whether a dependency bot's pull request may merge without a person, for a repository whose
  merges reach production. The classified diff is that of the exact commit the caller approves.

  The decision is "pin" when the pull request changes nothing but release pins: ghcr.io/a-novel
  images in terraform.tfvars, and Dockerfile FROM lines taking a digest the same pull request pins
  there. It is "renovate" when the bot first enabled auto-merge, auto-merge is still on, and every
  changed line outside checksum files moves only a dependency reference's version, or a digest
  together with its version. It is "ranges" when the pull request changes only a
  google-service-ranges.json file, to exactly the list the google-service-ranges action computes from
  Google's files now. Anything else is "review", for a person to approve. A digest that moves without
  its version marks a moved tag, so it always needs review.

inputs:
  github_token:
    required: true
    description: Token that reads the pull request, its diff and its auto-merge history.
  pull_request:
    required: true
    description: URL or number of a pull request in the calling repository.
  head_sha:
    required: true
    description: >
      Commit the caller approves. Its own diff against the base is classified, so the approval and
      the classification name the same commit whatever the branch does meanwhile.
  bot:
    required: true
    description: >
      Login of the dependency bot. Auto-merge that the bot enabled first marks an update Renovate
      chose to merge.

outputs:
  decision:
    description: '"pin", "renovate", "ranges" or "review".'
    value: ${{ steps.classify.outputs.decision }}
  reason:
    description: One line explaining the decision.
    value: ${{ steps.classify.outputs.reason }}

runs:
  using: composite
  steps:
    - name: Classify the change
      id: classify
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        REPOSITORY: ${{ github.repository }}
        PULL_REQUEST: ${{ inputs.pull_request }}
        HEAD_SHA: ${{ inputs.head_sha }}
        BOT: ${{ inputs.bot }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        node "$ACTION_PATH/classify.mjs"
