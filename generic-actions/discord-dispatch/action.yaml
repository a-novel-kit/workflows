name: discord-dispatch
description: >
  Deprecated, use generic-actions/chat-dispatch, which this action runs with the same inputs. The
  next major removes it.

inputs:
  posts:
    required: true
    description: Forwarded to chat-dispatch.
  channel:
    required: true
    description: Forwarded to chat-dispatch.
  client_id:
    required: true
    description: Forwarded to chat-dispatch.
  app_private_key:
    required: true
    description: Forwarded to chat-dispatch.
  dry_run:
    required: false
    default: "false"
    description: Forwarded to chat-dispatch.

runs:
  using: composite
  steps:
    - name: Warn that discord-dispatch is deprecated
      shell: bash
      run: |
        echo "::warning::generic-actions/discord-dispatch is deprecated, and the next major removes it. Call generic-actions/chat-dispatch, which takes the same inputs."
    - uses: a-novel-kit/workflows/generic-actions/chat-dispatch@v1.85.0
      with:
        posts: ${{ inputs.posts }}
        channel: ${{ inputs.channel }}
        client_id: ${{ inputs.client_id }}
        app_private_key: ${{ inputs.app_private_key }}
        dry_run: ${{ inputs.dry_run }}
