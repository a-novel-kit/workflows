name: codecov
description: >
  Check out the repository, download coverage artifacts and upload their reports to Codecov. A failed
  upload fails the step.

inputs:
  coverage_artifact:
    required: false
    description: Name of the artifact that holds the coverage reports.
  coverage_artifact_ids:
    required: false
    description: Comma-separated IDs of the artifacts to download.
  coverage_files:
    required: false
    description: Coverage report files to upload. Empty lets Codecov search the workspace.
  codecov_token:
    required: true
    description: Codecov upload token of the repository.

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.coverage_artifact }}
        artifact-ids: ${{ inputs.coverage_artifact_ids }}
    - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      env:
        CODECOV_TOKEN: ${{ inputs.codecov_token }}
      with:
        fail_ci_if_error: true
        files: ${{ inputs.coverage_files }}
