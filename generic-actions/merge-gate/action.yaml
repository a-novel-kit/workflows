name: merge-gate
description: >
  Post the `merge-gate` check run, the required "may this pull request merge?" status, on a pull
  request head or a merge-queue group head. The App given by `client_id` posts it, so a ruleset can
  require the check from that App.

  A pull request belongs to Epic N when it carries the `epic:<N>` label. Applying a label needs
  triage access, so the label is a permission-gated claim. A `Closes` keyword is author-controlled,
  and the gate uses it only to suggest the label. A pull request without an `epic:<N>` label is
  standalone and passes. On a pull_request event its labels come from the payload, so an ordinary
  pull request passes without an API read. An Epic member passes only when every member of its set,
  resolved through epic-membership, is non-draft, approved and passing `review-gate`. The set's
  cross-repo pull requests therefore land together.

  A hold posts `conclusion: failure`, because a required check passes on `neutral` or `skipped`.
  The gate holds whenever readiness is uncertain, such as after a failed member resolve or while the
  label index lags, and a later run re-evaluates the pull request. The `automation:paused` label on
  an Epic issue holds that Epic's members, and a failed read of that label lets readiness decide. On
  a merge group, the gate re-evaluates the queued pull request's Epic and dequeues the group when a
  member has regressed since enqueue.

  The gate is the only writer of the activation snapshot, a marker in the Epic body that freezes the
  member set. It freezes the set once the Epic has held merge-ready for two minutes, and replaces the
  marker with a `retired` tombstone once the wave has merged or been rolled back. A pull request
  labeled after the freeze waits for the next wave, and its held run is what retires the finished
  one. Snapshot writes are best-effort and never change the posted check.

inputs:
  client_id:
    required: true
    description: >
      Client ID of the GitHub App that posts the check, installed on the organization with write
      access to checks and issues and read access to pull requests. Issue writes stay within
      `planning_repo`, for the activation snapshot. Only `review-gate` runs this App posted count
      toward readiness.
  app_private_key:
    required: true
    description: Private key (PEM) of that App.
  repo:
    required: false
    default: ${{ github.event.repository.name }}
    description: >
      Repository of the pull request to gate, as a bare name in the workflow's organization.
      Defaults to the triggering repository.
  pull_request_number:
    required: false
    default: ${{ github.event.pull_request.number }}
    description: Number of the pull request to gate. Defaults to the triggering pull request.
  head_sha:
    required: false
    default: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
    description: >
      Commit to post the check on. Defaults to the head of the triggering pull request or merge
      group. The gate fails without one.
  merge_group_head_ref:
    required: false
    default: ${{ github.event.merge_group.head_ref }}
    description: >
      Head ref of the merge-queue group to gate, such as `refs/heads/gh-readonly-queue/master/pr-7-<sha>`.
      The gate reads the queued pull request's number from its `pr-<N>` segment. Defaults to the
      triggering merge group, and a run relayed through `workflow_run` passes it explicitly. Empty off
      the queue.
  planning_repo:
    required: false
    default: .github
    description: >
      Repository that holds the Epic issues, as a bare name in the workflow's organization. The gate
      reads each Epic's labels and writes its activation snapshot there. Defaults to the
      organization's `.github` repository.
  kill_switch:
    required: false
    default: ""
    description: >
      Organization-wide halt. The gate runs only when the value, lowercased with whitespace removed,
      is empty, `0`, `off`, `false`, `no` or `disabled`. Any other value halts, so a mistyped value
      halts too. A halted gate posts a `failure` hold on every pull request and merge group, before
      any label or membership read. A composite action cannot read the `vars` context, so the caller
      passes the switch in as an input. Engaging the switch leaves posted checks alone. A pull request
      that already passed can still merge through auto-merge until the next run on it posts the hold.
  snapshot_dry_run:
    required: false
    default: "false"
    description: >
      When "true", log the snapshot decision and its payload, and leave the Epic issue untouched. The
      dry run mints a read-only token for the snapshot step, and it skips every Epic issue write,
      the `rolled-back` label cleanup included. The `merge-gate` check is posted either way, because
      it is required. The default writes, because without a snapshot an Epic keeps live label
      membership.

runs:
  using: composite
  steps:
    # The token spans the organization. The check posts to whichever repository `repo` names, and
    # the pause label and the `Closes` hint's parent Epic live in the planning repo. epic-membership
    # mints its own token.
    - name: Mint token
      id: token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.client_id }}
        private-key: ${{ inputs.app_private_key }}
        owner: ${{ github.repository_owner }}
        permission-checks: write
        permission-issues: read
        permission-pull-requests: read

    # Post the verdict for every case that needs no member set: the halt, a misconfigured caller, a
    # paused Epic, unreadable labels and a standalone pull request. An Epic member emits its Epic
    # number for the resolve and evaluate steps instead.
    - name: Classify PR (standalone vs Epic member)
      id: discover
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        REPO_FULL: ${{ github.repository_owner }}/${{ inputs.repo }}
        OWNER: ${{ github.repository_owner }}
        REPO: ${{ inputs.repo }}
        PLANNING_REPO: ${{ inputs.planning_repo }}
        KILL_SWITCH: ${{ inputs.kill_switch }}
        HEAD_SHA: ${{ inputs.head_sha }}
        PR_NUMBER: ${{ inputs.pull_request_number }}
        IN_QUEUE: ${{ inputs.merge_group_head_ref }}
        MG_HEAD_REF: ${{ inputs.merge_group_head_ref }}
        # The triggering pull request's labels from the event payload. A run without a pull_request
        # payload, such as a merge group or a dispatch, leaves them empty.
        EVENT_PR: ${{ github.event.pull_request.number }}
        EVENT_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
      run: |
        set -euo pipefail

        # Every verdict posts on HEAD_SHA, the commit the ruleset evaluates.
        if [ -z "${HEAD_SHA:-}" ]; then
          echo "::error::merge-gate must run on a pull_request or merge_group event (no head SHA)."
          exit 1
        fi

        # Post the check run as the App. jq builds the payload, so a summary with quotes or newlines
        # stays valid JSON.
        post_check() { # $1=conclusion  $2=summary
          jq -n --arg sha "$HEAD_SHA" --arg concl "$1" --arg summary "$2" \
            '{name: "merge-gate", head_sha: $sha, status: "completed", conclusion: $concl,
              output: {title: "merge-gate", summary: $summary}}' \
            | gh api "repos/${REPO_FULL}/check-runs" --method POST --input - >/dev/null
          echo "merge-gate=$1 @ ${HEAD_SHA:0:12} — $2" | tee -a "$GITHUB_STEP_SUMMARY"
        }

        # An empty epic_number means this step posted the verdict. A number hands the Epic to the
        # resolve and evaluate steps.
        emit() { echo "epic_number=$1" >> "$GITHUB_OUTPUT"; }

        # ---- Organization-wide halt, read before any membership work ------------------------
        # The switch fails toward halting, so only an explicit off-token runs the gate. The halt
        # precedes every other verdict, so it holds every pull request and dequeues every merge group.
        case "$(printf '%s' "${KILL_SWITCH:-}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')" in
          "" | 0 | off | false | no | disabled) : ;;  # explicit off-token / unset → running
          *)
            post_check failure "Automation halted org-wide by AGENT_KILL_SWITCH — holding this PR. Lift the org kill-switch (set it to an explicit off-token, e.g. \"off\", or unset it) to resume; the next event or reconcile sweep re-evaluates."
            emit ""
            exit 0
            ;;
        esac

        # planning_repo becomes an API path component in the pause read below, so it must be a bare
        # repository name. An owner slash, whitespace or an injected path redirects the request. The
        # check follows the halt, so the halt wins even on a malformed value.
        if ! [[ "${PLANNING_REPO:-}" =~ ^[A-Za-z0-9._-]+$ ]]; then
          echo "::error::planning_repo must be a bare repository name (no owner/slash), got \"${PLANNING_REPO:-}\""
          exit 1
        fi

        # Whether Epic $1 carries the `automation:paused` label in the planning repo. Applying a label
        # needs triage access, so the pause is permission-gated. Returns 0 when paused, 1 when not, and
        # 2 on a read error. The caller treats a read error as not paused, because the pause is an
        # operator convenience and readiness still gates.
        epic_paused() { # $1 = epic number
          local out
          out=$(gh api "repos/${OWNER}/${PLANNING_REPO}/issues/$1" --jq '.labels[].name' 2>/dev/null) || return 2
          printf '%s\n' "$out" | grep -qx 'automation:paused'
        }

        # Read a pull request's labels and its `Closes` parent in one query, retrying transient
        # GraphQL errors. Prints the response JSON, or prints nothing and returns 1, and the caller
        # chooses between holding and passing. A null `pullRequest` also counts as a failure, which
        # lets the caller post its hold.
        fetch_pr() { # $1=pr number
          local q data
          q='query($owner:String!,$repo:String!,$num:Int!){ repository(owner:$owner,name:$repo){
               pullRequest(number:$num){
                 labels(first:100){ nodes{ name } pageInfo{ hasNextPage } }
                 closingIssuesReferences(first:5){ nodes{ parent{ number } } } } } }'
          for attempt in 1 2 3; do
            if data=$(gh api graphql -f query="$q" -F owner="$OWNER" -F repo="$REPO" -F num="$1" 2>/dev/null) \
              && echo "$data" | jq -e 'has("data") and (has("errors") | not) and (.data.repository.pullRequest != null)' >/dev/null 2>&1; then
              printf '%s' "$data"
              return 0
            fi
            [ "$attempt" -lt 3 ] && sleep 2
          done
          return 1
        }

        # A head SHA with neither a pull request nor a merge group means a misconfigured caller. The
        # gate holds, since any success on that commit satisfies the ruleset.
        if [ -z "${IN_QUEUE:-}" ] && [ -z "${PR_NUMBER:-}" ]; then
          post_check failure "No pull_request_number for ${HEAD_SHA:0:12} and not a merge_group event — refusing to pass a required check without evaluating a PR."
          emit ""
          exit 0
        fi

        # Identify the pull request to classify. A merge group names one queued pull request in its
        # ref (refs/heads/gh-readonly-queue/<base>/pr-<N>-<sha>), and the gate evaluates that pull
        # request's Epic. Off the queue it is the pull_request_number input.
        if [ -n "${IN_QUEUE:-}" ]; then
          classify_pr=$(printf '%s' "${MG_HEAD_REF:-}" | grep -oE 'pr-[0-9]+' | head -n1 | grep -oE '[0-9]+' || true)
          if [ -z "$classify_pr" ]; then
            # The group ref names no pull request, so the gate holds. A failing required check
            # dequeues the group, and the pull request returns to the pool to re-enqueue.
            post_check failure "merge_group head_ref \"${MG_HEAD_REF:-}\" — couldn't identify the queued PR to re-check its Epic; holding (dequeues) rather than passing blind."
            emit ""
            exit 0
          fi
        else
          classify_pr="$PR_NUMBER"
        fi

        # Read the labels, which decide membership, and the `Closes` parent, which only hints. A
        # pull_request event carries the labels in its payload, so that path makes no API read and a
        # GraphQL outage cannot hold it. Other runs read the labels through the API, and a read that
        # cannot complete holds.
        labels=""
        parent=""
        labels_truncated=false
        if [ -n "${EVENT_PR:-}" ] && [ "$classify_pr" = "${EVENT_PR}" ]; then
          labels=$(printf '%s' "${EVENT_LABELS:-[]}")
        else
          if data=$(fetch_pr "$classify_pr"); then
            labels=$(printf '%s' "$data" | jq -c '[.data.repository.pullRequest.labels.nodes[].name]')
            labels_truncated=$(printf '%s' "$data" | jq -r '.data.repository.pullRequest.labels.pageInfo.hasNextPage')
            parent=$(printf '%s' "$data" | jq -r '.data.repository.pullRequest.closingIssuesReferences.nodes[0].parent.number // empty')
          else
            post_check failure "Couldn't read PR #${classify_pr}'s labels (GraphQL error after retries) — holding rather than passing a required check blind; the reconcile sweep re-checks."
            emit ""
            exit 0
          fi
        fi

        # The first `epic:<N>` label wins, since a pull request belongs to one Epic by convention.
        # Matching digits only keeps the value safe for the later steps.
        epic=$(printf '%s' "$labels" | jq -r 'map(select(test("^epic:[0-9]+$")))[0] // empty' | grep -oE '[0-9]+' || true)

        # The API read stops at 100 labels. A truncated page without `epic:<N>` does not prove the pull
        # request standalone, so the gate holds. The payload path reads the full label set.
        if [ -z "$epic" ] && [ "$labels_truncated" = "true" ]; then
          post_check failure "PR #${classify_pr} has >100 labels; couldn't confirm it carries no \`epic:<N>\` label — holding rather than passing as standalone."
          emit ""
          exit 0
        fi

        if [ -n "$epic" ]; then
          # `automation:paused` on the Epic issue holds its members and leaves other Epics moving. The
          # pause is read first, so a paused Epic never resolves its set.
          ps=0; epic_paused "$epic" || ps=$?
          if [ "$ps" -eq 0 ]; then
            post_check failure "Epic #${epic} is automation:paused — holding its members. Remove the \`automation:paused\` label from Epic #${epic} to resume atomic landing."
            emit ""
            exit 0
          fi
          [ "$ps" -eq 2 ] && echo "::warning::couldn't read Epic #${epic} pause state (planning-repo read failed) — proceeding with normal readiness evaluation."
          echo "PR #${classify_pr} carries \`epic:${epic}\` — resolving the authorized member set." | tee -a "$GITHUB_STEP_SUMMARY"
          emit "$epic"
          exit 0
        fi

        # No `epic:<N>` label means standalone, which passes. When the closing issue has a parent
        # Epic, the summary suggests the label. The payload path skipped the API read above, so it
        # reads the hint here, and a failed read only drops the hint.
        if [ -n "${EVENT_PR:-}" ] && [ "$classify_pr" = "${EVENT_PR}" ]; then
          if data=$(fetch_pr "$classify_pr"); then
            parent=$(printf '%s' "$data" | jq -r '.data.repository.pullRequest.closingIssuesReferences.nodes[0].parent.number // empty')
          fi
        fi

        if [ -n "$parent" ]; then
          post_check success "PR #${classify_pr} closes an issue under epic #${parent} but has no \`epic:${parent}\` label — treated as standalone. Add the \`epic:${parent}\` label to gate it for atomic cross-repo landing."
        else
          post_check success "PR #${classify_pr} has no \`epic:<N>\` label — standalone, nothing to coordinate."
        fi
        emit ""
        exit 0

    # Resolve the Epic's member set: the frozen snapshot when one exists, otherwise the open pull
    # requests labeled `epic:<N>`. continue-on-error keeps a resolve failure from aborting the
    # action, and the evaluate step turns an empty or failed resolve into a hold.
    - name: Resolve authorized member set
      id: membership
      if: ${{ steps.discover.outputs.epic_number != '' }}
      continue-on-error: true
      uses: a-novel-kit/workflows/generic-actions/epic-membership@v1.63.0
      with:
        epic_number: ${{ steps.discover.outputs.epic_number }}
        # The gate writes the snapshot to planning_repo, so epic-membership must read it there.
        planning_repo: ${{ inputs.planning_repo }}
        client_id: ${{ inputs.client_id }}
        app_private_key: ${{ inputs.app_private_key }}

    # Recompute readiness over the member set and post the verdict. Only an Epic member reaches this
    # step, and the classify step posted every other verdict.
    - name: Evaluate readiness + post merge-gate
      id: evaluate
      if: ${{ steps.discover.outputs.epic_number != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        REPO_FULL: ${{ github.repository_owner }}/${{ inputs.repo }}
        HEAD_SHA: ${{ inputs.head_sha }}
        EPIC: ${{ steps.discover.outputs.epic_number }}
        MEMBERS: ${{ steps.membership.outputs.members }}
        IN_QUEUE: ${{ inputs.merge_group_head_ref }}
        PR_NUMBER: ${{ inputs.pull_request_number }}
      run: |
        set -euo pipefail

        post_check() { # $1=conclusion  $2=summary
          jq -n --arg sha "$HEAD_SHA" --arg concl "$1" --arg summary "$2" \
            '{name: "merge-gate", head_sha: $sha, status: "completed", conclusion: $concl,
              output: {title: "merge-gate", summary: $summary}}' \
            | gh api "repos/${REPO_FULL}/check-runs" --method POST --input - >/dev/null
          echo "merge-gate=$1 @ ${HEAD_SHA:0:12} — $2" | tee -a "$GITHUB_STEP_SUMMARY"
        }

        where="on the PR head"
        [ -n "${IN_QUEUE:-}" ] && where="on the merge-queue group head"

        # An empty output means epic-membership failed after its own retries. A labeled pull request
        # belongs to its own live set, so "[]" means the label index lags or a frozen member could
        # not be re-read. Neither confirms readiness, so the gate holds until a later run.
        if [ -z "${MEMBERS:-}" ] || [ "${MEMBERS}" = "[]" ]; then
          post_check failure "Epic #${EPIC} — couldn't confirm the member set ${where} (resolve errored, or the label index is lagging); holding rather than passing on uncertainty. The reconcile sweep re-checks."
          exit 0
        fi

        # A pull request labeled `epic:<N>` but absent from the set was labeled after the freeze or
        # missed at capture. It belongs to a later wave, whose readiness this set says nothing about,
        # so the gate holds it.
        #
        # This hold also runs the capture step in retire-only mode. A fully merged wave has no open
        # member left to run the gate, so the pull request waiting for the next wave retires it.
        if [ -z "${IN_QUEUE:-}" ] && [ -n "${PR_NUMBER:-}" ]; then
          if [ "$(printf '%s' "$MEMBERS" | jq --arg r "$REPO_FULL" --argjson n "${PR_NUMBER}" \
                'any(.[]; .repo == $r and .number == $n)')" != "true" ]; then
            post_check failure "Epic #${EPIC} — this PR carries the label but is not in the member set ${where}; holding (it belongs to a later wave, not this landing)."
            echo "retire_only=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        fi

        # An open member is merge-ready when it is non-draft, approved, and its `review-gate` check
        # from the App passed. A merged member has landed and is skipped. A frozen member closed
        # unmerged means the wave can never land whole, so it holds the rest. On a merge group the
        # same recompute dequeues the group when a member has regressed since enqueue.
        #
        # Before a snapshot, a member closed unmerged leaves the live set, and detect-partial-landing
        # acts on it once something has merged. A member without `state` counts as open.
        unready=$(printf '%s' "$MEMBERS" | jq -r '.[]
          | if .state == "CLOSED" then "  - \(.repo)#\(.number) (closed without merging: the wave cannot land whole)"
            elif (.state == "OPEN" or .state == null)
                and (.isDraft or .reviewDecision != "APPROVED" or .reviewGate != "SUCCESS")
              then "  - \(.repo)#\(.number) (draft=\(.isDraft), review=\(.reviewDecision // "none"), review-gate=\(.reviewGate // "none"))"
            else empty end')

        total=$(printf '%s' "$MEMBERS" | jq '[.[] | select(.state != "MERGED")] | length')
        if [ -z "$unready" ]; then
          post_check success "Epic #${EPIC} — all ${total} open member(s) merge-ready ${where}. Atomic landing OK."
          # Every open member is ready, so the capture step may write or retire the snapshot.
          echo "capture=true" >> "$GITHUB_OUTPUT"
        else
          count=$(printf '%s\n' "$unready" | grep -c '')
          post_check failure "$(printf 'Epic #%s — holding for atomic landing %s: %s of %s member(s) not ready:\n%s' \
            "$EPIC" "$where" "$count" "$total" "$unready")"
        fi

    # Activation snapshot. Freeze the member set once the whole Epic has held merge-ready, and retire
    # it once its wave has finished. The write uses its own token, so the gate's main token stays
    # read-only on issues.
    - name: Mint snapshot-write token
      id: snap_token
      if: ${{ steps.evaluate.outputs.capture == 'true' || steps.evaluate.outputs.retire_only == 'true' }}
      # Best-effort, like the capture step, so a failed mint never fails the gate.
      continue-on-error: true
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.client_id }}
        private-key: ${{ inputs.app_private_key }}
        owner: ${{ github.repository_owner }}
        # The token edits one issue, which every snapshot reader trusts, so its write access stops at
        # the planning repo.
        repositories: ${{ inputs.planning_repo }}
        # A dry run mints a read-only token, so it cannot edit the issue even past the capture step's
        # dry-run branch. Expressions compare strings case-insensitively, so any casing of "true"
        # selects read.
        permission-issues: ${{ inputs.snapshot_dry_run == 'true' && 'read' || 'write' }}

    - name: Capture activation snapshot
      if: ${{ steps.evaluate.outputs.capture == 'true' || steps.evaluate.outputs.retire_only == 'true' }}
      # Best-effort. The merge-gate check is already posted, so a failed capture never changes it,
      # and membership stays live until a later pass writes the marker.
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ steps.snap_token.outputs.token }}
        ORG: ${{ github.repository_owner }}
        PLANNING_REPO: ${{ inputs.planning_repo }}
        EPIC: ${{ steps.discover.outputs.epic_number }}
        MEMBERS: ${{ steps.membership.outputs.members }}
        STABILIZE_SECONDS: "120"
        # Set when this pass arrived from the not-in-set hold. Such a pass is not a member of the set
        # it just read, so it may only retire the wave holding it.
        RETIRE_ONLY: ${{ steps.evaluate.outputs.retire_only }}
        SNAPSHOT_DRY_RUN: ${{ inputs.snapshot_dry_run }}
        # Hours a frozen wave may stay unfinished before the gate warns, naming what it waits on. The
        # snapshot never expires, so a person resolves a stuck wave.
        STUCK_WAVE_HOURS: "72"
      run: |
        set -euo pipefail
        # The marker JSON in body $1, or empty when there is none or it does not parse. The region
        # holds a note and then the JSON, so parsing starts at the first line that opens a value.
        # epic-membership, detect-partial-landing and epic-rollback extract the marker the same way.
        current_marker() { # $1 = body
          printf '%s\n' "$1" \
            | awk -v s="$START" -v e="$END" '$0 == s {f=1;next} $0 == e {f=0} f' \
            | sed -n '/^[[:space:]]*[{[]/,$p' \
            | jq -s -c '.[0] // empty' 2>/dev/null || true
        }

        # The wave boundary a marker carries, the instant before which a terminal pull request belongs
        # to a retired wave. detect-partial-landing adds it to its `merged:` and `closed:` searches, so
        # one wave's history stays out of the next one's.
        #
        # Payloads and write checks both read the boundary through this function, so they agree on
        # what is well-formed. The accepted form is the one this step emits, the only form
        # detect-partial-landing puts in a query. A hand-edited boundary drops out here, and the next
        # write replaces it. A dropped boundary leaves the next wave unbounded history, which
        # over-freezes, while a malformed one in a query returns no rows, which clears.
        since_of() { # $1 = marker json -> the boundary, or empty
          printf '%s' "${1:-}" | jq -r '
            if type == "object" and (.since | type == "string")
              and (.since | test("\\A[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z\\z"))
            then .since else empty end' 2>/dev/null || true
        }

        START='<!-- epic-membership:snapshot:start -->'
        END='<!-- epic-membership:snapshot:end -->'

        # Capture runs in two phases, because a lagging label index can make a short set look
        # all-ready. The first all-ready pass writes a `pending` marker with a timestamp. A later pass
        # promotes it to `frozen` once the set has stayed unchanged for STABILIZE_SECONDS, and a
        # changed set restarts the clock. Readers treat only `frozen` as the set.
        #
        # A body edited on the web carries CRLF line endings, so \r is stripped for the fence match.
        body=$(gh api "repos/${ORG}/${PLANNING_REPO}/issues/${EPIC}" --jq '.body // ""' | tr -d '\r')

        # Whether every member of the wave merged. A member closed unmerged keeps the wave frozen until
        # epic-rollback resolves it. The snapshot is the only record that the wave failed, and a
        # retired wave hides its closed member from detect-partial-landing, which then posts success.
        #
        # Under a frozen marker epic-membership returns that set with live states, so this costs no
        # extra call. Before activation every state is OPEN, so nothing retires early.
        all_landed=$(printf '%s' "$MEMBERS" | jq -c \
          '(length > 0) and all(.[]; .state == "MERGED")' 2>/dev/null || echo false)

        # epic-rollback resolves a wave that cannot land whole, and labels the Epic `rolled-back`. Such
        # a wave also ends once none of its members is open. Its merged members are being reverted and
        # its closed ones never landed, so nothing from it can land alone. The label is read only for
        # a wave in that shape.
        rolled_back=false
        if [ "$all_landed" != true ] && printf '%s' "$MEMBERS" | jq -e \
             '(length > 0) and all(.[]; .state == "MERGED" or .state == "CLOSED")' >/dev/null 2>&1 \
          && gh api "repos/${ORG}/${PLANNING_REPO}/issues/${EPIC}" --jq '[.labels[].name] | index("rolled-back") != null' \
               2>/dev/null | grep -qx true; then
          rolled_back=true
        fi

        # Repository names are lowercased, so every pass computes a byte-identical set for the same
        # members. GitHub answers with either casing, and a set that differs by case resets the
        # stabilization clock. Every lookup built from the stored name is case-insensitive, and both
        # readers match members by alias index and number.
        #
        # The checks below match what the readers validate, the 50-member cap included. A frozen marker
        # stays until its wave retires, so a marker the readers reject leaves that Epic on live
        # membership for the whole wave.
        cur=$(printf '%s' "$MEMBERS" | jq -c '
          [.[] | {repo: (.repo | ascii_downcase), number}]
          | unique_by(.repo, .number) | sort_by(.repo, .number)')
        if ! printf '%s' "$cur" | jq -e '
              length > 0 and length <= 50
              and all(.[]; (.repo | test("\\A[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9._-]+\\z"))
                and (.number | type == "number" and . == floor and . > 0 and . < 2147483648))' >/dev/null 2>&1; then
          echo "::warning::Epic #${EPIC}: resolved member set is not snapshot-writable (empty, over 50 members, or malformed) — not capturing an activation snapshot this pass." \
            | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        # An unparseable marker counts as absent and gets a fresh pending, which repairs the region. A
        # frozen marker that fails to parse is overwritten with the live set, losing any de-labeled
        # member it held.
        marker=$(current_marker "$body")
        if [ -z "$marker" ] || ! printf '%s' "$marker" | jq empty 2>/dev/null; then marker=null; fi
        now=$(date -u +%Y-%m-%dT%H:%M:%SZ)

        # The boundary this pass inherits. splice replaces the whole fenced region, so a boundary
        # survives only when written again. The first capture after a retirement carries the
        # tombstone's instant forward, which keeps the retired wave's merges out of the new history.
        inherited_since=$(since_of "$marker")

        # A frozen marker retires once its wave has landed or been rolled back, and is otherwise
        # skipped. A valid pending marker resets when the members changed, promotes when unchanged and
        # aged, and otherwise waits. Anything else gets a fresh pending, including no marker, a
        # malformed one and a `retired` tombstone.
        do=$(jq -rn --argjson cur "$cur" --argjson mk "$marker" --arg now "$now" \
          --argjson landed "$all_landed" --argjson rolled "$rolled_back" --argjson thr "${STABILIZE_SECONDS}" '
          if ($mk | type) != "object" then "pending"
          # Retiring a finished frozen wave draws the wave boundary and lets the next ready set
          # capture its own. A frozen marker left in place holds every pull request labeled after it.
          elif $mk.status == "frozen" then (if $landed or $rolled then "retire" else "skip" end)
          elif ($mk.status == "pending" and ($mk.members | type == "array") and ($mk.at | type == "string"))
            then (
              if (($mk.members | sort_by((.repo | ascii_downcase), .number)) != $cur) then "pending"
              # An unparseable `at` gets a fresh pending, which restarts the stabilization window and
              # repairs the marker.
              elif (($mk.at | try (fromdateiso8601 | true) catch false) | not) then "pending"
              elif (($now | fromdateiso8601) - ($mk.at | fromdateiso8601)) >= $thr then "frozen"
              else "skip" end)
          else "pending" end' 2>/dev/null || echo skip)

        if [ "$do" = "skip" ]; then
          # A frozen wave that cannot finish holds every pull request labeled after it, and nothing
          # else says why. Past STUCK_WAVE_HOURS the gate names what the wave waits on. An open member
          # is late. A member closed unmerged means the wave did not land, and it retires only after
          # epic-rollback.
          if [ "$(printf '%s' "$marker" | jq -r 'if type == "object" then (.status // "") else "" end' 2>/dev/null || true)" = "frozen" ] \
            && printf '%s' "$marker" | jq -e --arg now "$now" --argjson hrs "${STUCK_WAVE_HOURS}" \
                 '(.at | try (fromdateiso8601 | true) catch false)
                  and (($now | fromdateiso8601) - (.at | fromdateiso8601)) >= ($hrs * 3600)' >/dev/null 2>&1; then
            late=$(printf '%s' "$MEMBERS" | jq -r '[.[] | select(.state == "OPEN" or .state == null)
              | "\(.repo)#\(.number)"] | join(", ")' 2>/dev/null || true)
            abandoned=$(printf '%s' "$MEMBERS" | jq -r '[.[] | select(.state == "CLOSED")
              | "\(.repo)#\(.number)"] | join(", ")' 2>/dev/null || true)
            if [ -n "$late" ]; then
              echo "::warning::Epic #${EPIC}: the frozen wave has been open more than ${STUCK_WAVE_HOURS}h, still waiting on ${late}. Nothing labeled after it can land until it finishes — land those, close them, or label the Epic \`automation:paused\`." \
                | tee -a "$GITHUB_STEP_SUMMARY"
            fi
            if [ -n "$abandoned" ]; then
              echo "::warning::Epic #${EPIC}: the frozen wave cannot retire — ${abandoned} closed without merging, so it did not land. It stays frozen because the snapshot is the only record that those were members; resolve it with epic-rollback, which lets the wave retire once none of its members is open." \
                | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "Epic #${EPIC}: snapshot already frozen, or stable but not yet aged — leaving it." \
            | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        # A retire-only pass read a set it is not part of, so it may end the previous wave and capture
        # nothing.
        if [ "${RETIRE_ONLY:-}" = "true" ] && [ "$do" != "retire" ]; then
          echo "Epic #${EPIC}: held for a later wave, and the current snapshot is not retirable this pass (${do}) — leaving it." \
            | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        if [ "$do" = "retire" ]; then
          # The tombstone is the only record of where this wave ended. The live `merged:` search returns
          # the wave's merges for the rest of the Epic's life, and the boundary keeps them out of the
          # next wave. `since` is `now`, because retirement draws the boundary.
          #
          # The gate holds every labeled pull request outside the frozen set, so nothing of the Epic
          # merges between the wave's last merge and this pass. The tombstone names no members, and
          # both membership readers select on `status == "frozen"`, so they read it as no marker.
          payload=$(jq -cn --arg since "$now" '{status: "retired", since: $since}')
          note="_Epic membership, RETIRED — the wave frozen here has $([ "$all_landed" = true ] && echo "fully landed" || echo "been rolled back"). The instant below separates its history from the next wave's; the next ready set captures its own. Do not edit._"
        elif [ "$do" = "frozen" ]; then
          # `at` records the freeze, and STUCK_WAVE_HOURS measures a stuck wave from it.
          payload=$(printf '%s' "$cur" | jq -c --arg at "$now" --arg since "$inherited_since" \
            '{status: "frozen", at: $at, members: .} + (if $since == "" then {} else {since: $since} end)')
          note="_Epic membership, FROZEN at activation by the merge-gate. The authoritative set for this landing — a later de-label, close, or relabel does not change it. Do not edit._"
        else
          payload=$(printf '%s' "$cur" | jq -c --arg at "$now" --arg since "$inherited_since" \
            '{status: "pending", at: $at, members: .} + (if $since == "" then {} else {since: $since} end)')
          note="_Epic membership, PENDING — stabilizing before it freezes (the label index is eventually consistent). Do not edit._"
        fi

        # The same splice as render-epic-status. One START line before one END line is rewritten in
        # place. Any other shape has every fence line removed and one fresh region appended. Text
        # outside the fences survives both paths.
        splice() { # $1 = body file, $2 = region file (already wrapped in the markers)
          local bodyf="$1" regionf="$2" ns ne sl el wellformed=false
          ns=$(grep -cxF -- "$START" "$bodyf" || true)
          ne=$(grep -cxF -- "$END" "$bodyf" || true)
          if [ "$ns" = "1" ] && [ "$ne" = "1" ]; then
            sl=$(grep -nxF -- "$START" "$bodyf" | cut -d: -f1)
            el=$(grep -nxF -- "$END" "$bodyf" | cut -d: -f1)
            if [ "$sl" -lt "$el" ]; then wellformed=true; fi
          fi
          if [ "$wellformed" = true ]; then
            awk -v startm="$START" -v endm="$END" -v regionfile="$regionf" '
              BEGIN { region=""; while ((getline line < regionfile) > 0) region = region line "\n" }
              $0 == startm { if (!done) { printf "%s", region; done=1 } inside=1; next }
              $0 == endm { inside=0; next }
              inside { next }
              { print }
            ' "$bodyf"
          else
            grep -vxF -e "$START" -e "$END" -- "$bodyf" || true
            printf '\n'
            cat "$regionf"
          fi
        }

        # The region write_marker splices in below.
        regionf=$(mktemp)
        {
          echo "$START"
          echo "$note"
          printf '%s\n' "$payload"
          echo "$END"
        } > "$regionf"

        # Read-modify-verify. Writers overlap, because the reconcile sweep runs this gate for many
        # members at once and render-epic-status edits the same body. The issues API has no
        # conditional update, so each attempt splices into a fresh read, writes, and confirms the
        # write survived. A losing writer retries against whatever landed.
        #
        # The decision ($do and $payload) came from an earlier read, and a peer may have moved the set
        # since. Each attempt therefore re-checks the decision against the marker it finds. The tests
        # drive write_marker against a stubbed gh.

        # Whether live marker $1 already carries payload $2 and can make progress. Both the entry
        # short-circuit and the post-write verify call this, so a clobbered repair never reads as
        # landed.
        marker_settled() { # $1 = live marker json, $2 = our payload json
          same_marker "$1" "$2" || return 1
          # Only `pending` ages. `frozen` and `retired` are terminal and carry no aging clock, so
          # equality settles them. A tombstone has no `at` to parse.
          case "$(printf '%s' "$1" | jq -r '.status // ""' 2>/dev/null || true)" in
            frozen | retired) return 0 ;;
          esac
          # A pending marker whose `at` cannot be parsed never ages, so it stays unsettled however
          # equal its members look. The decision step routes it to a repairing write.
          printf '%s' "$1" | jq -e '.at | try (fromdateiso8601 | true) catch false' >/dev/null 2>&1
        }

        # Whether two markers agree on status, members and wave boundary. `at` differs per writer and
        # stays out of the comparison, while `since` is inherited content and counts.
        same_marker() { # $1 = marker json, $2 = marker json
          [ -n "$1" ] && [ -n "$2" ] \
            && jq -e -n --argjson a "$1" --argjson b "$2" \
              '($a.status == $b.status) and (($a.members // []) == ($b.members // []))' >/dev/null 2>&1 \
            && [ "$(since_of "$1")" = "$(since_of "$2")" ]
        }

        write_marker() { # $1 = region file, $2 = the marker the decision read. 0 = in place, 2 = yielded, 1 = gave up
          local regionf="$1" decided="$2" bodyf outf attempt body marker err rc=1
          bodyf=$(mktemp); outf=$(mktemp)
          for attempt in 1 2 3; do
            # Re-read every attempt, the first included.
            if ! body=$(gh api "repos/${ORG}/${PLANNING_REPO}/issues/${EPIC}" --jq '.body // ""' 2>/dev/null | tr -d '\r'); then
              # A read failure has no diagnostic of its own, so `err` records it for the give-up
              # message when the last attempts fail here.
              err="could not read ${ORG}/${PLANNING_REPO}#${EPIC} (attempt ${attempt})"
              [ "$attempt" -lt 3 ] && sleep 2
              continue
            fi
            marker=$(current_marker "$body")

            # The body already carries this pass's payload, so nothing needs writing.
            if marker_settled "$marker" "$payload"; then
              rc=0
              break
            fi

            if [ "$do" = "retire" ]; then
              # A retirement may end only the frozen marker this pass judged finished. Any other
              # marker means a peer opened the next wave, so this pass yields to it. The check
              # compares the marker itself, since a frozen marker keeps a renamed repository's old
              # name and never matches the live set.
              if ! jq -e -n --argjson m "${marker:-null}" --argjson decided "${decided:-null}" \
                   '($m | type == "object") and $m.status == "frozen" and $m == $decided' >/dev/null 2>&1; then
                echo "Epic #${EPIC}: the snapshot moved on before this pass could retire it — leaving it." \
                  | tee -a "$GITHUB_STEP_SUMMARY"
                rc=2
                break
              fi
            # A frozen marker is terminal, since every reader already acts on it, so this pass yields.
            # A freeze that lands between this check and the write below is still overwritten,
            # because the API has no conditional update.
            elif [ -n "$marker" ] && [ "$(printf '%s' "$marker" | jq -r '.status // ""')" = "frozen" ]; then
              echo "Epic #${EPIC}: the snapshot is already frozen (a peer got there first) — leaving it." \
                | tee -a "$GITHUB_STEP_SUMMARY"
              rc=2
              break
            fi

            # The payload took its boundary from the marker this pass read at the start, so a peer
            # that has since drawn a different one must survive. Retirement draws the boundary, and
            # the check above already pins which set it may end, so it skips this one. Both sides read
            # through since_of, so a corrupt boundary compares equal to the empty one replacing it, and
            # the repairing write goes through.
            if [ "$do" != "retire" ] && [ "$(since_of "$marker")" != "${inherited_since:-}" ]; then
              echo "Epic #${EPIC}: the wave boundary moved while this pass was deciding — not overwriting it; the next pass inherits what is actually there." \
                | tee -a "$GITHUB_STEP_SUMMARY"
              rc=2
              break
            fi

            # Re-derive the freeze against the marker this attempt read. A peer may have reset the
            # clock on a changed set since this pass decided, and a frozen set is final. The age is
            # re-checked too, so a freeze never lands inside a stabilization window a peer just
            # restarted. The pass yields, and the next one decides on current state.
            if [ "$do" = "frozen" ] \
              && ! jq -e -n --argjson m "${marker:-null}" --argjson cur "$cur" \
                   --arg now "$now" --argjson thr "${STABILIZE_SECONDS}" \
                   '($m | type == "object") and $m.status == "pending"
                    and (($m.members // []) | sort_by((.repo | ascii_downcase), .number)) == $cur
                    and ($m.at | try (fromdateiso8601 | true) catch false)
                    and (($now | fromdateiso8601) - ($m.at | fromdateiso8601)) >= $thr' >/dev/null 2>&1; then
              echo "::warning::Epic #${EPIC}: the member set moved while this pass was deciding — not freezing a stale set; the next pass re-derives." \
                | tee -a "$GITHUB_STEP_SUMMARY"
              rc=2
              break
            fi

            printf '%s' "$body" > "$bodyf"
            splice "$bodyf" "$regionf" > "$outf"
            err=$(gh issue edit "$EPIC" --repo "${ORG}/${PLANNING_REPO}" --body-file "$outf" 2>&1 >/dev/null) || true
            # Verify the write, since a peer write can land after it and the edit's exit code cannot
            # show that. The comparison is semantic and scoped to the region, so an orphaned payload
            # line that splice's repair path leaves behind as prose does not match.
            if body=$(gh api "repos/${ORG}/${PLANNING_REPO}/issues/${EPIC}" --jq '.body // ""' 2>/dev/null | tr -d '\r') \
              && marker_settled "$(current_marker "$body")" "$payload"; then
              rc=0
              break
            fi
            [ "$attempt" -lt 3 ] && sleep 2
          done
          if [ "$rc" = 1 ] && [ -n "${err:-}" ]; then
            echo "::warning::Epic #${EPIC}: last write error — ${err}"
          fi
          rm -f "$bodyf" "$outf"
          return "$rc"
        }

        # A dry run stops here, before the first write, and reports the decision, the member set and
        # the exact payload. The member list is what a reviewer checks, because a frozen set is final.
        if [ "$(printf '%s' "${SNAPSHOT_DRY_RUN:-false}" | tr '[:upper:]' '[:lower:]')" = "true" ]; then
          {
            echo "Epic #${EPIC}: dry run — would write a \"${do}\" activation snapshot. The Epic body is untouched, so a repeated pass reports this same transition."
            echo "  set judged ($(printf '%s' "$cur" | jq 'length') member(s)):"
            printf '%s' "$cur" | jq -r '.[] | "    \(.repo)#\(.number)"'
            echo "  payload: ${payload}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        # A rolled-back label belongs to the wave whose rollback set it. Clear one an earlier wave left
        # before freezing this one, or this wave could later retire on a closed member without a
        # rollback of its own. If the label cannot be read or cleared, freezing waits for a later pass.
        if [ "$do" = "frozen" ]; then
          if ! stale=$(gh api "repos/${ORG}/${PLANNING_REPO}/issues/${EPIC}" --jq '[.labels[].name] | index("rolled-back") != null' 2>/dev/null) \
            || { [ "$stale" = true ] && ! gh api -X DELETE "repos/${ORG}/${PLANNING_REPO}/issues/${EPIC}/labels/rolled-back" >/dev/null 2>&1; }; then
            echo "::warning::Epic #${EPIC}: could not confirm that no earlier wave's rolled-back label remains — freezing on a later pass." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
        fi

        write_marker "$regionf" "$marker" && wm=0 || wm=$?
        if [ "$wm" = 0 ] && [ "$do" = "retire" ]; then
          echo "Epic #${EPIC}: the wave $([ "$all_landed" = true ] && echo landed || echo "was rolled back") — activation snapshot retired at ${now}; the next ready set captures its own." \
            | tee -a "$GITHUB_STEP_SUMMARY"
        elif [ "$wm" = 0 ]; then
          n=$(printf '%s' "$cur" | jq 'length')
          echo "Epic #${EPIC}: ${do} activation snapshot in place — ${n} member(s)." | tee -a "$GITHUB_STEP_SUMMARY"
        elif [ "$wm" = 2 ]; then
          : # yielded, and write_marker logged why
        else
          echo "::warning::Epic #${EPIC}: could not write the ${do} activation snapshot after 3 attempts; membership stays live-derived."
        fi
