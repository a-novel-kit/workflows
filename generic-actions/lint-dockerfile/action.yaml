name: lint dockerfile
description: >
  Run hadolint over a repo's Dockerfiles. hadolint also shellchecks each RUN block. A repo with no
  Dockerfiles passes, so the job fits any repo. Advisory mode reports findings without failing, for
  a repo clearing an existing backlog before the check gates.

inputs:
  paths:
    required: false
    description: >
      Space- or newline-separated globs of Dockerfiles to lint. Empty lints every tracked file named
      `Dockerfile` or `<x>.Dockerfile` in either casing, or `Dockerfile.<x>` with a capital D.
      Discovery reads tracked files only, so it skips gitignored trees. The caller checks the repo
      out first.
  advisory:
    required: false
    default: "false"
    description: >
      When "true", the log lists the findings, the run summary counts them, and the check passes.
      When "false", any finding fails the check.
  version:
    required: true
    description: >
      hadolint release tag, with or without the leading v. The caller pins it so Renovate bumps it
      per repo, with the annotation
      `# renovate: datasource=custom.hadolint depName=hadolint/hadolint`.
  sha256:
    required: false
    default: ""
    description: >
      SHA-256 of that release's `hadolint-linux-x86_64`, on the line right after `version`, so
      Renovate moves both together. A download that does not match fails the step. Empty runs the
      release unverified, with a warning; a later release requires it.

runs:
  using: composite
  steps:
    - name: hadolint
      shell: bash
      env:
        PATHS: ${{ inputs.paths }}
        ADVISORY: ${{ inputs.advisory }}
        HADOLINT_VERSION: ${{ inputs.version }}
        HADOLINT_SHA256: ${{ inputs.sha256 }}
      run: |
        # errexit is off because hadolint exits non-zero on findings, and the step gates on that code.
        set +e -u
        shopt -s nullglob
        if [ -n "${PATHS//[[:space:]]/}" ]; then
          # The caller's globs split into words and expand into the file list.
          # shellcheck disable=SC2206
          files=($PATHS)
        else
          # A lowercase `dockerfile.<x>` is usually source, such as `dockerfile.go`, so the
          # `Dockerfile.<x>` form needs a capital D.
          mapfile -t files < <(git ls-files \
            | grep -E '(^|/)[Dd]ockerfile$|\.[Dd]ockerfile$|(^|/)Dockerfile\.[^/]+$')
        fi

        if [ ${#files[@]} -eq 0 ]; then
          echo "No Dockerfiles to lint."
          printf '## hadolint\n\nNo Dockerfiles found — nothing to lint.\n' >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        bin="$RUNNER_TEMP/hadolint"
        # The check gates, so the download retries. `--retry-all-errors` also retries a
        # transport-level reset (curl exit 35), which plain `--retry` leaves fatal.
        if ! curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors \
          "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION#v}/hadolint-linux-x86_64" \
          -o "$bin"; then
          echo "::error::failed to download hadolint ${HADOLINT_VERSION} after 3 retries"
          exit 1
        fi

        # The pin comes from the caller, never from the release, whose files and checksums an
        # attacker holding the release can replace together.
        if [ -z "$HADOLINT_SHA256" ]; then
          echo "::warning::hadolint ${HADOLINT_VERSION} runs unverified: pin its sha256 beside version."
        elif ! echo "$HADOLINT_SHA256  $bin" | sha256sum --check --quiet; then
          echo "::error::hadolint ${HADOLINT_VERSION} does not match the pinned sha256"
          exit 1
        fi
        chmod +x "$bin"

        "$bin" "${files[@]}" > "$RUNNER_TEMP/hadolint.txt" 2>&1
        rc=$?
        cat "$RUNNER_TEMP/hadolint.txt"

        total=$(grep -cE 'DL[0-9]+|SC[0-9]+' "$RUNNER_TEMP/hadolint.txt")
        printf '## hadolint\n\n**%s** finding(s) across %s Dockerfile(s).\n' \
          "${total:-0}" "${#files[@]}" >> "$GITHUB_STEP_SUMMARY"

        if [ "$ADVISORY" = "true" ]; then
          echo "Advisory mode: findings reported without gating."
          exit 0
        fi
        exit "$rc"
