name: release train
description: >
  Release every repository an Epic landed in, from one dispatch. The action finds the repositories
  of the Epic's merged `epic:<N>` pull requests, derives each one's semver bump from the commits
  since its last tag, and dispatches that repository's own `release.yaml` to cut the release. That
  workflow takes `release_type` and `dry_run` inputs, and owns the bump, the tag, the push and the
  GitHub Release with its own token. The repositories release independently, in any order. Ordering
  releases across Epics is left to the caller.

  Each repository is rehearsed first, through a `release.yaml` run with dry_run "true" that cuts no
  tag and must succeed. A live cut then waits up to an hour for approval at the repository's
  protected `release` environment. A rehearsal that stops at that environment parks the repository.

  A live run records each released tag as a receipt in the Epic issue's body. A re-dispatch resumes
  from live tags, never from the receipt. It skips each repository whose newest tag contains the
  Epic's merge and has a published Release. A tag without a Release is a botched cut, left for
  manual repair. The run fails while any repository is unfinished. `dry_run` defaults to "true",
  which rehearses every repository and leaves the Epic body untouched. The action requires the admin
  role and refuses to run while the kill switch is engaged or the Epic carries `automation:paused`.

inputs:
  client_id:
    required: true
    description: >
      Client ID of a GitHub App installed on the org. The action mints three tokens from it. An
      org-wide read token reads issues, pull requests and contents. An org-wide Actions write token
      dispatches and polls each `release.yaml`. An Issues write token scoped to `planning_repo`
      writes the receipt.
  app_private_key:
    required: true
    description: Private key (PEM) of that App.
  epic_number:
    required: true
    description: >
      Number of the Epic to release. It builds a `label:"epic:<N>"` search qualifier, so anything
      but an integer fails the run.
  org:
    required: false
    default: ${{ github.repository_owner }}
    description: >
      Organization login. The `epic:<N>` search is scoped to it, and every token is minted on its
      installation. Defaults to the workflow's org.
  planning_repo:
    required: false
    default: .github
    description: >
      Repository, by name in `org`, that holds the Epic issue. The receipt goes into that issue's
      body, and its `automation:paused` label stops the run. Defaults to `.github`.
  dry_run:
    required: false
    default: "true"
    description: >
      Only "false", ignoring case and whitespace, rehearses each repository and then cuts its release.
      Any other value, the default "true" included, rehearses every repository through its
      `release.yaml` with dry_run "true", which cuts no tag, and leaves the Epic body untouched.
  kill_switch:
    required: false
    default: ""
    description: >
      Org-level halt, passed in by the caller because a composite action cannot read the `vars`
      context. The action runs only on an explicit off value: empty, 0, off, false, no or disabled,
      compared lowercased with whitespace removed. Any other value engages the halt, and the action
      fails in its first step, before the role check or any token mint.

runs:
  using: composite
  steps:
    # Org-level halt, read before the role check and every token mint. Cutting releases is a
    # deliberate decision, so an engaged switch fails the run. Only an explicit off-token runs.
    - name: Halt guard (kill-switch)
      shell: bash
      env:
        KILL_SWITCH: ${{ inputs.kill_switch }}
      run: |
        set -euo pipefail
        case "$(printf '%s' "${KILL_SWITCH:-}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')" in
          "" | 0 | off | false | no | disabled) : ;;
          *)
            echo "::error::AGENT_KILL_SWITCH engaged — [Agent] automation is halted org-wide; refusing to run the release train. Lift the org kill-switch (set it to an explicit off-token, e.g. \"off\", or unset it) before releasing."
            exit 1
            ;;
        esac

    # The role is checked here as well as in the caller, since a hand-written or outdated caller can
    # omit the check.
    - uses: a-novel-kit/workflows/generic-actions/require-role@v1.81.1
      with:
        roles: admin

    # Read token. The ledger search, the commit ranges and the tag and release reads span every
    # repository in the org, which the single-repository GITHUB_TOKEN cannot see.
    - name: Mint read token
      id: read
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.client_id }}
        private-key: ${{ inputs.app_private_key }}
        owner: ${{ inputs.org }} # zizmor: ignore[github-app] read-only, across the org
        permission-issues: read
        permission-pull-requests: read
        permission-contents: read

    # Dispatch token. actions:write triggers each repository's release.yaml and reads its runs. The
    # action never pushes, so it holds no contents:write, and release-core mints its own.
    - name: Mint dispatch token
      id: dispatch
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.client_id }}
        private-key: ${{ inputs.app_private_key }}
        owner: ${{ inputs.org }} # zizmor: ignore[github-app] dispatches each member's release.yaml
        permission-actions: write

    # Issue token, scoped to the planning repo alone, which splices the receipt into the Epic body.
    # The receipt is a best-effort audit, since a resume reads live tags.
    - name: Mint issue token
      id: issue
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.client_id }}
        private-key: ${{ inputs.app_private_key }}
        owner: ${{ inputs.org }}
        repositories: ${{ inputs.planning_repo }}
        permission-issues: write

    - name: Reconstruct the Epic, derive bumps, drive each release.yaml
      shell: bash
      env:
        # Every bare `gh` call reads with the read token. The dispatch token applies inline to the
        # dispatches and to the run reads, which need Actions access, and the issue token to the
        # receipt write.
        GH_TOKEN: ${{ steps.read.outputs.token }}
        DISPATCH_TOKEN: ${{ steps.dispatch.outputs.token }}
        ISSUE_TOKEN: ${{ steps.issue.outputs.token }}
        APP_SLUG: ${{ steps.dispatch.outputs.app-slug }}
        ORG: ${{ inputs.org }}
        EPIC: ${{ inputs.epic_number }}
        PLANNING_REPO: ${{ inputs.planning_repo }}
        DRY_RUN: ${{ inputs.dry_run }}
        ACTOR: ${{ github.actor }}
      run: |
        set -euo pipefail

        # ---- Validate untrusted inputs before they reach a search grammar / an API path ------------
        if ! [[ "${EPIC:-}" =~ ^[0-9]+$ ]]; then
          echo "::error::epic_number must be an integer, got \"${EPIC:-}\""
          exit 1
        fi
        if ! [[ "${ORG:-}" =~ ^[A-Za-z0-9-]+$ ]]; then
          echo "::error::org must be a valid GitHub login (alphanumeric + hyphens), got \"${ORG:-}\""
          exit 1
        fi
        if ! [[ "${PLANNING_REPO:-}" =~ ^[A-Za-z0-9._-]+$ ]]; then
          echo "::error::planning_repo must be a bare repository name (no owner/slash), got \"${PLANNING_REPO:-}\""
          exit 1
        fi
        dry=$(printf '%s' "${DRY_RUN:-}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
        [ "$dry" = false ] || dry=true

        # ---- Per-Epic pause. A failed label read does not block, since the role check already
        # gates the run.
        labels=$(gh api "repos/${ORG}/${PLANNING_REPO}/issues/${EPIC}" --jq '.labels[].name' 2>/dev/null || echo "")
        if printf '%s\n' "$labels" | grep -qx 'automation:paused'; then
          echo "::error::epic:#${EPIC} is automation:paused — remove the \`automation:paused\` label from the Epic issue before releasing it."
          exit 1
        fi

        # ================= Shared helpers ==========================================================

        # Pull request search node. mergedAt picks each repository's newest-merged sibling, which
        # anchors the ship test, so a later sibling missing from the tag is never masked.
        SEARCH_Q='query($q:String!,$cursor:String){
          search(query:$q, type:ISSUE, first:100, after:$cursor){
            pageInfo{ hasNextPage endCursor }
            nodes{ ... on PullRequest{ number mergedAt repository{ nameWithOwner } } } } }'

        # Page an ISSUE search to completion, retrying transient GraphQL errors, and print the
        # aggregated node array. Returns 1 on failure, so the caller fails closed.
        search_prs() { # $1 = search query
          local search="$1" cursor="" agg='[]' data page ok args
          while :; do
            ok=false
            for attempt in 1 2 3; do
              args=(-f query="$SEARCH_Q" -f q="$search")
              [ -n "$cursor" ] && args+=(-f cursor="$cursor")
              if data=$(gh api graphql "${args[@]}" 2>&1) \
                && printf '%s' "$data" | jq -e 'has("data") and (has("errors") | not)' >/dev/null 2>&1; then
                ok=true; break
              fi
              [ "$attempt" -lt 3 ] && sleep 2
            done
            [ "$ok" = true ] || { printf 'search_prs failed for "%s": %s\n' "$search" "$data" >&2; return 1; }
            page=$(printf '%s' "$data" | jq '[(.data.search.nodes // [])[] | select(.number != null)]')
            agg=$(jq -s '.[0] + .[1]' <(printf '%s' "$agg") <(printf '%s' "$page"))
            [ "$(printf '%s' "$data" | jq -r '.data.search.pageInfo.hasNextPage')" = "true" ] || break
            cursor=$(printf '%s' "$data" | jq -r '.data.search.pageInfo.endCursor')
          done
          printf '%s' "$agg"
        }

        # Read one pull request through REST, the authority the search index lags behind. Prints
        # "<merged> <merge_commit_sha>".
        rest_pr_merge() { # $1=owner/repo $2=number
          local data
          for attempt in 1 2 3; do
            if data=$(gh api "repos/$1/pulls/$2" 2>/dev/null); then
              printf '%s' "$data" | jq -r '"\(.merged) \(.merge_commit_sha // "")"'; return 0
            fi
            [ "$attempt" -lt 3 ] && sleep 2
          done
          printf 'rest_pr_merge failed for %s#%s\n' "$1" "$2" >&2; return 1
        }

        # Newest release tag of a repository, `vX.Y.Z` or a Go submodule's `<dir>/vX.Y.Z`. A
        # repository with no tag prints nothing, which means a first release. A read that fails after
        # retries prints "__ERR__" instead, and the caller skips the repository. A read error taken
        # for a first release releases the repository twice on a resumed train.
        #
        # `sort -V` across both forms relies on the single go.mod that release-core enforces. A
        # repository that moved its module carries both forms and can get the wrong one.
        latest_tag() { # $1=owner/repo
          local refs
          for attempt in 1 2 3; do
            if refs=$(gh api "repos/$1/git/matching-refs/tags" --paginate --jq '.[].ref' 2>/dev/null); then
              printf '%s\n' "$refs" | sed 's|refs/tags/||' | grep -E '(^|/)v[0-9]' | sort -V | tail -n1
              return 0
            fi
            [ "$attempt" -lt 3 ] && sleep 2
          done
          printf '__ERR__'
        }

        # Does <tag> contain <merge_sha>? The compare runs from the merge to the tag, and `ahead` or
        # `identical` puts the tag at or after the merge. Returns 2 when the read fails after retries.
        tag_contains() { # $1=owner/repo $2=tag $3=merge_sha
          local st
          for attempt in 1 2 3; do
            if st=$(gh api "repos/$1/compare/$3...$2" --jq '.status' 2>/dev/null); then
              [ "$st" = "ahead" ] || [ "$st" = "identical" ]; return
            fi
            [ "$attempt" -lt 3 ] && sleep 2
          done
          return 2
        }

        # Does a published GitHub Release exist for <tag>? A botched cut leaves a tag without one.
        # gh exits 1 on a 404 and on a transient error alike, so every failure is retried, and a
        # persistent one returns 1. The caller then reports a botched cut, which a re-dispatch clears
        # once the read succeeds.
        release_exists() { # $1=owner/repo $2=tag
          for attempt in 1 2 3; do
            if gh api "repos/$1/releases/tags/$2" >/dev/null 2>&1; then return 0; fi
            [ "$attempt" -lt 3 ] && sleep 1
          done
          return 1
        }

        # Print a jq filter's output for an API path, paginated on request, retrying transient
        # errors. Returns 1 when every attempt fails.
        commit_messages() { # $1=api path  $2=jq filter  $3=paginate(true|false)
          local out attempt page=()
          [ "$3" = "true" ] && page=(--paginate)
          for attempt in 1 2 3; do
            out=$(gh api "$1" "${page[@]}" --jq "$2" 2>/dev/null) && { printf '%s' "$out"; return 0; }
            [ "$attempt" -lt 3 ] && sleep 2
          done
          return 1
        }

        # Derive a repository's semver bump from its commits since the last tag. The release cuts the
        # whole default branch since that tag, which can hold more than the Epic's own commits. The
        # highest bump wins. A `!` or a BREAKING CHANGE footer gives major, any feat gives minor, and
        # anything else gives patch. An empty range prints "none" and a failed read "__ERR__".
        #
        # feat and `!` are read from subject lines, since a body line starting `feat:` is no type. The
        # BREAKING CHANGE footer is read from the full body. The compare API supplies both, so the
        # derivation needs no checkout.
        derive_bump() { # $1=owner/repo $2=last_tag ("" = first release) $3=default_branch
          local repo="$1" last="$2" head="$3" messages subjects bodies path paginate jq_messages
          if [ -z "$last" ]; then
            # A first release reads one page of recent default-branch commits, and an empty page
            # gives minor.
            path="repos/$repo/commits"; paginate=false
            jq_messages='.[].commit.message | @json'
          else
            # The compare API pages its commit list, so the read paginates to see every feat.
            path="repos/$repo/compare/${last}...${head}"; paginate=true
            jq_messages='.commits[].commit.message | @json'
          fi
          # A failed read prints "__ERR__", which the caller records as a failure. An empty range
          # skips the repository as nochange and keeps the run green, so the two stay apart.
          if ! messages=$(commit_messages "$path" "$jq_messages" "$paginate"); then
            printf '__ERR__'; return 0
          fi
          # One JSON string per message keeps multi-line bodies apart, so one read yields both views.
          bodies=$(printf '%s' "$messages" | jq -r '.')
          subjects=$(printf '%s' "$messages" | jq -r 'split("\n")[0]')
          if [ -z "$(printf '%s' "$subjects" | tr -d '[:space:]')" ]; then
            [ -z "$last" ] && { printf 'minor'; return 0; }
            printf 'none'; return 0
          fi
          if printf '%s\n' "$subjects" | grep -qE '^[[:alpha:]]+(\([^)]*\))?!:' \
            || printf '%s\n' "$bodies" | grep -qE '^BREAKING[ -]CHANGE:'; then printf 'major'
          elif printf '%s\n' "$subjects" | grep -qE '^feat(\([^)]*\))?:'; then printf 'minor'
          else printf 'patch'
          fi
        }

        # Dispatch a repository's release.yaml and print the run id, which `return_run_details`
        # returns directly. When GitHub answers 204 without it, the run is found by the App bot actor
        # and a created>= filter at the runner's dispatch time. A runner clock ahead of GitHub's can
        # hide the run from that filter.
        #
        # Inputs travel as strings, which the dispatches API takes whatever an input's declared type.
        # release.yaml declares dry_run a boolean, so "true" and "false" reach it as booleans.
        dispatch_release() { # $1=owner/repo $2=default_branch $3=release_type $4=run_dry(true|false)
          local repo="$1" ref="$2" rt="$3" rdry="$4" ts resp run_id
          ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          resp=$(jq -n --arg ref "$ref" --arg rt "$rt" --arg dry "$rdry" \
            '{ref:$ref, inputs:{release_type:$rt, dry_run:$dry}, return_run_details:true}' \
            | GH_TOKEN="$DISPATCH_TOKEN" gh api \
              "repos/$repo/actions/workflows/release.yaml/dispatches" --method POST --input - 2>/dev/null || echo "")
          run_id=$(printf '%s' "$resp" | jq -r '.workflow_run_id // empty' 2>/dev/null || echo "")
          if [ -z "$run_id" ]; then
            for attempt in 1 2 3 4 5; do
              sleep 3
              run_id=$(GH_TOKEN="$DISPATCH_TOKEN" gh api \
                "repos/$repo/actions/workflows/release.yaml/runs?event=workflow_dispatch&actor=${APP_SLUG}%5Bbot%5D&created=%3E%3D${ts//:/%3A}&per_page=5" \
                --jq "[.workflow_runs[] | select(.head_branch==\"${ref}\")][0].id // empty" 2>/dev/null || echo "")
              [ -n "$run_id" ] && break
            done
          fi
          [ -n "$run_id" ] || { echo "::error::could not resolve the dispatched run id for ${repo}" >&2; return 1; }
          printf '%s' "$run_id"
        }

        # Poll a run to completion and print its conclusion. A cut waits up to an hour at the protected
        # `release` environment for a person's approval. A rehearsal runs outside that environment, so
        # a rehearsal waiting there prints "blocked" at once, as does a cut nobody approves within the
        # hour. A blocked run can still complete on approval, so the caller records it as parked. A
        # run that keeps running past about 30 minutes prints "timeout".
        poll_run() { # $1=owner/repo $2=run_id $3=approval(true|false)
          local repo="$1" run_id="$2" approval="$3" polls=0 waits=0 st cc
          while [ "$polls" -lt 180 ]; do   # ~30 min of running at 10s (release-core can go install + build on a cold runner)
            read -r st cc < <(GH_TOKEN="$DISPATCH_TOKEN" gh api "repos/$repo/actions/runs/$run_id" \
              --jq '"\(.status) \(.conclusion // "")"' 2>/dev/null || echo "unknown ")
            case "$st" in
              completed) printf '%s' "$cc"; return 0 ;;
              waiting)
                if [ "$approval" != "true" ]; then
                  echo "::error::${repo} run ${run_id} is waiting at the \`release\` environment: its release.yaml runs the rehearsal in the environment instead of in a credential-free plan job." >&2
                  printf 'blocked'; return 0
                fi
                if [ "$waits" -ge 360 ]; then
                  echo "::error::${repo} run ${run_id} was not approved within an hour." >&2
                  printf 'blocked'; return 0
                fi
                if [ "$waits" -eq 0 ]; then
                  echo "- ⏳ **${repo}** — cut awaiting approval: ${GITHUB_SERVER_URL}/${repo}/actions/runs/${run_id}" | tee -a "$GITHUB_STEP_SUMMARY" >&2
                fi
                waits=$((waits + 1)) ;;
              *) polls=$((polls + 1)) ;;
            esac
            sleep 10
          done
          echo "::error::${repo} run ${run_id} did not complete within the poll window" >&2
          printf 'timeout'; return 0
        }

        # Snapshot a repository's `vX…` and `<dir>/vX…` tags, one per line, sorted for `comm`.
        tag_set() { # $1=owner/repo
          gh api "repos/$1/git/matching-refs/tags" --paginate --jq '.[].ref' 2>/dev/null \
            | sed 's|refs/tags/||' | grep -E '(^|/)v[0-9]' | sort -u || true
        }

        # Splice the receipt region into the Epic body and print the new body. One START/END pair
        # in order is replaced in place, markers and old content together. Any other shape loses its
        # stray marker lines and gets one fresh region appended, so a hand-edit never drops prose.
        splice_body() { # $1=current body   $2=new region (incl. its markers)
          local body="$1" block="$2" s='<!-- release-train:receipts:start -->' e='<!-- release-train:receipts:end -->' ns ne sl el
          ns=$(printf '%s\n' "$body" | grep -cxF "$s" || true)
          ne=$(printf '%s\n' "$body" | grep -cxF "$e" || true)
          sl=$(printf '%s\n' "$body" | grep -nxF "$s" | head -1 | cut -d: -f1)
          el=$(printf '%s\n' "$body" | grep -nxF "$e" | head -1 | cut -d: -f1)
          # BLK arrives through ENVIRON, so awk does not interpret its backslash escapes.
          if [ "$ns" = "1" ] && [ "$ne" = "1" ] && [ "$sl" -lt "$el" ]; then
            printf '%s\n' "$body" | BLK="$block" awk -v s="$s" -v e="$e" '
              $0==s { print ENVIRON["BLK"]; skip=1; next } $0==e { skip=0; next } !skip { print }'
          else
            { printf '%s\n' "$body" | grep -vxF "$s" | grep -vxF "$e"; printf '\n%s' "$block"; }
          fi
        }

        # ================= 1. Discover the Epic's landed repos (newest-merged sibling anchors) =======
        echo "## 🚂 Release train — epic:#${EPIC} (org=${ORG})" | tee -a "$GITHUB_STEP_SUMMARY"
        echo "Requested by @${ACTOR}. dry_run=${dry}." | tee -a "$GITHUB_STEP_SUMMARY"

        if ! cands=$(search_prs "is:pr is:merged label:\"epic:${EPIC}\" org:${ORG}"); then
          echo "::error::could not reconstruct the Epic (GraphQL search failed after retries)"
          exit 1
        fi
        # One row per repository, for its newest-merged sibling. Siblings share a base under atomic
        # landing, so a tag that contains the newest merge contains them all. fd 3 keeps the REST
        # reads in the loop off its input.
        ledger='[]'
        while read -r repo number <&3; do
          if ! info=$(rest_pr_merge "$repo" "$number"); then
            echo "::error::REST read failed for ${repo}#${number} — cannot confirm the Epic; aborting."
            exit 1
          fi
          read -r merged sha <<<"$info"
          [ "$merged" = "true" ] && [ -n "$sha" ] || continue
          ledger=$(jq -cn --argjson acc "$ledger" --arg r "$repo" --arg s "$sha" '$acc + [{repo:$r, sha:$s}]')
        done 3< <(printf '%s' "$cands" | jq -r '
          group_by(.repository.nameWithOwner)
          | .[] | max_by(.mergedAt) | "\(.repository.nameWithOwner) \(.number)"')
        repo_n=$(printf '%s' "$ledger" | jq 'length')
        if [ "$repo_n" -eq 0 ]; then
          echo "::error::no merged PRs carry epic:${EPIC} in org ${ORG} — nothing to release."
          exit 1
        fi
        echo "### ${repo_n} repo(s) in epic:#${EPIC}" | tee -a "$GITHUB_STEP_SUMMARY"

        # ================= 2. Per repo: resume-skip → derive bump → rehearse → cut → receipt =======
        receipts='[]'
        had_failure=false

        # Appends the current $repo's receipt. $1 is its status: shipped, rehearsed, skipped, nochange,
        # botched, parked or failed:<why>. $2 is the cut tag, or the bump for a rehearsal, and empty
        # records a null tag.
        receipt() { # $1=status $2=tag
          receipts=$(jq -cn --argjson a "$receipts" --arg r "$repo" --arg s "$1" --arg t "${2:-}" \
            '$a + [{repo:$r, tag:(if $t == "" then null else $t end), status:$s}]')
        }

        # Records the current $repo as unfinished, which fails the run: receipt $1 with tag $3, and
        # summary line $2.
        unfinished() { # $1=status $2=summary line $3=tag
          had_failure=true
          receipt "$1" "${3:-}"
          echo "$2" | tee -a "$GITHUB_STEP_SUMMARY"
        }

        # Releases the ledger's repository $1, whose Epic merge is $2. Each outcome records one
        # receipt and returns.
        release_repo() { # $1=owner/repo $2=merge sha
          local repo="$1" merge_sha="$2" default_branch="" attempt last tc bump rid concl before after newtag=""

          # Resolve the default branch once, with retries, and fail closed on an unresolved ref.
          for attempt in 1 2 3; do
            default_branch=$(gh api "repos/$repo" --jq '.default_branch' 2>/dev/null || echo "")
            [ -n "$default_branch" ] && break
            sleep 2
          done
          if [ -z "$default_branch" ]; then
            unfinished failed:read "- ❌ **${repo}** — could not read the default branch; skipping."
            return 0
          fi

          # -- Ship-state of this Epic's merge, read from live tags ----------------------------------
          last=$(latest_tag "$repo")
          if [ "$last" = "__ERR__" ]; then
            unfinished failed:tagread "- ❌ **${repo}** — tag read failed after retries; skipping (fail-closed, never assume first-release)."
            return 0
          fi
          if [ -n "$last" ]; then
            # tag_contains returns 1 when the merge has not shipped and 2 on a read error. The `||`
            # list suspends `set -e` through the call, so either code reaches tc.
            tc=0
            tag_contains "$repo" "$last" "$merge_sha" || tc=$?
            if [ "$tc" -eq 2 ]; then
              unfinished failed:compare "- ❌ **${repo}** — could not compare \`${last}\` to the Epic merge; skipping (fail-closed)."
              return 0
            fi
            if [ "$tc" -eq 0 ] && release_exists "$repo" "$last"; then
              echo "- ⏭️  **${repo}** already shipped epic:#${EPIC} in \`${last}\` — skipping." | tee -a "$GITHUB_STEP_SUMMARY"
              receipt skipped "$last"
              return 0
            fi
            # A tag at or after the merge without a published Release is a botched cut. release-core
            # pushed the tag and failed before creating the Release. The action holds no
            # contents:write to create it, and a re-cut orphans this tag under a higher one. The
            # repository fails for manual repair, which publishes the Release or deletes the tag.
            if [ "$tc" -eq 0 ]; then
              unfinished botched "::error::${repo} — tag \`${last}\` exists (contains the Epic merge) but has NO published Release — a botched cut. Publish the Release for \`${last}\`, or delete the tag to let a re-dispatch re-cut it. Not skipping, not re-cutting." "$last"
              return 0
            fi
          fi

          # -- Not shipped: derive the bump ---------------------------------------------------------
          bump=$(derive_bump "$repo" "$last" "$default_branch")
          if [ "$bump" = "__ERR__" ]; then
            unfinished failed:bumpread "- ❌ **${repo}** — commit-range read failed after retries; skipping (fail-closed, never assume nothing-to-release)."
            return 0
          fi
          if [ "$bump" = "none" ]; then
            echo "- ⏭️  **${repo}** has nothing new since \`${last}\` — skipping." | tee -a "$GITHUB_STEP_SUMMARY"
            receipt nochange
            return 0
          fi

          # -- Rehearse: release.yaml with dry_run=true must succeed --------------------------------
          if ! rid=$(dispatch_release "$repo" "$default_branch" "$bump" true); then
            unfinished failed:dispatch "- ❌ **${repo}** — could not dispatch the rehearsal."
            return 0
          fi
          concl=$(poll_run "$repo" "$rid" false)
          if [ "$concl" = "blocked" ]; then
            unfinished parked "- ⏸️  **${repo}** — rehearsal parked at the release environment; its release.yaml runs the rehearsal inside that environment."
            return 0
          fi
          if [ "$concl" != "success" ]; then
            unfinished "failed:${concl}" "- ❌ **${repo}** — rehearsal (${bump}) did not pass (${concl}); not cutting."
            return 0
          fi

          if [ "$dry" != "false" ]; then
            echo "- 🧪 **${repo}** — rehearsed **${bump}** OK (dry-run; no tag cut)." | tee -a "$GITHUB_STEP_SUMMARY"
            receipt rehearsed "$bump"
            return 0
          fi

          # -- Cut: snapshot tags, dispatch live, poll, recover the new tag from the tag-set diff -----
          before=$(tag_set "$repo")
          if ! rid=$(dispatch_release "$repo" "$default_branch" "$bump" false); then
            unfinished failed:dispatch "- ❌ **${repo}** — could not dispatch the live release."
            return 0
          fi
          concl=$(poll_run "$repo" "$rid" true)
          if [ "$concl" = "blocked" ]; then
            # Recorded as parked, since the run can still cut the tag on approval. A re-dispatch
            # before that run clears starts a second cut, and both release once approved.
            unfinished parked "- ⏸️  **${repo}** — live release not approved within the hour (pending). Approve the run, then re-dispatch to record the receipt."
            return 0
          fi

          # Recover the cut tag from the tag-set diff, retrying the after-snapshot for ref-index lag.
          for attempt in 1 2 3 4; do
            after=$(tag_set "$repo")
            newtag=$(comm -13 <(printf '%s\n' "$before") <(printf '%s\n' "$after") | sort -V | tail -n1 || true)
            [ -n "$newtag" ] && break
            sleep 5
          done

          if [ "$concl" != "success" ]; then
            unfinished "failed:${concl}" "::error::${repo} — live release ${bump} did not complete cleanly (conclusion=${concl}, new tag='${newtag:-none}'). A tag it left without a published Release blocks a re-dispatch until someone publishes that Release or deletes the tag."
            return 0
          fi
          if [ -n "$newtag" ]; then
            echo "- ✅ **${repo}** — released \`${newtag}\` (${bump})." | tee -a "$GITHUB_STEP_SUMMARY"
            receipt shipped "$newtag"
            return 0
          fi
          # The run succeeded, so a tag was cut, but the lagging ref index does not show it yet.
          # Success is recorded with a null tag, and a resume confirms the tag from live tags. The
          # run conclusion alone decides, since a first release has no earlier tag to compare.
          echo "- ✅ **${repo}** — release ${bump} ran clean (new tag not yet visible; resume will confirm)." | tee -a "$GITHUB_STEP_SUMMARY"
          receipt shipped
        }

        while read -r repo merge_sha <&3; do
          release_repo "$repo" "$merge_sha"
        done 3< <(printf '%s' "$ledger" | jq -r '.[] | "\(.repo) \(.sha)"')

        # ================= 3. Receipt block on the Epic body (live runs only; best-effort audit) ====
        table=$(printf '%s' "$receipts" | jq -r '
          "| Repo | Result |", "| --- | --- |",
          (.[] | "| \(.repo) | \(
            if .status=="shipped" then (if .tag then "✅ `"+.tag+"`" else "✅ shipped" end)
            elif .status=="skipped" then "⏭️ already `"+.tag+"`"
            elif .status=="rehearsed" then "🧪 rehearsed "+.tag
            elif .status=="nochange" then "— nothing new"
            elif .status=="botched" then "⚠️ tag `"+.tag+"` without a Release — repair"
            elif .status=="parked" then "⏸️ parked (release-env approval)"
            else "❌ "+.status end) |")')
        if [ "$dry" = "false" ]; then
          block=$(printf '<!-- release-train:receipts:start -->\n### 🚂 Release train — epic:#%s (%s)\n%s\n<!-- release-train:receipts:end -->' \
            "$EPIC" "$(date -u +%Y-%m-%dT%H:%MZ)" "$table")
          # A failed read skips the write, because splicing into an empty body replaces the Epic's
          # prose and its frozen activation snapshot, which epic-membership, merge-gate and
          # detect-partial-landing read. A body read successfully as empty still splices, so the
          # guard tests the read's exit status. The run summary holds the same table either way.
          #
          # GitHub stores bodies with CRLF, so `tr` strips \r and the receipt markers match whole lines.
          if ! cur=$(gh api "repos/${ORG}/${PLANNING_REPO}/issues/${EPIC}" --jq '.body // ""' 2>/dev/null | tr -d '\r'); then
            echo "::warning::could not read epic:#${EPIC} — leaving its body untouched; the receipt table is in the run summary."
          else
            newbody=$(splice_body "$cur" "$block")
            printf '%s' "$newbody" | GH_TOKEN="$ISSUE_TOKEN" gh api "repos/${ORG}/${PLANNING_REPO}/issues/${EPIC}" \
              --method PATCH --field body=@- >/dev/null 2>&1 \
              || echo "::warning::could not update the receipt block on epic:#${EPIC} (issues:write?) — the table is still in the run summary."
          fi
        fi

        # ================= 4. Final status =========================================================
        { echo ""; printf '%s\n' "$table"; } | tee -a "$GITHUB_STEP_SUMMARY"
        if [ "$had_failure" = true ]; then
          echo "::error::Release train for epic:#${EPIC} finished with unfinished repos — re-dispatch to resume (shipped repos are skipped from live tags; only the unshipped are re-cut)."
          exit 1
        fi
        if [ "$dry" != "false" ]; then
          echo "DRY RUN — rehearsed every repo, cut no tag, did not touch the Epic body. Re-dispatch with dry_run=false to release." | tee -a "$GITHUB_STEP_SUMMARY"
        else
          echo "Release train for epic:#${EPIC} complete." | tee -a "$GITHUB_STEP_SUMMARY"
        fi
