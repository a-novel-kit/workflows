name: epic-membership
description: >
  Resolve an Epic's authorized member set across the workflow's organization.

  Membership is the `epic:<N>` label. Applying a label needs triage access, so the label is a
  permission-gated claim. A `Closes` keyword is author-controlled and defines no membership.

  Before activation the set is every open pull request labeled `epic:<N>`. Once merge-gate freezes
  an activation snapshot into the Epic body, the frozen set is the membership. A member de-labeled,
  closed or relabeled afterwards stays a member, and a pull request labeled later waits for the next
  wave. The snapshot fixes who the members are, and each member's state is read live on every run.
  A `pending` or `retired` marker counts as no snapshot, so the live label set applies.

  The action only reads. A missing Epic issue counts as no snapshot. The action fails when any other
  read of the Epic issue fails or the label search cannot complete, and it reports an empty set when
  it cannot re-read every frozen member. The caller decides whether either outcome holds or passes.

inputs:
  epic_number:
    required: true
    description: >
      Number N of the Epic issue. The action searches the `epic:<N>` label and reads the Epic's
      activation snapshot.
  planning_repo:
    required: false
    default: .github
    description: >
      Repository that holds the Epic issue, as a bare name in the workflow's organization. Defaults
      to the organization's `.github` repository.
  client_id:
    required: true
    description: >
      Client ID of the GitHub App that posts the `review-gate` check, installed on the organization
      with read access to issues, pull requests and checks. Only that App's `review-gate` runs count.
  app_private_key:
    required: true
    description: Private key (PEM) of that App.

outputs:
  members:
    description: >
      Compact JSON array of the members, sorted by repository then number. Each entry carries
      `repo` (owner/name), `number`, `headRefOid`, `isDraft`, `reviewDecision`, `reviewGate` and
      `state`. `reviewGate` is the conclusion of the latest `review-gate` run the App posted on the
      member's head, or null. `state` is always `OPEN` in the live set, and `OPEN`, `MERGED` or
      `CLOSED` in a frozen set. `[]` when the Epic has no members, or when a frozen member could not
      be re-read.
    value: ${{ steps.resolve.outputs.members }}
  count:
    description: Number of entries in `members`.
    value: ${{ steps.resolve.outputs.count }}

runs:
  using: composite
  steps:
    # The label search covers the whole organization, so the token spans every repository of the
    # installation. The workflow token sees one repository. This token only reads.
    - name: Mint token
      id: token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.client_id }}
        private-key: ${{ inputs.app_private_key }}
        owner: ${{ github.repository_owner }}
        permission-checks: read
        permission-issues: read
        permission-pull-requests: read

    - name: Resolve the authorized member set
      id: resolve
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        AGENT: ${{ steps.token.outputs.app-slug }}
        OWNER: ${{ github.repository_owner }}
        EPIC: ${{ inputs.epic_number }}
        PLANNING_REPO: ${{ inputs.planning_repo }}
      run: |
        set -euo pipefail

        # The head's `review-gate` conclusion counts only from the App this action authenticates as,
        # because any workflow can post a check run of that name.
        GATE_FIELDS='commits(last:1){nodes{commit{checkSuites(first:10, filterBy:{checkName:"review-gate"}){nodes{app{slug} checkRuns(last:1, filterBy:{checkName:"review-gate"}){nodes{conclusion}}}}}}}'
        GATE_JQ='([.commits.nodes[0].commit.checkSuites.nodes[]? | select(.app.slug == $agent) | .checkRuns.nodes[-1]?.conclusion] | last)'

        if [ -z "${EPIC:-}" ]; then
          echo "::error::epic_number is required"
          exit 1
        fi
        # `epic_number` goes into a quoted `label:` search qualifier. A non-numeric value could close
        # the quote and add search terms that broaden the set.
        if ! [[ "$EPIC" =~ ^[0-9]+$ ]]; then
          echo "::error::epic_number must be an integer, got \"$EPIC\""
          exit 1
        fi

        # Guard planning_repo before it becomes an API path component.
        if ! [[ "${PLANNING_REPO:-}" =~ ^[A-Za-z0-9._-]+$ ]]; then
          echo "::error::planning_repo must be a bare repository name (no owner/slash), got \"${PLANNING_REPO:-}\""
          exit 1
        fi

        # --- Activation snapshot -----------------------------------------------------------------
        # A frozen marker in the Epic body is the member set. Any other marker, or none, falls
        # through to the live label search.
        # Fences match whole lines, as in merge-gate's splice, so a fence string inside other text
        # cannot shadow the real region.
        START_M='<!-- epic-membership:snapshot:start -->'
        END_M='<!-- epic-membership:snapshot:end -->'
        # Only a 404, a missing Epic issue, means no snapshot. Any other read failure fails the action
        # after three attempts, because the live set may differ from a frozen one. merge-gate holds on
        # the empty output a failure leaves.
        errf="$RUNNER_TEMP/epic-membership-read.err"
        for attempt in 1 2 3; do
          body=$(gh api "repos/${OWNER}/${PLANNING_REPO}/issues/${EPIC}" --jq '.body // ""' 2>"$errf") && break
          body=""
          grep -q 'HTTP 404' "$errf" && break
          if [ "$attempt" -eq 3 ]; then
            echo "::error::Epic #${EPIC}: could not read its body for the activation snapshot: $(cat "$errf")"
            exit 1
          fi
          sleep 2
        done
        # A body edited on the web carries CRLF line endings. Stripping \r lets the fence lines match.
        body=$(printf '%s' "$body" | tr -d '\r')
        # The fenced region holds a note and then the JSON, which may span several lines, so parsing
        # starts at the first line that opens a value. `-s .[0]` takes the first value when a hand-edit
        # left several. Trailing prose inside the region voids the marker. merge-gate,
        # detect-partial-landing and epic-rollback extract the marker the same way.
        marker=$(printf '%s\n' "$body" \
          | awk -v s="$START_M" -v e="$END_M" '$0 == s {f=1;next} $0 == e {f=0} f' \
          | sed -n '/^[[:space:]]*[{[]/,$p' \
          | jq -s -c '.[0] // empty' 2>/dev/null || true)
        # Only a frozen marker listing 1 to 50 valid members counts, the cap merge-gate writes with. A
        # pending, malformed or misshapen marker leaves `frozen` empty, and the live search applies.
        #
        # The guards are strict because `.repo` and `.number` go into the GraphQL document below, and
        # anyone who can edit the Epic issue can write the marker. The repo pattern excludes quotes and
        # newlines, which could inject fields. The number must be a whole integer, because a value such
        # as 1.5 fails validation for the whole query.
        frozen=$(printf '%s' "$marker" | jq -c '
          select(type == "object" and .status == "frozen" and (.members | type == "array"))
          | .members
          | select(all(.[]; type == "object"
              and (.repo | type == "string") and (.repo | test("\\A[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9._-]+\\z"))
              and (.number | type == "number" and . == floor and . > 0 and . < 2147483648)))
          | unique_by((.repo | ascii_downcase), .number)
          | select(length > 0 and length <= 50)' 2>/dev/null || true)
        if [ -n "$frozen" ]; then
          # Re-read each frozen member's live state, one GraphQL alias per member in a single call.
          # GitHub answers a multi-alias query with partial data and an `errors` array, so the answer
          # must cover every member. An incomplete answer yields [], which merge-gate holds on, so the
          # gate never passes a wave with a member it did not evaluate.
          #
          # Each node matches its member by alias index and number. GraphQL follows a repository
          # rename and answers with the new name, while a frozen marker keeps the old one, so the
          # match leaves the name out.
          alias_q=$(printf '%s' "$frozen" | jq -r 'to_entries | map(
              "m\(.key): repository(owner:\"\(.value.repo|split("/")[0])\", name:\"\(.value.repo|split("/")[1])\")"
              + "{pullRequest(number:\(.value.number|floor)){number isDraft reviewDecision headRefOid state repository{nameWithOwner} \($gate)}}"
            ) | join("\n")' --arg gate "$GATE_FIELDS")
          want=$(printf '%s' "$frozen" | jq 'length')
          rh='{}'
          for attempt in 1 2 3; do
            out=$(gh api graphql -f query="{ ${alias_q} }" 2>&1 || true)
            if printf '%s' "$out" | jq -e --argjson want "$want" '
                 (has("errors") | not)
                 and (((.data // {}) | to_entries | map(.value.pullRequest | select(. != null)) | length) == $want)
               ' >/dev/null 2>&1; then
              rh="$out"; break
            fi
            [ "$attempt" -lt 3 ] && sleep 2
          done
          members=$(printf '%s' "$rh" | jq -c --argjson members "$frozen" --arg agent "$AGENT" '
            [ (.data // {}) | to_entries[]
              | (.key | ltrimstr("m") | tonumber) as $i
              | .value.pullRequest | select(. != null)
              | select($members[$i] != null and .number == ($members[$i].number | floor))
              | {repo: .repository.nameWithOwner, number, headRefOid, isDraft, reviewDecision, reviewGate: '"$GATE_JQ"', state} ]
            | sort_by((.repo | ascii_downcase), .number)' 2>/dev/null || printf '[]')
          if [ "$(printf '%s' "$members" | jq 'length')" -ne "$want" ]; then
            echo "::warning::Epic #${EPIC}: could not re-read all ${want} frozen member(s) — reporting an empty set, which holds the Epic rather than gating on a partial one."
            members='[]'
          fi
          count=$(printf '%s' "$members" | jq 'length')
          {
            echo "members=$members"
            echo "count=$count"
          } >> "$GITHUB_OUTPUT"
          echo "Epic #${EPIC}: ${count} member(s) from the frozen activation snapshot (live state)." \
            | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        # Live membership: open pull requests labeled `epic:<N>` across the organization. The label
        # name is quoted because of its colon. The search index is eventually consistent, so a pull
        # request labeled seconds ago can be missing and a just-closed one can still appear. merge-gate
        # holds a pull request missing from its own set, and its two-phase capture gives a lagging
        # member time to appear before the set freezes.
        search="is:pr is:open label:\"epic:${EPIC}\" org:${OWNER}"

        # The search returns the ISSUE union, so pull requests come through the PullRequest fragment.
        q='query($q:String!,$cursor:String){
          search(query:$q, type:ISSUE, first:100, after:$cursor){
            pageInfo{ hasNextPage endCursor }
            nodes{ ... on PullRequest{
              number isDraft reviewDecision headRefOid
              repository{ nameWithOwner } '"$GATE_FIELDS"' } } } }'

        # Retry transient GraphQL failures. An unresolvable set fails the action with the underlying
        # error, and the caller chooses between holding and passing.
        fetch() { # $1=cursor  → prints the response JSON on success, nothing on failure
          # Both variables are GraphQL strings, so they pass with -f, which skips the type coercion
          # -F applies to true, false, numbers and a leading @.
          local args=(-f query="$q" -f q="$search")
          [ -n "${1:-}" ] && args+=(-f cursor="$1")
          local data
          for attempt in 1 2 3; do
            # Capture stdout and stderr together, so the final failure can echo a transport, auth,
            # rate-limit or query error. On success gh prints only the response JSON, which jq checks.
            if data=$(gh api graphql "${args[@]}" 2>&1) \
              && printf '%s' "$data" | jq -e 'has("data") and (has("errors") | not)' >/dev/null 2>&1; then
              printf '%s' "$data"
              return 0
            fi
            [ "$attempt" -lt 3 ] && sleep 2
          done
          # fetch runs in a command substitution, where the caller cannot see $data, so the error is
          # echoed here.
          printf 'epic-membership: GraphQL fetch failed after 3 attempts: %s\n' "$data" >&2
          return 1
        }

        # Accumulate nodes across pages, since an Epic can span more than 100 pull requests.
        # `(.data.search.nodes // [])[]` tolerates a null `nodes`, and `.number != null` drops any row
        # of the ISSUE union that is not a pull request.
        agg='[]'
        cursor=""
        while :; do
          if ! resp=$(fetch "$cursor"); then
            echo "::error::could not resolve epic:${EPIC} members — GraphQL search failed after retries (caller decides hold vs fail-open)"
            exit 1
          fi
          page=$(printf '%s' "$resp" | jq '[(.data.search.nodes // [])[] | select(.number != null)]')
          agg=$(jq -s '.[0] + .[1]' <(printf '%s' "$agg") <(printf '%s' "$page"))
          [ "$(printf '%s' "$resp" | jq -r '.data.search.pageInfo.hasNextPage')" = "true" ] || break
          cursor=$(printf '%s' "$resp" | jq -r '.data.search.pageInfo.endCursor')
        done

        # `jq -c` keeps the output on one line, because GITHUB_OUTPUT is line-based. Search order
        # varies between runs, so the set is sorted by repo then number.
        members=$(printf '%s' "$agg" | jq -c --arg agent "$AGENT" '[.[] | {
          repo: .repository.nameWithOwner,
          number,
          headRefOid,
          isDraft,
          reviewDecision,
          reviewGate: '"$GATE_JQ"',
          state: "OPEN"
        }] | sort_by((.repo | ascii_downcase), .number)')
        count=$(printf '%s' "$members" | jq 'length')

        {
          echo "members=$members"
          echo "count=$count"
        } >> "$GITHUB_OUTPUT"
        echo "Epic #${EPIC}: ${count} authorized member(s) (open \`epic:${EPIC}\` PR(s))." \
          | tee -a "$GITHUB_STEP_SUMMARY"
