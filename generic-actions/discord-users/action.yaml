name: discord-users
description: >
  Deprecated, use generic-actions/chat-users, which this action runs with the same inputs. Its
  chat_ids output replaces discord_ids. The next major removes this action.

inputs:
  github_user_ids:
    required: true
    description: Forwarded to chat-users.
  bws_access_token:
    required: false
    default: ""
    description: Forwarded to chat-users.
  bws_server_url:
    required: false
    default: ""
    description: Forwarded to chat-users.

outputs:
  discord_ids:
    description: chat-users' chat_ids output.
    value: ${{ steps.resolve.outputs.chat_ids }}

runs:
  using: composite
  steps:
    - name: Warn that discord-users is deprecated
      shell: bash
      run: |
        echo "::warning::generic-actions/discord-users is deprecated, and the next major removes it. Call generic-actions/chat-users, which takes the same inputs, and read its chat_ids output."
    - id: resolve
      uses: a-novel-kit/workflows/generic-actions/chat-users@v1.85.0
      with:
        github_user_ids: ${{ inputs.github_user_ids }}
        bws_access_token: ${{ inputs.bws_access_token }}
        bws_server_url: ${{ inputs.bws_server_url }}
