name: assign bot (deprecated)
description: >
  Deprecated alias of `assign-author`, which assigns a pull request to its author. Call that action
  instead; this one goes in the next major.

inputs:
  github_token:
    required: true
    description: Token with pull requests write, which adds the assignee.

runs:
  using: composite
  steps:
    - name: Warn about the deprecated name
      shell: bash
      run: echo "::warning::generic-actions/assign-bot is deprecated; call generic-actions/assign-author with the same inputs."
    - uses: a-novel-kit/workflows/generic-actions/assign-author@v1.87.0
      with:
        github_token: ${{ inputs.github_token }}
