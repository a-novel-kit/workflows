name: archive board items
description: >
  Archive the board items in a terminal state and close their issues. An item matches when its
  Status is one of `status`, or, with `archive_closed`, when its issue is closed. `repo` limits the
  matches to one repository, and "*" lifts the limit. Archiving a Projects v2 item leaves its issue
  open, so the action also closes each archived issue unless `close` is "false". Archived items are
  skipped, so a re-run is safe.

inputs:
  client_id:
    required: true
    description: >
      Client ID of a GitHub App installed on the org that runs the workflow, with organization
      Projects write and Issues write. The default workflow token cannot reach an org's Projects v2.
  app_private_key:
    required: true
    description: Private key (PEM) of that App.
  status:
    required: false
    default: Awaiting release
    description: >
      Comma-separated Status values to archive, such as "Awaiting release" or "Applied". An item
      matches when its Status is any of them. Ignored when `archive_closed` is "true".
  repo:
    required: false
    default: ""
    description: >
      Repository (owner/name) whose items to match. Empty means the running repository, and "*"
      matches items from every repository.
  close:
    required: false
    default: "true"
    description: >
      When "true" (default), also close the issue behind each archived item. A pull request or a
      draft item has no issue to close and is only archived.
  archive_closed:
    required: false
    default: "false"
    description: >
      When "true", ignore `status` and archive every item whose issue is closed. Pull request and
      draft items never match.
  project_id:
    required: true
    description: >
      Node id of the Projects v2 board (PVT_…). Find it with: gh project view <n> --owner <org>
      --format json.
  dry_run:
    required: false
    default: "false"
    description: When "true", log what would be archived without archiving anything.

runs:
  using: composite
  steps:
    # The token holds the two permissions the archive and the close need, which bounds a leak to
    # board edits and issue writes.
    - name: Mint org-Projects token
      id: token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.client_id }}
        private-key: ${{ inputs.app_private_key }}
        owner: ${{ github.repository_owner }}
        permission-organization-projects: write
        permission-issues: write # close each archived issue

    - name: Archive (and close) terminal board items
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        REPO_IN: ${{ inputs.repo }}
        STATUS: ${{ inputs.status }}
        CLOSE: ${{ inputs.close }}
        ARCHIVE_CLOSED: ${{ inputs.archive_closed }}
        PROJECT_ID: ${{ inputs.project_id }}
        DRY_RUN: ${{ inputs.dry_run }}
      run: |
        set -euo pipefail

        proj_id="$PROJECT_ID"
        if [ -z "$proj_id" ]; then
          echo "::error::project_id is required (the org \"Tasks\" board node id)"
          exit 1
        fi

        REPO_FULL="${REPO_IN:-$GITHUB_REPOSITORY}"

        # Page the board and keep the unarchived items that match. Skipping archived items makes a
        # re-run or an overlapping trigger a no-op.
        items_q='
          query($proj:ID!,$cursor:String){ node(id:$proj){ ... on ProjectV2{
            items(first:100, after:$cursor){
              pageInfo{ hasNextPage endCursor }
              nodes{ id isArchived
                status: fieldValueByName(name:"Status"){
                  ... on ProjectV2ItemFieldSingleSelectValue{ name } }
                content{
                  ... on Issue{ repository{ nameWithOwner } number url state }
                  ... on PullRequest{ repository{ nameWithOwner } number url } } } } } } }'

        matches=$(mktemp)
        cursor=""
        while :; do
          args=(-F proj="$proj_id")
          [ -n "$cursor" ] && args+=(-F cursor="$cursor")
          resp=$(gh api graphql -f query="$items_q" "${args[@]}")
          echo "$resp" | jq -c --arg repo "$REPO_FULL" --arg status "$STATUS" --arg closed "$ARCHIVE_CLOSED" '
            ($status | split(",") | map(gsub("^\\s+|\\s+$";""))) as $statuses
            | .data.node.items.nodes[]
            | select(
                (.isArchived | not)
                and (if $closed == "true"
                     then (.content.state == "CLOSED")
                     else ((.status.name // "") as $sn | ($statuses | any(. == $sn))) end)
                and ($repo == "*" or (.content.repository.nameWithOwner // "") == $repo))
            | {id, number: .content.number, url: .content.url, repo: (.content.repository.nameWithOwner // "")}' >> "$matches"
          [ "$(echo "$resp" | jq -r '.data.node.items.pageInfo.hasNextPage')" = "true" ] || break
          cursor=$(echo "$resp" | jq -r '.data.node.items.pageInfo.endCursor')
        done

        count=$(grep -c '' "$matches" || true)
        kind=$([ "$ARCHIVE_CLOSED" = "true" ] && echo "closed" || echo "'$STATUS'")
        echo "Found ${count:-0} ${kind} item(s) for $REPO_FULL." | tee -a "$GITHUB_STEP_SUMMARY"
        [ "${count:-0}" -eq 0 ] && exit 0

        # Archive each match and close its issue, or report it under dry_run.
        archive_m='mutation($proj:ID!,$item:ID!){
          archiveProjectV2Item(input:{projectId:$proj,itemId:$item}){ item{ id } } }'
        while IFS= read -r row; do
          id=$(echo "$row" | jq -r '.id')
          num=$(echo "$row" | jq -r '.number')
          url=$(echo "$row" | jq -r '.url')
          rp=$(echo "$row" | jq -r '.repo')
          verb=$([ "$CLOSE" = "true" ] && echo "archive+close" || echo "archive")
          if [ "$DRY_RUN" = "true" ]; then
            echo "- [dry-run] would $verb #$num ($url)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            gh api graphql -f query="$archive_m" -F proj="$proj_id" -F item="$id" >/dev/null
            # The close is best-effort, since a pull request or draft item has no issue to close.
            if [ "$CLOSE" = "true" ] && [ -n "$num" ] && [ "$num" != "null" ] && [ -n "$rp" ] && [ "$rp" != "null" ]; then
              gh issue close "$num" --repo "$rp" --reason completed >/dev/null 2>&1 || true
            fi
            echo "- ${verb}d #$num ($url)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
        done < "$matches"
