name: publish npm
description: Set up Node, build the package, and publish it to the GitHub npm registry.

inputs:
  build_action:
    required: false
    description: The name of the build command in the package file.
    default: build
  github_token:
    required: true
    description: The GitHub token to use for the action.
  ref:
    required: false
    description: >
      Ref to check out and publish from. A dispatched release passes its new tag, so the package
      carries the bumped version. Empty publishes the triggering ref.
    default: ""

runs:
  using: "composite"
  steps:
    - uses: a-novel-kit/workflows/node-actions/setup-node@v1.67.0
      with:
        github_token: ${{ inputs.github_token }}
        ref: ${{ inputs.ref }}
    - name: build
      shell: bash
      env:
        BUILD_ACTION: ${{ inputs.build_action }}
      run: pnpm run "$BUILD_ACTION"
    - run: pnpm publish -r --access public
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.github_token }}
