name: publish npm
description: >
  Set up Node, build the workspace packages, attest their tarballs and publish those tarballs to the
  GitHub npm registry. The attestation names the run's ref, so a consumer can tell a tag's release
  from a version a branch published. The calling job needs packages, attestations and id-token write.

inputs:
  build_action:
    required: false
    description: The name of the build command in the package file.
    default: build
  github_token:
    required: true
    description: The GitHub token to use for the action.
  ref:
    required: false
    description: >
      Ref to check out and publish from. A dispatched release passes its new tag, so the package
      carries the bumped version. Empty publishes the triggering ref.
    default: ""

runs:
  using: "composite"
  steps:
    - uses: a-novel-kit/workflows/node-actions/setup-node@v1.67.2
      with:
        github_token: ${{ inputs.github_token }}
        ref: ${{ inputs.ref }}
    - name: build
      shell: bash
      env:
        BUILD_ACTION: ${{ inputs.build_action }}
      run: pnpm run "$BUILD_ACTION"
    # A re-run skips the versions an earlier attempt published, since the registry refuses them.
    - name: Pack the unpublished packages
      id: pack
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.github_token }}
      run: |
        set -euo pipefail
        out="$RUNNER_TEMP/npm"
        mkdir -p "$out"
        pnpm -r ls --depth -1 --json | jq -r '.[] | select(.private | not) | [.name, .version, .path] | @tsv' |
          while IFS=$'\t' read -r name version dir; do
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published."
            else
              pnpm -C "$dir" pack --pack-destination "$out"
            fi
          done
        echo "dir=$out" >> "$GITHUB_OUTPUT"
        echo "count=$(find "$out" -name '*.tgz' | wc -l)" >> "$GITHUB_OUTPUT"
    - name: Attest the tarballs
      if: ${{ steps.pack.outputs.count != '0' }}
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: ${{ steps.pack.outputs.dir }}/*.tgz
        # Verification needs only the signed attestation; a linked-artifact record needs a broader
        # permission.
        create-storage-record: false
    - name: Publish the attested tarballs
      if: ${{ steps.pack.outputs.count != '0' }}
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.github_token }}
        DIR: ${{ steps.pack.outputs.dir }}
      run: |
        set -euo pipefail
        for tarball in "$DIR"/*.tgz; do
          npm publish "$tarball" --access public
        done
