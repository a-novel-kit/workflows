name: release core (hotfix)
description: >
  Cut the next patch of a release line, release/vX.Y, which carries backported fixes on top of a
  release tag. It runs release-core's bump.mjs and plan.mjs on the line instead of the default
  branch, and pushes the bump commit to the line with the vX.Y.(Z+1) tags, so the line's head stays
  its latest patch. The release is not marked latest, so a patch to an old line leaves a newer
  release in place.

  A separate action keeps a change to this exception path away from the everyday release path. The
  caller owns the lock and the human gate.

inputs:
  cli_version:
    required: true
    description: >
      a-novel CLI release to install, with or without the leading v. The caller pins it, so Renovate
      bumps it per repository and every release runs a reviewed CLI. Annotate it:
      `# renovate: datasource=go depName=github.com/a-novel-kit/stack/cli`.
  ref:
    required: true
    description: >
      The release line to cut, release/vX.Y, carrying backported fixes on top of its latest release
      tag. The version in the line's package.json must name a released tag that the line descends
      from, which the cut asserts.
  client_id:
    required: false
    default: ""
    description: >
      Client ID of the release App. It needs contents write and the bypass of the tags and
      release-lines rulesets, since the vX.Y.(Z+1) tag and the line are protected. Required unless
      dry_run.
  app_private_key:
    required: false
    default: ""
    description: >
      Private key (PEM) of the App that client_id names. Required unless dry_run.
  dry_run:
    required: false
    default: "false"
    description: >
      Only "false", ignoring case and whitespace, commits, tags, pushes and releases. Any other value
      bumps and reports the version and tags, then reverts the working tree. A dry run mints no token,
      so it needs no credential.

outputs:
  version:
    description: The bumped hotfix version (e.g. 1.4.6).
    value: ${{ steps.cut.outputs.version }}
  tag:
    description: The root hotfix tag, vX.Y.Z.
    value: ${{ steps.cut.outputs.tag }}
  tags:
    description: Every tag cut, one per line, the root vX.Y.Z followed by any <subdir>/vX.Y.Z sub-module tags.
    value: ${{ steps.cut.outputs.tags }}

runs:
  using: composite
  steps:
    - name: Resolve dry_run
      id: dry
      shell: bash
      env:
        DRY_RUN: ${{ inputs.dry_run }}
      run: |
        set -euo pipefail
        dry=$(printf '%s' "${DRY_RUN:-}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
        [ "$dry" = false ] || dry=true
        echo "dry_run=$dry" >> "$GITHUB_OUTPUT"

    - name: Mint push token
      id: token
      if: ${{ steps.dry.outputs.dry_run == 'false' }}
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.client_id }}
        private-key: ${{ inputs.app_private_key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-contents: write

    # The App checks out the release line with full history and tags, so the baseline assert and
    # the tag resolve. The line goes into a sub-path, so the root workspace stays on the caller's ref
    # for any local `./` action the caller runs after the cut.
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        token: ${{ steps.token.outputs.token || github.token }}
        ref: ${{ inputs.ref }}
        path: __hotfix
        fetch-depth: 0
        fetch-tags: true

    - name: Setup node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: lts/*
    # Only repos that stamp docs, through a prepublish:doc script, need the a-novel CLI.
    - name: Detect prepublish:doc
      id: stamp
      working-directory: __hotfix
      shell: bash
      run: |
        if node -e "process.exit(require('./package.json').scripts?.['prepublish:doc']?0:1)" 2>/dev/null; then
          echo "needed=true" >> "$GITHUB_OUTPUT"
        else
          echo "needed=false" >> "$GITHUB_OUTPUT"
        fi
    # prepublish:doc scripts call pnpm, and Node ships without Corepack from v25 on.
    - name: Setup pnpm
      if: ${{ steps.stamp.outputs.needed == 'true' }}
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        package_json_file: __hotfix/package.json
    - name: Setup Go
      if: ${{ steps.stamp.outputs.needed == 'true' }}
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable
        cache: false
    - name: Install a-novel CLI (for stamp)
      if: ${{ steps.stamp.outputs.needed == 'true' }}
      shell: bash
      env:
        CLI_VERSION: ${{ inputs.cli_version }}
      run: |
        go install "github.com/a-novel-kit/stack/cli/cmd/a-novel@v${CLI_VERSION#v}"

    - name: Cut hotfix
      id: cut
      working-directory: __hotfix
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        APP_SLUG: ${{ steps.token.outputs.app-slug }}
        DRY_RUN: ${{ steps.dry.outputs.dry_run }}
        STAMP_NEEDED: ${{ steps.stamp.outputs.needed }}
        BRANCH: ${{ inputs.ref }}
      run: |
        set -euo pipefail

        # The absolute $GITHUB_ACTION_PATH runs this release's bump.mjs and plan.mjs on the line's
        # tree, whatever the line's own copy of them.
        RC="$GITHUB_ACTION_PATH/../release-core"
        export RELEASE_TYPE=patch

        git config user.name "${APP_SLUG}[bot]"
        git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"

        # bump.mjs patches the version in the line's package.json, so that baseline must be a released
        # tag and the line must descend from it.
        baseline=$(node -p "require('./package.json').version")
        if ! git rev-parse -q --verify "refs/tags/v${baseline}" >/dev/null; then
          echo "::error::baseline v${baseline} (this ref's package.json version) is not a released tag — a hotfix must be cut from a release tag, not an arbitrary commit."
          exit 1
        fi
        if ! git merge-base --is-ancestor "refs/tags/v${baseline}" HEAD; then
          echo "::error::HEAD does not descend from baseline v${baseline} — the release line was not cut from that release tag."
          exit 1
        fi

        node "$RC/bump.mjs"
        version=$(node -p "require('./package.json').version")

        # Refresh doc version refs where a prepublish:doc script exists. The env var skips pnpm's
        # pre-run install, which needs npm-registry auth.
        if [ "$STAMP_NEEDED" = "true" ]; then
          PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN=false pnpm run prepublish:doc
        fi

        # plan.mjs stamps in-repository version references and prints the tags.
        tags=$(node "$RC/plan.mjs")
        root_tag="v${version}"

        # Refuse when any computed tag already exists, which means a stale-baseline cut or a re-run.
        # Every tag is checked up front, so a partial set is never pushed before the failure.
        while IFS= read -r t; do
          [ -n "$t" ] || continue
          if git rev-parse -q --verify "refs/tags/$t" >/dev/null; then
            echo "::error::tag $t already exists — refusing to overwrite (stale baseline or a re-run?)."
            exit 1
          fi
        done <<< "$tags"

        {
          echo "version=$version"
          echo "tag=$root_tag"
          echo "tags<<__TAGS__"
          printf '%s\n' "$tags"
          echo "__TAGS__"
        } >> "$GITHUB_OUTPUT"
        {
          echo "Hotfix **$version** (patch of v${baseline}) — tags:"
          printf '%s\n' "$tags" | sed 's/^/- `/; s/$/`/'
        } | tee -a "$GITHUB_STEP_SUMMARY"

        if [ "$DRY_RUN" = "true" ]; then
          echo "[dry-run] no commit, tag, push, or release." | tee -a "$GITHUB_STEP_SUMMARY"
          git checkout -- . 2>/dev/null || true
          exit 0
        fi

        # Commit the bump and push it to the line with the tags, atomically, so the line never
        # moves without its tag.
        git add -A
        git commit -m "chore(release): $version"
        tag_refs=()
        while IFS= read -r t; do
          [ -n "$t" ] || continue
          git tag "$t"
          tag_refs+=("refs/tags/$t")
        done <<< "$tags"

        git push --atomic origin "HEAD:refs/heads/$BRANCH" "${tag_refs[@]}"

        # --latest=false keeps a patch to an old line from becoming the repo's "Latest" release over
        # a newer version. The tag already exists, so --target only records the line on the release,
        # which is how notify-release tells a hotfix apart.
        gh release create "$root_tag" --repo "$GITHUB_REPOSITORY" --target "$BRANCH" \
          --title "${GITHUB_REPOSITORY#*/} ${version}" --generate-notes --latest=false
        echo "- ✓ hotfix released $(printf '%s\n' "$tags" | grep -c .) tag(s), root \`$root_tag\` (not latest)" | tee -a "$GITHUB_STEP_SUMMARY"
