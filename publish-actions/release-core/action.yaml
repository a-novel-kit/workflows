name: release core
description: >
  Cut a release in CI. It bumps the version of every workspace package.json, stamps in-repository
  version references, commits, pushes the root vX.Y.Z tag with any sub-module tags, and creates the
  GitHub Release. The caller's cut job runs in the protected `release` environment, which holds the
  release App's key. A dry run rehearses without a credential, outside that environment.

inputs:
  cli_version:
    required: true
    description: >
      a-novel CLI release to install, with or without the leading v. The caller pins it, so Renovate
      bumps it per repository and every release runs a reviewed CLI. Annotate it:
      `# renovate: datasource=go depName=github.com/a-novel-kit/stack/cli`.
  release_type:
    required: true
    description: Semver bump to apply, one of patch, minor or major.
  client_id:
    required: false
    default: ""
    description: >
      Client ID of the release App. It needs contents and workflows write and the release rulesets'
      bypass, since the bump commit lands on the protected default branch and the tags are
      protected. Required unless dry_run.
  app_private_key:
    required: false
    default: ""
    description: >
      Private key (PEM) of the App that client_id names. Required unless dry_run.
  dry_run:
    required: false
    default: "false"
    description: >
      Only "false", ignoring case and whitespace, commits, tags, pushes and releases. Any other value
      bumps and reports the version and tags, then reverts the working tree. A dry run mints no token,
      so it runs outside the release environment.

outputs:
  version:
    description: The bumped version (e.g. 1.2.3).
    value: ${{ steps.cut.outputs.version }}
  tag:
    description: The root release tag, vX.Y.Z.
    value: ${{ steps.cut.outputs.tag }}
  tags:
    description: Every tag cut, one per line, the root vX.Y.Z followed by any <subdir>/vX.Y.Z sub-module tags.
    value: ${{ steps.cut.outputs.tags }}

runs:
  using: composite
  steps:
    # A tag cut from another branch names the wrong commit, so any other ref fails before a token
    # is minted. A cut whose job is outside the `release` environment reads an empty key. Every later
    # step reads the dry_run this guard resolves.
    - name: Guard — default branch and credentials
      id: guard
      shell: bash
      env:
        REF_NAME: ${{ github.ref_name }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        DRY_RUN: ${{ inputs.dry_run }}
        HAS_KEY: ${{ inputs.app_private_key != '' && inputs.client_id != '' }}
      run: |
        set -euo pipefail
        if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
          echo "::error::releases run from the default branch ($DEFAULT_BRANCH) only — got '$REF_NAME'"
          exit 1
        fi
        dry=$(printf '%s' "${DRY_RUN:-}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
        [ "$dry" = false ] || dry=true
        if [ "$dry" = false ] && [ "$HAS_KEY" != "true" ]; then
          echo "::error::a cut needs the release App's client ID and key; run its job in the \`release\` environment"
          exit 1
        fi
        echo "dry_run=$dry" >> "$GITHUB_OUTPUT"

    # The self-pin sync rewrites `.github/workflows/*`, and GitHub refuses an App push touching a
    # workflow file without workflows write (GH013).
    - name: Mint push token
      id: token
      if: ${{ steps.guard.outputs.dry_run == 'false' }}
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.client_id }}
        private-key: ${{ inputs.app_private_key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-contents: write
        permission-workflows: write

    # Full history and tags resolve the tag and the release notes. The checkout keeps no credential,
    # so the steps before the push never see the release token. A dry run reads with the job's own
    # token.
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        token: ${{ steps.token.outputs.token || github.token }}
        ref: ${{ github.ref_name }}
        fetch-depth: 0
        fetch-tags: true
        persist-credentials: false

    - name: Setup node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: lts/*
    # Only repos that stamp docs, through a prepublish:doc script, need the a-novel CLI.
    - name: Detect prepublish:doc
      id: stamp
      shell: bash
      run: |
        if node -e "process.exit(require('./package.json').scripts?.['prepublish:doc']?0:1)" 2>/dev/null; then
          echo "needed=true" >> "$GITHUB_OUTPUT"
        else
          echo "needed=false" >> "$GITHUB_OUTPUT"
        fi
    # prepublish:doc scripts call pnpm, and Node ships without Corepack from v25 on.
    - name: Setup pnpm
      if: ${{ steps.stamp.outputs.needed == 'true' }}
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - name: Setup Go
      if: ${{ steps.stamp.outputs.needed == 'true' }}
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable
        # Go only installs the a-novel CLI here.
        cache: false
    - name: Install a-novel CLI (for stamp)
      if: ${{ steps.stamp.outputs.needed == 'true' }}
      shell: bash
      env:
        CLI_VERSION: ${{ inputs.cli_version }}
      run: |
        go install "github.com/a-novel-kit/stack/cli/cmd/a-novel@v${CLI_VERSION#v}"

    - name: Cut release
      id: cut
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        APP_SLUG: ${{ steps.token.outputs.app-slug }}
        RELEASE_TYPE: ${{ inputs.release_type }}
        DRY_RUN: ${{ steps.guard.outputs.dry_run }}
        BRANCH: ${{ github.ref_name }}
        STAMP_NEEDED: ${{ steps.stamp.outputs.needed }}
      run: |
        set -euo pipefail

        case "$RELEASE_TYPE" in
          patch | minor | major) ;;
          *) echo "::error::release_type must be patch, minor, or major (got '$RELEASE_TYPE')"; exit 1 ;;
        esac

        git config user.name "${APP_SLUG}[bot]"
        git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"

        # Plain Node bumps every workspace package.json, which skips pnpm's cold-store dependency checks.
        node "$GITHUB_ACTION_PATH/bump.mjs"

        # Refresh doc version refs through `a-novel publish stamp` where that script exists.
        # The env var skips pnpm's pre-run install, which would need npm-registry auth.
        if [ "$STAMP_NEEDED" = "true" ]; then
          PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN=false pnpm run prepublish:doc
        fi

        version=$(node -p "require('./package.json').version")

        # plan.mjs stamps in-repository version references, self-pins included, and prints the tags.
        tags=$(node "$GITHUB_ACTION_PATH/plan.mjs" --self-pins)
        root_tag="v${version}"

        {
          echo "version=$version"
          echo "tag=$root_tag"
          echo "tags<<__TAGS__"
          printf '%s\n' "$tags"
          echo "__TAGS__"
        } >> "$GITHUB_OUTPUT"
        {
          echo "Release **$version** (bump: $RELEASE_TYPE) — tags:"
          printf '%s\n' "$tags" | sed 's/^/- `/; s/$/`/'
        } | tee -a "$GITHUB_STEP_SUMMARY"

        if [ "$DRY_RUN" = "true" ]; then
          echo "[dry-run] no commit, tag, push, or release." | tee -a "$GITHUB_STEP_SUMMARY"
          git checkout -- . 2>/dev/null || true
          exit 0
        fi

        git add -A
        git commit -m "chore(release): $version"
        tag_refs=()
        while IFS= read -r t; do
          [ -n "$t" ] || continue
          git tag "$t"
          tag_refs+=("refs/tags/$t")
        done <<< "$tags"
        # GitHub creates no push event for more than three tags in one push, so a release with more
        # sub-module tags would not start its tag-triggered publishing run.
        # The checkout kept no credential, so the release token reaches git for this push alone, as the
        # header actions/checkout would have written.
        auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
        GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}" \
          git push --atomic origin "HEAD:$BRANCH" "${tag_refs[@]}"
        gh release create "$root_tag" --repo "$GITHUB_REPOSITORY" \
          --title "${GITHUB_REPOSITORY#*/} ${version}" --generate-notes
        echo "- ✓ released $(printf '%s\n' "$tags" | grep -c .) tag(s), root \`$root_tag\`" | tee -a "$GITHUB_STEP_SUMMARY"
