name: lint semgrep
description: >
  Enforce the A-Novel structural conventions that golangci-lint cannot express, such as a call that
  must be present or a pairing that must hold. The ruleset ships with the action, so a consuming repo
  carries no semgrep config. Semgrep reads the rules from disk, so no rule registry can stall the
  scan.

inputs:
  ruleset:
    required: false
    default: "service"
    description: >
      Ruleset to enforce. "service" fits the clean-architecture layout. A repository that no ruleset
      fits runs no lint-semgrep job.
  advisory:
    required: false
    default: "false"
    description: >
      When "true", findings go to the run summary and the log, and the check passes. When "false",
      any finding fails the check. A scan that fails to run fails either way.
  version:
    required: false
    description: >
      semgrep image tag and digest, as `<tag>@sha256:<digest>`, for a repo that must hold its own
      release. Empty runs the image this action pins, which Renovate moves here. A tag alone fails
      the step: it would run whatever image the tag names.

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: semgrep
      shell: bash
      env:
        RULESET: ${{ inputs.ruleset }}
        ADVISORY: ${{ inputs.advisory }}
        SEMGREP_VERSION: ${{ inputs.version }}
        # The pinned default, under the key the base Renovate preset's workflow regex reads.
        # renovate: datasource=docker depName=semgrep/semgrep
        version: "1.187.0@sha256:0c8dfa7aa1ca8c50233ec9110e8cd88d139dedd603d56507493f74c6f4b3e062"
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        version="${SEMGREP_VERSION:-$version}"

        rules="$ACTION_PATH/rules/$RULESET.yaml"
        if [ ! -f "$rules" ]; then
          echo "::error::unknown ruleset '$RULESET'; expected one of: $(cd "$ACTION_PATH/rules" && printf '%s\n' ./*.yaml | sed 's|^./||; s/\.yaml$//' | tr '\n' ' ')"
          exit 1
        fi

        if [[ "$version" != *@sha256:* ]]; then
          echo "::error::semgrep ${version} has no digest: pin it as <tag>@sha256:<digest>."
          exit 1
        fi

        node "$ACTION_PATH/../run-scan.mjs" semgrep docker run --rm \
          -v "$PWD:/src:ro" -v "$ACTION_PATH/rules:/rules:ro" \
          "semgrep/semgrep:$version" \
          semgrep --config="/rules/$RULESET.yaml" --metrics=off --error /src
