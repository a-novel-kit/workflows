name: lint semgrep
description: >
  Enforce the A-Novel structural conventions that golangci-lint cannot express, such as a call that
  must be present or a pairing that must hold. The ruleset ships with the action, so a consuming repo
  carries no semgrep config. Semgrep reads the rules from disk, so no rule registry can stall the
  scan.

inputs:
  ruleset:
    required: false
    default: "service"
    description: >
      Ruleset to enforce. "service" fits the clean-architecture layout. A repository that no ruleset
      fits runs no lint-semgrep job.
  advisory:
    required: false
    default: "false"
    description: >
      When "true", findings go to the run summary and the log, and the check passes. When "false",
      any finding fails the check. A scan that fails to run fails either way.
  version:
    required: true
    description: >
      semgrep image tag and digest, as `<tag>@sha256:<digest>`. The caller pins both so Renovate bumps
      them together per repo, with the annotation
      `# renovate: datasource=docker depName=semgrep/semgrep`. A tag alone fails the step: it would run
      whatever image the tag names.

runs:
  using: composite
  steps:
    - name: semgrep
      shell: bash
      env:
        RULESET: ${{ inputs.ruleset }}
        ADVISORY: ${{ inputs.advisory }}
        SEMGREP_VERSION: ${{ inputs.version }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail

        rules="$ACTION_PATH/rules/$RULESET.yaml"
        if [ ! -f "$rules" ]; then
          echo "::error::unknown ruleset '$RULESET'; expected one of: $(cd "$ACTION_PATH/rules" && printf '%s\n' ./*.yaml | sed 's|^./||; s/\.yaml$//' | tr '\n' ' ')"
          exit 1
        fi

        if [[ "$SEMGREP_VERSION" != *@sha256:* ]]; then
          echo "::error::semgrep ${SEMGREP_VERSION} has no digest: pin it as <tag>@sha256:<digest>."
          exit 1
        fi

        node "$ACTION_PATH/../run-scan.mjs" semgrep docker run --rm \
          -v "$PWD:/src:ro" -v "$ACTION_PATH/rules:/rules:ro" \
          "semgrep/semgrep:$SEMGREP_VERSION" \
          semgrep --config="/rules/$RULESET.yaml" --metrics=off --error /src
