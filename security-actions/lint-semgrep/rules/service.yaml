# Structural conventions for the clean-architecture services, such as a call that
# must be present or a pairing that must hold. golangci-lint owns span lifecycle
# and error reporting (spancheck), layer import direction (depguard) and contexts
# held in structs (containedctx).
#
# Semgrep has no return-arity wildcard for Go, so a signature match repeats per
# arity. Its built-in ignore list skips *_test.go, so no rule can target tests.
rules:
  # An unspanned method folds its latency into the caller and surfaces errors
  # with no operation name.
  - id: a-novel-must-open-span
    languages: [go]
    severity: ERROR
    message: >-
      $M takes a context but never opens an otel span. Every function in the
      internal layers that receives an explicit context is a step in the trace.
      A function that skips the span hides its work and folds its latency into
      the caller. Open one with
      `ctx, span := otel.Tracer().Start(ctx, "<layer>.<Operation>")`.
    paths:
      # pkg/go holds a generated client and its mocks, which are not ours to
      # instrument.
      include:
        - "**/internal/"
      exclude:
        - "*_test.go"
        - "**/mocks/"
        - "**/protogen/"
    patterns:
      # Taking a context as the first parameter is the whole criterion, with no
      # exemption for unexported helpers, delegators or context wrappers. A
      # function stays untraced only by taking no context.
      - pattern-either:
          - pattern: "func ($R $T) $M(ctx context.Context, ...) { ... }"
          - pattern: "func ($R $T) $M(ctx context.Context, ...) $RET { ... }"
          - pattern: "func ($R $T) $M(ctx context.Context, ...) ($RET1, $RET2) { ... }"
          - pattern: "func $M(ctx context.Context, ...) { ... }"
          - pattern: "func $M(ctx context.Context, ...) $RET { ... }"
          - pattern: "func $M(ctx context.Context, ...) ($RET1, $RET2) { ... }"
      - pattern-not: |
          func ($R $T) $M(ctx context.Context, ...) {
            ...
            otel.Tracer().Start(...)
            ...
          }
      - pattern-not: |
          func ($R $T) $M(ctx context.Context, ...) $RET {
            ...
            otel.Tracer().Start(...)
            ...
          }
      - pattern-not: |
          func ($R $T) $M(ctx context.Context, ...) ($RET1, $RET2) {
            ...
            otel.Tracer().Start(...)
            ...
          }
      - pattern-not: |
          func $M(ctx context.Context, ...) {
            ...
            otel.Tracer().Start(...)
            ...
          }
      - pattern-not: |
          func $M(ctx context.Context, ...) $RET {
            ...
            otel.Tracer().Start(...)
            ...
          }
      - pattern-not: |
          func $M(ctx context.Context, ...) ($RET1, $RET2) {
            ...
            otel.Tracer().Start(...)
            ...
          }

  # A context flows downward only, from caller to callee. The rule covers the
  # layers that carry request flow. internal/lib stays out, because a context
  # helper there, such as a WithX wrapper, returns the context it derives.
  - id: a-novel-no-context-return
    languages: [go]
    severity: ERROR
    message: >-
      $F returns a context.Context. In the request layers a context flows
      downward only. Take one as the first parameter instead of handing one up.
    paths:
      include:
        - "**/internal/core/"
        - "**/internal/dao/"
        - "**/internal/handlers/"
      exclude:
        - "*_test.go"
        - "**/mocks/"
        - "**/protogen/"
    patterns:
      - pattern-either:
          - pattern: "func $F(...) context.Context { ... }"
          - pattern: "func ($R $T) $F(...) context.Context { ... }"
      # A context.WithValue wrapper hands back the context it derived. The
      # exemption keys on the body, so it holds wherever the helper lives, such
      # as handlers/middlewares/.
      - pattern-not: |
          func $F(...) context.Context {
            ...
            return context.WithValue(...)
          }

  # A dependency interface is the contract its consumer owns, with one method
  # named Exec. Another method name means the boundary was drawn by hand. The
  # compliant case is excluded with pattern-not, because semgrep's regex engine
  # has no lookahead.
  - id: a-novel-dep-interface-method-must-be-exec
    languages: [go]
    severity: ERROR
    message: >-
      Dependency interface $NAME declares $METHOD; layer contracts expose exactly
      one method, named Exec.
    paths:
      include:
        - "**/internal/core/"
        - "**/internal/handlers/"
      exclude:
        - "*_test.go"
        - "**/mocks/"
        - "**/protogen/"
    patterns:
      - pattern-either:
          - pattern: |
              type $NAME interface {
                $METHOD(ctx context.Context, ...) ($RET1, $RET2)
              }
          - pattern: |
              type $NAME interface {
                $METHOD(ctx context.Context, ...) $RET
              }
      - metavariable-regex:
          metavariable: $NAME
          regex: .*(Dao|Service[A-Za-z]*)$
      - pattern-not: |
          type $NAME interface {
            Exec(ctx context.Context, ...) ($RET1, $RET2)
          }
      - pattern-not: |
          type $NAME interface {
            Exec(ctx context.Context, ...) $RET
          }
      # The proto names a protoc-generated client method. The
      # `opts ...grpc.CallOption` tail identifies one wherever the interface
      # lives.
      - pattern-not: |
          type $NAME interface {
            $ANY(ctx context.Context, ..., $OPTS ...grpc.CallOption) ($O1, $O2)
          }

  # The Exec signature is `(ctx context.Context, request *XxxRequest)`, so the
  # request can gain a field without breaking callers. The rule catches a request
  # taken by value. A pointer to a badly named struct needs the lookahead that
  # semgrep lacks.
  - id: a-novel-exec-takes-request-pointer
    languages: [go]
    severity: ERROR
    message: >-
      Exec on $NAME takes $PARAM by value; it must take a
      *<Entity><Operation>Request so the signature can gain a field later.
    paths:
      include:
        - "**/internal/core/"
        - "**/internal/handlers/"
      exclude:
        - "*_test.go"
        - "**/mocks/"
        - "**/protogen/"
    patterns:
      - pattern-either:
          - pattern: |
              type $NAME interface {
                Exec(ctx context.Context, $ARG $PARAM) ($RET1, $RET2)
              }
          - pattern: |
              type $NAME interface {
                Exec(ctx context.Context, $ARG $PARAM) $RET
              }
      - metavariable-regex:
          metavariable: $NAME
          regex: .*(Dao|Service[A-Za-z]*)$
      - metavariable-regex:
          metavariable: $PARAM
          regex: ^[^*]

  # Logs, traces and span attributes record identifiers, never credential
  # material. A span attribute is the easiest place to add one by reflex and the
  # hardest to notice later.
  - id: a-novel-no-secret-in-span-attribute
    languages: [go]
    severity: ERROR
    message: >-
      Span attribute "$KEY" names credential material. Traces are retained and
      widely readable. Record an identifier (`user.id`, `key.id`) instead.
    paths:
      exclude:
        - "*_test.go"
    patterns:
      - pattern-either:
          - pattern: attribute.String($KEY, ...)
          - pattern: attribute.StringSlice($KEY, ...)
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i)"?([a-z0-9_.]*\.)?(password|passwd|secret|token|apikey|api_key|privatekey|private_key|ciphertext|signature|bearer)"?$

  # Service and DAO types are stateless after construction. Their constructor
  # sets every field, so every type is safe for concurrent use without
  # synchronization. Constructors are plain functions, so the receiver form
  # matches exactly the mutation this rule forbids.
  - id: a-novel-no-receiver-mutation
    languages: [go]
    severity: ERROR
    message: >-
      $M assigns to $R.$FIELD after construction. These types are shared across
      concurrent requests without synchronization. Only the constructor sets
      their fields.
    paths:
      include:
        - "**/internal/core/"
        - "**/internal/dao/"
        - "**/internal/handlers/"
      exclude:
        - "*_test.go"
        - "**/mocks/"
        - "**/protogen/"
    patterns:
      - pattern-either:
          - pattern: |
              func ($R $T) $M(...) {
                ...
                $R.$FIELD = $VAL
                ...
              }
          - pattern: |
              func ($R $T) $M(...) $RET {
                ...
                $R.$FIELD = $VAL
                ...
              }
          - pattern: |
              func ($R $T) $M(...) ($RET1, $RET2) {
                ...
                $R.$FIELD = $VAL
                ...
              }
      # A method that locks a receiver field synchronizes, so the rule exempts
      # it. The match is the whole function, so pattern-not-inside cannot place
      # the assignment between Lock and Unlock. The exemption keys on the method
      # locking at all.
      - pattern-not: |
          func ($R $T) $M(...) {
            ...
            $R.$MU.Lock()
            ...
          }
      - pattern-not: |
          func ($R $T) $M(...) $RET {
            ...
            $R.$MU.Lock()
            ...
          }
      - pattern-not: |
          func ($R $T) $M(...) ($RET1, $RET2) {
            ...
            $R.$MU.Lock()
            ...
          }

  # A golib httpf tag is part of the public error response, so only the HTTP
  # handler answering the request chooses one. WithTag also extends a tagged
  # error in place, which is safe because a handler never shares the error it
  # tags.
  - id: a-novel-error-tag-in-handler
    languages: [go]
    severity: ERROR
    message: >-
      httpf.WithTag adds a client-visible tag to an error response, which only
      the HTTP handler answering the request may choose. Return a sentinel
      error from this layer and tag it in the handler that maps it to a status.
    paths:
      exclude:
        - "**/internal/handlers/"
        - "*_test.go"
    pattern: httpf.WithTag(...)
