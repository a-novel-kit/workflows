name: scan secrets
description: >
  Scan the working tree for committed credentials with gitleaks. A baseline config ships with the
  action, and most repos need none of their own. The scan runs offline, which keeps it safe on the
  merge path. It reads the working tree alone, so a secret committed and later deleted goes unseen.

inputs:
  config:
    required: false
    default: ""
    description: >
      Repo-local gitleaks config, relative to the workspace. Empty uses the shipped baseline.

      A repo config replaces the baseline whole. gitleaks rejects `extend.path` together with
      `extend.useDefault`, and an extending config's allowlists replace the base's. A repo that
      needs one more allowlist entry therefore copies the shipped gitleaks.toml and adds to it.
  advisory:
    required: false
    default: "false"
    description: >
      When "true", redacted findings go to the run summary and the log, and the check passes. When
      "false", any finding fails the check. A scan that fails to run fails either way.
  version:
    required: true
    description: >
      gitleaks release tag, with or without the leading v. The caller pins it so Renovate bumps it
      per repo, with the annotation
      `# renovate: datasource=github-releases depName=gitleaks/gitleaks`. The action builds that
      version with the runner's Go, which checks the source against Go's checksum database.

runs:
  using: composite
  steps:
    - name: install gitleaks
      shell: bash
      env:
        GITLEAKS_VERSION: ${{ inputs.version }}
        # Any proxy error falls back to the origin; Go's checksum database still verifies the source.
        GOPROXY: "https://proxy.golang.org|direct"
      run: |
        set -euo pipefail
        # go install builds the source that Go's checksum database recorded for this version, which
        # replacing the release's files, checksums.txt included, or moving its tag cannot change.
        # The build tag and version stamp match gitleaks' release archives. The binary runs
        # directly, because gitleaks-action's free tier covers one repo per organization.
        v="${GITLEAKS_VERSION#v}"
        GOBIN=/usr/local/bin go install -tags gore2regex \
          -ldflags "-X=github.com/zricethezav/gitleaks/v8/version.Version=${v}" \
          "github.com/zricethezav/gitleaks/v8@v${v}"
        gitleaks version

    - name: scan working tree
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        ADVISORY: ${{ inputs.advisory }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail

        config="${CONFIG:-}"
        if [ -z "$config" ]; then
          config="$ACTION_PATH/gitleaks.toml"
        elif [ ! -f "$config" ]; then
          echo "::error::config '$config' not found in the workspace."
          exit 1
        fi

        # Exit code 10 marks findings, apart from the 1 that gitleaks returns on its own errors.
        node "$ACTION_PATH/../run-scan.mjs" gitleaks \
          gitleaks dir . --config "$config" --redact --exit-code 10 --verbose
