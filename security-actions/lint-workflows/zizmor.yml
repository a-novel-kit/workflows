# Baseline zizmor config, shipped with the lint-workflows action.

rules:
  unpinned-uses:
    config:
      policies:
        # Third-party actions run from the commit their release named, so a moved tag cannot
        # change what runs beside an App key. The a-novel-kit/workflows actions stay on release
        # tags, which their immutable releases lock.
        "a-novel-kit/*": ref-pin
        "*": hash-pin

  cache-poisoning:
    ignore:
      # main.yaml restores a build cache and builds images, the shape this audit
      # flags. The attack needs a lower-trust branch to write a cache that a
      # release run reads. GitHub scopes cache writes so a pull request branch
      # cannot reach the default branch's scope, and releases run from
      # release.yaml.
      - main.yaml
