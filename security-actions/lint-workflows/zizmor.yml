# Baseline zizmor config, shipped with the lint-workflows action.

rules:
  unpinned-uses:
    config:
      policies:
        # Accepts tags until every repository's Renovate has pinned its third-party actions to
        # their release commits. Requiring commit pins first would fail each repository's
        # grouped a-novel-kit/workflows update (a-novel-kit/workflows#626). ref-pin still fails
        # a floating `@master` or a missing ref.
        "*": ref-pin

  cache-poisoning:
    ignore:
      # main.yaml restores a build cache and builds images, the shape this audit
      # flags. The attack needs a lower-trust branch to write a cache that a
      # release run reads. GitHub scopes cache writes so a pull request branch
      # cannot reach the default branch's scope, and releases run from
      # release.yaml.
      - main.yaml
