name: lint workflows
description: >
  Audit GitHub Actions workflows with zizmor. Replaces CodeQL's `actions` analysis: its
  `excessive-permissions` is the class CodeQL reported as `actions/missing-workflow-permissions`,
  plus checkout credential leaks, cache poisoning and floating refs. Config ships with the action;
  runs `--offline`.

inputs:
  config:
    required: false
    default: ""
    description: >
      Path to a repo-local zizmor config, relative to the workspace. Empty (the default) uses the
      baseline shipped with this action.
  advisory:
    required: false
    default: "false"
    description: >
      When "true", findings go to the run summary and the log but the check passes — for a repo
      adopting the audit over an existing backlog. When "false" (the default), any finding fails.
  version:
    required: true
    description: >
      zizmor image tag. Pinned by the caller so Renovate bumps it per repo. Annotate it:
      `# renovate: datasource=docker depName=ghcr.io/zizmorcore/zizmor`.

runs:
  using: composite
  steps:
    - name: zizmor
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        ADVISORY: ${{ inputs.advisory }}
        ZIZMOR_VERSION: ${{ inputs.version }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail

        if [ ! -d .github/workflows ]; then
          echo "no .github/workflows — nothing to audit."
          exit 0
        fi

        if [ -n "${CONFIG:-}" ]; then
          if [ ! -f "$CONFIG" ]; then
            echo "::error::config '$CONFIG' not found in the workspace."
            exit 1
          fi
          mount_cfg="$PWD/$CONFIG"
        else
          mount_cfg="$ACTION_PATH/zizmor.yml"
        fi

        image="ghcr.io/zizmorcore/zizmor:$ZIZMOR_VERSION"

        # errexit is disabled around the audit deliberately: zizmor exits non-zero on findings and
        # this step decides gating from that code.
        #
        # 125 is docker's own code for "could not run the container", which is what a registry
        # timeout looks like. zizmor never exits 125 once started, so retrying it can never re-run
        # an audit that already produced a result.
        for attempt in 1 2 3; do
          set +e
          docker run --rm \
            -v "$PWD:/src:ro" -v "$mount_cfg:/zizmor.yml:ro" \
            "$image" \
            --offline --config /zizmor.yml /src/.github/workflows \
            | tee /tmp/zizmor.out
          code=${PIPESTATUS[0]}
          set -e

          [ "$code" = "125" ] || break
          echo "::warning::docker could not run $image (attempt $attempt/3); retrying"
          sleep $((attempt * 5))
        done

        if [ "$code" = "0" ]; then
          echo "zizmor: no findings" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        # Only 1 means findings. Anything else is the audit failing to run, and reporting that as
        # findings sends a reviewer hunting for a problem that was never detected.
        if [ "$code" != "1" ]; then
          echo "::error::zizmor exited $code — the audit did not complete. This is not a findings report."
          {
            echo "### zizmor did not run"
            echo ""
            echo '```'
            tail -c 20000 /tmp/zizmor.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
        fi

        {
          echo "### zizmor findings"
          echo ""
          echo '```'
          tail -c 60000 /tmp/zizmor.out
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

        if [ "$ADVISORY" = "true" ]; then
          echo "::warning::zizmor reported findings; advisory mode, not failing the check."
          exit 0
        fi

        echo "::error::zizmor reported findings."
        exit "$code"
