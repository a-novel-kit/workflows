name: lint workflows
description: >
  Audit a repo's GitHub Actions workflows and composite actions with zizmor, in place of CodeQL's
  `actions` analysis. zizmor reports CodeQL's `actions/missing-workflow-permissions` as
  `excessive-permissions`, and adds checkout credential leaks, cache poisoning and floating refs.
  The baseline config ships with the action, and zizmor runs offline. A repo without
  `.github/workflows` passes.

inputs:
  config:
    required: false
    default: ""
    description: >
      Path to a repo-local zizmor config, relative to the workspace. Empty uses the baseline shipped
      with this action.
  advisory:
    required: false
    default: "false"
    description: >
      When "true", findings go to the run summary and the log, and the check passes. When "false",
      any finding fails the check. An audit that fails to run fails either way.
  version:
    required: false
    description: >
      zizmor image tag and digest, as `<tag>@sha256:<digest>`, for a repo that must hold its own
      release. Empty runs the image this action pins, which Renovate moves here. A tag alone fails
      the step: it would run whatever image the tag names.

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: zizmor
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        ADVISORY: ${{ inputs.advisory }}
        ZIZMOR_VERSION: ${{ inputs.version }}
        # The pinned default, under the key the base Renovate preset's workflow regex reads.
        # renovate: datasource=docker depName=ghcr.io/zizmorcore/zizmor
        version: "1.33.0@sha256:1b9bebe30894567d922aa8467ec3b6d39d8f4f65b7736addbda6e83d1b0c477f"
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        version="${ZIZMOR_VERSION:-$version}"

        if [ ! -d .github/workflows ]; then
          echo "no .github/workflows, so nothing to audit."
          exit 0
        fi

        if [ -n "${CONFIG:-}" ]; then
          if [ ! -f "$CONFIG" ]; then
            echo "::error::config '$CONFIG' not found in the workspace."
            exit 1
          fi
          mount_cfg="$PWD/$CONFIG"
        else
          mount_cfg="$ACTION_PATH/zizmor.yml"
        fi

        if [[ "$version" != *@sha256:* ]]; then
          echo "::error::zizmor ${version} has no digest: pin it as <tag>@sha256:<digest>."
          exit 1
        fi

        node "$ACTION_PATH/../run-scan.mjs" zizmor docker run --rm \
          -v "$PWD:/src:ro" -v "$mount_cfg:/zizmor.yml:ro" \
          "ghcr.io/zizmorcore/zizmor:$version" \
          --offline --config /zizmor.yml --collect=workflows,actions /src
