name: lint workflows
description: >
  Audit a repo's GitHub Actions workflows with zizmor, in place of CodeQL's `actions` analysis.
  zizmor reports CodeQL's `actions/missing-workflow-permissions` as `excessive-permissions`, and adds
  checkout credential leaks, cache poisoning and floating refs. The baseline config ships with the
  action, and zizmor runs offline. A repo without `.github/workflows` passes.

inputs:
  config:
    required: false
    default: ""
    description: >
      Path to a repo-local zizmor config, relative to the workspace. Empty uses the baseline shipped
      with this action.
  advisory:
    required: false
    default: "false"
    description: >
      When "true", findings go to the run summary and the log, and the check passes. When "false",
      any finding fails the check. An audit that fails to run fails either way.
  version:
    required: true
    description: >
      zizmor image tag. The caller pins it so Renovate bumps it per repo, with the annotation
      `# renovate: datasource=docker depName=ghcr.io/zizmorcore/zizmor`.

runs:
  using: composite
  steps:
    - name: zizmor
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        ADVISORY: ${{ inputs.advisory }}
        ZIZMOR_VERSION: ${{ inputs.version }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail

        if [ ! -d .github/workflows ]; then
          echo "no .github/workflows — nothing to audit."
          exit 0
        fi

        if [ -n "${CONFIG:-}" ]; then
          if [ ! -f "$CONFIG" ]; then
            echo "::error::config '$CONFIG' not found in the workspace."
            exit 1
          fi
          mount_cfg="$PWD/$CONFIG"
        else
          mount_cfg="$ACTION_PATH/zizmor.yml"
        fi

        node "$ACTION_PATH/../run-scan.mjs" zizmor docker run --rm \
          -v "$PWD:/src:ro" -v "$mount_cfg:/zizmor.yml:ro" \
          "ghcr.io/zizmorcore/zizmor:$ZIZMOR_VERSION" \
          --offline --config /zizmor.yml /src/.github/workflows
