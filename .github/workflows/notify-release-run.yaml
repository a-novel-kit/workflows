name: notify-release (reusable)

# Announces each published release in Discord with its notes, as GitHub shows them. Each governed
# repository calls this engine on `release: published`, from the `notify.yaml` that repocfg renders.
# release-core and release-core-hotfix create releases with an App token, so the event fires for
# every release.
on:
  workflow_call:
    inputs:
      dry_run:
        description: When "true", write the message to the step summary instead of posting it.
        required: false
        type: string
        default: "false"
    secrets:
      webhook:
        description: Discord webhook of the releases channel. Empty skips the post.
        required: false

jobs:
  notify:
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions: {}
    steps:
      # GitHub renders a bare pull request or compare URL as "#N" or "v1...v2", and Discord shows it
      # whole. The step rewrites only bare URLs, so a link the author already wrote stays intact.
      - name: Format the notes
        id: notes
        env:
          BODY: ${{ github.event.release.body }}
        run: |
          set -euo pipefail
          delimiter="EOF_$(openssl rand -hex 8)"
          {
            echo "description<<$delimiter"
            printf '%s\n' "$BODY" | sed -E \
              -e 's,(^|[[:space:]])(https://github\.com/[^/[:space:]]+/[^/[:space:]]+/pull/([0-9]+)),\1[#\3](\2),g' \
              -e 's,(^|[[:space:]])(https://github\.com/[^/[:space:]]+/[^/[:space:]]+/compare/([^[:space:]]+)),\1[\3](\2),g'
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      # A hotfix shows gold, since release-core-hotfix targets the release line it cuts. Every other
      # release takes its bump from the tag: blue for a patch, green for a minor, purple for a major.
      - name: Pick the color
        id: color
        env:
          TAG: ${{ github.event.release.tag_name }}
          TARGET: ${{ github.event.release.target_commitish }}
        run: |
          set -euo pipefail
          if [[ "$TARGET" == release/* ]]; then
            color=upcoming
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[1-9] ]]; then
            color=started
          elif [[ "$TAG" =~ ^v[0-9]+\.[1-9] ]]; then
            color=succeeded
          else
            color=released
          fi
          echo "color=$color" >> "$GITHUB_OUTPUT"

      - name: Post to Discord
        uses: a-novel-kit/workflows/generic-actions/discord-post@v1.63.0
        with:
          webhook: ${{ secrets.webhook }}
          color: ${{ steps.color.outputs.color }}
          title: ${{ github.event.release.name || format('{0} {1}', github.event.repository.name, github.event.release.tag_name) }}
          url: ${{ github.event.release.html_url }}
          description: ${{ steps.notes.outputs.description }}
          dry_run: ${{ inputs.dry_run }}
