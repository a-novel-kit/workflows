name: release

# Releases are cut from the GitHub UI (Actions ▸ release ▸ pick a type ▸ Run) or by the release
# train, through workflow_call's identical inputs. `plan` rehearses with no credential; `cut` runs in
# the protected `release` environment, the "who can publish" gate whose key only it reads, and
# pushes the version commit, the tags and the GitHub Release as the release App.
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Version bump to cut
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: Bump & report only — no commit, tag, push, or release
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      release_type:
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false

run-name: "🚀 release ${{ inputs.release_type }}${{ inputs.dry_run && ' (dry-run)' || '' }}"

# There is no concurrency lock. Two releases triggered at once compute the same next tag: the first
# push wins and the second is rejected as non-fast-forward, failing in the release job below before
# any build job runs, so an accidental double-trigger cannot double-release. The protected `release`
# environment is the human gate on top.

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # This checkout makes the local ./publish-actions/* actions available; release-core
      # re-checks-out with its own token.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: $/publish-actions/release-core
        with:
          # renovate: datasource=go depName=github.com/a-novel-kit/stack/cli
          cli_version: "1.7.5"
          release_type: ${{ inputs.release_type }}
          dry_run: "true"

  cut:
    needs: [plan]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      # This checkout makes the local ./publish-actions/* actions available; release-core
      # re-checks-out with its own token.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: core
        uses: $/publish-actions/release-core
        with:
          # renovate: datasource=go depName=github.com/a-novel-kit/stack/cli
          cli_version: "1.7.5"
          release_type: ${{ inputs.release_type }}
          client_id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          app_private_key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      # Surface the cut version in the run summary, since the run name carries only the bump type.
      # Both values arrive through env rather than ${{ }}: an expression is substituted into the
      # script before bash sees it, so its contents would be code; as variables they are data.
      - env:
          TAG: ${{ steps.core.outputs.tag }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: echo "## 🚀 Released \`${TAG}\` (${RELEASE_TYPE})" >> "$GITHUB_STEP_SUMMARY"

  # Everything on the default branch just shipped: clear this repo's awaiting-release items off the
  # board. The Agent key is a secret of the governance environment, never of the release one.
  archive:
    needs: [cut]
    runs-on: ubuntu-latest
    environment:
      name: governance
      deployment: false
    permissions:
      contents: read
    steps:
      # This checkout makes the local archive action available.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: $/generic-actions/archive-board-items
        with:
          client_id: ${{ vars.AGENT_BOT_CLIENT_ID }}
          app_private_key: ${{ secrets.AGENT_BOT_PRIVATE_KEY }}
          project_id: ${{ github.repository_owner == 'a-novel' && 'PVT_kwDOB9MxdM4BMh8r' || 'PVT_kwDOCy-nAM4BbtKH' }}
