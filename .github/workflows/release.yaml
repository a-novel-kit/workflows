name: release

# A person cuts a release from the Actions tab, or the release train dispatches it. Run on the
# default branch, the commits since the last release size it. Run on a v<N> branch, it is major N.
# `plan` rehearses with no credential. `cut` runs in the protected `release` environment, the only
# holder of the release App's key, and pushes the version commit, the tags and the GitHub Release
# as that App.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Bump and report only, with no commit, tag, push or release
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      dry_run:
        required: false
        type: boolean
        default: false

run-name: "🚀 release ${{ github.ref_name }}${{ inputs.dry_run && ' (dry-run)' || '' }}"

# Two releases started at once compute the same next tag. The first push wins and the second fails
# as non-fast-forward, so a double trigger cannot release twice.

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.core.outputs.tag }}
    steps:
      - id: core
        uses: $/publish-actions/release-core
        with:
          # renovate: datasource=go depName=github.com/a-novel-kit/stack/cli
          cli_version: "1.42.4"
          dry_run: "true"

  # GitHub's release-notes endpoint wants contents write although it stores nothing, so this job
  # holds that token alone and runs no repository code. `cut` waits for it, so whoever approves the
  # cut has read the notes.
  notes:
    needs: [plan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Preview the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
            --jq .body >> "$GITHUB_STEP_SUMMARY"

  cut:
    needs: [plan, notes]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - id: core
        uses: $/publish-actions/release-core
        with:
          # renovate: datasource=go depName=github.com/a-novel-kit/stack/cli
          cli_version: "1.42.4"
          client_id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          app_private_key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      # The run name carries only the branch, so the summary names the cut version.
      - env:
          TAG: ${{ steps.core.outputs.tag }}
        run: echo "## 🚀 Released \`${TAG}\`" >> "$GITHUB_STEP_SUMMARY"

  # Everything on the default branch just shipped: clear this repo's awaiting-release items off the
  # board. The Agent key is a secret of the governance environment, never of the release one.
  archive:
    needs: [cut]
    runs-on: ubuntu-latest
    environment:
      name: governance
      deployment: false
    permissions:
      contents: read
    steps:
      - uses: $/generic-actions/archive-board-items
        with:
          client_id: ${{ vars.AGENT_BOT_CLIENT_ID }}
          app_private_key: ${{ secrets.AGENT_BOT_PRIVATE_KEY }}
          project_id: ${{ github.repository_owner == 'a-novel' && 'PVT_kwDOB9MxdM4BMh8r' || 'PVT_kwDOCy-nAM4BbtKH' }}
