name: token-expiry (deprecated)

# Deprecated alias of token-expiry-run.yaml, which runs the same watcher. Call that file instead; this
# one goes in the next major.
on:
  workflow_call:
    inputs:
      client_id:
        required: true
        type: string
      dry_run:
        required: false
        type: string
        default: "false"
      test_run:
        required: false
        type: boolean
        default: false
    secrets:
      private_key:
        required: true
      webhook:
        required: false
      default_mention:
        required: false

jobs:
  watch:
    # Every job of the engine mints its own App token.
    permissions: {}
    uses: a-novel-kit/workflows/.github/workflows/token-expiry-run.yaml@v1.86.0
    with:
      client_id: ${{ inputs.client_id }}
      dry_run: ${{ inputs.dry_run }}
      test_run: ${{ inputs.test_run }}
    secrets:
      private_key: ${{ secrets.private_key }}
      webhook: ${{ secrets.webhook }}
      default_mention: ${{ secrets.default_mention }}
