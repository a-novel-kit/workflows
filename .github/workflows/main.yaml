name: main

on:
  push:
    tags-ignore:
      - "**"
    branches:
      - "**"

# A newer commit on the same ref supersedes a run. Nothing here releases or deploys, so cancelling
# the older run loses nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-node:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Calls this branch's setup-node directly, since lint-node pins setup-node to the last release.
      - uses: $/node-actions/setup-node
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm run lint

  test-actions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - name: Install browser test dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps --only-shell chromium
      - name: Run action regression suites
        run: pnpm test

  lint-renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare Renovate validation
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/validate-renovate.sh" <<'BASH'
          #!/bin/bash
          set -euo pipefail
          cd /workspace
          renovate-config-validator --strict --no-global renovate/*.json
          renovate-config-validator --strict generic-actions/renovate/config.json
          # globalExtends resolves before authentication; check inheritance as a local consumer.
          validation=$(mktemp -d)
          trap 'rm -rf -- "$validation"' EXIT
          git -C "$validation" init --quiet
          for preset in renovate/*.json; do
            name="${preset#renovate/}"
            name="${name%.json}"
            printf 'Resolving %s at %s\n' "$name" "$GITHUB_SHA"
            printf '{"extends":["github>%s//renovate/%s#%s"]}\n' \
              "$GITHUB_REPOSITORY" "$name" "$GITHUB_SHA" > "$validation/renovate.json"
            git -C "$validation" add renovate.json
            (cd "$validation" && renovate --platform=local --dry-run=extract --config-validation-error=true)
          done
          BASH
          bash -n "$RUNNER_TEMP/validate-renovate.sh"
          chmod +x "$RUNNER_TEMP/validate-renovate.sh"
      - name: Validate Renovate presets and inheritance
        uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker-cmd-file: ${{ runner.temp }}/validate-renovate.sh
          docker-volumes: ${{ github.workspace }}:/workspace:ro
          additional-env-list: |
            GITHUB_REPOSITORY
            GITHUB_SHA
        env:
          RENOVATE_GITHUB_COM_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Checks the Bash that the manifests embed in their run blocks.
  lint-shell:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/generic-actions/lint-shell
        with:
          # renovate: datasource=custom.shellcheck depName=koalaman/shellcheck
          version: "0.11.0"
          sha256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
          run_steps: "*-actions/*/action.yaml .github/workflows/*.yaml"

  # Runs this branch's audit against .github/zizmor.yml, a copy of the shipped baseline with
  # this repository's own exceptions.
  lint-workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/security-actions/lint-workflows
        with:
          config: .github/zizmor.yml
          # renovate: datasource=docker depName=ghcr.io/zizmorcore/zizmor
          version: "1.31.1"
