name: main

on:
  push:
    tags-ignore:
      - "**"
    branches:
      - "**"
      # The ephemeral hotfix branches hotfix.yaml pushes and deletes, dry-run drills included, never
      # become PRs, so there is nothing to lint on them.
      - "!hotfix/**"

# Cancel an in-progress lint run when a newer commit lands on the same ref, since the superseded
# run's result is worthless. This workflow only lints, with no release or deploy work that has to
# run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-node:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: $/node-actions/lint-node
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          app_private_key: ${{ secrets.DEPENDENCY_BOT_PRIVATE_KEY }}
          client_id: ${{ vars.DEPENDENCY_BOT_CLIENT_ID }}

  # Validate manifests before a release reaches downstream consumers.
  lint-action-manifests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate composite expression contexts
        run: node .github/scripts/lint-action-manifests.mjs .

  test-actions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - name: Install browser and Drive test dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          npm ci --prefix node-actions/test-playwright/drive --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Run action regression suites
        run: pnpm test
      - name: Prepare Renovate validation
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/validate-renovate.sh" <<'BASH'
          #!/bin/bash
          set -euo pipefail
          cd /workspace
          renovate-config-validator --strict --no-global renovate/*.json
          renovate-config-validator --strict generic-actions/renovate/config.json
          for preset in renovate/*.json; do
            name="${preset#renovate/}"
            name="${name%.json}"
            printf 'Resolving %s at %s\n' "$name" "$GITHUB_SHA"
            RENOVATE_GLOBAL_EXTENDS="[\"github>${GITHUB_REPOSITORY}//renovate/${name}#${GITHUB_SHA}\"]" \
              renovate-config-validator --strict --no-global "$preset"
          done
          BASH
          bash -n "$RUNNER_TEMP/validate-renovate.sh"
          chmod +x "$RUNNER_TEMP/validate-renovate.sh"
      - name: Validate Renovate presets and inheritance
        uses: renovatebot/github-action@v46.3.6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker-cmd-file: ${{ runner.temp }}/validate-renovate.sh
          docker-volumes: ${{ github.workspace }}:/workspace:ro
          additional-env-list: |
            GITHUB_REPOSITORY
            GITHUB_SHA
        env:
          GITHUB_COM_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Check the shipped Bash run blocks, which are embedded in YAML.
  lint-shell:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Extract Bash steps from YAML
        env:
          SHELL_DIR: ${{ runner.temp }}/workflow-shell
        run: node .github/scripts/extract-shell.mjs "$SHELL_DIR"
      - uses: $/generic-actions/lint-shell
        with:
          # renovate: datasource=github-releases depName=koalaman/shellcheck
          version: "0.11.0"
          paths: ${{ runner.temp }}/workflow-shell/*.sh

  # The repo that ships the audit was the one repo not running it, so its own workflows went
  # unchecked until a fleet sweep ran zizmor here by hand. Dogfooded with a relative path, against
  # the repo-local config — see .github/zizmor.yml for why it exists rather than the shipped
  # baseline.
  lint-workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: $/security-actions/lint-workflows
        with:
          config: .github/zizmor.yml
          # renovate: datasource=docker depName=ghcr.io/zizmorcore/zizmor
          version: "1.30.1"
