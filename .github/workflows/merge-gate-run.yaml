name: merge-gate (reusable)

# Gates a repository's pull requests and coordinates the landing of Epic members. Each governed
# repository calls this engine from the `merge-gate.yaml` that repocfg renders.
on:
  workflow_call:
    inputs:
      client_id:
        description: >-
          Client id of the GitHub App that posts the `merge-gate` check and arms auto-merge on Epic
          members. Its identity fixes the integration id the ruleset requires.
        required: true
        type: string
      kill_switch:
        description: >-
          Org-wide halt value. Any value but an explicit off value (empty, 0, off, false, no,
          disabled) posts a failing `merge-gate` check on every pull request and arms no auto-merge.
          Auto-merge armed before the halt stays armed, and the failing check blocks that merge once
          the next event or reconcile sweep posts it.
        required: false
        type: string
        default: ""
      planning_repo:
        description: >-
          Name of the org repository holding the Epic issues, where the gate reads membership and
          writes the activation snapshot. epic-membership and detect-partial-landing must read the
          same repository. A mismatch silently degrades every Epic to live label membership.
        required: false
        type: string
        default: .github
      snapshot_dry_run:
        description: >-
          When "true", the gate logs the activation snapshot it would capture and leaves the Epic body
          alone. The `merge-gate` check is posted either way. Without a snapshot, every Epic falls back
          to live label membership.
        required: false
        type: string
        default: "false"
      pull_request_number:
        description: >-
          Number of the pull request to gate. Empty gates the triggering pull request. A caller
          relaying a review through `workflow_run` passes the number `relay-context` reads.
        required: false
        type: string
        default: ""
      head_sha:
        description: Commit to post the check on. Empty uses the triggering pull request's or merge group's head.
        required: false
        type: string
        default: ""
      merge_group_head_ref:
        description: >-
          Head ref of the merge-queue group to gate. Empty uses the triggering merge group. A caller
          relaying a merge group through `workflow_run` passes the ref `relay-context` reads.
        required: false
        type: string
        default: ""
    secrets:
      app_private_key:
        description: Private key (PEM) of the App that client_id names.
        required: true

jobs:
  # Posts the required `merge-gate` check on every pull request and on the merge queue's group. The
  # queue validates required checks on the group, so a gate that skipped the group would leave a
  # queued pull request to time out and drop. The App posts the check through the Checks API, under
  # the stable integration id the ruleset requires, so this job only runs the gate. A standalone pull
  # request passes, and an Epic member holds until every sibling is ready.
  evaluate:
    runs-on: ubuntu-latest
    # The App key is a secret of the caller's governance environment, which no feature branch opens.
    environment:
      name: governance
      deployment: false
    # The gate mints its own App token and never uses the default token.
    permissions: {}
    steps:
      - uses: a-novel-kit/workflows/generic-actions/merge-gate@v1.72.0
        with:
          client_id: ${{ inputs.client_id }}
          app_private_key: ${{ secrets.app_private_key }}
          kill_switch: ${{ inputs.kill_switch }}
          planning_repo: ${{ inputs.planning_repo }}
          snapshot_dry_run: ${{ inputs.snapshot_dry_run }}
          # An empty `with:` value overrides the action's default, so the event fallback lives here.
          pull_request_number: ${{ inputs.pull_request_number || github.event.pull_request.number }}
          head_sha: ${{ inputs.head_sha || github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          merge_group_head_ref: ${{ inputs.merge_group_head_ref || github.event.merge_group.head_ref }}

  # Arms native auto-merge on an Epic member, so the whole set lands together once the gate and the
  # approval go green. GitHub parks a request armed while the gate is red and merges when it turns
  # green.
  auto-merge:
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    environment:
      name: governance
      deployment: false
    # The member check reads the event payload, and enable-auto-merge mints its own App token.
    permissions: {}
    steps:
      - name: Is this an epic member?
        id: member
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if printf '%s' "$LABELS" | grep -qE '"epic:[0-9]+"'; then
            echo "member=true" >> "$GITHUB_OUTPUT"
          else
            echo "member=false" >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ steps.member.outputs.member == 'true' }}
        uses: a-novel-kit/workflows/generic-actions/enable-auto-merge@v1.72.0
        with:
          pull_request_number: ${{ github.event.pull_request.number }}
          client_id: ${{ inputs.client_id }}
          app_private_key: ${{ secrets.app_private_key }}
          dry_run: "false"
          kill_switch: ${{ inputs.kill_switch }}
