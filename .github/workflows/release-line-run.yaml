name: release line (reusable)

# Cuts a release line's next patch when a backport pull request merges into `release/**`. Each
# governed repository calls this engine from the `hotfix.yaml` that repocfg renders. The cut runs as
# the release App behind the protected `release` environment, the human gate on who may publish. It
# pushes the bump commit to the line together with its tags, so the line's head is always its latest
# patch. The caller triggers on pull_request_target, so GitHub runs the default branch's copy of the
# caller and checks the `release` environment against the default branch.
#
# A head that is already tagged has nothing to release. The caller serializes runs per line, and
# each run reads the line's current head, so two backports merged together cut one patch and the
# second run finds nothing to cut.
on:
  workflow_call:
    inputs:
      branch:
        description: Release line to cut, named release/vMAJOR.MINOR. The caller passes the merged pull request's base.
        required: true
        type: string
      severity:
        description: Escalation severity, sev2 or sev1, when the cut fails.
        required: false
        type: string
        default: sev2
      dry_run:
        description: When true, computes and reports the bump without committing, tagging, pushing or releasing.
        required: false
        type: boolean
        default: false
      client_id:
        description: Client id of the GitHub App that files the escalation ticket when the cut fails.
        required: true
        type: string
      release_client_id:
        description: >
          Client id of the release App, the GitHub App that pushes the bump commit and tags past the
          line's rulesets. Required unless dry_run.
        required: false
        type: string
        default: ""
      project_id:
        description: Node id (PVT_…) of the org project board that tracks the escalation ticket.
        required: true
        type: string
      mention:
        description: GitHub @mention, a user or a team, that a SEV1 or SEV2 escalation ticket pings.
        required: false
        type: string
        default: ""
      push_mention:
        description: Discord mention, such as "<@&ROLE_ID>", that a SEV1 escalation's push pings.
        required: false
        type: string
        default: ""
    secrets:
      app_private_key:
        description: Private key (PEM) of the App that client_id names.
        required: true
      release_private_key:
        description: >
          Private key (PEM) of the App that release_client_id names. The caller passes it by name from
          its `release` environment, which only the cut job opens.
        required: false
      push_webhook:
        description: Chat webhook URL that receives a SEV1 escalation's push. Empty turns the push off.
        required: false

jobs:
  # Reads the line's state outside the `release` environment, so a merge with nothing to release
  # never asks a person to approve.
  pending:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      cut: ${{ steps.pending.outputs.cut }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Check for unreleased commits
        id: pending
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail

          # Prints true when the line's current head carries no release tag of its own line.
          line_pending() {
            local branch="$1" line head
            if ! printf '%s' "$branch" | grep -qE '^release/v[0-9]+\.[0-9]+$'; then
              echo "::error::release lines are named release/vMAJOR.MINOR, got \"$branch\"." >&2
              return 1
            fi
            line=${branch#release/v}
            git fetch --quiet --tags origin "$branch"
            head=$(git rev-parse "origin/$branch")
            if git tag --points-at "$head" | grep -qE "^v${line//./\\.}\.[0-9]+$"; then
              echo false
            else
              echo true
            fi
          }

          cut=$(line_pending "$BRANCH")
          echo "cut=$cut" >> "$GITHUB_OUTPUT"
          if [ "$cut" = "false" ]; then
            echo "\`$BRANCH\` head is already released; nothing to cut." >> "$GITHUB_STEP_SUMMARY"
          fi

  cut:
    needs: pending
    if: needs.pending.outputs.cut == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      actions: read # the lock step reads in-flight release runs
    steps:
      # The cut waits out any in-flight cut of a release, so the two never interleave. Only a
      # dispatched release.yaml run cuts, so a release tag's publishing run never conflicts. A release
      # does not wait for this cut, so the ordering is best-effort, and release-core-hotfix refuses a
      # tag that already exists.
      - name: Acquire lock (wait for in-flight release)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1800))
          while :; do
            active=$(gh run list --repo "$REPO" --workflow release.yaml --event workflow_dispatch --limit 30 \
              --json status --jq '[.[] | select(.status | IN("in_progress","queued"))] | length' 2>/dev/null || echo "err")
            if [ "$active" = "0" ]; then
              break
            elif [ "$active" = "err" ]; then
              echo "::warning::couldn't read in-flight release runs (gh error) — retrying in 30s."
            else
              echo "⏳ ${active} release run(s) actively in flight — waiting 30s before re-checking…"
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::a release has been actively in flight (or its status unreadable) > 30m — aborting the cut; retry once it completes."
              exit 1
            fi
            sleep 30
          done

      - name: Cut the patch
        uses: a-novel-kit/workflows/publish-actions/release-core-hotfix@v1.75.0
        with:
          # renovate: datasource=go depName=github.com/a-novel-kit/stack/cli
          cli_version: "1.7.5"
          ref: ${{ inputs.branch }}
          client_id: ${{ inputs.release_client_id }}
          app_private_key: ${{ secrets.release_private_key }}
          dry_run: ${{ inputs.dry_run }}

  # The `release` environment holds only the release key, so the escalation runs in the caller's
  # governance environment. A failed pending job escalates too.
  escalate:
    needs: cut
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    environment:
      name: governance
      deployment: false
    permissions: {}
    steps:
      - name: Escalate the failed cut
        uses: a-novel-kit/workflows/generic-actions/escalate@v1.75.0
        with:
          client_id: ${{ inputs.client_id }}
          app_private_key: ${{ secrets.app_private_key }}
          project_id: ${{ inputs.project_id }}
          severity: ${{ inputs.severity }}
          summary: "release cut on ${{ inputs.branch }} failed"
          dedup_key: "release-line-failed:${{ github.repository }}:${{ inputs.branch }}"
          repo: ${{ github.repository }}
          mention: ${{ inputs.mention }}
          push_mention: ${{ inputs.push_mention }}
          push_webhook: ${{ secrets.push_webhook }}
          dry_run: ${{ inputs.dry_run }}
