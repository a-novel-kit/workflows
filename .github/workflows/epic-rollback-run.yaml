name: epic-rollback (reusable)

# Reverts a landed Epic's merged members across repositories and lands the reverts together. Each
# governed repository calls this engine from the `epic-rollback.yaml` dispatch that repocfg renders.
# The rollback undoes merged code, so the job opens with an admin check and a typed confirmation.
on:
  workflow_call:
    inputs:
      epic_number:
        description: Number N of the Epic to roll back.
        required: true
        type: string
      confirm:
        description: >
          The text "revert-epic-<N>", such as revert-epic-42, confirming that the run reverts merged
          code. Any other value fails the run.
        required: true
        type: string
      reason:
        description: >
          Why the Epic's landed members must be reverted. The rollback records it in the step summary,
          the rollback Epic and every revert pull request.
        required: true
        type: string
      dry_run:
        description: >
          When "true", prints the plan without writing anything. "false" opens the reverts, which land
          once a person approves them.
        required: false
        type: string
        default: "true"
      max_rollback_repos:
        description: >
          Most repositories one rollback may touch. A wider rollback fails before any revert. Raise it
          for a genuinely wide rollback.
        required: false
        type: string
        default: "5"
      client_id:
        description: >
          Client id of the GitHub App that reconstructs the Epic across the org and writes its reverts
          and board updates.
        required: true
        type: string
      project_id:
        description: Node id (PVT_…) of the org project board whose rolled-back tasks return to Ready.
        required: true
        type: string
      kill_switch:
        description: >
          Org-wide halt value. Any value but an explicit off value (empty, 0, off, false, no,
          disabled) fails the run before it mints a token.
        required: false
        type: string
        default: ""
    secrets:
      app_private_key:
        description: Private key (PEM) of the App that client_id names.
        required: true

jobs:
  rollback:
    runs-on: ubuntu-latest
    # The App key is a secret of the caller's governance environment, which no feature branch opens.
    environment:
      name: governance
      deployment: false
    # The default token serves only the admin check. The rollback action mints its own narrow App
    # tokens for every read and write.
    permissions:
      contents: read
    steps:
      # Any user with write access can dispatch, so these gates keep a rollback admin-only and
      # deliberate.
      - uses: a-novel-kit/workflows/generic-actions/require-role@v1.66.2
        with:
          roles: admin

      - name: Require numeric epic + typed confirmation
        env:
          EPIC: ${{ inputs.epic_number }}
          CONFIRM: ${{ inputs.confirm }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # The number reaches the `label:"epic:<N>"` search query, so it must be numeric.
          if ! [[ "${EPIC:-}" =~ ^[0-9]+$ ]]; then
            echo "::error::epic_number must be an integer, got \"${EPIC:-}\"."
            exit 1
          fi
          if [ "${CONFIRM:-}" != "revert-epic-${EPIC}" ]; then
            echo "::error::confirmation mismatch — type \"revert-epic-${EPIC}\" exactly to proceed."
            exit 1
          fi
          echo "Confirmation matches — proceeding with rollback of epic:#${EPIC} (dry_run=${DRY_RUN:-true})." | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: a-novel-kit/workflows/generic-actions/epic-rollback@v1.66.2
        with:
          client_id: ${{ inputs.client_id }}
          app_private_key: ${{ secrets.app_private_key }}
          epic_number: ${{ inputs.epic_number }}
          reason: ${{ inputs.reason }}
          dry_run: ${{ inputs.dry_run }}
          max_rollback_repos: ${{ inputs.max_rollback_repos }}
          kill_switch: ${{ inputs.kill_switch }}
          project_id: ${{ inputs.project_id }}
