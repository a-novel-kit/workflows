name: notify-stuck (reusable)

# Tells Discord when a bot's pull request is stuck: green, yet not in the merge queue long after its
# last commit. A rule can hold a green pull request with no event at all, such as an unsigned commit
# or a check that never reports. Each org's `.github` repository calls this engine from a workflow a
# clock dispatches every hour. The engine posts each pull request that turned stuck since the
# caller's previous successful run, so the next run catches up a late or failed one. A first run
# posts every pull request stuck at that moment.
#
# The post goes to the dependencies channel and pings the repository's role. A pull request waiting
# on a person's review posts to its repository's reviews channel too, or the org's when the
# repository has none. That post pings the requested reviewers, else the role, and the dependencies
# post stays quiet.
#
# The same clock watches the caller repository's notify-audit, which cannot report its own silence.
# When its last success turns 2 hours old, the security channel hears it once.
on:
  workflow_call:
    inputs:
      client_id:
        required: true
        type: string
        description: >-
          Client id of the GitHub App that searches the org's open pull requests, which the default
          token cannot read.
      stuck_hours:
        required: false
        type: string
        default: "2"
        description: Hours after its head's commit that a green bot pull request outside the merge queue counts as stuck.
      roles:
        required: false
        type: string
        default: "{}"
        description: JSON map from "<org>/<repo>" to the Discord role id that a stuck pull request pings.
      bws_server_url:
        required: false
        type: string
        default: ""
        description: Bitwarden server holding the GitHub-to-Discord map. Empty means the US cloud.
      dry_run:
        required: false
        type: string
        default: "false"
        description: When "true", write each message to the step summary instead of posting it.
    secrets:
      private_key:
        required: true
        description: Private key (PEM) of the App that client_id names.
      dependencies_webhook:
        required: false
        description: Discord webhook of the dependencies channel. Empty skips those posts.
      reviews_webhook:
        required: false
        description: >-
          Discord webhook of the org's reviews channel, for repositories missing from
          reviews_webhooks. Empty skips their posts.
      reviews_webhooks:
        required: false
        description: JSON map from "<org>/<repo>" to the webhook of that repository's reviews channel.
      bws_access_token:
        required: false
        description: Bitwarden token that reads the GitHub-to-Discord map. Empty posts without user pings.
      security_webhook:
        required: false
        description: >-
          Discord webhook of the org's security channel, told when the caller repository's
          notify-audit.yaml stops succeeding. Empty skips that check.
      security_mention:
        required: false
        description: Discord user id of the admin the security post pings. Empty posts without a ping.

jobs:
  # A broken dispatch, a revoked App key or a disabled workflow stops notify-audit without a post.
  watch-audit:
    runs-on: ubuntu-latest
    # The default token alone reads the runs, so the check outlives the App key that notify-audit and
    # the scan share.
    permissions:
      actions: read
    steps:
      - name: Check notify-audit's last success
        id: audit
        env:
          GH_TOKEN: ${{ github.token }}
          CALLER: ${{ github.workflow_ref }}
          WEBHOOK: ${{ secrets.security_webhook }}
        run: |
          set -euo pipefail
          if [ -z "$WEBHOOK" ]; then
            echo "No security webhook, so notify-audit goes unwatched." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # notify-audit runs every 30 minutes, so 2 hours is four runs missed. The alert posts in
          # the run whose window, read as the scan reads it, holds that deadline.
          workflow="${CALLER%@*}"
          since="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "${workflow##*/}" --status success \
            --limit 1 --json createdAt --jq '.[0].createdAt // empty')"
          until="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)"
          last="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow notify-audit.yaml --status success \
            --limit 1 --json createdAt --jq '.[0].createdAt // empty')"

          # During an incident GitHub can list no run without an error, so an empty history only
          # warns. The daily CI-warning digest reports a caller whose notify-audit never succeeded.
          if [ -z "$last" ]; then
            echo "::warning::GitHub listed no successful notify-audit run in $GITHUB_REPOSITORY, so this check could not tell whether it stopped."
            exit 0
          fi

          silent="$(jq -nr --arg since "$since" --arg until "$until" --arg last "$last" '
            ($last | fromdateiso8601 + 7200 | todateiso8601) as $due | $due > $since and $due <= $until')"
          echo "silent=$silent" >>"$GITHUB_OUTPUT"
          echo "last=$last" >>"$GITHUB_OUTPUT"
          echo "notify-audit last succeeded: $last." >>"$GITHUB_STEP_SUMMARY"

      - name: Post to the security channel
        if: steps.audit.outputs.silent == 'true'
        uses: a-novel-kit/workflows/generic-actions/discord-post@v1.80.0
        with:
          webhook: ${{ secrets.security_webhook }}
          color: failed
          title: notify-audit has not succeeded for 2 hours in ${{ github.repository_owner }}
          url: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/notify-audit.yaml
          description: >-
            Last success: ${{ steps.audit.outputs.last }}. No audit-log alert reaches this channel until
            it runs again. Check that the workflow is enabled, why its last run failed, and whether its
            clock still dispatches it.
          mention_users: ${{ secrets.security_mention }}
          dry_run: ${{ inputs.dry_run }}

  scan:
    runs-on: ubuntu-latest
    # The App key is a secret of the caller's governance environment, which no feature branch opens.
    environment:
      name: governance
      deployment: false
    # The default token reads the caller's runs. The pull requests go through the App.
    permissions:
      actions: read
    outputs:
      events: ${{ steps.scan.outputs.events }}
    steps:
      - name: Mint read token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.client_id }}
          private-key: ${{ secrets.private_key }}
          owner: ${{ github.repository_owner }}
          permission-pull-requests: read

      - name: Find the stuck pull requests
        id: scan
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.token.outputs.token }}
          CALLER: ${{ github.workflow_ref }}
          STUCK_HOURS: ${{ inputs.stuck_hours }}
        run: |
          set -euo pipefail
          # The window runs from the previous successful run's creation to this one's, so consecutive
          # runs never overlap and each head posts once.
          workflow="${CALLER%@*}"
          since="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "${workflow##*/}" --status success \
            --limit 1 --json createdAt --jq '.[0].createdAt // empty')"
          until="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)"

          query='query($q: String!, $endCursor: String) {
            search(query: $q, type: ISSUE, first: 50, after: $endCursor) {
              pageInfo { hasNextPage endCursor }
              nodes { ... on PullRequest {
                number title url isInMergeQueue mergeStateStatus reviewDecision
                author { __typename }
                repository { nameWithOwner }
                autoMergeRequest { enabledAt }
                reviewRequests(first: 10) { nodes { requestedReviewer {
                  __typename ... on User { databaseId login } ... on Team { name }
                } } }
                commits(last: 1) { nodes { commit {
                  committedDate signature { isValid } statusCheckRollup { state }
                } } }
                dropped: timelineItems(itemTypes: [REMOVED_FROM_MERGE_QUEUE_EVENT], last: 1) {
                  nodes { ... on RemovedFromMergeQueueEvent { reason } }
                }
              } }
            }
          }'
          # notify-pr-run reports a red head. A pending head may be waiting on purpose, such as for
          # renovate/stability-days. GitHub timestamps share one ISO 8601 UTC format, so they compare
          # as strings.
          events="$(GH_TOKEN="$APP_TOKEN" gh api graphql --paginate -f query="$query" \
            -F q="org:${GITHUB_REPOSITORY_OWNER} is:pr is:open draft:false" |
            jq -sc --arg since "$since" --arg until "$until" --argjson hours "$STUCK_HOURS" '[.[].data.search.nodes[]
              | select(.author.__typename == "Bot" and (.isInMergeQueue | not))
              | .commits.nodes[0].commit as $head
              | select($head.statusCheckRollup.state == "SUCCESS")
              | ($head.committedDate | fromdateiso8601 + $hours * 3600 | todateiso8601) as $stuck
              | select($stuck > $since and $stuck <= $until)
              | [.reviewRequests.nodes[].requestedReviewer | select(.)] as $reviewers
              | (.reviewDecision == "REVIEW_REQUIRED") as $review
              | {
                  repo: .repository.nameWithOwner, number, title, url, review: $review,
                  review_description: (if $review | not then ""
                    elif $reviewers == [] then "**Stuck waiting on a review** · nobody requested"
                    else "**Stuck waiting on a review** · requested from \($reviewers | map(.login // .name) | join(", "))" end),
                  user_ids: ([$reviewers[] | select(.__typename == "User") | .databaseId | tostring] | join(" ")),
                  description: ([
                    "**Stuck** · green but not merging \($hours)h after its last commit",
                    (.mergeStateStatus | ascii_downcase),
                    ((.reviewDecision // "no review") | ascii_downcase | gsub("_"; " ")),
                    (if .autoMergeRequest then empty else "auto-merge off" end),
                    (if $head.signature.isValid then empty else "unsigned head" end),
                    (.dropped.nodes[0].reason // empty | "last dropped: \(ascii_downcase | gsub("_"; " "))")
                  ] | join(" · "))
                }]')"
          echo "events=$events" >>"$GITHUB_OUTPUT"
          echo "$(jq length <<<"$events") stuck pull request(s) between ${since:-the start} and $until." >>"$GITHUB_STEP_SUMMARY"

  post:
    needs: scan
    if: needs.scan.outputs.events != '[]'
    runs-on: ubuntu-latest
    environment:
      name: governance
      deployment: false
    permissions: {}
    strategy:
      # One post at a time keeps the channel under Discord's rate limit.
      max-parallel: 1
      matrix:
        event: ${{ fromJSON(needs.scan.outputs.events) }}
    steps:
      - name: Post to the dependencies channel
        uses: a-novel-kit/workflows/generic-actions/discord-post@v1.80.0
        with:
          webhook: ${{ secrets.dependencies_webhook }}
          color: in-progress
          title: ${{ matrix.event.repo }}#${{ matrix.event.number }} · ${{ matrix.event.title }}
          url: ${{ matrix.event.url }}
          description: ${{ matrix.event.description }}
          mention_roles: ${{ !matrix.event.review && fromJSON(inputs.roles || '{}')[matrix.event.repo] || '' }}
          dry_run: ${{ inputs.dry_run }}

      # The posting job resolves the reviewers, because masked Discord ids cannot cross a job boundary.
      - name: Resolve the reviewers
        id: reviewers
        if: matrix.event.review && matrix.event.user_ids != ''
        uses: a-novel-kit/workflows/generic-actions/discord-users@v1.80.0
        with:
          github_user_ids: ${{ matrix.event.user_ids }}
          bws_access_token: ${{ secrets.bws_access_token }}
          bws_server_url: ${{ inputs.bws_server_url }}

      - name: Post to the reviews channel
        if: matrix.event.review
        uses: a-novel-kit/workflows/generic-actions/discord-post@v1.80.0
        with:
          webhook: ${{ secrets.reviews_webhook }}
          webhooks: ${{ secrets.reviews_webhooks }}
          repository: ${{ matrix.event.repo }}
          color: in-progress
          title: ${{ matrix.event.repo }}#${{ matrix.event.number }} · ${{ matrix.event.title }}
          url: ${{ matrix.event.url }}
          description: ${{ matrix.event.review_description }}
          mention_users: ${{ steps.reviewers.outputs.discord_ids }}
          mention_roles: ${{ matrix.event.user_ids == '' && fromJSON(inputs.roles || '{}')[matrix.event.repo] || '' }}
          dry_run: ${{ inputs.dry_run }}
