name: auto-approve-dependabot (reusable)

# Approves and queues a repository's trusted dependency-bot pull requests. Each governed repository
# calls this engine from the `auto-approve-dependabot.yaml` that repocfg renders, and the engine runs
# in that repository's context. A Renovate update merges alone only when Renovate itself put it on
# auto-merge, so the updates its presets leave to review, such as majors, wait for a person.
#
# Approval is what lets a bot pull request merge, so the engine also enforces Renovate's release age.
# An update younger than its minimumReleaseAge carries a pending `renovate/stability-days` status,
# which no ruleset requires. The caller re-runs the engine when that status turns green. A `status`
# event carries no pull request, so the job resolves the pull request from the commit.
#
# It also approves a first-party package or image only with its release proof. Any workflow run of a
# repository can publish its packages, so an update to a version no release built waits for a person.
on:
  workflow_call:
    inputs:
      client_id:
        description: >-
          Client id of the GitHub App that approves and auto-merges each pull request. The App needs
          write access to contents and pull requests, and its review must count toward the required
          approval.
        required: true
        type: string
      dependency_bot_login:
        description: >-
          Login of the trusted dependency bot, such as Renovate, whose pull requests are approved. A
          `status` event resolves only this bot's pull requests.
        required: true
        type: string
      dependabot_security_login:
        description: Login of the Dependabot security-updates bot whose pull requests are approved.
        required: true
        type: string
      strict:
        description: >-
          Set for a repository whose merges reach production. The engine then approves only a release
          pin, or a version update Renovate itself put on auto-merge. Every other bot pull request
          waits for a person.
        required: false
        type: boolean
        default: false
    secrets:
      bot_private_key:
        description: Private key (PEM) of the App that client_id names.
        required: true

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    # The App key is a secret of the caller's governance environment, which no feature branch opens.
    environment:
      name: governance
      deployment: false
    if: >-
      github.event_name == 'status' ||
      github.event.pull_request.user.login == inputs.dependency_bot_login ||
      github.event.pull_request.user.login == inputs.dependabot_security_login
    # The default token makes the reads the App cannot: commit statuses, attestations and GitHub
    # Packages tarballs, with the diff they belong to. Every write uses the App.
    permissions:
      statuses: read
      contents: read
      attestations: read
      packages: read
    steps:
      # The App approves because the workflow token's review does not count toward the required
      # approval.
      - name: Mint approval token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.client_id }}
          private-key: ${{ secrets.bot_private_key }}
          # Without `owner` and `repositories`, the token covers the current repository only.
          permission-contents: write
          permission-pull-requests: write

      # A `status` event names only a commit, so the step looks up the open dependency-bot pull
      # request whose head it is.
      - name: Resolve the pull request
        id: pr
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          EVENT_PR: ${{ github.event.pull_request.html_url }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha || github.event.sha }}
          EVENT_AUTHOR: ${{ github.event.pull_request.user.login }}
          RENOVATE: ${{ inputs.dependency_bot_login }}
        run: |
          set -euo pipefail
          url="$EVENT_PR" author="$EVENT_AUTHOR"
          if [ -z "$url" ]; then
            read -r url author < <(gh api "repos/$GITHUB_REPOSITORY/commits/$EVENT_SHA/pulls" |
              jq -r --arg sha "$EVENT_SHA" --arg bot "$RENOVATE" '[.[] | select(.state == "open" and .head.sha == $sha and .user.login == $bot)][0]
                | "\(.html_url // "") \(.user.login // "")"')
          fi
          if [ -z "$url" ]; then
            echo "::notice::No open dependency-bot PR has head ${EVENT_SHA:0:12}; nothing to approve."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          { echo "url=$url"; echo "author=$author"; echo "sha=$EVENT_SHA"; } >> "$GITHUB_OUTPUT"

      # A person's push means the change needs real review, so the step approves only when every
      # commit is the bot's own. An unknown author counts as a person. A push can claim any author
      # email, so each commit must also carry GitHub's signature, which only the bot's API commits
      # get. Renovate puts on auto-merge exactly the updates its configuration lets merge alone, so a
      # Renovate pull request it left off auto-merge, or that a person took off, waits for a person.
      # The first to enable auto-merge decided it; recover-prs re-arms a dropped pull request as the
      # agent. An update inside its release-age window waits for its green status to re-run the job.
      - name: Confirm the bot's commits, Renovate's auto-merge choice and the update's age
        id: guard
        if: ${{ steps.pr.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          STATUS_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.url }}
          BOT: ${{ steps.pr.outputs.author }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          set -euo pipefail
          authors=$(gh pr view "$PR" --json commits \
            -q '[.commits[].authors[].login // "unknown"] | unique | sort | join(",")')
          if [ "$authors" != "$BOT" ]; then
            echo "::notice::Not auto-approving — commits by '${authors:-unknown}', expected only '$BOT'."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          unsigned=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/${PR##*/}/commits" | jq --arg bot "$BOT" \
            '[add[] | select(.author.login != $bot or .committer.login != "web-flow" or (.commit.verification.verified | not))] | length')
          if [ "$unsigned" != 0 ]; then
            echo "::notice::Not auto-approving — $unsigned commit(s) not signed by GitHub for '$BOT'."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          read -r branch first armed < <(gh api graphql -f owner="${GITHUB_REPOSITORY%/*}" \
            -f name="${GITHUB_REPOSITORY#*/}" -F number="${PR##*/}" -f query='
              query($owner: String!, $name: String!, $number: Int!) {
                repository(owner: $owner, name: $name) { pullRequest(number: $number) {
                  headRefName
                  autoMergeRequest { enabledAt }
                  timelineItems(itemTypes: [AUTO_MERGE_ENABLED_EVENT], first: 1) {
                    nodes { ... on AutoMergeEnabledEvent { actor { login } } }
                  }
                } }
              }' --jq '.data.repository.pullRequest |
                "\(.headRefName) \(.timelineItems.nodes[0].actor.login // "none") \(.autoMergeRequest != null)"')
          if [[ "$branch" == renovate/* ]] && { [ "${first%"[bot]"}" != "${BOT%"[bot]"}" ] || [ "$armed" != true ]; }; then
            echo "::notice::Not auto-approving — Renovate left this update to review, or a person took it off auto-merge."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          age=$(GH_TOKEN="$STATUS_TOKEN" gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/status" \
            --jq '[.statuses[] | select(.context == "renovate/stability-days")][0].state // "none"')
          if [ "$age" != none ] && [ "$age" != success ]; then
            echo "::notice::Not auto-approving yet — renovate/stability-days is '$age'; its success re-runs this."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify first-party release proofs
        id: proof
        if: ${{ steps.pr.outputs.skip != 'true' && steps.guard.outputs.skip != 'true' }}
        uses: a-novel-kit/workflows/generic-actions/verify-release-proof@v1.72.0
        with:
          github_token: ${{ github.token }}
          pull_request: ${{ steps.pr.outputs.url }}
          head_sha: ${{ steps.pr.outputs.sha }}

      # Strict mode defers to Renovate's own auto-merge choice, so an update Renovate leaves to
      # review, and any moved tag, waits for a person.
      - name: Classify the change
        id: classify
        if: ${{ inputs.strict && steps.proof.outputs.verified == 'true' }}
        uses: a-novel-kit/workflows/generic-actions/classify-bot-change@v1.72.0
        with:
          github_token: ${{ steps.token.outputs.token }}
          pull_request: ${{ steps.pr.outputs.url }}
          head_sha: ${{ steps.pr.outputs.sha }}
          bot: ${{ steps.pr.outputs.author }}

      - name: Approve
        if: >-
          ${{ steps.proof.outputs.verified == 'true' && (!inputs.strict ||
          steps.classify.outputs.decision == 'pin' || steps.classify.outputs.decision == 'renovate') }}
        uses: a-novel-kit/workflows/generic-actions/approve-bot@v1.72.0
        with:
          pull_request: ${{ steps.pr.outputs.url }}
          github_token: ${{ steps.token.outputs.token }}
          # The approval names the checked commit, so a later push needs its own.
          head_sha: ${{ steps.pr.outputs.sha }}

      # Auto-merge puts the approved pull request in the merge queue, which re-validates the required
      # checks and owns the merge method. `--squash` is the org's only merge method and serves a
      # repository with no queue. In strict mode, a Renovate update keeps the auto-merge Renovate
      # enabled, so the step arms only a release pin.
      - name: Enable auto-merge
        if: ${{ steps.proof.outputs.verified == 'true' && (!inputs.strict || steps.classify.outputs.decision == 'pin') }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ steps.pr.outputs.url }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          set -euo pipefail
          gh pr merge "$PR" --auto --squash --match-head-commit "$SHA"
