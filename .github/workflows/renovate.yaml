name: run renovate
on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  renovate:
    runs-on: ubuntu-latest
    # The privileged keys are secrets of the governance environment, which no feature branch opens.
    environment:
      name: governance
      deployment: false
    # Renovate writes as the Dependencies App, with the token the action mints from its key. The job
    # token only reads GitHub Packages, for Renovate and for the commands it runs, such as
    # pnpm install.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: $/generic-actions/renovate
        with:
          repository_config: "true"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          app_private_key: ${{ secrets.DEPENDENCY_BOT_PRIVATE_KEY }}
          client_id: ${{ vars.DEPENDENCY_BOT_CLIENT_ID }}
