name: notify-pr (reusable)

# Tells people in Discord where each pull request stands, without the dependency bots' noise. Each
# governed repository calls this engine on pull request, review and failed CI events, from the
# `notify.yaml` and `notify-reviews.yaml` that repocfg renders. Drafts post nothing, and a post
# never pings the person who caused it.
#
# A person's pull request posts to its repository's reviews channel, or the org's when there is none.
# It posts when it waits on a review, gets one, merges or drops out of the merge queue. A review
# request pings the reviewers. A review or a drop pings the owners: the assignees, else the
# assignees of the issues it closes, else the repository's role. A bot's pull request posts to the
# dependencies channel when a commit fails CI, pinging the role the first time, and when it merges
# or closes after a failure.
on:
  workflow_call:
    inputs:
      client_id:
        required: true
        type: string
        description: >-
          Client id of the GitHub App that reads the pull request, the issues it closes and their org
          board Target date. The default token cannot read an org board.
      roles:
        required: false
        type: string
        default: "{}"
        description: >-
          JSON map from "<org>/<repo>" to the Discord role id pinged when a pull request has no owner
          or reviewer, and on a bot's first CI failure.
      bws_server_url:
        required: false
        type: string
        default: ""
        description: Bitwarden server holding the GitHub-to-Discord map. Empty means the US cloud.
      dry_run:
        required: false
        type: string
        default: "false"
        description: When "true", write each message to the step summary instead of posting it.
    secrets:
      private_key:
        required: true
        description: Private key (PEM) of the App that client_id names.
      reviews_webhook:
        required: false
        description: >-
          Discord webhook of the org's reviews channel, for repositories missing from
          reviews_webhooks. Empty skips their posts.
      reviews_webhooks:
        required: false
        description: JSON map from "<org>/<repo>" to the webhook of that repository's reviews channel.
      dependencies_webhook:
        required: false
        description: Discord webhook of the dependencies channel, where bots' pull requests post. Empty skips those posts.
      bws_access_token:
        required: false
        description: Bitwarden token that reads the GitHub-to-Discord map. Empty posts without user pings.

jobs:
  notify:
    runs-on: ubuntu-latest
    # The App key and the Bitwarden token are secrets of the caller's governance environment, which no
    # feature branch opens.
    environment:
      name: governance
      deployment: false
    # A bot's pull request reaches the job only through a failed CI run or its close. Repositories run
    # `main` on pull_request, merge_group or a push to every branch, so the branch tells a pull
    # request's run from the default branch's.
    if: >-
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.name == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch != github.event.repository.default_branch ||
      github.event_name == 'workflow_run' && github.event.workflow_run.name == 'pr-relay' &&
      github.event.workflow_run.event == 'pull_request_review' ||
      github.event_name != 'workflow_run' && !github.event.pull_request.draft &&
      (github.event.pull_request.user.type != 'Bot' || github.event.action == 'closed')
    # The default token lists the CI runs of a bot's pull request. The pull request goes through the App.
    permissions:
      actions: read
    # One pull request's events post in the order they happened.
    concurrency:
      group: notify-pr-${{ github.repository }}-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_branch }}
      queue: max
    steps:
      - name: Mint read token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.client_id }}
          private-key: ${{ secrets.private_key }}
          owner: ${{ github.repository_owner }}
          permission-issues: read
          permission-pull-requests: read
          permission-organization-projects: read

      - name: Decide what to post
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          event="$(cat "$GITHUB_EVENT_PATH")"
          owner="${GITHUB_REPOSITORY%/*}"

          # A review reaches this job through pr-relay, which a pull request's own workflow can
          # rewrite, so the relay run names nothing trusted. The step reads the pull request and its
          # latest review back, and builds from them the payload of a direct review event.
          if [ "$GITHUB_EVENT_NAME" = workflow_run ] && [ "$(jq -r .workflow_run.name <<<"$event")" = pr-relay ]; then
            [ "$(jq -r .workflow_run.event <<<"$event")" = pull_request_review ] || exit 0
            number="$(jq -r '.workflow_run.pull_requests[0].number // empty' <<<"$event")"
            if [ -z "$number" ]; then
              number="$(gh api "repos/$GITHUB_REPOSITORY/commits/$(jq -r .workflow_run.head_sha <<<"$event")/pulls" \
                --jq '[.[] | select(.state == "open")][0].number // empty')"
            fi
            [ -n "$number" ] || exit 0
            pull="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number")"
            # The job's condition skips drafts and bots' pull requests on a direct event. A relayed
            # review skips them here.
            if [ "$(jq -r .draft <<<"$pull")" = true ] || [ "$(jq -r .user.type <<<"$pull")" = Bot ]; then
              exit 0
            fi
            review="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$number/reviews" --jq '.[]' | jq -sc 'max_by(.submitted_at) // empty')"
            [ -n "$review" ] || exit 0
            kind=review_submitted
            [ "$(jq -r .state <<<"$review")" = DISMISSED ] && kind=review_dismissed
            event="$(jq -n --argjson pull "$pull" --argjson review "$review" '{
              review: ($review | .state |= ascii_downcase),
              pull_request: {number: $pull.number, draft: $pull.draft, user: $pull.user},
              sender: {id: $review.user.id, login: $review.user.login}
            }')"
          # A failed run names its pull request by branch. A merge queue branch carries the number.
          elif [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            kind=failed
            branch="$(jq -r .workflow_run.head_branch <<<"$event")"
            if [[ $branch =~ ^gh-readonly-queue/.+/pr-([0-9]+)-[0-9a-f]+$ ]]; then
              number="${BASH_REMATCH[1]}"
            else
              number="$(gh api -X GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f head="$owner:$branch" \
                --jq '.[0].number // empty')"
            fi
            [ -n "$number" ] || exit 0
          else
            kind="$(jq -r .action <<<"$event")"
            if [ "$GITHUB_EVENT_NAME" = pull_request_review ]; then kind="review_$kind"; fi
            number="$(jq -r .pull_request.number <<<"$event")"
          fi

          # A ready pull request is read a minute later, so the reviewers automation requests meanwhile
          # join its post. A review request from that minute, dated by its run's creation, posts
          # nothing. A dequeue's reason reaches the timeline just after the event.
          at=""
          case "$kind" in
            opened | ready_for_review) sleep 60 ;;
            dequeued) sleep 10 ;;
            review_requested | review_request_removed)
              at="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)"
              ;;
          esac

          query='query($owner: String!, $name: String!, $number: Int!) {
            repository(owner: $owner, name: $name) { pullRequest(number: $number) {
              number title url state isDraft createdAt headRefName baseRefName reviewDecision
              author { __typename login }
              assignees(first: 10) { nodes { databaseId login } }
              reviewRequests(first: 10) { nodes { requestedReviewer {
                __typename ... on User { databaseId login } ... on Team { name }
              } } }
              latestOpinionatedReviews(first: 20, writersOnly: true) { nodes { state author { login } } }
              mergeQueueEntry { state }
              milestone { title url dueOn }
              closingIssuesReferences(first: 5) { nodes {
                number url repository { nameWithOwner }
                assignees(first: 10) { nodes { databaseId login } }
                projectItems(first: 5) { nodes {
                  target: fieldValueByName(name: "Target date") { ... on ProjectV2ItemFieldDateValue { date } }
                } }
              } }
              ready: timelineItems(itemTypes: [READY_FOR_REVIEW_EVENT], last: 1) {
                nodes { ... on ReadyForReviewEvent { createdAt } }
              }
              dropped: timelineItems(itemTypes: [REMOVED_FROM_MERGE_QUEUE_EVENT], last: 20) {
                nodes { ... on RemovedFromMergeQueueEvent { reason } }
              }
            } }
          }'
          pr="$(GH_TOKEN="$APP_TOKEN" gh api graphql -f owner="$owner" -f name="${GITHUB_REPOSITORY#*/}" \
            -F number="$number" -f query="$query" --jq .data.repository.pullRequest)"

          # A bot's history decides its posts. The history holds every CI run since the pull request
          # opened, on its branch or in the queue, ordered by completion. A rerun counts as a failure,
          # since a green run is rarely rerun. A repository without a main workflow answers 404 and has
          # no history.
          runs='[]'
          jobs='[]'
          if [ "$(jq -r .author.__typename <<<"$pr")" = Bot ] && { [ "$kind" = failed ] || [ "$kind" = closed ]; }; then
            if out="$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/workflows/main.yaml/runs?created=>=$(jq -r .createdAt <<<"$pr")&per_page=100" \
              --jq '.workflow_runs[] | {id, head_branch, head_sha, conclusion, run_attempt, updated_at}' 2>&1)"; then
              runs="$(jq -sc . <<<"$out")"
            elif [[ $out != *"HTTP 404"* ]]; then
              printf '::error::%s\n' "$out"
              exit 1
            fi
            if [ "$kind" = failed ]; then
              jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$(jq -r .workflow_run.id <<<"$event")/jobs" \
                --jq '[.jobs[] | select(.conclusion == "failure") | .name]')"
            fi
          fi

          # GitHub timestamps share one ISO 8601 UTC format, so they compare as strings.
          delimiter="EOF_$(openssl rand -hex 8)"
          jq -r --argjson pr "$pr" --argjson runs "$runs" --argjson jobs "$jobs" \
            --arg kind "$kind" --arg at "$at" --arg repo "$GITHUB_REPOSITORY" --arg d "$delimiter" '
            . as $event
            | def logins: map(.login // .name) | join(", ");
            def ids: map(select(.databaseId != $event.sender.id) | .databaseId | tostring);
            def when($style): "<t:\(fromdateiso8601):\($style)>";
            ($pr.author.__typename == "Bot") as $bot
            | ($pr.state == "OPEN") as $open
            | (if $pr.assignees.nodes != [] then $pr.assignees.nodes
               else [$pr.closingIssuesReferences.nodes[].assignees.nodes[]] | unique_by(.databaseId) end) as $owners
            | (if $owners == [] then {role: true} else {users: ($owners | ids)} end) as $to_owners
            | [$pr.reviewRequests.nodes[].requestedReviewer] as $reviewers
            | ([$pr.latestOpinionatedReviews.nodes[] | select(.state == "APPROVED") | .author]) as $approvers
            | ([$pr.latestOpinionatedReviews.nodes[] | select(.state == "CHANGES_REQUESTED") | .author]) as $blockers
            | (($pr.ready.nodes[0].createdAt // $pr.createdAt) | fromdateiso8601 + 60 | todateiso8601) as $settled
            | ($at < $settled) as $settling
            | ($reviewers == [] and $approvers == [] and $blockers == []) as $unreviewed
            | ($event.workflow_run // {}) as $run
            | [$runs[] | select(.head_branch == $pr.headRefName or
                (.head_branch | startswith("gh-readonly-queue/\($pr.baseRefName)/pr-\($pr.number)-")))] as $history
            # $failed_before holds the failures that finished before this run. A commit posts only from
            # its first failed run, once per failing attempt.
            | ([$history[] | select((.conclusion == "failure" or .run_attempt > 1) and .id != $run.id and
                 ($run == {} or [.updated_at, .id] < [$run.updated_at, $run.id]))]
               + if ($run.run_attempt // 1) > 1 then [$run] else [] end) as $failed_before
            | any($failed_before[]; .head_sha == $run.head_sha and .id != $run.id) as $reported
            | [$pr.dropped.nodes[].reason | ascii_downcase] as $drops

            # Each event makes at most one post, with a color, a headline and who to ping.
            | (if $bot then
                if $kind == "failed" and $open and ($reported | not) then
                  {color: "failed"}
                  + if $failed_before == [] then {headline: "**CI failed**", role: true}
                    else {headline: "**CI failed again**"} end
                elif $kind == "closed" and $failed_before != [] then
                  if $pr.state == "MERGED" then {color: "succeeded", headline: "**Merged** after failing CI"}
                  else {color: "cancelled", headline: "**Closed** after failing CI"} end
                else null end
              elif $kind == "opened" or $kind == "ready_for_review" or
                ($kind == "review_request_removed" and ($settling | not)) then
                if $unreviewed then {color: "upcoming", headline: "**Needs a reviewer**", role: true, commands: true}
                elif $kind == "review_request_removed" then
                  {color: "cancelled",
                   headline: "**Review request removed** for \([$event.requested_reviewer // $event.requested_team] | logins)"}
                elif $reviewers != [] then
                  {color: "started", headline: "**Review requested** from \($reviewers | logins)",
                   users: ([$reviewers[] | select(.__typename == "User")] | ids)}
                else null end
              elif $kind == "review_requested" and ($settling | not) then
                {color: "started",
                 headline: "**Review requested** from \([$event.requested_reviewer // $event.requested_team] | logins)",
                 users: ([$event.requested_reviewer // empty | {databaseId: .id}] | ids)}
              # A reply in a review thread arrives as a bodiless "commented" review.
              elif $kind == "review_submitted" and ($event.review.state != "commented" or
                (($event.review.body // "") != "" and $event.review.user.login != $event.pull_request.user.login)) then
                {color: ({approved: "succeeded", changes_requested: "in-progress"}[$event.review.state] // "upcoming"),
                 headline: ("**\({approved: "Approved", changes_requested: "Changes requested"}[$event.review.state] // "Reviewed")**"
                   + " by \($event.review.user.login) · [read the review](\($event.review.html_url))")}
                + $to_owners
              elif $kind == "review_dismissed" then
                {color: "in-progress", headline: "**Review dismissed** · \($event.review.user.login)"}
                + if $pr.reviewDecision == "APPROVED" then {} else $to_owners end
              # Purple, as GitHub shows a merge, so it never reads as the green of an approval.
              elif $kind == "closed" and $pr.state == "MERGED" then
                {color: "released", headline: "**Merged**"}
              # recover-prs re-queues a pull request whose checks timed out, up to three times.
              elif $kind == "dequeued" and $open and ($drops[-1] // "merged") != "merged"
                and ($drops[-1] != "checks_timed_out" or ($drops | map(select(. == "checks_timed_out")) | length) > 3) then
                {color: "failed", headline: "**Dropped from the merge queue** · \($drops[-1] | gsub("_"; " "))"}
                + $to_owners
              else null end) as $post

            # $details holds what every post says beyond its headline.
            | (([$pr.closingIssuesReferences.nodes[].projectItems.nodes[].target.date // empty] | first
                | if . then "\(.)T12:00:00Z" else null end) // $pr.milestone.dueOn) as $due
            | [
                "Status: \(if $pr.state == "MERGED" then "merged" elif $pr.state == "CLOSED" then "closed"
                  elif $pr.isDraft then "draft" elif $pr.mergeQueueEntry then "in the merge queue" else "open" end)"
                + " · Review: \([
                    if $approvers != [] then "approved by \($approvers | logins)" else empty end,
                    if $blockers != [] then "changes requested by \($blockers | logins)" else empty end,
                    if $reviewers != [] and $open then "waiting on \($reviewers | logins)" else empty end
                  ] | if . == [] then "no reviewer" else join(" · ") end)",
                ([
                  ($pr.closingIssuesReferences.nodes | if . != [] then
                    "Closes \(map("[\(.repository.nameWithOwner)#\(.number)](\(.url))") | join(", "))" else empty end),
                  ($pr.milestone // empty | "Milestone [\(.title)](\(.url))")
                ] | if . != [] then join(" · ") else empty end),
                ([
                  ($due // empty | "Due \(when("D")) (\(when("R")))"),
                  "Opened \($pr.createdAt | when("R")) by \($pr.author.login)"
                ] | join(" · ")),
                ($run | select($kind == "failed") |
                  "[\(.name) #\(.run_number)](\(.html_url)) failed\(if $jobs != [] then ": \($jobs | join(", "))" else "" end)")
              ] as $details
            # A pull request waiting on a reviewer carries the commands that take its review or, for an
            # admin who opened it, approve it through approve-pr.
            | (if $post.commands then [
                "Assign yourself as reviewer:",
                "```sh\ngh pr edit \($pr.number) -R \($repo) --add-reviewer \"$(gh api user -q .login)\"\n```",
                "Self-approve your own pull request (repository admins and core only):",
                "```sh\ngh workflow run approve-pr.yaml -R \($repo) -f pull_request=\($pr.number)\n```"
              ] else [] end) as $commands
            | {
                title: "\($repo)#\($pr.number) · \($pr.title)",
                url: $pr.url,
                channel: (if $bot then "dependencies" else "reviews" end),
                color: ($post.color // ""),
                description: (if $post then [$post.headline] + $details + $commands | join("\n") else "" end),
                users: ($post.users // [] | join(" ")),
                role: ($post.role // false)
              }
            | to_entries[] | "\(.key)<<\($d)\n\(.value)\n\($d)"' <<<"$event" >>"$GITHUB_OUTPUT"
          echo "Pull request #$number, $kind." >>"$GITHUB_STEP_SUMMARY"

      - name: Resolve the pings
        id: users
        if: steps.state.outputs.users != ''
        uses: a-novel-kit/workflows/generic-actions/discord-users@v1.81.2
        with:
          github_user_ids: ${{ steps.state.outputs.users }}
          bws_access_token: ${{ secrets.bws_access_token }}
          bws_server_url: ${{ inputs.bws_server_url }}

      - name: Post
        if: steps.state.outputs.color != ''
        uses: a-novel-kit/workflows/generic-actions/discord-post@v1.81.2
        with:
          # A post never falls back to the other channel.
          webhook: >-
            ${{ steps.state.outputs.channel == 'reviews' && secrets.reviews_webhook ||
            steps.state.outputs.channel == 'dependencies' && secrets.dependencies_webhook || '' }}
          webhooks: ${{ steps.state.outputs.channel == 'reviews' && secrets.reviews_webhooks || '' }}
          color: ${{ steps.state.outputs.color }}
          title: ${{ steps.state.outputs.title }}
          url: ${{ steps.state.outputs.url }}
          description: ${{ steps.state.outputs.description }}
          mention_users: ${{ steps.users.outputs.discord_ids }}
          mention_roles: ${{ steps.state.outputs.role == 'true' && fromJSON(inputs.roles || '{}')[github.repository] || '' }}
          dry_run: ${{ inputs.dry_run }}
