name: backport (reusable)

# Opens one backport pull request per fix onto a release line `release/vX.Y`. Each fix lands on the
# default branch first through its normal pull request, so a hotfix ships only reviewed, tested
# changes and never unreleased work. CI and review run against the released code, and merging a
# backport cuts the patch through release-line-run.yaml.
#
# A fix that does not apply opens nothing. The run fails and escalates with the commands that write
# the release line's form of the fix by hand. The kill switch does not gate this emergency patch
# path. An admin check and the cut's `release` environment guard it instead.
on:
  workflow_call:
    inputs:
      line:
        description: >
          Line to patch as MAJOR.MINOR, such as "1.4". A missing release line starts from the line's
          latest stable vX.Y.PATCH tag.
        required: true
        type: string
      fix_refs:
        description: >
          Space-separated commit SHAs already on the default branch, oldest first, each backported as
          its own pull request. Empty prepares the release line only, for a fix the line needs that
          the default branch does not.
        required: false
        type: string
        default: ""
      severity:
        description: Escalation severity, sev2 or sev1, when the backport fails.
        required: false
        type: string
        default: sev2
      dry_run:
        description: >
          When true, reports what the run would create, without pushing a branch or opening a pull
          request.
        required: false
        type: boolean
        default: true
      client_id:
        description: >
          Client id of the agent, the GitHub App that pushes the backport branches, approves the clean
          ones and files the escalation ticket.
        required: true
        type: string
      release_client_id:
        description: >
          Client id of the release App, the only GitHub App that may create a release line. A missing
          line is then created in a job of its own that waits at the `release` environment. Empty, the
          agent creates the line.
        required: false
        type: string
        default: ""
      dependency_client_id:
        description: >
          Client id of a second GitHub App that opens each clean backport, one that carries the
          reviewed fix's patch unchanged. The agent can then approve it, since the agent is not its
          last pusher. Empty, every backport waits for a person.
        required: false
        type: string
        default: ""
      project_id:
        description: Node id (PVT_…) of the org project board that tracks the escalation ticket.
        required: true
        type: string
      mention:
        description: GitHub @mention, a user or a team, that a SEV1 or SEV2 escalation ticket pings.
        required: false
        type: string
        default: ""
      push_mention:
        description: Discord mention, such as "<@&ROLE_ID>", that a SEV1 escalation's push pings.
        required: false
        type: string
        default: ""
    secrets:
      app_private_key:
        description: Private key (PEM) of the App that client_id names.
        required: true
      release_private_key:
        description: >
          Private key (PEM) of the App that release_client_id names. The caller passes it by name from
          its `release` environment, which only the job that creates the line opens.
        required: false
      dependency_private_key:
        description: Private key (PEM) of the App that dependency_client_id names.
        required: false
      push_webhook:
        description: Chat webhook URL that receives a SEV1 escalation's push. Empty turns the push off.
        required: false

jobs:
  # Reads whether the release line exists and, for a missing line, the tag it starts from. That tag
  # is the line's highest stable vLINE.PATCH tag, the baseline the backport job picks too. The job
  # runs outside the `release` environment, so a backport onto an existing line never waits for an
  # approval.
  line:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      missing: ${{ steps.line.outputs.missing }}
      baseline: ${{ steps.line.outputs.baseline }}
    steps:
      - name: Read the release line
        id: line
        env:
          LINE: ${{ inputs.line }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$LINE" | grep -qE '^[0-9]+\.[0-9]+$'; then
            echo "::error::line must be MAJOR.MINOR (e.g. 1.4), got \"$LINE\"." >&2
            exit 1
          fi
          if gh api "repos/$REPO/git/ref/heads/release/v$LINE" --silent 2>/dev/null; then
            echo "missing=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          baseline=$(gh api "repos/$REPO/git/matching-refs/tags/v$LINE." \
            --jq '.[] | select(.object.type == "commit") | "\(.ref | ltrimstr("refs/tags/")) \(.object.sha)"' |
            { grep -E "^v${LINE//./\\.}\.[0-9]+ " || true; } | sort -V | tail -n1 | cut -d' ' -f2)
          echo "missing=true" >>"$GITHUB_OUTPUT"
          echo "baseline=$baseline" >>"$GITHUB_OUTPUT"

  # Only the release App may create a release line, and its key lives in the `release` environment.
  # This job alone waits there, once per line, and the backport job opens the pull requests without it.
  create-line:
    needs: line
    if: needs.line.outputs.missing == 'true' && needs.line.outputs.baseline != '' && !inputs.dry_run && inputs.release_client_id != ''
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: a-novel-kit/workflows/generic-actions/require-role@v1.69.0
        with:
          roles: admin
      - name: Mint line token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.release_client_id }}
          private-key: ${{ secrets.release_private_key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          # The line starts at an old tag whose workflow files differ from the default branch's.
          # GitHub refuses that ref to an App token without the workflows permission.
          permission-workflows: write
      - name: Create the release line
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          LINE: ${{ inputs.line }}
          BASELINE: ${{ needs.line.outputs.baseline }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/release/v$LINE" -f sha="$BASELINE" --silent
          echo "Created \`release/v$LINE\` as the release App." >>"$GITHUB_STEP_SUMMARY"

  backport:
    needs: [line, create-line]
    if: ${{ !cancelled() && needs.line.result == 'success' && needs.create-line.result != 'failure' }}
    runs-on: ubuntu-latest
    # The App keys are secrets of the caller's governance environment, which no feature branch opens.
    environment:
      name: governance
      deployment: false
    # The default token serves only the admin check. Branch and pull request writes use the App
    # tokens minted below.
    permissions:
      contents: read
    steps:
      # Any user with write access can dispatch, so this gate keeps hotfixes admin-only.
      - uses: a-novel-kit/workflows/generic-actions/require-role@v1.69.0
        with:
          roles: admin

      - name: Mint git token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.client_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      # A pull request's approval must come from someone other than its last pusher. This token makes
      # the last push to a clean backport and opens it, so the agent can approve it.
      - name: Mint backport token
        id: backport-token
        if: ${{ inputs.dependency_client_id != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.dependency_client_id }}
          private-key: ${{ secrets.dependency_private_key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.token.outputs.token }}
          fetch-depth: 0
          fetch-tags: true

      - name: Open backport pull requests
        id: backport
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          BACKPORT_TOKEN: ${{ steps.backport-token.outputs.token }}
          LINE: ${{ inputs.line }}
          FIX_REFS: ${{ inputs.fix_refs }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DRY_RUN: ${{ inputs.dry_run }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
        run: |
          set -euo pipefail

          # Prints the highest vLINE.PATCH release tag, excluding sub-module tags (<dir>/v…) and
          # pre-releases. Validating the line first guards the glob and grep against a malformed or
          # injected value. Escaping its dots keeps line 1.4 from matching a tag v1x4.0.
          release_baseline() {
            local line="$1" line_re
            if ! printf '%s' "$line" | grep -qE '^[0-9]+\.[0-9]+$'; then
              echo "::error::line must be MAJOR.MINOR (e.g. 1.4), got \"$line\"." >&2
              return 1
            fi
            line_re=$(printf '%s' "$line" | sed 's/\./\\./g')
            git tag -l "v${line}.*" | grep -E "^v${line_re}\.[0-9]+$" | sort -V | tail -1
          }

          # Creates release/vLINE from the baseline tag when the line has none yet. An existing line
          # must contain the baseline, since its head is the latest patch. A line missing the baseline
          # was cut by hand from something else.
          ensure_release_line() {
            local line="$1" baseline="$2" branch="release/v$1"
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
              git fetch --quiet origin "$branch"
              if ! git merge-base --is-ancestor "$baseline" "origin/$branch"; then
                echo "::error::$branch does not contain $baseline, the line's latest tag; repair the branch before backporting." >&2
                return 1
              fi
              return 0
            fi
            if [ "$DRY_RUN" = "true" ]; then
              echo "[dry-run] would create \`$branch\` from \`$baseline\`." >> "$GITHUB_STEP_SUMMARY"
              git update-ref "refs/remotes/origin/$branch" "$baseline"
              return 0
            fi
            # Only a caller without the release App gets here. With it, the create-line job made the line.
            git push --quiet origin "$baseline^{commit}:refs/heads/$branch"
            git fetch --quiet origin "$branch"
            echo "Created \`$branch\` from \`$baseline\`." >> "$GITHUB_STEP_SUMMARY"
          }

          # Prints the full SHA of a commit on the default branch. The step resolves every fix before
          # it writes anything, so a bad ref stops the run before any backport opens. The create-line
          # job runs earlier and still creates a missing line.
          resolve_fix() {
            local ref="$1" sha
            case "$ref" in -*)
              echo "::error::fix ref must not begin with '-' (got \"$ref\")." >&2
              return 1
              ;;
            esac
            if ! sha=$(git rev-parse --verify --quiet "${ref}^{commit}"); then
              echo "::error::$ref is not a commit in this repository." >&2
              return 1
            fi
            if ! git merge-base --is-ancestor "$sha" "origin/$DEFAULT_BRANCH"; then
              echo "::error::${sha:0:12} is not on $DEFAULT_BRANCH. Land the fix through its pull request first, then backport it." >&2
              return 1
            fi
            echo "$sha"
          }

          # Prints a hint when a normal patch release ships the fixes with one review less. That holds
          # when the line's baseline is the latest release and the default branch holds nothing
          # unreleased but the fixes. Prints nothing otherwise.
          fast_path() {
            local baseline="$1" latest unreleased
            shift
            latest=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            [ "$#" -gt 0 ] && [ "$latest" = "$baseline" ] || return 0
            git merge-base --is-ancestor "$baseline" "origin/$DEFAULT_BRANCH" || return 0
            unreleased=$(git rev-list "$baseline..origin/$DEFAULT_BRANCH" | grep -vxF -f <(printf '%s\n' "$@") || true)
            [ -z "$unreleased" ] || return 0
            echo "\`$DEFAULT_BRANCH\` holds nothing unreleased since \`$baseline\` but these fixes: a normal patch release ships them with one review less than a backport."
          }

          # Prints a commit's patch-id, which names its diff whatever its message, author or line numbers.
          patch_of() {
            git show "$1" | git patch-id --stable | cut -d' ' -f1
          }

          # Cherry-picks one resolved fix onto the release line and opens it as its own pull request. A
          # conflict leaves nothing behind and appends the commands that write the line's form of the
          # fix by hand to $INSTRUCTIONS, the escalation ticket's body.
          backport_fix() {
            local sha="$1" line="$2" base="release/v$2" subject branch signed url writer="${GH_TOKEN:-}" clean=false
            # The title reuses the fix's subject, which passed the Conventional Commits check on the
            # default branch.
            subject=$(git log -1 --format=%s "$sha")
            # `git cherry` prints `-` for a commit whose patch is already on the line.
            if git cherry "origin/$base" "$sha" "${sha}^" | grep -q '^-'; then
              echo "${sha:0:12} is already on \`$base\`; nothing to backport." >> "$GITHUB_STEP_SUMMARY"
              return 0
            fi
            branch="backport/v${line}-${sha:0:12}"
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
              echo "::warning::\`$branch\` already exists; ${sha:0:12} is already being backported." >&2
              return 0
            fi
            git switch --quiet --detach "origin/$base"
            if ! git cherry-pick -x "$sha" >/dev/null 2>&1; then
              local paths
              paths=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
              git cherry-pick --abort
              echo "::error::${sha:0:12} does not apply to $base; conflicting paths: ${paths:-none}." >&2
              # The title is quoted with %q, so the printed command stays safe to paste.
              tee -a "$INSTRUCTIONS" >&2 <<EOF
          \`${sha:0:12}\` (${subject}) does not apply to \`$base\`. Write the release line's form of the fix by hand:

              git switch --create $branch origin/$base
              git cherry-pick -S -x $sha   # the line requires signed commits; resolve against the released code
              git push --set-upstream origin $branch
              gh pr create --base $base --title $(printf '%q' "$subject [v$line]")

          EOF
              return 1
            fi
            if [ "$DRY_RUN" = "true" ]; then
              echo "[dry-run] would open \`$subject [v$line]\` from \`$branch\` into \`$base\`." >> "$GITHUB_STEP_SUMMARY"
              return 0
            fi
            # A clean backport is the reviewed fix unchanged, so the backport token writes it and the
            # agent can approve it. A backport git fitted to different context stays the agent's.
            if [ -n "${BACKPORT_TOKEN:-}" ] && [ "$(patch_of "$sha")" = "$(patch_of HEAD)" ]; then
              writer="$BACKPORT_TOKEN" clean=true
            fi
            git push --quiet origin "HEAD:refs/heads/$branch"
            # The release line requires signed commits, and GitHub signs only the commits an App makes
            # through its API. The push puts the cherry-pick's tree on GitHub under the backport branch,
            # which no ruleset requires signed. The writing App then recreates the commit from that tree
            # and moves the branch onto it.
            signed=$(GH_TOKEN="$writer" gh api "repos/$GITHUB_REPOSITORY/git/commits" -f message="$(git log -1 --format=%B)" \
              -f tree="$(git rev-parse 'HEAD^{tree}')" -f "parents[]=$(git rev-parse HEAD^)" --jq .sha) || return 1
            GH_TOKEN="$writer" gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" -f sha="$signed" \
              -F force=true --silent || return 1
            url=$(GH_TOKEN="$writer" gh pr create --base "$base" --head "$branch" --title "$subject [v$line]" \
              --body "Backports ${sha} from \`$DEFAULT_BRANCH\` to \`$base\`. Merging it cuts the next v${line} patch.") || return 1
            echo "$url" >> "$GITHUB_STEP_SUMMARY"
            if [ "$clean" = true ]; then
              gh pr review "$url" --approve --body "Carries ${sha} unchanged, as reviewed on \`$DEFAULT_BRANCH\`." || return 1
              gh pr merge "$url" --auto --squash || return 1
              echo "Approved it: it carries the reviewed fix unchanged, so it merges once its checks pass." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "It waits for a person's review." >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"

          fixes=()
          for ref in $FIX_REFS; do
            sha=$(resolve_fix "$ref")
            fixes+=("$sha")
          done
          if ! baseline=$(release_baseline "$LINE") || [ -z "$baseline" ]; then
            echo "::error::no released tag on line v${LINE}.x — nothing to backport to."
            exit 1
          fi
          ensure_release_line "$LINE" "$baseline"
          fast_path "$baseline" "${fixes[@]}" >> "$GITHUB_STEP_SUMMARY"

          INSTRUCTIONS="$RUNNER_TEMP/backport-instructions.md"
          failed=0
          for sha in "${fixes[@]}"; do
            backport_fix "$sha" "$LINE" || failed=1
          done
          if [ -s "$INSTRUCTIONS" ]; then
            delimiter="EOF_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
            printf 'instructions<<%s\n%s\n%s\n' "$delimiter" "$(cat "$INSTRUCTIONS")" "$delimiter" >> "$GITHUB_OUTPUT"
          fi
          exit "$failed"

      # Any failure in this job escalates to a person at the dispatch's severity. A failed line or
      # create-line job skips this job and escalates nothing. A dry run only logs the escalation.
      - name: Escalate on failure
        if: ${{ failure() }}
        uses: a-novel-kit/workflows/generic-actions/escalate@v1.69.0
        with:
          client_id: ${{ inputs.client_id }}
          app_private_key: ${{ secrets.app_private_key }}
          project_id: ${{ inputs.project_id }}
          severity: ${{ inputs.severity }}
          summary: "backport to v${{ inputs.line }}.x failed"
          dedup_key: "backport-failed:${{ github.repository }}:${{ inputs.line }}"
          body: ${{ steps.backport.outputs.instructions }}
          repo: ${{ github.repository }}
          mention: ${{ inputs.mention }}
          push_mention: ${{ inputs.push_mention }}
          push_webhook: ${{ secrets.push_webhook }}
          dry_run: ${{ inputs.dry_run }}
