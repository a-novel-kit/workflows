# Repairs the board and check state that the event-driven automation can miss. Each org's `.github`
# repository calls this sweep from a workflow that a clock dispatches, and that workflow owns the
# concurrency. The per-PR passes run as matrices over the org's open pull requests and reach each
# repository through their actions' repo inputs. Every board mutation goes through the single-writer
# actions.
#
# The kill switch is the org's `AGENT_KILL_SWITCH` variable, which this reusable workflow reads and
# a composite action cannot. Each action that receives it runs only for an explicit off value
# (empty, 0, off, false, no, disabled) and halts on anything else, so a mistyped value stops it.
name: reconcile-board

on:
  workflow_call:
    inputs:
      project_id:
        required: true
        type: string
        description: Node id (PVT_…) of the org project board to reconcile.
      client_id:
        required: true
        type: string
        description: >-
          Client id of the GitHub App every pass runs as, across the org's repositories, board and
          checks. Each pass mints its own narrow token from it.
      rollup_dry_run:
        required: false
        type: string
        default: "true"
        description: When "true", the rollup pass only logs. "false" writes the board.
      detect_dry_run:
        required: false
        type: string
        default: "true"
        description: >
          When "true", the partial-landing detector only logs. "false" posts `epic-freeze` checks and
          re-arms auto-merge on stray Epic members.
      render_dry_run:
        required: false
        type: string
        default: "true"
        description: >
          When "true", the render pass only logs the status table it would write. "false" rewrites the
          table into each active Epic's issue body.
      planning_repo:
        required: false
        type: string
        default: .github
        description: >
          Name of the org repository holding the Epic issues, where the sweep reads the
          `automation:paused` marker and the activation snapshot and renders the status table. The
          regate, detect and render passes share this one value, since merge-gate writes the snapshot
          where detect-partial-landing reads it. A mismatch silently degrades every Epic to live label
          membership.
      regate_snapshot_dry_run:
        required: false
        type: string
        default: "false"
        description: >
          When "true", the re-posted merge-gate logs the activation snapshot it would capture and
          leaves the Epic body alone. The gate check is posted either way. The sweep is often the only
          run on a set that is ready and waiting, and a pending snapshot freezes on a later pass. A
          rehearsing sweep therefore leaves the snapshot pending, and the Epic lands on live label
          membership.
      archive_dry_run:
        required: false
        type: string
        default: "true"
        description: >
          When "true", the archive pass only logs. "false" archives and closes every "Applied" item in
          the org, and archives every item whose issue is closed.
    secrets:
      private_key:
        required: true
        description: Private key (PEM) of the App that client_id names.

jobs:
  # Rolls each parent issue's Status and Start date up from its children. The job runs after
  # rederive, so parents aggregate fresh Task statuses. It still runs when rederive failed or had no
  # Task pull requests, and only a cancel stops it.
  rollup:
    needs: rederive
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # The App key is a secret of the caller's governance environment, which no feature branch opens.
    environment:
      name: governance
      deployment: false
    permissions: {}
    steps:
      - uses: a-novel-kit/workflows/generic-actions/rollup-board@v1.64.0
        with:
          client_id: ${{ inputs.client_id }}
          app_private_key: ${{ secrets.private_key }}
          project_id: ${{ inputs.project_id }}
          dry_run: ${{ inputs.rollup_dry_run }}
          kill_switch: ${{ vars.AGENT_KILL_SWITCH }}

  # Clears terminal meta work off the board. The job archives and closes every "Applied" item in the
  # org, such as a resolved escalation ticket. Each repository's publish archives its own "Awaiting
  # release" items, so this sweep takes the Applied items no release ships. The kill switch does not
  # reach this job.
  archive:
    runs-on: ubuntu-latest
    environment:
      name: governance
      deployment: false
    permissions: {}
    steps:
      - uses: a-novel-kit/workflows/generic-actions/archive-board-items@v1.64.0
        with:
          client_id: ${{ inputs.client_id }}
          app_private_key: ${{ secrets.private_key }}
          project_id: ${{ inputs.project_id }}
          status: Applied
          repo: "*"
          close: "true"
          dry_run: ${{ inputs.archive_dry_run }}
      # Archives every board item whose issue is closed, org-wide. No publish archives a done planning
      # issue in the `.github` repository, so this step keeps closed and archived equivalent on the
      # board.
      - uses: a-novel-kit/workflows/generic-actions/archive-board-items@v1.64.0
        with:
          client_id: ${{ inputs.client_id }}
          app_private_key: ${{ secrets.private_key }}
          project_id: ${{ inputs.project_id }}
          archive_closed: "true"
          repo: "*"
          dry_run: ${{ inputs.archive_dry_run }}

  # Lists every open pull request in the org into the matrices of the two per-PR passes.
  enumerate:
    runs-on: ubuntu-latest
    environment:
      name: governance
      deployment: false
    permissions: {}
    outputs:
      tasks: ${{ steps.list.outputs.tasks }}
      epic_prs: ${{ steps.list.outputs.epic_prs }}
    steps:
      - name: Mint read token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.client_id }}
          private-key: ${{ secrets.private_key }}
          owner: ${{ github.repository_owner }}
          permission-issues: read
          permission-pull-requests: read
      - name: List open PRs
        id: list
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ORG: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          q='query($q:String!,$cursor:String){ search(query:$q, type:ISSUE, first:100, after:$cursor){
            pageInfo{ hasNextPage endCursor }
            nodes{ ... on PullRequest{ number headRefOid repository{ name }
              labels(first:20){ nodes{ name } }
              closingIssuesReferences(first:5){ nodes{ number } } } } } }'
          # A fail-safe cannot stop at the first 100 pull requests, so the loop pages through all.
          nodes='[]'
          cursor=""
          while :; do
            args=(-F q="org:$ORG is:pr is:open")
            [ -n "$cursor" ] && args+=(-F cursor="$cursor")
            page=$(gh api graphql -f query="$q" "${args[@]}")
            nodes=$(jq -cn --argjson a "$nodes" --argjson b "$(echo "$page" | jq -c '.data.search.nodes')" '$a + $b')
            [ "$(echo "$page" | jq -r '.data.search.pageInfo.hasNextPage')" = "true" ] || break
            cursor=$(echo "$page" | jq -r '.data.search.pageInfo.endCursor')
          done
          # tasks holds the open pull requests that close an issue, whose Status is re-derived.
          # Status derivation follows the same closing reference.
          tasks=$(echo "$nodes" | jq -c '[.[]
            | select(.number and (.closingIssuesReferences.nodes | length > 0))
            | {repo: .repository.name, number, sha: .headRefOid}]')
          # epic_prs holds the pull requests merge-gate is re-posted on, selected by the `epic:<N>`
          # label that merge-gate holds a set against. A member carries the label whether or not it
          # closes an issue, which covers the infra and re-pin pull requests pulled into a wave.
          #
          # This sweep releases a held member that has no event of its own. A member missing from here
          # stays at `failure` until its next event, and the whole wave waits behind it.
          epic_prs=$(echo "$nodes" | jq -c '[.[]
            | select(.number and ([.labels.nodes[].name | select(startswith("epic:"))] | length > 0))
            | {repo: .repository.name, number, sha: .headRefOid}]')
          {
            echo "tasks=$tasks"
            echo "epic_prs=$epic_prs"
          } >> "$GITHUB_OUTPUT"

  # Re-derives each open Task pull request's board Status, catching dropped derive events.
  rederive:
    needs: enumerate
    if: ${{ needs.enumerate.outputs.tasks != '[]' }}
    runs-on: ubuntu-latest
    environment:
      name: governance
      deployment: false
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.enumerate.outputs.tasks) }}
    steps:
      - name: Mint read token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.client_id }}
          private-key: ${{ secrets.private_key }}
          owner: ${{ github.repository_owner }}
          # Each matrix run reads one pull request, so the token covers that repository only.
          repositories: ${{ matrix.pr.repo }}
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
      - uses: a-novel-kit/workflows/generic-actions/derive-status@v1.64.0
        with:
          client_id: ${{ inputs.client_id }}
          app_private_key: ${{ secrets.private_key }}
          project_id: ${{ inputs.project_id }}
          repo: ${{ matrix.pr.repo }}
          pull_request_number: ${{ matrix.pr.number }}
          github_token: ${{ steps.token.outputs.token }}
          kill_switch: ${{ vars.AGENT_KILL_SWITCH }}

  # Re-posts merge-gate on each open Epic member, since a sibling changing in another repository
  # emits no event to it. merge-gate walks the siblings across repositories with its own org-wide
  # token.
  regate:
    needs: enumerate
    if: ${{ needs.enumerate.outputs.epic_prs != '[]' }}
    runs-on: ubuntu-latest
    environment:
      name: governance
      deployment: false
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.enumerate.outputs.epic_prs) }}
    steps:
      - uses: a-novel-kit/workflows/generic-actions/merge-gate@v1.64.0
        with:
          client_id: ${{ inputs.client_id }}
          app_private_key: ${{ secrets.private_key }}
          repo: ${{ matrix.pr.repo }}
          pull_request_number: ${{ matrix.pr.number }}
          head_sha: ${{ matrix.pr.sha }}
          snapshot_dry_run: ${{ inputs.regate_snapshot_dry_run }}
          planning_repo: ${{ inputs.planning_repo }}
          # A halted merge-gate posts a failing check on this idle pull request too, so a pull request
          # with no event while halted is still held.
          kill_switch: ${{ vars.AGENT_KILL_SWITCH }}

  # Runs the sweep half of the epic-freeze detector. One org-wide invocation, with no
  # pull_request_number, enumerates every active Epic and every open head itself. The action mints
  # its own org-wide read and checks tokens, plus a write token that re-arms stray members.
  detect:
    runs-on: ubuntu-latest
    environment:
      name: governance
      deployment: false
    permissions: {}
    steps:
      - uses: a-novel-kit/workflows/generic-actions/detect-partial-landing@v1.64.0
        with:
          client_id: ${{ inputs.client_id }}
          planning_repo: ${{ inputs.planning_repo }}
          app_private_key: ${{ secrets.private_key }}
          dry_run: ${{ inputs.detect_dry_run }}
          # A halted detector does nothing, since regate holds every pull request. max_freeze_repos
          # keeps its default of 5. An over-wide Epic is frozen anyway and only turns the sweep red.
          kill_switch: ${{ vars.AGENT_KILL_SWITCH }}

  # Rewrites each active Epic's derived status table into its issue body. One org-wide invocation
  # enumerates the active Epics and their members itself. No landing decision reads the table, so a
  # lost table is cosmetic, and a read or write error only warns.
  render:
    runs-on: ubuntu-latest
    environment:
      name: governance
      deployment: false
    permissions: {}
    steps:
      - uses: a-novel-kit/workflows/generic-actions/render-epic-status@v1.64.0
        with:
          client_id: ${{ inputs.client_id }}
          planning_repo: ${{ inputs.planning_repo }}
          app_private_key: ${{ secrets.private_key }}
          dry_run: ${{ inputs.render_dry_run }}
          kill_switch: ${{ vars.AGENT_KILL_SWITCH }}
