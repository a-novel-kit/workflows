name: reconcile-board (deprecated)

# Deprecated alias of reconcile-board-run.yaml, which runs the same sweep. Call that file instead; this
# one goes in the next major.
on:
  workflow_call:
    inputs:
      project_id:
        required: false
        type: string
        default: ${{ github.repository_owner == 'a-novel' && 'PVT_kwDOB9MxdM4BMh8r' || 'PVT_kwDOCy-nAM4BbtKH' }}
      client_id:
        required: true
        type: string
      rollup_dry_run:
        required: false
        type: string
        default: "true"
      detect_dry_run:
        required: false
        type: string
        default: "true"
      planning_repo:
        required: false
        type: string
        default: .github
      regate_snapshot_dry_run:
        required: false
        type: string
        default: "false"
      archive_dry_run:
        required: false
        type: string
        default: "true"
    secrets:
      private_key:
        required: true

jobs:
  reconcile:
    # Every job of the engine mints its own App token.
    permissions: {}
    uses: a-novel-kit/workflows/.github/workflows/reconcile-board-run.yaml@v1.87.2
    with:
      project_id: ${{ inputs.project_id }}
      client_id: ${{ inputs.client_id }}
      rollup_dry_run: ${{ inputs.rollup_dry_run }}
      detect_dry_run: ${{ inputs.detect_dry_run }}
      planning_repo: ${{ inputs.planning_repo }}
      regate_snapshot_dry_run: ${{ inputs.regate_snapshot_dry_run }}
      archive_dry_run: ${{ inputs.archive_dry_run }}
    secrets:
      private_key: ${{ secrets.private_key }}
