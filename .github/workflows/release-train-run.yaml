name: release-train (reusable)

# Releases every repository a landed Epic touched, from one admin dispatch. Each governed repository
# calls this engine from the `release-train.yaml` dispatch that repocfg renders.
on:
  workflow_call:
    inputs:
      epic_number:
        description: Number of the Epic to release.
        required: true
        type: string
      dry_run:
        description: >
          When "true", rehearses every repository and cuts nothing. "false" rehearses each repository,
          then cuts its release.
        required: false
        default: "true"
        # workflow_call has no choice type, so the caller's dispatch input holds the choice and passes
        # a validated string.
        type: string
      client_id:
        description: >-
          Client id of the GitHub App that reads the Epic's pull requests across the org, dispatches
          each repository's `release.yaml` and records the released tags on the Epic.
        required: true
        type: string
      kill_switch:
        description: >-
          Org-wide halt value. Any value but an explicit off value (empty, 0, off, false, no,
          disabled) fails the run before it mints a token.
        required: false
        type: string
        default: ""
    secrets:
      app_private_key:
        description: Private key (PEM) of the App that client_id names.
        required: true

jobs:
  release-train:
    runs-on: ubuntu-latest
    # The App key is a secret of the caller's governance environment, which no feature branch opens.
    environment:
      name: governance
      deployment: false
    # The default token serves only the admin check. The release-train action mints its own narrow
    # App tokens for the dispatches and the reads.
    permissions:
      contents: read
    steps:
      # Any user with write access can dispatch, so this gate keeps the release train admin-only.
      - uses: a-novel-kit/workflows/generic-actions/require-role@v1.70.0
        with:
          roles: admin

      - name: Require numeric epic
        env:
          EPIC: ${{ inputs.epic_number }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # The number reaches the `label:"epic:<N>"` search query, so it must be numeric.
          if ! [[ "${EPIC:-}" =~ ^[0-9]+$ ]]; then
            echo "::error::epic_number must be an integer, got \"${EPIC:-}\"."
            exit 1
          fi
          echo "Proceeding with the release train for epic:#${EPIC} (dry_run=${DRY_RUN:-true})." | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: a-novel-kit/workflows/generic-actions/release-train@v1.70.0
        with:
          client_id: ${{ inputs.client_id }}
          app_private_key: ${{ secrets.app_private_key }}
          epic_number: ${{ inputs.epic_number }}
          dry_run: ${{ inputs.dry_run }}
          kill_switch: ${{ inputs.kill_switch }}
