name: notify-issues (reusable)

# Tells people in Discord how board issues move through their lifecycle. Each org's `.github`
# repository calls this engine from a workflow a clock dispatches, since GitHub raises no event when a
# board Status changes. The engine posts each board issue whose Status changed, and each open one whose
# assignees changed, since the caller's previous successful run. The next run therefore catches up a
# late or failed one. Issues in Backlog post nothing.
#
# A post goes to its repository's issues channel, or the org's when the repository has none. Its color
# names the stage: purple for Triage, blue for Ready, gold for In review and green for the rest. A move
# into Triage or Ready, and an assignee change, ping the assignees through the GitHub-to-Discord map, or
# the repository's role when nobody is assigned.
on:
  workflow_call:
    inputs:
      project_id:
        required: true
        type: string
        description: Node id (PVT_…) of the org project board to poll.
      client_id:
        required: true
        type: string
        description: >-
          Client id of the GitHub App that reads the org board and its issues. The default token
          cannot read an org board.
      roles:
        required: false
        type: string
        default: "{}"
        description: JSON map from "<org>/<repo>" to the Discord role id that an unassigned issue pings.
      bws_server_url:
        required: false
        type: string
        default: ""
        description: Bitwarden server holding the GitHub-to-Discord map. Empty means the US cloud.
      dry_run:
        required: false
        type: string
        default: "false"
        description: When "true", write each message to the step summary instead of posting it.
    secrets:
      private_key:
        required: true
        description: Private key (PEM) of the App that client_id names.
      webhook:
        required: false
        description: >-
          Discord webhook of the org's issues channel, for repositories missing from webhooks. Empty
          skips their posts.
      webhooks:
        required: false
        description: JSON map from "<org>/<repo>" to the webhook of that repository's issues channel.
      bws_access_token:
        required: false
        description: Bitwarden token that reads the GitHub-to-Discord map. Empty posts without user pings.

jobs:
  scan:
    runs-on: ubuntu-latest
    # The App key is a secret of the caller's governance environment, which no feature branch opens.
    environment:
      name: governance
      deployment: false
    # The default token reads the caller's previous run. The board goes through the App.
    permissions:
      actions: read
    outputs:
      events: ${{ steps.scan.outputs.events }}
    steps:
      - name: Mint board token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.client_id }}
          private-key: ${{ secrets.private_key }}
          owner: ${{ github.repository_owner }}
          permission-issues: read
          permission-organization-projects: read

      - name: Find the issues to post
        id: scan
        env:
          GH_TOKEN: ${{ github.token }}
          BOARD_TOKEN: ${{ steps.token.outputs.token }}
          PROJECT_ID: ${{ inputs.project_id }}
          CALLER: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          # A first run looks back one dispatch interval, 15 minutes.
          workflow="${CALLER%@*}"
          since="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "${workflow##*/}" --status success \
            --limit 1 --json createdAt --jq '.[0].createdAt // empty')"
          [ -n "$since" ] || since="$(date -u -d '-15 minutes' +%Y-%m-%dT%H:%M:%SZ)"

          query='query($project: ID!, $states: [ProjectV2ItemArchivedState!], $filter: String, $endCursor: String) {
            node(id: $project) { ... on ProjectV2 { items(first: 100, after: $endCursor, archivedStates: $states, query: $filter) {
              pageInfo { hasNextPage endCursor }
              nodes {
                status: fieldValueByName(name: "Status") { ... on ProjectV2ItemFieldSingleSelectValue { name updatedAt } }
                content { ... on Issue {
                  number title url state
                  repository { nameWithOwner }
                  assignees(first: 10) { nodes { databaseId login } }
                  timelineItems(itemTypes: [ASSIGNED_EVENT, UNASSIGNED_EVENT], last: 1) {
                    nodes { ... on AssignedEvent { createdAt } ... on UnassignedEvent { createdAt } }
                  }
                } }
              }
            } } }
          }'
          scan() {
            GH_TOKEN="$BOARD_TOKEN" gh api graphql --paginate -f query="$query" -F project="$PROJECT_ID" \
              -f states="$1" -f filter="$2"
          }
          # reconcile-board archives a closed issue within 15 minutes, often before this poll sees it
          # merge, so archived items count too. Their filter takes whole days in an unstated time zone,
          # hence a day of margin. An item archived between the two scans appears in both.
          day="$(date -u -d "${since%T*} -1 day" +%F)"
          # GitHub timestamps share one ISO 8601 UTC format, so they compare as strings. discord-post
          # names its colors after CI states: released is purple, started blue, upcoming gold and
          # succeeded green.
          events="$({ scan NOT_ARCHIVED ""; scan ARCHIVED "updated:>=$day"; } |
            jq -sc --arg since "$since" '[.[].data.node.items.nodes[]
              | select(.content.state != null and .status != null and .status.name != "Backlog")
              | .status.name as $status
              | (.content.timelineItems.nodes[0].createdAt // "") as $assigned
              | (if .status.updatedAt > $since then
                   {at: .status.updatedAt, ping: ($status == "Triage" or $status == "Ready"),
                    what: (if $status == "Ready" then "Ready for pickup" else "Moved to \($status)" end)}
                 elif .content.state == "OPEN" and $assigned > $since then
                   {at: $assigned, ping: true, what: "Assignees changed, status \($status)"}
                 else empty end) as $event
              | [.content.assignees.nodes[] | select(.login | endswith("[bot]") | not)] as $assignees
              | {
                  at: $event.at, ping: $event.ping,
                  color: ({Triage: "released", Ready: "started", "In review": "upcoming"}[$status] // "succeeded"),
                  repo: .content.repository.nameWithOwner, number: .content.number, title: .content.title,
                  url: .content.url, user_ids: ($assignees | map(.databaseId | tostring) | join(" ")),
                  description: "\($event.what) · \(if $assignees == [] then "nobody assigned"
                    else "assigned to \($assignees | map(.login) | join(", "))" end)"
                }] | unique_by(.url) | sort_by(.at)')"
          echo "events=$events" >>"$GITHUB_OUTPUT"
          echo "$(jq length <<<"$events") issue(s) to post since $since." >>"$GITHUB_STEP_SUMMARY"

  post:
    needs: scan
    if: needs.scan.outputs.events != '[]'
    runs-on: ubuntu-latest
    environment:
      name: governance
      deployment: false
    permissions: {}
    strategy:
      # One post at a time keeps the channel in event order and under Discord's rate limit.
      max-parallel: 1
      matrix:
        event: ${{ fromJSON(needs.scan.outputs.events) }}
    steps:
      # The posting job resolves the assignees, because masked Discord ids cannot cross a job boundary.
      - name: Resolve the assignees
        id: users
        if: matrix.event.ping && matrix.event.user_ids != ''
        uses: a-novel-kit/workflows/generic-actions/discord-users@v1.77.1
        with:
          github_user_ids: ${{ matrix.event.user_ids }}
          bws_access_token: ${{ secrets.bws_access_token }}
          bws_server_url: ${{ inputs.bws_server_url }}

      - name: Post to Discord
        uses: a-novel-kit/workflows/generic-actions/discord-post@v1.77.1
        with:
          webhook: ${{ secrets.webhook }}
          webhooks: ${{ secrets.webhooks }}
          repository: ${{ matrix.event.repo }}
          color: ${{ matrix.event.color }}
          title: ${{ matrix.event.repo }}#${{ matrix.event.number }} · ${{ matrix.event.title }}
          url: ${{ matrix.event.url }}
          description: ${{ matrix.event.description }}
          mention_users: ${{ steps.users.outputs.discord_ids }}
          mention_roles: ${{ matrix.event.ping && matrix.event.user_ids == '' && fromJSON(inputs.roles || '{}')[matrix.event.repo] || '' }}
          dry_run: ${{ inputs.dry_run }}
