# zizmor config for this repository's own workflows.
#
# security-actions/lint-workflows mounts one config, so this file carries the baseline's rules
# beside this repository's exceptions. security-actions/lint-workflows/zizmor.yml is the original;
# keep the shared rules identical.

rules:
  unpinned-uses:
    config:
      policies:
        # Third-party actions run from the commit their release named, so a moved tag cannot
        # change what runs beside an App key. The a-novel-kit/workflows actions stay on release
        # tags, which their immutable releases lock.
        "a-novel-kit/*": ref-pin
        "*": hash-pin

  cache-poisoning:
    ignore:
      # main.yaml restores a build cache and builds images, the shape this audit
      # flags. The attack needs a lower-trust branch to write a cache that a
      # release run reads. GitHub scopes cache writes so a pull request branch
      # cannot reach the default branch's scope, and releases run from
      # release.yaml.
      - main.yaml

  github-app:
    ignore:
      # Each mints an App token with `owner:` and no `repositories:`, which zizmor reads as
      # over-broad. Each is an org-wide sweep, and a repository list would blind it:
      #
      #   token-expiry.yaml: reads the organization's PATs through an org-level grant.
      #   reconcile-board.yaml: searches every repository's pull requests for the board.
      #   notify-issues-run.yaml: reads the org board, whose issues live in every repository.
      #   notify-pr-run.yaml: reads the issues a pull request closes, in any repository.
      #   notify-stuck-run.yaml: searches every repository for stuck bot pull requests.
      #   notify-warnings-run.yaml: reads every repository's default-branch runs and annotations.
      #   notify-audit-run.yaml: reads the organization's audit log through an org-level grant.
      #
      # All seven keep the default token unused or read-only and give the App token read-only
      # `permission-*` scopes. A wider grant voids this exception.
      - token-expiry.yaml
      - reconcile-board.yaml
      - notify-issues-run.yaml
      - notify-pr-run.yaml
      - notify-stuck-run.yaml
      - notify-warnings-run.yaml
      - notify-audit-run.yaml

  artipacked:
    ignore:
      # The one checkout here that keeps its credentials. It checks out with a minted, repo-scoped
      # bot token, and its plain `git push` of the release line and the backport branches
      # authenticates through the persisted credential.
      - backport-run.yaml
