name: build node
description: Set up Node and run the package's build script.

inputs:
  build_action:
    required: false
    description: The name of the build command in the package file.
    default: build
  github_token:
    required: true
    description: The GitHub token to use for the action.

runs:
  using: "composite"
  steps:
    - uses: a-novel-kit/workflows/node-actions/setup-node@v1.74.0
      with:
        github_token: ${{ inputs.github_token }}
    - name: build
      shell: bash
      env:
        BUILD_ACTION: ${{ inputs.build_action }}
      run: pnpm run "$BUILD_ACTION"
