name: test playwright
description: >
  Run browser component tests with coverage, then screenshot tests: a platform's Playwright journeys
  or a Vitest browser project. With Drive configured, the tests compare their screenshots against the
  master reference kept in a private Shared Drive, and the run posts the result as the
  `visual-comparison` commit status. A screenshot change passes only on a head approved through
  `approve-playwright`.

inputs:
  github_token:
    required: true
    description: >
      Token that installs packages. With Drive configured, it also reads the provenance of runs,
      pull requests and labels, and posts the `visual-comparison` commit status (statuses write).
  component_test_action:
    required: false
    default: test:browser
    description: Package script for browser component tests that produce coverage.
  test_action:
    required: false
    default: test:e2e
    description: >
      Package script that runs the screenshot tests: Playwright journeys, which start the application
      and services themselves, or a Vitest browser project.
  runner:
    required: false
    default: playwright
    description: >
      Test runner behind test_action, "playwright" or "vitest". With Drive configured, Vitest tests
      declare their screenshots with visual-snapshot annotations, as Playwright journeys do.
  coverage_artifact:
    required: false
    default: browsercover
    description: Name of the browser component coverage artifact.
  coverage_file:
    required: false
    default: coverage/browser/lcov.info
    description: Browser component coverage file to upload.
  report_artifact:
    required: false
    default: playwright-report
    description: >
      Name of the artifact that holds the reports, traces, screenshots and service logs for seven
      days. It is uploaded only without Drive, which otherwise keeps that evidence.
  compose_file:
    required: false
    default: ""
    description: >
      Docker Compose file of disposable test services. When set, the action always collects their
      logs and removes them with their volumes.

  drive_ci_provider:
    required: false
    default: ""
    description: >
      Workload Identity provider of the tested run's Drive access. Empty turns the Drive comparison
      off, and the report goes to the report_artifact artifact.
  drive_ci_account:
    required: false
    default: ""
    description: >
      Service account of the tested run. It reads the references folder and adds to the results
      folder. An account that can add to or delete from the references folder is refused.
  drive_maintenance_provider:
    required: false
    default: ""
    description: Workload Identity provider that stages the new reference, used only on a push to master.
  drive_maintenance_account:
    required: false
    default: ""
    description: Service account that stages the reference on master. It can add and delete in both folders.
  references_folder:
    required: false
    default: ""
    description: ID of the platform's references folder inside a Shared Drive.
  results_folder:
    required: false
    default: ""
    description: ID of the platform's results folder, a sibling of the references folder.
  seed_sha:
    required: false
    default: ""
    description: >
      Reviewed master commit allowed to create the first reference. While no reference exists, every
      other Drive run fails.

outputs:
  artifact-id:
    description: Browser component coverage artifact id for the Codecov action.
    value: ${{ steps.coverage.outputs.artifact-id }}

runs:
  using: composite
  steps:
    - uses: a-novel-kit/workflows/node-actions/setup-node@v1.63.0
      with:
        github_token: ${{ inputs.github_token }}
        # A pull request's screenshot approval binds its head, so test that commit, not the branch tip.
        ref: ${{ github.event.pull_request.head.sha }}
    - name: Install Chromium and system dependencies
      shell: bash
      run: |
        set -euo pipefail
        pnpm exec playwright install --with-deps chromium
    - name: Run browser component tests
      id: component-tests
      shell: bash
      env:
        TEST_ACTION: ${{ inputs.component_test_action }}
      run: |
        set -euo pipefail
        pnpm run "$TEST_ACTION"
    - uses: actions/upload-artifact@v7
      id: coverage
      with:
        name: ${{ inputs.coverage_artifact }}
        path: ${{ inputs.coverage_file }}
        if-no-files-found: error
    - name: Validate the Drive configuration
      if: ${{ inputs.drive_ci_provider != '' }}
      shell: bash
      env:
        CI_ACCOUNT: ${{ inputs.drive_ci_account }}
        MAINTENANCE_PROVIDER: ${{ inputs.drive_maintenance_provider }}
        MAINTENANCE_ACCOUNT: ${{ inputs.drive_maintenance_account }}
        REFERENCES_FOLDER: ${{ inputs.references_folder }}
        RESULTS_FOLDER: ${{ inputs.results_folder }}
      run: |
        set -euo pipefail
        : "${CI_ACCOUNT:?Missing drive_ci_account}" "${MAINTENANCE_PROVIDER:?Missing drive_maintenance_provider}" "${MAINTENANCE_ACCOUNT:?Missing drive_maintenance_account}" "${REFERENCES_FOLDER:?Missing references_folder}" "${RESULTS_FOLDER:?Missing results_folder}"
    - name: Authenticate candidate Drive access
      id: drive-auth
      if: ${{ inputs.drive_ci_provider != '' }}
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ inputs.drive_ci_provider }}
        service_account: ${{ inputs.drive_ci_account }}
        token_format: access_token
        access_token_scopes: https://www.googleapis.com/auth/drive
        create_credentials_file: false
        export_environment_variables: false
    - name: Download the current master reference
      id: reference
      if: ${{ inputs.drive_ci_provider != '' }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        DRIVE_TOKEN: ${{ steps.drive-auth.outputs.access_token }}
        GH_TOKEN: ${{ inputs.github_token }}
        REFERENCES_FOLDER: ${{ inputs.references_folder }}
        RESULTS_FOLDER: ${{ inputs.results_folder }}
        SEED_SHA: ${{ inputs.seed_sha }}
      run: |
        set -euo pipefail
        node "$ACTION_PATH/drive/storage.mjs" download
    - name: Check approval for this head
      if: ${{ inputs.drive_ci_provider != '' }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        set -euo pipefail
        node "$ACTION_PATH/drive/policy.mjs" allow
    - name: Run screenshot tests
      id: journeys
      shell: bash
      env:
        TEST_ACTION: ${{ inputs.test_action }}
        ACTION_PATH: ${{ github.action_path }}
        DRIVE_PROVIDER: ${{ inputs.drive_ci_provider }}
        VISUAL_RUNNER: ${{ inputs.runner }}
      run: |
        set -euo pipefail
        if [ -n "$DRIVE_PROVIDER" ]; then
          node "$ACTION_PATH/drive/runner.mjs" "$TEST_ACTION"
        else
          pnpm run "$TEST_ACTION"
        fi
    - name: Collect service logs
      id: service-logs
      if: ${{ always() && inputs.compose_file != '' }}
      shell: bash
      env:
        COMPOSE_FILE: ${{ inputs.compose_file }}
      run: |
        set -euo pipefail
        if [ ! -f integration-services.log ]; then
          docker compose --file "$COMPOSE_FILE" logs --no-color > integration-services.log
        fi
    - name: Upload browser report and diagnostics
      uses: actions/upload-artifact@v7
      if: ${{ always() && inputs.drive_ci_provider == '' }}
      with:
        name: ${{ inputs.report_artifact }}
        path: |
          playwright-report/
          test-results/
          integration-services.log
        retention-days: 7
    - name: Upload private browser evidence
      id: drive-upload
      if: ${{ always() && steps.reference.outcome == 'success' }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        DRIVE_TOKEN: ${{ steps.drive-auth.outputs.access_token }}
        REFERENCES_FOLDER: ${{ inputs.references_folder }}
        RESULTS_FOLDER: ${{ inputs.results_folder }}
        BATCH_ARCHIVE: .visual/batch.tar
        JOURNEY_OUTCOME: ${{ steps.journeys.outcome }}
      run: |
        set -euo pipefail
        if [ "$JOURNEY_OUTCOME" != success ]; then
          node "$ACTION_PATH/drive/runner.mjs" --diagnostics
        else
          node "$ACTION_PATH/drive/runner.mjs" --archive
        fi
        node "$ACTION_PATH/drive/storage.mjs" upload
    - name: Upload screenshot drift review
      id: drift-upload
      if: ${{ always() && inputs.drive_ci_provider != '' && steps.journeys.outputs.drift == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        path: .visual/review/playwright-drift.html
        archive: false
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 3
        overwrite: true
    - name: Link screenshot drift review
      if: ${{ always() && steps.drift-upload.outcome == 'success' }}
      shell: bash
      env:
        DRIFT_URL: ${{ steps.drift-upload.outputs.artifact-url }}
      run: |
        set -euo pipefail
        printf '\n[Review screenshot drift (Old / New / Diff)](%s) — retained for 3 days.\n' "$DRIFT_URL" >> "$GITHUB_STEP_SUMMARY"
    - name: Record the visual comparison result
      if: ${{ always() && steps.reference.outcome == 'success' }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ inputs.github_token }}
        VISUAL_OUTCOME: ${{ steps.journeys.outcome == 'success' && steps.drive-upload.outcome == 'success' && steps.drift-upload.outcome != 'failure' && 'success' || 'failure' }}
        APPROVAL: ${{ steps.drive-upload.outcome == 'success' && steps.journeys.outputs.approval || '' }}
        DRIFT_URL: ${{ steps.drift-upload.outputs.artifact-url }}
      run: |
        set -euo pipefail
        node "$ACTION_PATH/drive/policy.mjs" record
    - name: Authenticate master reference staging
      id: reference-auth
      if: ${{ success() && inputs.drive_ci_provider != '' && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ inputs.drive_maintenance_provider }}
        service_account: ${{ inputs.drive_maintenance_account }}
        token_format: access_token
        access_token_scopes: https://www.googleapis.com/auth/drive
        create_credentials_file: false
        export_environment_variables: false
    - name: Stage the complete master reference
      if: ${{ success() && steps.reference-auth.outcome == 'success' }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        DRIVE_TOKEN: ${{ steps.reference-auth.outputs.access_token }}
        GH_TOKEN: ${{ inputs.github_token }}
        REFERENCES_FOLDER: ${{ inputs.references_folder }}
        RESULTS_FOLDER: ${{ inputs.results_folder }}
        BATCH_ARCHIVE: .visual/batch.tar
      run: |
        set -euo pipefail
        node "$ACTION_PATH/drive/storage.mjs" stage
    - name: Remove integration services and data
      id: cleanup
      if: ${{ always() && inputs.compose_file != '' }}
      shell: bash
      env:
        COMPOSE_FILE: ${{ inputs.compose_file }}
      run: |
        set -euo pipefail
        docker compose --file "$COMPOSE_FILE" down --volumes --remove-orphans
