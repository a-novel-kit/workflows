name: setup node
description: >
  Check out the repository, set up pnpm and Node against the GitHub package registry, and install
  dependencies. The checkout uses the workflow token: the repositories and their packages are public,
  so an App token would add only a credential every pull request's own workflow could read.

inputs:
  github_token:
    required: true
    description: The GitHub token to use for the action.
  ref:
    required: false
    description: >
      Ref to check out. Defaults to github.head_ref; pass a release tag when publishing from a
      dispatched release so the build is the bumped commit, not the pre-bump default branch.
    default: ""

outputs:
  token:
    description: The token the checkout used, for a later checkout such as an LFS one.
    value: ${{ inputs.github_token }}

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v7
      with:
        token: ${{ inputs.github_token }}
        ref: ${{ inputs.ref != '' && inputs.ref || github.head_ref }}
        persist-credentials: false
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        package-manager-cache: false
        node-version: "lts/*"
        registry-url: "https://npm.pkg.github.com"
    - id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    # setup-node's pnpm cache matched the exact lockfile only, so every lockfile change
    # installed cold on its branch, again in the merge queue, and again on master.
    - id: pnpm-cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-
    - name: setup github registry
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        pnpm config set "@a-novel:registry" "https://npm.pkg.github.com"
        pnpm config set "@a-novel-kit:registry" "https://npm.pkg.github.com"
        pnpm config set "//npm.pkg.github.com/:_authToken" "$GITHUB_TOKEN"
    - name: install dependencies
      shell: bash
      run: pnpm i --frozen-lockfile
    # Only pushes to the default branch that install its own commit save: other refs restore
    # its cache, a merge-queue branch's cache is unreachable once the branch is deleted, and a
    # pull_request_target run reports the base branch as its ref while the checkout takes the
    # PR head. Pruning drops packages the lockfile no longer uses, which the fallback key would
    # otherwise carry forever.
    - id: pnpm-prune
      if: steps.pnpm-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && inputs.ref == ''
      shell: bash
      run: pnpm store prune
    - if: steps.pnpm-prune.outcome == 'success'
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
