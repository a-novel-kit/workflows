name: lint node
description: Set up Node and run the package's lint script.

inputs:
  lint_action:
    required: false
    description: The name of the lint command in the package file.
    default: lint
  github_token:
    required: true
    description: The GitHub token to use for the action.

runs:
  using: "composite"
  steps:
    - uses: a-novel-kit/workflows/node-actions/setup-node@v1.60.1
      id: app_token
      with:
        github_token: ${{ inputs.github_token }}
    - name: run lint
      shell: bash
      run: pnpm run ${{ inputs.lint_action }}
