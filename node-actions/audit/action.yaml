name: audit
description: >
  Run pnpm audit --fix and open or update one pull request with the resulting dependency fixes, as
  the bot. Pass the Dependencies App, whose pull requests the auto-approver approves like a Renovate
  update; no bot pushes the default branch.

inputs:
  github_token:
    required: true
    description: The GitHub token to use for the action.
  app_private_key:
    required: true
    description: Private key of the GitHub App that pushes the branch and opens the pull request.
  client_id:
    required: true
    description: Client ID of that App.
  branch:
    required: false
    default: chore/deps/audit
    description: Branch that carries the fixes. Each run replaces its content.

runs:
  using: "composite"
  steps:
    - uses: a-novel-kit/workflows/node-actions/setup-node@v1.60.0
      with:
        github_token: ${{ inputs.github_token }}
    # The bot writes its branch and opens the pull request, nothing else.
    - name: Mint bot token
      id: bot
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.client_id }}
        private-key: ${{ inputs.app_private_key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-contents: write
        permission-pull-requests: write
    - name: run audit
      shell: bash
      # --fix takes a mode since pnpm 11; "override" pins vulnerable transitive
      # dependencies through pnpm-workspace.yaml overrides, leaving direct ones alone.
      env:
        # Unfreeze any install pnpm triggers here: CI freezes the lockfile by
        # default, and the overrides `audit --fix` writes make it mismatch the
        # committed one.
        npm_config_frozen_lockfile: "false"
      run: |
        set -euo pipefail
        pnpm audit --fix=override
        # The overrides are all audit changes. Without one there is nothing to reconcile, format
        # or commit, and a repo's format script can otherwise take minutes (go mod tidy, lint fixes).
        if [ -z "$(git status --porcelain -- pnpm-workspace.yaml)" ]; then
          echo "No audit fixes."
          exit 0
        fi
        # `pnpm audit --fix` rewrites the overrides but leaves the lockfile stale, so
        # reconcile it before `pnpm format`: pnpm 11 runs a verify-deps-before-run
        # pre-hook on any `pnpm <script>`, which spawns a frozen install and aborts
        # with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH.
        pnpm i --no-frozen-lockfile
        pnpm format
    # Only the files the audit owns are committed: whatever else the format script touches
    # (a go.sum tidy, lint fixes) would otherwise reach master unreviewed under this message.
    - name: check diff
      id: check_diff
      shell: bash
      run: |
        if [ -z "$(git status --porcelain -- pnpm-workspace.yaml pnpm-lock.yaml)" ];
        then
          echo "diff=0" >> "$GITHUB_OUTPUT"
        else
          echo "diff=1" >> "$GITHUB_OUTPUT"
        fi
    - name: Open or update the pull request
      if: steps.check_diff.outputs.diff == '1'
      shell: bash
      env:
        GH_TOKEN: ${{ steps.bot.outputs.token }}
        BRANCH: ${{ inputs.branch }}
      run: |
        set -euo pipefail
        # The default branch requires signed commits. GitHub signs a commit the App creates through
        # the API, never one it pushes.
        tree="$(for path in pnpm-workspace.yaml pnpm-lock.yaml; do
          jq -n --arg path "$path" --rawfile content "$path" '{path: $path, mode: "100644", type: "blob", content: $content}'
        done | jq -s --arg base "$(git rev-parse 'HEAD^{tree}')" '{base_tree: $base, tree: .}' |
          gh api "repos/$GITHUB_REPOSITORY/git/trees" --input - --jq .sha)"
        commit="$(gh api "repos/$GITHUB_REPOSITORY/git/commits" -f message="chore(security): audit fix" \
          -f tree="$tree" -f "parents[]=$(git rev-parse HEAD)" --jq .sha)"
        if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --silent 2>/dev/null; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" -f sha="$commit" -F force=true --silent
        else
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$commit" --silent
        fi
        if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
          gh pr create --head "$BRANCH" --title "chore(security): audit fix" \
            --body "Pins the vulnerable transitive dependencies \`pnpm audit --fix=override\` reported to their patched versions."
        fi
